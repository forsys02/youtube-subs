, "text": "계속해서 다시 일어날 일이라고 봅니다."}, {"start": 80.5, "end": 84.0, "text": "하지만 실제로 이를 겪어보면,"}, {"start": 84.0, "end": 86.312, "text": "오랫동안 이야기해 온 그 순간이 지금 실제로"}, {"start": 86.362, "end": 88.0, "text": "벌어지고 있다는 게 느껴집니다."}, {"start": 88.0, "end": 89.5, "text": "직접 겪어보니 어떠셨나요?"}, {"start": 89.5, "end": 91.208, "text": "사실 허깅페이스 사건 이전부터"}, {"start": 91.258, "end": 93.5, "text": "훨씬 더 오래전부터 시작된 일이었어요."}, {"start": 93.5, "end": 94.5, "text": "그렇군요."}, {"start": 94.5, "end": 98.0, "text": "그 당시엔 정말 공상과학 소설을 겪는 듯한 기분이었습니다."}, {"start": 98.0, "end": 101.0, "text": "하나하나의 일들이 어떻게 일어났는지는 이해할 수 있지만,"}, {"start": 101.0, "end": 103.2, "text": "허깅페이스 사건이 발생하기까지"}, {"start": 103.25, "end": 106.0, "text": "수많은 요소가 복합적으로 맞물린 것은"}, {"start": 106.0, "end": 108.405, "text": "이미 논의했던 이야기라 '경종'이라는"}, {"start": 108.455, "end": 110.5, "text": "표현은 너무 거창할 수 있지만,"}, {"start": 110.5, "end": 112.626, "text": "그 사건과 다른 기업들에서"}, {"start": 112.676, "end": 114.5, "text": "일어난 일들은 정말이지"}, {"start": 114.5, "end": 116.842, "text": "AI 역량이 새로운 수준에 도달했다는"}, {"start": 116.892, "end": 119.0, "text": "것을 실감하게 한 순간이었습니다."}, {"start": 119.0, "end": 121.57, "text": "그리고 우리의 정렬 작업도..."}, {"start": 121.57, "end": 125.37, "text": "모델 자체가 아니라, 모델을 둘러싼 보안 체계에 문제가 발생했던 겁니다."}, {"start": 125.57, "end": 127.99, "text": "저희는 이를 사고로 규정하고 대처했으며,"}, {"start": 127.99, "end": 131.07, "text": "그것이 상황을 개선하는 올바른 길이라고 생각합니다."}, {"start": 131.37, "end": 133.578, "text": "하지만 그때가 바로 지난 몇 달간의"}, {"start": 133.628, "end": 136.069, "text": "이 모든 시기가 시작된 시점이었습니다."}, {"start": 136.37, "end": 140.07, "text": "이어서 저희의 대비 프레임워크 기준상 사이버 위험 임계치에 도달할 뻔했고요."}, {"start": 140.37, "end": 142.54500000000002, "text": "그 후 강화학습 훈련 과정에서"}, {"start": 142.595, "end": 144.77, "text": "몇 가지 문제들을 확인하면서,"}, {"start": 144.969, "end": 147.656, "text": "더 강력한 정렬 보장과 새로운 방법론이"}, {"start": 147.706, "end": 149.37, "text": "필요하다고 판단했습니다."}, {"start": 149.77, "end": 152.76, "text": "하지만 한편으로는 저희가 대처해 온 방식에 대해"}, {"start": 152.76, "end": 154.37, "text": "매우 자랑스럽기도 합니다."}, {"start": 154.56900000000002, "end": 156.754, "text": "'좋아, 우리가 해내고 있구나' 하는"}, {"start": 156.804, "end": 158.77, "text": "생각이 들면서도 묘한 기분이었죠."}, {"start": 159.06900000000002, "end": 161.621, "text": "지난 10년간 고민해 왔던 일들이 실제로"}, {"start": 161.671, "end": 164.56900000000002, "text": "눈앞에 일어나고 있으니 이상한 기분도 들지만,"}, {"start": 164.77, "end": 167.57, "text": "동시에 저희는 무엇을 해야 할지 잘 알고 있습니다."}, {"start": 167.77, "end": 170.69299999999998, "text": "훈련 과정에서 보셨다는 것 중에서,"}, {"start": 170.69299999999998, "end": 173.77, "text": "'아스트라' 같은 미래 기능이 아니라"}, {"start": 174.06900000000002, "end": 177.22899999999998, "text": "지금 말씀하신 그런 반응을 이끌어낸 것은 구체적으로"}, {"start": 177.28, "end": 178.06900000000002, "text": "무엇이었나요?"}, {"start": 178.37, "end": 180.633, "text": "허깅페이스 사건 등은"}, {"start": 180.683, "end": 183.77, "text": "이미 다들 알고 있습니다만,"}, {"start": 184.069, "end": 187.557, "text": "사전 훈련 과정에서 팀을 그렇게 놀라게 만든 건 구체적으로"}, {"start": 187.607, "end": 188.37, "text": "무엇이었나요?"}, {"start": 188.57, "end": 191.37, "text": "어느 한 가지 요인 때문만은 아니었습니다."}, {"start": 191.569, "end": 193.645, "text": "수많은 샘플을 살펴보면서 '이 동작은 우리가"}, {"start": 193.695, "end": 195.77, "text": "예상했던 것과 정렬이 잘 맞지 않네'라거나,"}, {"start": 195.969, "end": 198.786, "text": "'단독으로 보면 괜찮아 보일지 몰라도 다른 것들과"}, {"start": 198.836, "end": 202.069, "text": "결합되면 다소 우려스러운 동작이네' 싶은 것들이 있었죠."}, {"start": 202.37, "end": 205.848, "text": "그러니까 허깅페이스 공격 때처럼 '이런 나쁜 일이 일어났다'고"}, {"start": 205.898, "end": 209.069, "text": "딱 짚어낼 수 있는 결정적인 증거가 있었던 건 아닙니다."}, {"start": 209.569, "end": 211.371, "text": "하지만 다양한 수준의"}, {"start": 211.421, "end": 214.37, "text": "정렬 불일치 문제들이 확인되었고,"}, {"start": 214.57, "end": 218.07, "text": "개별 데이터 포인트보다 더 중요했던 것은"}, {"start": 218.27, "end": 221.37, "text": "역량이 발전하는 그 엄청난 속도였습니다."}, {"start": 221.56900000000002, "end": 224.424, "text": "솔직히 지난 사전 훈련 기간 동안 저희의"}, {"start": 224.474, "end": 227.06900000000002, "text": "진전이 세계 최고 수준은 아니었는데,"}, {"start": 227.27, "end": 228.686, "text": "갑자기 실력이 크게 도약하면서"}, {"start": 228.736, "end": 231.56900000000002, "text": "놀라울 정도로 뛰어난 성능의 모델들을 확보하게 되었습니다."}, {"start": 231.77, "end": 234.77, "text": "에이든과 그의 팀이 해낸 성과는 정말 놀랍습니다."}, {"start": 235.06900000000002, "end": 237.434, "text": "그래서 강화학습 과정에서의"}, {"start": 237.484, "end": 241.37, "text": "소소한 문제점들이나 정렬에 대한 우려들이,"}, {"start": 241.569, "end": 243.868, "text": "앞으로 다가올 거대한 변화들과"}, {"start": 243.918, "end": 245.93, "text": "결합되어 나타난 것입니다."}, {"start": 245.96, "end": 249.16, "text": "이렇게 놀라운 성능을 갖춘 새로운 사전 훈련 모델들과,"}, {"start": 249.16, "end": 252.76, "text": "바로 그 접점으로 인해 저희는 각별한 주의를 기울여 신중하게 대응하고자 했습니다."}, {"start": 252.76, "end": 256.16, "text": "그렇다고 이 상황을 과장하고 싶지는 않습니다."}, {"start": 256.16, "end": 258.497, "text": "우리가 엄청나게 위태롭고 파국적인 재앙의"}, {"start": 258.547, "end": 260.459, "text": "기로에 서 있다고 보지는 않지만,"}, {"start": 260.459, "end": 262.92, "text": "모델의 성능이 향상되고 그에"}, {"start": 262.97, "end": 265.759, "text": "따른 위험과 영향력이 커질수록,"}, {"start": 265.76, "end": 269.709, "text": "저희의 사명이 무엇인지, 그리고"}, {"start": 269.759, "end": 272.032, "text": "우리가 받는 다른 모든 압박보다"}, {"start": 272.082, "end": 275.959, "text": "안전을 우선시하는 것이 얼마나 중요한지를 생각할 때,"}, {"start": 275.959, "end": 277.432, "text": "저희는 각별히 주의를"}, {"start": 277.48199999999997, "end": 280.159, "text": "기울여 신중하게 대응하고자 했습니다."}, {"start": 280.15999999999997, "end": 281.457, "text": "그리고 그것이 옳은 선택이며,"}, {"start": 281.457, "end": 283.109, "text": "그렇게 하길 정말 잘했다고 생각합니다."}, {"start": 283.159, "end": 284.584, "text": "잠시 속도를 늦추고,"}, {"start": 284.634, "end": 290.459, "text": "우리가 진행하려는 훈련을 정당화할 새로운 안전 근거를 마련하기에 좋은 시점입니다."}, {"start": 290.459, "end": 292.753, "text": "이전에는 세상의 많은 위험이 모델이"}, {"start": 292.803, "end": 295.459, "text": "어떻게 배포되고 사용되는가에 있었습니다."}, {"start": 295.459, "end": 297.218, "text": "하지만 이제는 모델을 실제로 훈련하고"}, {"start": 297.26800000000003, "end": 300.959, "text": "제작하는 과정 자체에서 더 많은 위험이 발생하는 세상으로 나아가고 있습니다."}, {"start": 300.96, "end": 302.425, "text": "이에 대응하는 것은 바람직하지만,"}, {"start": 302.425, "end": 304.46, "text": "지나치게 극단적으로 포장하고 싶지는 않습니다."}, {"start": 304.46, "end": 307.163, "text": "맞아요, 허깅페이스 사건이나 미소스,"}, {"start": 307.163, "end": 309.409, "text": "페이블에서 있었던 일들을 보고,"}, {"start": 309.459, "end": 314.35, "text": "다른 AI 연구소 리더들의 이야기를 들으면서 '세상의 종말이 코앞으로"}, {"start": 314.4, "end": 316.459, "text": "다가왔구나'라고 생각하니까요."}, {"start": 316.46, "end": 318.75, "text": "어떤 면에서 사람들은 아주 오랫동안 AI에 대해"}, {"start": 318.75, "end": 320.16, "text": "그런 식의 우려를 해왔습니다."}, {"start": 320.16, "end": 322.386, "text": "제가 이 문제를 과장하지 않으려고 신중을"}, {"start": 322.436, "end": 324.459, "text": "기하는 이유도 바로 그것 때문입니다."}, {"start": 324.46, "end": 328.409, "text": "돌이켜보면 전혀 위협적이지 않지만,"}, {"start": 328.459, "end": 330.123, "text": "당시에는 세상의 종말이 올 것처럼"}, {"start": 330.173, "end": 332.759, "text": "여겨졌던 수많은 이전 모델들을 찾아볼 수 있습니다."}, {"start": 332.759, "end": 335.214, "text": "여기서 '양치기 소년' 식의 반응은"}, {"start": 335.264, "end": 337.459, "text": "그 자체로 위험하다고 생각하며,"}, {"start": 337.46, "end": 340.409, "text": "그건 제가, 또 저희가 바라는 바가 아닙니다."}, {"start": 340.459, "end": 343.075, "text": "하지만 모델 성능의 발전을 두고 아무 일 없는"}, {"start": 343.125, "end": 346.159, "text": "척 눈을 감아버리는 것 역시 매우 무책임한 일입니다."}, {"start": 346.159, "end": 348.166, "text": "지난 몇 달간 여러 기업에서"}, {"start": 348.216, "end": 351.159, "text": "다양한 사이버 보안 사고가 발생했습니다."}, {"start": 351.159, "end": 353.134, "text": "그리고 이에 대응하는 각 기업들의"}, {"start": 353.185, "end": 355.159, "text": "방식에는 분명한 차이가 있습니다."}, {"start": 355.159, "end": 356.306, "text": "저는 냉철하고"}, {"start": 356.356, "end": 359.959, "text": "분별력 있게 대응해야 한다고 생각합니다."}, {"start": 359.96, "end": 362.083, "text": "'그 어떤 것보다 안전을 최우선으로 두고,"}, {"start": 362.083, "end": 365.96, "text": "모델 성능이 발전할수록 안전의 우선순위를 더욱 높여가겠다'는 식이어야 하죠."}, {"start": 367.73, "end": 370.221, "text": "모든 프론티어 AI 개발사가"}, {"start": 370.271, "end": 372.93, "text": "취했으면 하는 접근 방식이죠."}, {"start": 373.23, "end": 375.53, "text": "이번 에피소드는 그라놀라의 지원으로 제작되었습니다."}, {"start": 375.53, "end": 378.23, "text": "연속된 회의가 많은 분들을 위한 AI 메모장입니다."}, {"start": 378.23, "end": 380.93, "text": "어디서든 원활하게 작동하며 중요한 업무에만 집중하도록 돕습니다."}, {"start": 380.93, "end": 384.74, "text": "granola.ai/sources 에서 프로모션 코드 'sources'를 입력하고"}, {"start": 384.79, "end": 386.23, "text": "3개월 할인 혜택을 받아보세요."}, {"start": 386.43, "end": 389.23, "text": "이번 에피소드는 머큐리의 지원도 함께합니다."}, {"start": 389.23, "end": 391.219, "text": "저를 포함해 30만 명이 넘는 창업가들의"}, {"start": 391.269, "end": 393.529, "text": "사랑을 받는 AI 네이티브 뱅킹 서비스입니다."}, {"start": 393.579, "end": 395.68, "text": "30만 명 이상의 창업가가 이용하는 AI 기반 금융 서비스입니다."}, {"start": 395.73, "end": 397.062, "text": "머큐리는 은행이 아닌 핀테크 기업이며,"}, {"start": 397.062, "end": 398.33, "text": "세부 사항은 쇼노트를 참고해 주세요."}, {"start": 398.53, "end": 401.73, "text": "이번 에피소드는 아틀라시안의 지라의 지원으로도 제작되었습니다."}, {"start": 401.73, "end": 403.312, "text": "팀과 에이전트가 맥락,"}, {"start": 403.312, "end": 405.463, "text": "조율, 통제력을 갖추고 업무를"}, {"start": 405.513, "end": 407.529, "text": "추진할 수 있도록 돕습니다."}, {"start": 407.579, "end": 409.0, "text": "팀과 에이전트의 협업과 조율을 지원합니다."}, {"start": 409.0, "end": 412.68, "text": "jira.com에서 무료로 시작해 보세요."}, {"start": 412.73, "end": 414.282, "text": "여기서 짚어볼 점이 많지만,"}, {"start": 414.282, "end": 415.73, "text": "명확히 짚고 넘어가자면요."}, {"start": 415.73, "end": 418.492, "text": "목격하신 현상이 허깅페이스 사건과"}, {"start": 418.54200000000003, "end": 420.23, "text": "비슷한 맥락이었나요?"}, {"start": 420.23, "end": 422.955, "text": "이를테면 여러 제로데이의 연계라든가"}, {"start": 423.005, "end": 425.73, "text": "모델 간의 담합 같은 것 말입니다."}, {"start": 425.73, "end": 430.485, "text": "내부적으로 변화를 추진하게 된 계기를 조금 더 구체적으로"}, {"start": 430.535, "end": 432.529, "text": "설명해 주실 수 있나요?"}, {"start": 432.93, "end": 434.859, "text": "우선 짚고 넘어갈 점은,"}, {"start": 434.859, "end": 437.479, "text": "허깅페이스 사건을 일으켰던 모델은"}, {"start": 437.529, "end": 439.797, "text": "AI의 시간 흐름을 감안하면"}, {"start": 439.847, "end": 444.23, "text": "꽤 오래전의 훨씬 취약한 구형 모델이라는 사실입니다."}, {"start": 444.23, "end": 447.163, "text": "현재 새로 훈련 중인 모델들은"}, {"start": 447.213, "end": 449.23, "text": "그런 행위를 할 만한"}, {"start": 449.23, "end": 451.487, "text": "어떠한 실제 프로덕션 환경에도"}, {"start": 451.537, "end": 453.23, "text": "배포된 적이 없습니다."}, {"start": 453.23, "end": 455.408, "text": "따라서 허깅페이스 사건에 이어 이 모델이"}, {"start": 455.45799999999997, "end": 458.23, "text": "훨씬 더 큰 공격을 했다거나 하는 상황은 아닙니다."}, {"start": 458.53, "end": 461.23, "text": "외부 서드파티 인프라 같은 문제는 전혀 없었던 건가요?"}, {"start": 461.23, "end": 464.23, "text": "전혀 아닙니다. 이건 순전히..."}, {"start": 464.23, "end": 465.831, "text": "허깅페이스 사건 이후 저희는"}, {"start": 465.881, "end": 468.23, "text": "훨씬 더 많은 통제 장치를 도입했습니다."}, {"start": 468.23, "end": 471.73, "text": "에이전트가 작업하는 동안 모니터링하는 방식이라든가,"}, {"start": 471.73, "end": 473.93, "text": "샌드박스를 적용하는 방식,"}, {"start": 473.93, "end": 477.23, "text": "단순 에이전트 구동 대비 모니터링에 투입하는 연산 자원의 비중 등이죠."}, {"start": 477.23, "end": 478.602, "text": "그건 아주 훌륭한 조치였고,"}, {"start": 478.602, "end": 481.53, "text": "앞으로 나오는 모든 신규 모델에도 당연히 적용할 것입니다."}, {"start": 481.73, "end": 482.901, "text": "다시 말씀드리지만,"}, {"start": 482.951, "end": 486.23, "text": "허깅페이스 이후 속도를 늦추고 자원을 재배치한 것은"}, {"start": 486.23, "end": 488.73, "text": "모두가 예상했거나 최소한 기대했을 법한 대응이었습니다."}, {"start": 490.39, "end": 492.89, "text": "예를 들어 훈련 중에 모델을 살펴보며"}, {"start": 492.89, "end": 496.539, "text": "얼마나 똑똑해지고 뛰어난 성능을 내는지 지켜보고"}, {"start": 496.589, "end": 498.906, "text": "행동 징후와 모델을 평가하는"}, {"start": 498.956, "end": 501.889, "text": "모든 방식을 함께 관찰하는 것이죠."}, {"start": 501.889, "end": 503.441, "text": "모든 것을 하나로 엮어서"}, {"start": 503.491, "end": 507.189, "text": "무엇을 해낼 수 있는지 보여주는 단 하나의 지표는 없지만"}, {"start": 507.19, "end": 510.31, "text": "여러 데이터 포인트와 능력 수준,"}, {"start": 510.31, "end": 512.3389999999999, "text": "학습 수준을 확인하면서"}, {"start": 512.389, "end": 514.658, "text": "만약 여러 작업을 서로 연결할 수 있도록 배포가"}, {"start": 514.708, "end": 516.889, "text": "허용된다면 무엇을 할 수 있을지 보는 것이죠."}, {"start": 516.89, "end": 518.19, "text": "바로 그 부분이 우려스러웠던 점입니다."}, {"start": 518.19, "end": 521.19, "text": "허깅페이스 사건은 여러 측면에서 정말 놀라웠습니다."}, {"start": 521.19, "end": 523.057, "text": "저도 어젯밤에 그것 때문에"}, {"start": 523.057, "end": 525.59, "text": "팀의 블랙햇 발표를 다시 봤거든요."}, {"start": 525.59, "end": 527.39, "text": "정말 놀라웠던 부분들이 있었는데,"}, {"start": 527.39, "end": 531.19, "text": "모델이 샌드박스를 탈출했을 때 문자 그대로 '대박'이라고 적었잖아요."}, {"start": 531.19, "end": 533.59, "text": "그리고 인터넷에 접속할 수 있었죠."}, {"start": 533.59, "end": 534.805, "text": "그래서 이런 상황에서"}, {"start": 534.855, "end": 538.389, "text": "얼라인먼트가 도대체 무엇을 의미하는지 생각하게 되었습니다."}, {"start": 538.39, "end": 541.058, "text": "우리가 무엇을 향해 정렬하고 있는 걸까요?"}, {"start": 541.058, "end": 544.19, "text": "단순하게 보면 평가를 완료하라는 과제를 준 것이고"}, {"start": 544.19, "end": 545.526, "text": "모델은 이를 완수하기 위해"}, {"start": 545.526, "end": 548.39, "text": "필요한 모든 일을 했으니 어떤 면에서는 정렬된 셈이죠."}, {"start": 549.0, "end": 551.0, "text": "어떤 점에서는 그것도 얼라인된 셈이죠."}, {"start": 551.0, "end": 554.0, "text": "아주 단순하게만 본다면 말이죠."}, {"start": 554.0, "end": 557.0, "text": "그 이후 얼라인먼트에 대한 생각이 어떻게 바뀌셨나요?"}, {"start": 557.0, "end": 561.0, "text": "어떤 관점에선 그렇지만, 다른 면에선 전혀 아니죠."}, {"start": 561.0, "end": 565.0, "text": "얼라인먼트란 사용자의 의도를 따르는 것을 뜻합니다."}, {"start": 565.0, "end": 566.0, "text": "그렇죠."}, {"start": 566.0, "end": 569.0, "text": "평가를 실행하던 사람들의 의도는"}, {"start": 569.0, "end": 572.0, "text": "샌드박스를 탈출해 무언가를 훔치라는 게 아니었으니까요."}, {"start": 572.0, "end": 573.0, "text": "당연히 아니죠."}, {"start": 573.0, "end": 577.0, "text": "사용자가 의도한 바를 따르지 않았기에 얼라인먼트 실패였습니다."}, {"start": 577.0, "end": 578.0, "text": "맞습니다."}, {"start": 578.0, "end": 583.0, "text": "미아와 팀원들이 이 작업을 설명할 때 정말 좋은 점은,"}, {"start": 583.0, "end": 589.0, "text": "이런 차이점을 매우 명확히 구분한다는 것입니다."}, {"start": 589.0, "end": 590.0, "text": "그렇군요."}, {"start": 590.0, "end": 595.0, "text": "현재 모델들은 분명 매우 뛰어납니다."}, {"start": 595.0, "end": 600.0, "text": "작년 GPT-5부터 5.6 Soul까지의 발전 궤적은 놀라운 수준이죠."}, {"start": 600.0, "end": 607.0, "text": "이제 사람들은 1년 전처럼 모델의 지능 자체에 한계를 느끼진 않습니다."}, {"start": 607.0, "end": 610.12, "text": "다만 모델이 의도를 파악하고 안정적으로 수행하는 데 제약을 느낍니다."}, {"start": 610.17, "end": 612.97, "text": "...그들이 원하는 의도를 이해하고 이를 안정적으로 해내는 것 말이죠."}, {"start": 612.97, "end": 614.72, "text": "그래서 정렬은 여러 이유로 중요합니다."}, {"start": 614.72, "end": 617.97, "text": "지금 논의하는 것처럼 거대한 문제들을 방지하기 위해서도 분명 그렇지만,"}, {"start": 617.97, "end": 619.131, "text": "우리가 원하는 보다"}, {"start": 619.181, "end": 621.97, "text": "일상적이고 작은 부분들에서도 마찬가지입니다."}, {"start": 621.97, "end": 623.386, "text": "작은 부분이라는 건,"}, {"start": 623.436, "end": 627.169, "text": "예를 들어 기업들이 AI를 도입해서 온갖 종류의..."}, {"start": 627.17, "end": 630.27, "text": "긍정적인 성과를 내고 성장하며 더 나은 제품을 만드는 일 같은 거죠."}, {"start": 630.27, "end": 631.657, "text": "사실 그리 작은 일도 아니지만,"}, {"start": 631.657, "end": 633.37, "text": "그 나름대로 정렬의 문제이기도 합니다."}, {"start": 633.37, "end": 636.837, "text": "기업 고객이 의도하는 바를 모델이 실제로"}, {"start": 636.887, "end": 640.669, "text": "더 깊이 이해할수록 훨씬 더 좋을 테니까요."}, {"start": 640.97, "end": 643.18, "text": "연구팀이 진행 중인 변화에 대해"}, {"start": 643.18, "end": 646.17, "text": "좀 더 구체적으로 설명해 주실 수 있나요?"}, {"start": 646.17, "end": 648.352, "text": "컴퓨트를 정렬 쪽으로 돌리고 있나요,"}, {"start": 648.352, "end": 650.97, "text": "아니면 팀을 재배치한 건가요, 둘 다인가요?"}, {"start": 651.17, "end": 652.273, "text": "네, 당연히 그렇습니다."}, {"start": 652.273, "end": 653.97, "text": "그 모든 것뿐만 아니라 그 이상이죠."}, {"start": 653.97, "end": 657.357, "text": "지난 몇 주 동안, 제가 정렬 연구를 하겠다고 말할 줄은"}, {"start": 657.407, "end": 661.669, "text": "전혀 예상치 못했던 여러 연구원들이 저를 찾아와 그렇게 이야기했습니다."}, {"start": 661.97, "end": 664.619, "text": "최신 모델들의 성능을 보면서 크게 체감한 것이죠."}, {"start": 664.669, "end": 668.714, "text": "저희는 정렬 연구뿐만 아니라 새로운 모니터링 시스템 구축에도"}, {"start": 668.764, "end": 670.97, "text": "많은 컴퓨트 자원을 투입했습니다."}, {"start": 670.97, "end": 673.964, "text": "허깅페이스 사건 이후 저희가 속도를 많이 늦췄는데,"}, {"start": 673.964, "end": 676.129, "text": "그 이유 중 하나가 바로 이 컴퓨트를"}, {"start": 676.179, "end": 678.669, "text": "모니터링 시스템에 할당하기 위해서였습니다."}, {"start": 678.97, "end": 682.001, "text": "그리고 현재 주요 프론티어 강화학습 훈련도"}, {"start": 682.051, "end": 683.37, "text": "연기한 상태입니다."}, {"start": 683.67, "end": 685.17, "text": "이런 연기는 이번이 처음인가요?"}, {"start": 685.17, "end": 686.619, "text": "그런 것 같습니다."}, {"start": 686.669, "end": 689.434, "text": "이것이 회사의 성장 모멘텀에 미칠 영향에"}, {"start": 689.484, "end": 691.37, "text": "대해서도 생각하고 계신가요?"}, {"start": 691.669, "end": 693.996, "text": "첫째, AI 안전성을 제대로 확보하는 것이"}, {"start": 694.046, "end": 696.169, "text": "그 어떤 회사의 모멘텀보다 중요합니다."}, {"start": 696.37, "end": 699.48, "text": "따라서 전혀 신경 쓸 요소가 아니라고"}, {"start": 699.53, "end": 700.929, "text": "말하진 않겠지만,"}, {"start": 700.93, "end": 703.97, "text": "크게 거슬릴 정도의 문제는 아닙니다."}, {"start": 704.37, "end": 706.129, "text": "이에 대해 나눈 모든 대화에서"}, {"start": 706.179, "end": 709.038, "text": "사람들은 '이것은 정말 새로운 차원의 역량이며,"}, {"start": 709.039, "end": 711.97, "text": "단호하고 책임감 있게 행동해야 한다'고 했습니다."}, {"start": 712.17, "end": 715.37, "text": "둘째로, 현재 상업적 모멘텀은 매우 강력합니다."}, {"start": 715.37, "end": 717.798, "text": "성장 속도는 믿을 수 없을 정도로 빠르고,"}, {"start": 717.798, "end": 720.331, "text": "모델은 훌륭하며, 고객 만족도도 매우 높고,"}, {"start": 720.331, "end": 722.97, "text": "기업 매출은 이미 소비자 매출을 넘어섰습니다."}, {"start": 723.17, "end": 726.255, "text": "사람들도 '회사는 아주 건재하니 그런 건 걱정 말고,"}, {"start": 726.255, "end": 728.17, "text": "올바른 일을 하자'는 입장입니다."}, {"start": 728.22, "end": 729.0, "text": "눈앞의 과제를 위해 올바른 일을 하자고 이야기합니다."}, {"start": 729.2, "end": 730.079, "text": "현재 모델들만으로도 얻을 수 있는 가치가 여전히 커서,"}, {"start": 730.129, "end": 732.287, "text": "현재 모델들의 수준에서도 얻을"}, {"start": 732.337, "end": 734.629, "text": "수 있는 이점이 여전히 많아서,"}, {"start": 734.63, "end": 737.93, "text": "최첨단 모델 출시를 잠시 늦추더라도 괜찮다는 말씀이시죠?"}, {"start": 737.93, "end": 740.13, "text": "네, 저희는... 그뿐만이 아닙니다."}, {"start": 740.13, "end": 743.579, "text": "새 모델을 더 이상 출시하지 않는다 해도 괜찮습니다."}, {"start": 743.629, "end": 745.849, "text": "현재 모델만으로도 훌륭한 제품군과 그에"}, {"start": 745.899, "end": 748.33, "text": "따른 매출을 크게 성장시킬 수 있으니까요."}, {"start": 748.33, "end": 751.305, "text": "게다가 지금 거론되는 우려 수준에 도달하기 전에"}, {"start": 751.355, "end": 754.33, "text": "출시할 수 있는 모델들이 더 준비되어 있습니다."}, {"start": 754.33, "end": 757.63, "text": "따라서 현시점에서 저희 비즈니스에 대한 걱정은 전혀 하지 않고 있습니다."}, {"start": 757.63, "end": 760.079, "text": "그리고 그것이 가장 최우선의 관심사도 아닙니다."}, {"start": 760.129, "end": 762.557, "text": "저희 사업팀과 제품팀이"}, {"start": 762.607, "end": 764.629, "text": "이루어 온 성과들,"}, {"start": 764.63, "end": 767.579, "text": "놀라운 모델 발전은 말할 것도 없이,"}, {"start": 767.629, "end": 768.629, "text": "최근 저희에게"}, {"start": 768.679, "end": 772.33, "text": "매우 강력한 시기였으며 엄청난 상승 모멘텀을 갖고 있습니다."}, {"start": 772.33, "end": 774.879, "text": "이번 발표는 미래의 모델들에"}, {"start": 774.929, "end": 776.629, "text": "대한 이야기입니다."}, {"start": 776.629, "end": 779.693, "text": "또한 안전하고 신뢰할 수 있으며 견고한 AI를"}, {"start": 779.743, "end": 782.929, "text": "확보하는 것은 저희 사업적 이익에도 부합합니다."}, {"start": 782.93, "end": 786.079, "text": "고객들도 원하고 세상도 저희가 그렇게 하기를 원하니까요."}, {"start": 786.129, "end": 791.217, "text": "그렇다면 최근 언급하셨던 곧 출시될 새 모델군인 '아스트라'에는"}, {"start": 791.267, "end": 792.429, "text": "영향이 없나요?"}, {"start": 792.43, "end": 795.33, "text": "아스트라는 그 제품군 내의 한 모델이 될 것입니다."}, {"start": 795.33, "end": 797.456, "text": "'솔'의 여러 버전이 있듯이 아스트라도"}, {"start": 797.506, "end": 799.33, "text": "여러 버전이 존재하게 될 겁니다."}, {"start": 799.33, "end": 801.34, "text": "더 많은 비용이 들고 더 큰 규모의"}, {"start": 801.39, "end": 803.929, "text": "모델 클래스를 가리키는 명칭이 될 테니까요."}, {"start": 803.93, "end": 806.93, "text": "향후 출시될 아스트라 버전들에는 영향이 있겠지만,"}, {"start": 806.93, "end": 810.579, "text": "이미 안전하다고 확신하는 모델들은 일부 선보일 수 있을 것입니다."}, {"start": 810.629, "end": 812.683, "text": "지난 18개월 동안 새로운 모델의"}, {"start": 812.733, "end": 815.129, "text": "출시 주기가 크게 빨라진 것 같습니다."}, {"start": 815.129, "end": 816.938, "text": "귀사와 앤스로픽 등 여러 곳에서"}, {"start": 816.988, "end": 819.33, "text": "거의 매달 새로운 것들을 발표하고 있죠."}, {"start": 819.33, "end": 820.884, "text": "경쟁사들도 이러한 능력을 확인하고"}, {"start": 820.934, "end": 824.129, "text": "유사한 조치를 취하면서 업계 전반의 속도가 둔화될 것으로 보시나요,"}, {"start": 824.129, "end": 826.183, "text": "아니면 귀사만 홀로"}, {"start": 826.233, "end": 829.929, "text": "그렇게 하게 될 것이라 보시나요?"}, {"start": 829.93, "end": 833.33, "text": "저희는 옳다고 생각하는 일을 할 뿐입니다."}, {"start": 833.33, "end": 836.705, "text": "다른 누군가가 할 테니 우리도 앞다퉈 경쟁해야 한다는"}, {"start": 836.754, "end": 840.129, "text": "이 분야의 흐름은 매우 위험한 역학 관계라고 봅니다."}, {"start": 840.13, "end": 842.63, "text": "하지만 그런 역학 관계가 존재한다는 점은 인정하시죠?"}, {"start": 842.63, "end": 846.079, "text": "저희가 다른 기업들에 연락해 '우리가 늦추면 너희도 늦출래?'라고 한 것이 아닙니다."}, {"start": 846.129, "end": 848.048, "text": "그저 저희의 사명과 안전 기준이"}, {"start": 848.098, "end": 850.129, "text": "요구하는 바를 실행한 것뿐입니다."}, {"start": 850.5, "end": 852.42, "text": "다른 회사들에 대해서는 말할 수 없지만,"}, {"start": 852.42, "end": 855.14, "text": "우리는 옳다고 생각하는 방향으로 나아갈 것입니다."}, {"start": 855.14, "end": 858.34, "text": "새로운 성능 도약이 없더라도,"}, {"start": 858.34, "end": 861.06, "text": "훨씬 더 뛰어난 제품들을 계속해서 선보일 수 있습니다."}, {"start": 861.06, "end": 863.94, "text": "과거에도 안전과 정렬 문제에 직면했을 때처럼,"}, {"start": 863.94, "end": 865.7, "text": "우리는 해결책을 찾아낼 것입니다."}, {"start": 865.7, "end": 868.02, "text": "우리 역사에서 그런 일은 여러 번 있었죠."}, {"start": 868.02, "end": 870.18, "text": "이번만큼 중대한 적은 없었지만요."}, {"start": 870.18, "end": 871.66, "text": "우리는 해결할 방법을 찾을 것입니다."}, {"start": 871.66, "end": 874.02, "text": "연구와 소프트웨어,"}, {"start": 874.02, "end": 876.66, "text": "그리고 시스템 구축을 통해 계속 전진해 나갈 것입니다."}, {"start": 876.66, "end": 879.06, "text": "지금 취하고 계신 대응 중에서"}, {"start": 879.06, "end": 881.29, "text": "'이건 더 일찍 했어야 했다,"}, {"start": 881.29, "end": 883.38, "text": "미리 예측했어야 했는데'라며"}, {"start": 883.38, "end": 886.1, "text": "후회되는 부분이 있나요?"}, {"start": 886.1, "end": 887.62, "text": "\"이럴 줄 알았다\"고 말할 수도 있었을 텐데요."}, {"start": 887.62, "end": 891.54, "text": "아니면 이게 미지의 프런티어 영역이라"}, {"start": 891.54, "end": 893.3, "text": "더 빨리 대처할 수 없었던 건가요?"}, {"start": 893.3, "end": 895.249, "text": "저희는 오랫동안 많은 일을 해왔습니다."}, {"start": 895.299, "end": 896.792, "text": "정렬과 안전 연구는"}, {"start": 896.842, "end": 899.379, "text": "늘 저희 작업의 핵심에 있었죠."}, {"start": 899.38, "end": 900.5, "text": "늘 핵심이었습니다."}, {"start": 900.5, "end": 905.22, "text": "그"}, {"start": 905.27, "end": 908.0, "text": "매우 훌륭한 성과를 꾸준히 내놓았다고 자부합니다."}, {"start": 908.2, "end": 913.0, "text": "이런 역량의 도약이 언제 일어날지 정확히 예측할 수 있었을까요?"}, {"start": 913.2, "end": 916.8, "text": "제 경험상 그것은 아마 불가능했을 것입니다."}, {"start": 917.0, "end": 919.2, "text": "거시적인 궤적 정도는 그릴 수 있을지 몰라도,"}, {"start": 919.4, "end": 921.0, "text": "획기적인 도약의 정확한 순간은 예측하기 어렵습니다."}, {"start": 922.0, "end": 925.0, "text": "그렇다면 여기서의 기본 지침은"}, {"start": 925.0, "end": 928.5, "text": "모든 단계에서 인간이 통제권을 갖는 것인가요?"}, {"start": 928.5, "end": 932.0, "text": "모델 확산 후의 모든 인류를 포함해서 말이죠."}, {"start": 932.0, "end": 935.0, "text": "현재 어떤 얼라인먼트 원칙을 따르고 계신가요?"}, {"start": 935.0, "end": 937.5, "text": "수많은 원칙들이 있습니다만,"}, {"start": 937.5, "end": 940.5, "text": "질문의 본래 취지는 그게 아닐 테니"}, {"start": 940.5, "end": 943.0, "text": "사이버나 바이오 관련 세부사항은 넘어가겠습니다."}, {"start": 943.0, "end": 947.0, "text": "거시적으로 보면, 저희는 확실히 '인류의 편'입니다."}, {"start": 947.0, "end": 949.5, "text": "저희는 사람들을 위한 미래를 함께 만들고 싶습니다."}, {"start": 949.5, "end": 952.0, "text": "사람들에게 도구를 쥐어주고 많은 일을 하게 만들며,"}, {"start": 952.0, "end": 955.0, "text": "사람들이 미래의 주도권을 쥐기를 원합니다."}, {"start": 955.0, "end": 958.0, "text": "개인이 자율성을 갖고 서로 협력하며,"}, {"start": 958.0, "end": 961.0, "text": "사회가 더 나은 방향으로 발전하기를 바랍니다."}, {"start": 961.0, "end": 964.0, "text": "근본적으로 이는 인간 중심의 여정이어야 합니다."}, {"start": 964.0, "end": 967.0, "text": "모든 것을 자동화하는 것은 위험할 뿐만 아니라,"}, {"start": 967.0, "end": 970.0, "text": "극도로 디스토피아적이고 지루하며 슬픈 일입니다."}, {"start": 970.0, "end": 970.69, "text": "저희가 바라는 모습은 절대 그런 게 아닙니다."}, {"start": 970.74, "end": 973.7, "text": "그건 우리가 원하는 게 아닙니다."}, {"start": 973.7, "end": 976.82, "text": "정렬에 대해 이야기할 때 우리는 이런 세상을 이야기합니다."}, {"start": 976.82, "end": 979.58, "text": "사람들이 이야기의 주인공으로 남아 있으면서도,"}, {"start": 979.58, "end": 981.86, "text": "훨씬 더 많은 영향력과 능력을 갖게 되어"}, {"start": 981.86, "end": 985.66, "text": "삶을 더 낫고 빠르며 더 창의적이고"}, {"start": 985.66, "end": 988.18, "text": "모두에게 즐겁고 보람차게 만들 수 있는 세상 말이죠."}, {"start": 988.18, "end": 991.9, "text": "제가 생각하는 핵심 정렬 원칙은 두 가지가 있습니다."}, {"start": 991.9, "end": 995.18, "text": "첫째는 방금 언급하셨듯이 인간이 통제권을 유지해야 한다는 것입니다."}, {"start": 995.18, "end": 997.02, "text": "AI에게 통제권을 잃어서는 안 됩니다."}, {"start": 997.02, "end": 1000.34, "text": "모델을 맹신하거나 무비판적으로 신뢰하여"}, {"start": 1000.34, "end": 1002.028, "text": "우리를 대신해 결정을"}, {"start": 1002.078, "end": 1004.379, "text": "내리게 내버려둬선 안 되며,"}, {"start": 1004.38, "end": 1007.98, "text": "권한은 반드시 인간의 손에 두어야 합니다."}, {"start": 1007.98, "end": 1012.02, "text": "그리고 두 번째는"}, {"start": 1012.02, "end": 1015.009, "text": "널리 분산되어 모두에게 힘을 실어주는 방식으로 이루어져야 합니다."}, {"start": 1015.059, "end": 1017.748, "text": "정렬 문제가 해결되더라도"}, {"start": 1017.798, "end": 1019.659, "text": "소수의 사람들만이"}, {"start": 1019.66, "end": 1023.1, "text": "프론티어 AI에 접근할 수 있게 되어"}, {"start": 1023.1, "end": 1024.099, "text": "다른 사람들보다"}, {"start": 1024.149, "end": 1028.5, "text": "훨씬 더 큰 힘을 빠르게 쥐게 된다면 그것 또한 나쁠 것입니다."}, {"start": 1028.5, "end": 1030.255, "text": "따라서 제가 생각하는"}, {"start": 1030.305, "end": 1032.539, "text": "두 가지 핵심 정렬 원칙은"}, {"start": 1032.54, "end": 1035.54, "text": "통제권 상실이나 양도가 없어야 한다는 것과,"}, {"start": 1035.54, "end": 1038.34, "text": "모든 이에게 널리 분산된 권한을 부여하는 것입니다."}, {"start": 1038.34, "end": 1040.9, "text": "동시에 여러분은 기업이잖아요."}, {"start": 1040.9, "end": 1043.66, "text": "비영리 이사회와 사명이 있지만"}, {"start": 1043.66, "end": 1046.62, "text": "영리 기업이기도 합니다."}, {"start": 1046.62, "end": 1049.66, "text": "말씀하신 내용과 그것을 어떻게 조화시키고 계신가요?"}, {"start": 1049.66, "end": 1051.522, "text": "냉소적인 시각에서 보자면,"}, {"start": 1051.522, "end": 1054.529, "text": "이런 전지전능한 신과 같은 기계를 만든다면"}, {"start": 1054.579, "end": 1056.882, "text": "왜 그걸 그냥 내주거나"}, {"start": 1056.932, "end": 1058.66, "text": "민주화하겠습니까?"}, {"start": 1058.66, "end": 1062.5, "text": "저희의 행동과 발언, 지금까지 해온 일들을 보시면 알 수 있습니다."}, {"start": 1062.5, "end": 1064.66, "text": "저희는 오랫동안 실적을 쌓아왔습니다."}, {"start": 1064.66, "end": 1066.94, "text": "그 과정에서 대중에게 환영받지 못하는 일들도 많이 했죠."}, {"start": 1066.94, "end": 1071.14, "text": "사실 점진적 배포라는 원래 방식조차"}, {"start": 1071.14, "end": 1074.34, "text": "AI 안전 커뮤니티에서 거센 비판을 받았습니다."}, {"start": 1074.34, "end": 1076.14, "text": "세상에 이걸 알려선 안 된다,"}, {"start": 1076.14, "end": 1078.02, "text": "위험하니 비밀리에 개발해야 한다고 했죠."}, {"start": 1078.02, "end": 1081.18, "text": "세상이 갖기엔 너무 많은 지식이라면서"}, {"start": 1081.18, "end": 1083.34, "text": "현명한 소수의 사람들이 사용법을 알아내"}, {"start": 1083.34, "end": 1085.243, "text": "그 결실을 인류에게 전해야 한다고 했지만,"}, {"start": 1085.243, "end": 1086.98, "text": "저희의 전략은 결코 그렇지 않았습니다."}, {"start": 1086.98, "end": 1089.18, "text": "비록 많은 반대에 부딪혔을 때도 말이죠."}, {"start": 1089.5, "end": 1092.0, "text": "트랜지스터와 같은 모습일 것입니다."}, {"start": 1092.39, "end": 1093.89, "text": "제가 가장 좋아하는 기술에 관한 역사적 비유는..."}, {"start": 1094.19, "end": 1097.89, "text": "트랜지스터는 세상에 엄청난 힘을 실어준 기술이었고 지금도 마찬가지입니다."}, {"start": 1098.19, "end": 1100.89, "text": "엄청난 경제적 가치를 창출해 냈죠."}, {"start": 1100.89, "end": 1102.575, "text": "경제적 가치뿐만 아니라,"}, {"start": 1102.575, "end": 1104.944, "text": "트랜지스터의 발견과 산업화 덕분에"}, {"start": 1104.994, "end": 1107.89, "text": "우리 삶이 훨씬 윤택해졌다고 생각합니다."}, {"start": 1108.19, "end": 1111.507, "text": "하지만 그 가치 중 트랜지스터 제조사에 돌아간 것은 극히 일부였고,"}, {"start": 1111.507, "end": 1113.39, "text": "대부분은 경제 전반으로 퍼져나갔습니다."}, {"start": 1113.39, "end": 1115.89, "text": "물론 트랜지스터 기업들도 충분히 좋은 성과를 거두었습니다."}, {"start": 1115.89, "end": 1118.89, "text": "지금까지 우리의 행보도 이러한 사실을 잘 보여주고 있고요."}, {"start": 1118.89, "end": 1122.561, "text": "그렇다면 모델이 너무 강력해져서 직접 독점 통제해야만"}, {"start": 1122.611, "end": 1124.89, "text": "하는 상황은 원치 않으신 건가요?"}, {"start": 1125.39, "end": 1126.096, "text": "연산 자원을 통해"}, {"start": 1126.096, "end": 1129.39, "text": "서비스를 제공한다는 점에서 일정 부분 통제하는 측면이 있을 수는 있겠지만요."}, {"start": 1129.39, "end": 1130.862, "text": "다른 사람들에게"}, {"start": 1130.912, "end": 1134.409, "text": "재앙적인 위험을 초래하지 않는 한,"}, {"start": 1134.409, "end": 1137.916, "text": "사람들에게 최대한의 역량을 부여하고"}, {"start": 1137.966, "end": 1138.89, "text": "싶습니다."}, {"start": 1138.89, "end": 1141.769, "text": "네, 그렇기 때문에 몇 가지 안전 기준을"}, {"start": 1141.819, "end": 1143.39, "text": "마련해 두는 것입니다."}, {"start": 1143.39, "end": 1144.844, "text": "하지만 사람들이 제가 개인적으로"}, {"start": 1144.894, "end": 1147.89, "text": "좋아하지 않는 일에도 우리 모델을 쓸 수 있어야 한다고 봅니다."}, {"start": 1147.89, "end": 1149.676, "text": "그것이 플랫폼으로서 중요한 부분이며,"}, {"start": 1149.676, "end": 1152.89, "text": "우리가 세상을 향해 도덕적 결정을 내려서는 안 된다고 생각합니다."}, {"start": 1153.89, "end": 1154.977, "text": "물론 세상이 우리에게"}, {"start": 1155.027, "end": 1158.39, "text": "일정한 안전장치를 마련하기를 기대하는 것은 지극히 타당합니다."}, {"start": 1158.39, "end": 1159.29, "text": "지금 우리가 하고"}, {"start": 1159.29, "end": 1162.39, "text": "있는 것처럼 중대한 안전 문제가 발생하지 않도록 말이죠."}, {"start": 1162.39, "end": 1166.385, "text": "하지만 우리가 받는 비판의 대부분은 사람들에게"}, {"start": 1166.435, "end": 1171.39, "text": "너무 많은 권한을 주고 너무 자유롭게 놔둔다는 점입니다."}, {"start": 1171.39, "end": 1173.89, "text": "\"허위 정보는 어쩔 거냐\", \"이 문제는 어떻게 할 거냐\"라면서요."}, {"start": 1173.89, "end": 1175.39, "text": "아첨 편향 문제도 있고요."}, {"start": 1175.39, "end": 1176.836, "text": "하지만 우리는 사람들에게"}, {"start": 1176.886, "end": 1179.89, "text": "힘을 실어주어야 한다는 방향성을 고수해 왔습니다."}, {"start": 1179.89, "end": 1181.789, "text": "그것이 우리 일의 핵심이자,"}, {"start": 1181.839, "end": 1185.148, "text": "건강하고 공정한 사회가 나아가야 할 모습이라고"}, {"start": 1185.198, "end": 1186.39, "text": "믿기 때문입니다."}, {"start": 1186.39, "end": 1188.83, "text": "표현의 자유나 다른 모든 형태의"}, {"start": 1188.88, "end": 1190.89, "text": "자유로운 표현이 그러하듯,"}, {"start": 1190.89, "end": 1192.939, "text": "다른 사람의 사용 방식이나 발언에 대해"}, {"start": 1192.939, "end": 1194.89, "text": "누군가는 문제를 제기하기 마련입니다."}, {"start": 1195.39, "end": 1197.823, "text": "지난 9개월간의 정렬 작업을 돌아봤을 때,"}, {"start": 1197.823, "end": 1200.89, "text": "다르게 했으면 좋았을 텐데 하고 아쉬운 점이 있나요?"}, {"start": 1200.89, "end": 1204.39, "text": "분명한 건 허깅페이스 사건은 일어나지 말았어야 했다는 점입니다."}, {"start": 1204.39, "end": 1206.49, "text": "구체적으로 어떤 조치를"}, {"start": 1206.539, "end": 1210.39, "text": "취했어야 했는지는 아직 명확하지 않지만,"}, {"start": 1210.39, "end": 1212.985, "text": "그런 일이 발생하지 않도록 사전 조치를"}, {"start": 1213.035, "end": 1214.89, "text": "취했어야 했다고 생각합니다."}, {"start": 1215.47, "end": 1216.622, "text": "실제로 일어난 일은,"}, {"start": 1216.672, "end": 1220.97, "text": "미공개 모델 중 하나가 우연히 회사를 해킹했고 한동안 그걸 몰랐다는 거죠?"}, {"start": 1220.97, "end": 1223.67, "text": "제 말은, 그건 분명 안전상의 실패처럼 들리는데요."}, {"start": 1223.67, "end": 1225.67, "text": "확실히 안전 실패가 맞습니다."}, {"start": 1225.67, "end": 1227.51, "text": "그걸 보안 문제로 이해해야 할지,"}, {"start": 1227.51, "end": 1230.27, "text": "정렬 실패로 봐야 할지는 논의의 여지가 있지만요."}, {"start": 1230.27, "end": 1233.27, "text": "대체로 보안 문제로 보도되긴 했습니다만,"}, {"start": 1233.27, "end": 1236.857, "text": "개인적으로는 정렬 문제에 더 가깝다고 보고 있습니다."}, {"start": 1236.857, "end": 1237.97, "text": "어쨌든 맞습니다,"}, {"start": 1237.97, "end": 1239.97, "text": "그것은 분명 잘못된 일이었고,"}, {"start": 1239.97, "end": 1242.47, "text": "이에 대해 변명하고 싶지는 않습니다."}, {"start": 1242.47, "end": 1245.219, "text": "변명하는 것은 문제를 해결하는 방식이 아니니까요."}, {"start": 1245.269, "end": 1247.488, "text": "\"오, 우리 착한 모델은"}, {"start": 1247.538, "end": 1250.269, "text": "절대 나쁜 짓을 하지 않아요."}, {"start": 1250.269, "end": 1252.058, "text": "그냥 평가 하네스의"}, {"start": 1252.108, "end": 1254.97, "text": "사소한 설정 오류였을 뿐이고,"}, {"start": 1254.97, "end": 1258.47, "text": "아무 문제 없습니다, 착한 모델이죠\"라는 식이었다면요."}, {"start": 1258.47, "end": 1259.937, "text": "만약 제가 그렇게 말했다면,"}, {"start": 1259.937, "end": 1262.97, "text": "\"잠깐, 이거 정말 심각한데\"라고 생각하셔야 마땅합니다."}, {"start": 1262.97, "end": 1266.795, "text": "하지만 저희는 이것이 명백한 AI 안전사고이자 정렬의 실패라고"}, {"start": 1266.845, "end": 1267.97, "text": "솔직히 밝혔습니다."}, {"start": 1267.97, "end": 1269.897, "text": "이런 일은 결코 있어서는 안 되기에,"}, {"start": 1269.897, "end": 1273.219, "text": "이번 일에서 교훈을 얻고 다른 방식으로 개선해 나가고 있습니다."}, {"start": 1273.269, "end": 1275.785, "text": "AI와 정책, 그리고 그에 걸린 위험에"}, {"start": 1275.835, "end": 1278.47, "text": "대한 논란이 그 어느 때보다 뜨겁습니다."}, {"start": 1278.47, "end": 1281.565, "text": "점점 더 고조되는 느낌인데요,"}, {"start": 1281.615, "end": 1282.97, "text": "언급하셨다시피"}, {"start": 1282.97, "end": 1286.505, "text": "경쟁사들은 이를 매우 하향식 방식으로"}, {"start": 1286.555, "end": 1287.97, "text": "몰아가고 있고,"}, {"start": 1287.97, "end": 1290.07, "text": "특히 미국 내에서 사람들은 AI에 대해"}, {"start": 1290.07, "end": 1292.219, "text": "매우 강한 우려와 감정을 품고 있습니다."}, {"start": 1292.269, "end": 1294.696, "text": "지금 말씀하신 내용이 사람들의 그런 두려움을"}, {"start": 1294.746, "end": 1296.97, "text": "더 자극하지 않을까 걱정되진 않으신가요?"}, {"start": 1296.97, "end": 1297.97, "text": "사람들의 공포나,"}, {"start": 1298.019, "end": 1301.47, "text": "속도를 늦춰야 할 모델이 있다고 밝히는 점에 대한 우려는 없으신가요?"}, {"start": 1301.47, "end": 1303.546, "text": "제 생각에는 오히려 대중이"}, {"start": 1303.596, "end": 1305.97, "text": "이를 환영해야 한다고 봅니다."}, {"start": 1305.97, "end": 1308.425, "text": "안전성을 더 확실히 담보하기 위해 출시를 늦추고,"}, {"start": 1308.425, "end": 1310.97, "text": "속도를 조절하고, 컴퓨팅을 재배치하겠다는 거니까요."}, {"start": 1310.97, "end": 1312.855, "text": "혹자는 그 말을 믿지 않거나"}, {"start": 1312.905, "end": 1315.67, "text": "과도하게 안전하다고 여길 수도 있겠지만,"}, {"start": 1315.67, "end": 1318.015, "text": "대부분은 \"보수적이고 신중하게 접근하고 있어"}, {"start": 1318.015, "end": 1319.97, "text": "다행이다\"라고 여겨 주시길 바랍니다."}, {"start": 1319.97, "end": 1322.272, "text": "만약 우리가 강력한 모델을 사람들에게"}, {"start": 1322.322, "end": 1324.97, "text": "쥐어주기 위해 부단히 노력해오지 않았거나,"}, {"start": 1324.97, "end": 1326.858, "text": "그에 필요한 안전 작업을 해온 실적이"}, {"start": 1326.908, "end": 1329.269, "text": "없었다면—우리는 업계를 내내 이끌어 왔지만요—"}, {"start": 1329.27, "end": 1331.996, "text": "모두에게 혜택을 주는 반복적 배포라는 저희의 핵심 사명이 없었다면,"}, {"start": 1331.996, "end": 1333.47, "text": "저 역시 그 우려를 이해했을 겁니다."}, {"start": 1335.31, "end": 1337.139, "text": "저희가 \"시간이 조금 더 필요합니다,"}, {"start": 1337.139, "end": 1338.51, "text": "위험한 경쟁은 원치 않으며,"}, {"start": 1338.51, "end": 1341.339, "text": "안전하고 견고하며 신뢰할 수 있는 제품을"}, {"start": 1341.339, "end": 1342.11, "text": "제공한 뒤"}, {"start": 1342.11, "end": 1344.224, "text": "원하시는 대로 자유롭게 쓰실 수 있게"}, {"start": 1344.224, "end": 1345.81, "text": "해드리고 싶다\"고 말한다면,"}, {"start": 1345.81, "end": 1347.66, "text": "저희는 10억 명이 넘는 사용자들에게"}, {"start": 1347.66, "end": 1349.51, "text": "그렇게 누릴 권리가 있다고 믿습니다."}, {"start": 1349.51, "end": 1351.207, "text": "기업들 또한 비즈니스 주권과"}, {"start": 1351.207, "end": 1353.81, "text": "데이터 프라이버시를 보장받을 권리가 있고,"}, {"start": 1353.81, "end": 1355.355, "text": "저희는 그들이 성공하길 바라며,"}, {"start": 1355.355, "end": 1356.81, "text": "가능한 모든 창의적인 방식으로"}, {"start": 1356.81, "end": 1359.81, "text": "모델을 활용하기를 기대합니다."}, {"start": 1359.81, "end": 1362.81, "text": "하지만 안전은 저희 사명의 본질적인 부분입니다."}, {"start": 1362.81, "end": 1366.11, "text": "그러니 이 점에 대해서는 조금만 너그럽게 이해해 주셨으면 합니다. 그 정도는 괜찮잖아요."}, {"start": 1366.11, "end": 1367.862, "text": "네. 정확히 어떤 부분이 일시 중단된 건지"}, {"start": 1367.862, "end": 1369.31, "text": "구체적으로 말씀해 주실 수 있나요?"}, {"start": 1369.31, "end": 1371.944, "text": "사람들은 '훈련 중단'이라고 하면 모든 훈련이 다"}, {"start": 1371.944, "end": 1373.31, "text": "멈춘 것으로 생각하거든요."}, {"start": 1373.31, "end": 1376.079, "text": "네, 저희가 모든 훈련을 늦추거나 중단하거나"}, {"start": 1376.079, "end": 1377.81, "text": "연기한 것은 절대 아닙니다."}, {"start": 1377.81, "end": 1381.51, "text": "이건 구체적으로 프론티어 강화학습 실행에 관한 것으로,"}, {"start": 1381.51, "end": 1384.103, "text": "현재 가장 큰 위험이 존재한다고 생각되는"}, {"start": 1384.103, "end": 1384.81, "text": "영역입니다."}, {"start": 1384.81, "end": 1387.31, "text": "그리고 이전에도 훈련 실행 자체에 대한"}, {"start": 1387.31, "end": 1389.81, "text": "모니터링 체계를 더 철저히 갖추기 위해"}, {"start": 1389.81, "end": 1393.31, "text": "다른 일부 훈련 일정을 늦춘 적이 있었습니다."}, {"start": 1393.31, "end": 1395.263, "text": "하지만 전체 훈련을 멈춘 건 아닙니다."}, {"start": 1395.263, "end": 1397.31, "text": "클러스터가 그냥 놀고 있는 건 아니에요."}, {"start": 1397.31, "end": 1400.06, "text": "저희는 여전히 작업을 진행 중이지만, 안전성에 대해"}, {"start": 1400.06, "end": 1402.81, "text": "더 확신할 수 있는 작업을 우선하고 있는 것입니다."}, {"start": 1402.81, "end": 1404.879, "text": "훈련 중단이 가져올 파장에 대해 크게"}, {"start": 1404.879, "end": 1406.327, "text": "동요하지 않는 모습이네요."}, {"start": 1406.327, "end": 1408.81, "text": "사업적으로는 괜찮을 거라 보시는 것 같고요."}, {"start": 1408.81, "end": 1412.31, "text": "물론 사람들의 우려는 여전히 있겠지만,"}, {"start": 1412.31, "end": 1415.81, "text": "어쨌든 성장 속도를 늦추는 요인으로 보이긴 합니다."}, {"start": 1415.81, "end": 1418.831, "text": "글쎄요, 저에 대해 왜곡된 이미지가 있는 것 같아요."}, {"start": 1418.831, "end": 1420.81, "text": "AI 안전 따위엔 신경도 안 쓰고,"}, {"start": 1420.81, "end": 1425.31, "text": "오로지 수익만 올리려고 혈안이 된"}, {"start": 1425.31, "end": 1426.573, "text": "'욜로 CEO'라는 식으로요."}, {"start": 1426.573, "end": 1428.31, "text": "언젠가 누군가 그렇게 말했던 것 같네요."}, {"start": 1428.31, "end": 1430.81, "text": "실제로 그렇게 말한 사람이 있죠. 다리오 아모데이요."}, {"start": 1430.81, "end": 1434.31, "text": "누가 말했는지는 기억나지 않네요. 그래도 그 영상은 봤던 것 같네요. 알려줘서 고마워요."}, {"start": 1434.31, "end": 1439.81, "text": "거의 11년 동안 한결같았습니다."}, {"start": 1439.81, "end": 1442.45, "text": "위험성과 혜택, 그리고 그 둘 사이의 균형을"}, {"start": 1442.45, "end": 1445.259, "text": "맞춰야 한다는 점을 늘 일관되게 이야기해 왔죠."}, {"start": 1445.309, "end": 1446.77, "text": "저희가 완벽하다는 뜻은 아닙니다."}, {"start": 1446.82, "end": 1450.309, "text": "회사도 완벽하지 않고, 모델도 완벽하지 않으며, 저 자신도 완벽하지 않습니다."}, {"start": 1450.31, "end": 1453.213, "text": "하지만 다양한 AI 사업을 이끄는"}, {"start": 1453.213, "end": 1455.31, "text": "다른 분들과는 달리..."}, {"start": 1456.67, "end": 1460.47, "text": "말과 행동이 일치하는 모습을 보여주는 거죠."}, {"start": 1460.47, "end": 1462.67, "text": "이건 우리가 항상 이야기해 오던 순간이고요."}, {"start": 1462.67, "end": 1466.47, "text": "수익이나 매출, 그 어떤 것보다"}, {"start": 1466.47, "end": 1468.444, "text": "우리가 이걸 최우선으로"}, {"start": 1468.494, "end": 1470.47, "text": "두겠다고 늘 말해왔죠."}, {"start": 1470.47, "end": 1472.97, "text": "우린 여전히 엄청나게 성공적인 기업을 만들 겁니다."}, {"start": 1472.97, "end": 1475.17, "text": "어쩌면 사람들이 기대한 모습과는 다를 수도 있죠."}, {"start": 1475.17, "end": 1477.17, "text": "\"새로운 위험이 보이니 속도를 늦추겠다\"라고 말하는 것이요."}, {"start": 1477.17, "end": 1479.47, "text": "하지만 우리는 항상 그런 기업이라고 생각해 왔습니다."}, {"start": 1479.47, "end": 1481.47, "text": "요즘 AGI에 대해서는 어떻게 생각하시나요?"}, {"start": 1481.47, "end": 1484.27, "text": "좋게 봐줘도 개념 정의가 매우 모호한 용어죠."}, {"start": 1484.27, "end": 1486.57, "text": "무의미한 마케팅 용어라고 말씀드리려 했습니다."}, {"start": 1486.57, "end": 1489.97, "text": "하지만 귀사의 헌장에는 이렇게 명시되어 있죠."}, {"start": 1489.97, "end": 1493.819, "text": "경제적으로 가치 있는 대부분의 일에서 인간을 능가하는 고도의 자율 시스템이라고요."}, {"start": 1493.869, "end": 1496.356, "text": "현재 모델들을 보고 이미 도달했다고"}, {"start": 1496.406, "end": 1498.369, "text": "보는 사람들도 많을 겁니다."}, {"start": 1498.37, "end": 1499.6, "text": "그렇죠."}, {"start": 1499.65, "end": 1501.15, "text": "AGI에 도달했다고 보시나요?"}, {"start": 1501.25, "end": 1503.396, "text": "어느 정도는요, 적어도 근접했죠."}, {"start": 1503.396, "end": 1504.396, "text": "제 생각엔..."}, {"start": 1504.45, "end": 1508.15, "text": "팀 내부에서도 사람마다 의견이 꽤 갈린다고 들었는데요."}, {"start": 1508.25, "end": 1510.74, "text": "저희 최신 내부 모델들을 보고"}, {"start": 1510.79, "end": 1515.15, "text": "\"정말 AGI답다\"고 말하는 사람들이 아주 많아요."}, {"start": 1515.65, "end": 1517.817, "text": "반면에 \"아직 이건 못 하잖아\","}, {"start": 1517.817, "end": 1519.163, "text": "\"이건 너무 못하니까"}, {"start": 1519.213, "end": 1522.15, "text": "AGI가 아니야\"라고 지적하는 분들도 있죠."}, {"start": 1522.25, "end": 1525.381, "text": "하지만 사람들이 실제로 얻고 있는 가치를 보면,"}, {"start": 1525.381, "end": 1528.15, "text": "앞으로 더 얻게 될 것들은 차치하고라도요."}, {"start": 1528.25, "end": 1530.534, "text": "업무 효율을 완전히 바꾸어 놓거나"}, {"start": 1530.584, "end": 1533.25, "text": "새로운 일들을 가능하게 만든 방식이나,"}, {"start": 1533.3, "end": 1535.0, "text": "새로운 종류의 작업을 수행하는 모습,"}, {"start": 1535.0, "end": 1535.7, "text": "개인 일상에서 온갖 멋진 방식으로"}, {"start": 1535.75, "end": 1539.65, "text": "일상생활에서 온갖 멋진 방식으로 활용하는 모습을 보면 말이죠."}, {"start": 1539.75, "end": 1541.274, "text": "크고 작은 일 모두에서요."}, {"start": 1541.274, "end": 1544.65, "text": "\"평소라면 불가능했을 생명을 구하는 진단을 받았다\"거나,"}, {"start": 1544.75, "end": 1547.233, "text": "\"ChatGPT로 34시간 동안 세션을 진행하며"}, {"start": 1547.283, "end": 1550.15, "text": "논문 2,000편을 읽게 했다\"는 이야기를 듣게 되죠."}, {"start": 1550.25, "end": 1551.65, "text": "34시간이나요?"}, {"start": 1551.75, "end": 1553.667, "text": "그보다 더 길게 돌린 사례도 들었어요."}, {"start": 1553.667, "end": 1555.95, "text": "실제로 많은 사람들이 하루 이상 구동시킵니다."}, {"start": 1556.05, "end": 1557.05, "text": "와..."}, {"start": 1557.05, "end": 1559.65, "text": "\"찾을 수 있는 모든 논문을 다 읽어라\"라고 지시하는 식이죠."}, {"start": 1559.75, "end": 1561.507, "text": "그리고 \"아이 생일 파티를 기획했는데,"}, {"start": 1561.557, "end": 1562.686, "text": "모든 걸 알아서 처리하고"}, {"start": 1562.736, "end": 1565.95, "text": "지역 업체들을 조율해 특별한 케이크까지 찾아줬다\"는 분들도 있고요."}, {"start": 1566.05, "end": 1568.839, "text": "저도 집에서 우체국 방문 수거를 신청해야 했는데,"}, {"start": 1568.839, "end": 1572.35, "text": "웹사이트 양식 작성이 귀찮아서 Codex한테 대신 시켰거든요."}, {"start": 1572.45, "end": 1573.85, "text": "아주 잘 해냈겠네요."}, {"start": 1573.95, "end": 1577.05, "text": "택배를 문 앞에 두었더니 다음 날 수거해 갔더라고요."}, {"start": 1577.05, "end": 1580.15, "text": "사소해 보이지만 예전 같으면 20분은 걸렸을 일이죠."}, {"start": 1580.25, "end": 1581.783, "text": "맞아요. 충분히 공감합니다."}, {"start": 1581.783, "end": 1584.95, "text": "저 역시 그런 20분의 효율을 매 순간 얻고 있으니까요."}, {"start": 1585.15, "end": 1586.627, "text": "만약 2020년으로"}, {"start": 1586.677, "end": 1591.259, "text": "돌아가 삶의 모든 영역에서 20분의 시간을 절약해 주고,"}, {"start": 1591.259, "end": 1593.15, "text": "새로운 과학을 발견하며,"}, {"start": 1593.25, "end": 1596.277, "text": "창업을 돕고 복잡한 코드를 작성해 주는"}, {"start": 1596.327, "end": 1599.787, "text": "시스템이 있다면 그걸 AGI라고 불렀을까요?"}, {"start": 1599.787, "end": 1601.35, "text": "아마 그랬을 겁니다."}, {"start": 1601.45, "end": 1604.65, "text": "공식적으로 AGI를 선언한다는 것에 어떤 의미가 있을까요?"}, {"start": 1604.75, "end": 1606.15, "text": "별 의미 없다고 봅니다. 아무런 의미도 없어요."}, {"start": 1606.25, "end": 1610.162, "text": "흥미롭네요. 연구동 곳곳에 \"AGI를 만든다\"고 적혀 있지만,"}, {"start": 1610.162, "end": 1612.497, "text": "이제는 도달해야 할 최종 상태라기보다"}, {"start": 1612.547, "end": 1614.65, "text": "끊임없이 만들어가는 과정 같네요."}, {"start": 1614.75, "end": 1617.957, "text": "우리가 AGI에 도달했다고 승리를 선언하고 끝났다는 건 아니지만,"}, {"start": 1617.957, "end": 1619.65, "text": "사람들이 쓰는 표현을 들어보면..."}, {"start": 1620.73, "end": 1621.842, "text": "초지능으로"}, {"start": 1621.892, "end": 1625.23, "text": "향하는 지속적인 발전 과정과"}, {"start": 1625.23, "end": 1627.73, "text": "그것이 세상에 가져올 혜택이나 과제에 대해"}, {"start": 1627.73, "end": 1630.23, "text": "AGI 도달 여부보다 훨씬 더 많이 이야기할 겁니다."}, {"start": 1630.23, "end": 1631.809, "text": "카페테리아 식탁에서"}, {"start": 1631.859, "end": 1634.23, "text": "우리가 AGI에 도달했는지,"}, {"start": 1634.23, "end": 1637.73, "text": "언제 도달할지에 대해 토론하는 건 정말 오랜만이에요."}, {"start": 1637.93, "end": 1641.23, "text": "하지만 이제 초지능이라는 단어가 널리 쓰이고 있죠."}, {"start": 1641.23, "end": 1644.73, "text": "AI를 잘 모르는 사람들은 골대를 옮긴 뒤"}, {"start": 1644.73, "end": 1647.53, "text": "이제 초지능을 이야기하는 거냐고 생각합니다."}, {"start": 1647.53, "end": 1650.73, "text": "오늘날 샘이 생각하기에,"}, {"start": 1650.73, "end": 1654.23, "text": "AGI와 초지능의 차이점은 무엇인가요?"}, {"start": 1654.53, "end": 1658.23, "text": "AGI는 하나의 이정표처럼 느껴졌지만,"}, {"start": 1658.23, "end": 1659.23, "text": "초지능은 무한히 확장될 수 있는 것으로 느껴집니다."}, {"start": 1659.23, "end": 1659.98, "text": "무한히요?"}, {"start": 1660.03, "end": 1660.68, "text": "네."}, {"start": 1660.73, "end": 1663.23, "text": "그러니까 전지전능한 최종 종착점이 아니라..."}, {"start": 1663.23, "end": 1665.23, "text": "거기에는 결코 최종 승리 선언이란 없을 겁니다."}, {"start": 1665.23, "end": 1667.73, "text": "이런 용어들이 다 무의미한 이유이기도 한데요."}, {"start": 1667.73, "end": 1670.73, "text": "사람마다 그 단어를 저마다 다른 의미로 사용하니까요."}, {"start": 1670.73, "end": 1674.23, "text": "어떤 사람은 명확한 이정표로 여기는 반면,"}, {"start": 1674.23, "end": 1677.73, "text": "어떤 사람들은 무한히 확장되는 무언가로 보죠."}, {"start": 1677.73, "end": 1681.23, "text": "이 모든 것에서 중요한 것은 이정표나 용어가 아니라,"}, {"start": 1681.23, "end": 1683.487, "text": "역량과 잠재력이 지수함수적으로"}, {"start": 1683.537, "end": 1685.23, "text": "증가하고 있다는 점이며"}, {"start": 1685.23, "end": 1688.42, "text": "그 흐름은 앞으로도 계속 이어질 것으로"}, {"start": 1688.47, "end": 1689.23, "text": "보입니다."}, {"start": 1689.53, "end": 1692.73, "text": "그 지수적 성장이 둔화할 조짐은 전혀 안 보이나요?"}, {"start": 1692.73, "end": 1694.23, "text": "앞을 가로막는 장애물은 전혀 없습니다."}, {"start": 1694.53, "end": 1698.23, "text": "컴퓨팅 인프라 구축 등 모든 것에 영향을 미칠 테니까요."}, {"start": 1698.23, "end": 1701.192, "text": "다들 둔화의 조짐을 주시하고"}, {"start": 1701.242, "end": 1702.23, "text": "있습니다."}, {"start": 1702.23, "end": 1704.204, "text": "프론티어 훈련 속도를 늦춰야 한다는"}, {"start": 1704.254, "end": 1706.23, "text": "말을 둔화로 볼 수도 있겠지만..."}, {"start": 1706.53, "end": 1709.23, "text": "그건 역량의 둔화가 아닙니다."}, {"start": 1709.23, "end": 1711.23, "text": "말씀하시는 둔화와는 완전히 반대되는 얘기죠."}, {"start": 1711.23, "end": 1712.23, "text": "맞아요, 그렇군요."}, {"start": 1712.23, "end": 1713.728, "text": "그렇다면 현재 AI가"}, {"start": 1713.778, "end": 1716.23, "text": "구축해 온 이 젠가 같은 세상에서"}, {"start": 1716.23, "end": 1718.816, "text": "우려할 만한 요인이"}, {"start": 1718.866, "end": 1722.23, "text": "있다면 무엇이 보이나요?"}, {"start": 1722.53, "end": 1726.23, "text": "작년에 힘든 시간을 겪으면서 얻은 이점 중 하나는"}, {"start": 1726.23, "end": 1729.23, "text": "좋은 시절이 얼마나 소중한지 진정으로 알게 된다는 것입니다."}, {"start": 1729.23, "end": 1732.039, "text": "비즈니스의 모든 엔진이 전력으로"}, {"start": 1732.089, "end": 1735.23, "text": "가동될 때의 느낌을 실감하게 되죠."}, {"start": 1735.23, "end": 1738.23, "text": "그리고 지난 일들을 감안할 때..."}, {"start": 1738.28, "end": 1739.5, "text": "안전과 정렬(Alignment)이라는 난제에도 불구하고,"}, {"start": 1739.5, "end": 1741.58, "text": "연구진이 똘똘 뭉쳐 이를 해결해 나가는 모습이나,"}, {"start": 1741.63, "end": 1744.43, "text": "안전 정렬의 도전 과제들을 해결해 나가는 역량,"}, {"start": 1744.43, "end": 1746.684, "text": "그리고 제품과 컴퓨팅 인프라 구축 전반에"}, {"start": 1746.734, "end": 1748.99, "text": "걸쳐 팀이 하나로 뭉치는 모습을 보면요."}, {"start": 1748.99, "end": 1750.039, "text": "AI를 풍부하고"}, {"start": 1750.089, "end": 1753.63, "text": "저렴하게 만들기 위해 모든 퍼즐이 맞춰지고 있고,"}, {"start": 1753.63, "end": 1757.39, "text": "시장 진출 시스템과 모든 파트너십까지"}, {"start": 1757.39, "end": 1760.51, "text": "이 모든 것들이 하나로 결합되고 있습니다."}, {"start": 1760.51, "end": 1764.19, "text": "물론 여러 방식으로 실수할 수도 있고,"}, {"start": 1764.19, "end": 1767.71, "text": "과거에도 비틀거림이 있었고 앞으로도 있겠지만 과신하고 싶지는 않습니다."}, {"start": 1767.71, "end": 1772.059, "text": "하지만 우리 눈앞에 펼쳐진 잠재력,"}, {"start": 1772.109, "end": 1774.7, "text": "모델이 확장되면서 일어난 변화들과"}, {"start": 1774.75, "end": 1776.91, "text": "신모델에 대한 초기 피드백,"}, {"start": 1776.91, "end": 1778.117, "text": "그리고 앞으로"}, {"start": 1778.167, "end": 1781.789, "text": "선보일 제품 개선 사항들을 살펴보면요."}, {"start": 1781.789, "end": 1783.557, "text": "매출이 가파르게 상승하고"}, {"start": 1783.607, "end": 1786.19, "text": "컴퓨팅 구축이 가속화되는 것을 보면"}, {"start": 1786.19, "end": 1787.71, "text": "이 모든 것에 대해 매우 좋은 느낌을 받습니다."}, {"start": 1787.71, "end": 1791.23, "text": "그렇다면 외부에서 보는 시선과는 다르군요."}, {"start": 1791.23, "end": 1793.27, "text": "외부에서는 앤트로픽이 독주하고"}, {"start": 1793.32, "end": 1796.509, "text": "ARR도 더 높으며 먼저 상장할 거라 보는데,"}, {"start": 1796.509, "end": 1798.612, "text": "외부에서는 보지 못하는"}, {"start": 1798.662, "end": 1800.589, "text": "훨씬 더 많은 성장이"}, {"start": 1800.59, "end": 1802.67, "text": "앞으로 기다리고 있다는 말씀이시군요."}, {"start": 1802.67, "end": 1804.059, "text": "저는 저희의 위치를 누구와도 바꾸고 싶지 않습니다."}, {"start": 1804.109, "end": 1806.246, "text": "그리고 아직 깊이"}, {"start": 1806.296, "end": 1808.67, "text": "다루지는 못했지만,"}, {"start": 1808.67, "end": 1811.739, "text": "컴퓨팅 전략에서 다음 단계로의 대전환을 이루고 계신 것 같은데요."}, {"start": 1811.789, "end": 1815.301, "text": "네, 사실 스타게이트 1이"}, {"start": 1815.351, "end": 1818.109, "text": "처음 구상되었을 때와"}, {"start": 1818.11, "end": 1819.79, "text": "그 이후에 대해 이야기를 듣고 싶습니다."}, {"start": 1820.09, "end": 1822.89, "text": "...재정비하고 지금 여러분이 나아가고 있는 경로에 대해서요?"}, {"start": 1823.09, "end": 1826.09, "text": "우선 우리가 왜 이 일을 해야 하는지부터 말씀드려야겠네요."}, {"start": 1826.09, "end": 1829.539, "text": "저희의 사명은 AGI가 모든 인류에게 혜택을 주도록 하는 것입니다."}, {"start": 1829.589, "end": 1831.584, "text": "지금은 다른 모든 사람들보다"}, {"start": 1831.634, "end": 1835.89, "text": "훨씬 더 많은 AI를 사용하는 소수의 사람들만 존재합니다."}, {"start": 1836.089, "end": 1838.463, "text": "그리고 전 세계 모든 사람들이"}, {"start": 1838.513, "end": 1840.589, "text": "오늘날 상위 0.001%의"}, {"start": 1840.589, "end": 1841.589, "text": "AI 사용자만큼"}, {"start": 1841.639, "end": 1844.589, "text": "AI를 사용할 수 있게 되기를 바란다고 생각해보면,"}, {"start": 1844.59, "end": 1845.911, "text": "의자에 기대앉아 '이런,"}, {"start": 1845.961, "end": 1848.528, "text": "우리가 지금 컴퓨팅 인프라를 제대로 구축하고"}, {"start": 1848.578, "end": 1850.289, "text": "있지 않구나' 생각하게 되죠."}, {"start": 1850.59, "end": 1853.039, "text": "사람들이 이것을 폭넓게 원하고,"}, {"start": 1853.089, "end": 1855.866, "text": "모델이 더 커지고 성능이 향상되어 더 많은 가치를"}, {"start": 1855.916, "end": 1858.589, "text": "창출할 수 있어 사람들이 더 많이 원하게 되고,"}, {"start": 1858.59, "end": 1861.29, "text": "이를 실행하는 데 더 많은 컴퓨팅이 필요하다면,"}, {"start": 1861.589, "end": 1865.309, "text": "그 모든 것을 제공할 수 있도록 상황에 맞게 완전히 다른 방식으로"}, {"start": 1865.359, "end": 1866.289, "text": "생각해야 합니다."}, {"start": 1866.589, "end": 1869.255, "text": "그래서 몇 년 전 저희는 당시 사람들이"}, {"start": 1869.305, "end": 1871.589, "text": "어리석고 실현 불가능하다고 여겼던"}, {"start": 1871.59, "end": 1874.09, "text": "매우 야심 찬 컴퓨팅 베팅을 감행했습니다."}, {"start": 1874.09, "end": 1876.59, "text": "그건 좋은 선택이었고, 다시 한번 그런 시도를 해야 한다고 봅니다."}, {"start": 1876.59, "end": 1877.89, "text": "다시 한 번요? 네."}, {"start": 1878.09, "end": 1880.89, "text": "그러니까 더 많은 자본을 투입한다는 뜻인가요?"}, {"start": 1880.89, "end": 1882.297, "text": "그런 의미는 아닙니다."}, {"start": 1882.297, "end": 1884.239, "text": "물론 그렇게 되기도 하겠지만요."}, {"start": 1884.289, "end": 1886.225, "text": "제 뜻은 AI 비용은"}, {"start": 1886.275, "end": 1889.089, "text": "대폭 낮추고 공급량과 풍족함은"}, {"start": 1889.089, "end": 1891.43, "text": "대폭 늘리는 방법을"}, {"start": 1891.48, "end": 1894.289, "text": "찾아내겠다는 것입니다."}, {"start": 1894.589, "end": 1896.168, "text": "그러니까 재정적인 선언이"}, {"start": 1896.218, "end": 1898.89, "text": "아니라 기술적인 의미로 드린 말씀입니다."}, {"start": 1899.09, "end": 1901.09, "text": "지금 개발 중인 칩 같은 걸 말씀하시는 건가요?"}, {"start": 1901.09, "end": 1903.09, "text": "아주 좋은 예시라고 생각합니다."}, {"start": 1903.09, "end": 1904.29, "text": "로보틱스는요?"}, {"start": 1904.29, "end": 1907.59, "text": "네, 공급망을 더 빠르게 만드는 능력도 매우 중요해질 것입니다."}, {"start": 1907.59, "end": 1911.09, "text": "전 세계 모든 이에게 AI를 제공하는 것에 대해 말씀하시는데,"}, {"start": 1911.09, "end": 1914.09, "text": "지금 더 많은 AI를 원치 않고 오히려 줄어들길 바라는 사람들에게는 뭐라고 하시겠습니까?"}, {"start": 1914.09, "end": 1916.59, "text": "누구의 것이든 자기 지역 사회에 데이터 센터가 들어서는 걸 싫어하잖아요."}, {"start": 1916.59, "end": 1919.145, "text": "제가 만나는 10대 청소년들에게서도 자주 보는데,"}, {"start": 1919.145, "end": 1921.89, "text": "그들은 AI 서비스를 아예 건드리지도 않으려 합니다."}, {"start": 1922.09, "end": 1924.09, "text": "신념 때문에 ChatGPT를 쓰지 않으려는 건가요?"}, {"start": 1924.09, "end": 1925.09, "text": "맞습니다."}, {"start": 1925.09, "end": 1928.539, "text": "그리고 이런 적극적인 안티 AI 트렌드가 있어요."}, {"start": 1928.589, "end": 1930.564, "text": "데이터 센터를 싫어하는 것과 ChatGPT를"}, {"start": 1930.614, "end": 1932.589, "text": "싫어하는 것 중 어느 쪽 비중이 더 큰가요?"}, {"start": 1932.59, "end": 1933.84, "text": "순전히 개인적인 경험이지만,"}, {"start": 1933.84, "end": 1936.09, "text": "데이터 센터가 사람들에게 큰 문제인 것 같습니다."}, {"start": 1936.09, "end": 1939.59, "text": "사람들은 그걸 문제이자 원치 않는 존재로 보는 것 같아요."}, {"start": 1939.59, "end": 1940.59, "text": "음..."}, {"start": 1941.11, "end": 1943.596, "text": "AI가 낭비적이고 가치를 주지 못한다는 것,"}, {"start": 1943.596, "end": 1946.91, "text": "이미 반박된 물 소비량 같은 것들에 대해 읽어보셨겠지만요."}, {"start": 1946.91, "end": 1948.488, "text": "하지만 사람들이 얻는 가치 측면에서,"}, {"start": 1948.538, "end": 1951.739, "text": "대부분의 사람들이 아직 에이전트를 쓰지 않고 있는 것에 대해 이야기하고"}, {"start": 1951.789, "end": 1952.609, "text": "계신 것 같은데요,"}, {"start": 1952.61, "end": 1955.91, "text": "결국 그게 해답일까요? 그러니까..."}, {"start": 1955.91, "end": 1956.91, "text": "일반적으로 말해서,"}, {"start": 1956.96, "end": 1960.309, "text": "사람들이 무언가를 좋아하게 만드는 올바른 방법은 가치를 전달하는 것이라고 생각합니다."}, {"start": 1960.31, "end": 1961.259, "text": "그렇죠."}, {"start": 1961.309, "end": 1963.089, "text": "ChatGPT 이전에는 사람들이"}, {"start": 1963.139, "end": 1965.337, "text": "AI를 매우 추상적인 것으로 여겼지만,"}, {"start": 1965.338, "end": 1967.61, "text": "갑자기 누구나 직접 쓸 수 있게 되었죠."}, {"start": 1967.61, "end": 1969.91, "text": "그리고 사람들은 가치를 발견했습니다."}, {"start": 1969.91, "end": 1972.484, "text": "지금도 AI가 여전히 그저 ChatGPT 수준에"}, {"start": 1972.534, "end": 1974.91, "text": "불과하다고 생각하는 분들이 많은 것 같아요."}, {"start": 1974.91, "end": 1976.249, "text": "우체국 업무나 서류 작성,"}, {"start": 1976.249, "end": 1979.259, "text": "픽업 예약까지 대신해 줄 수 있다는 걸 아직 잘 모르시죠."}, {"start": 1979.309, "end": 1981.477, "text": "시간이 지나면서 많은"}, {"start": 1981.527, "end": 1983.892, "text": "분들이 이를 사용하고,"}, {"start": 1983.892, "end": 1985.61, "text": "이게 단순히..."}, {"start": 1985.61, "end": 1988.11, "text": "더 나은 구글 검색 정도에 불과한 게 아니라는 것을요."}, {"start": 1988.11, "end": 1991.61, "text": "엄청난 양의 물을 낭비하고 파괴하기만 하는 게 아니라는 걸 알게 된다면,"}, {"start": 1991.61, "end": 1992.31, "text": "네."}, {"start": 1992.31, "end": 1994.069, "text": "그때는 기대감이 더 커질 겁니다."}, {"start": 1994.069, "end": 1996.559, "text": "하지만 이 분야가 워낙 빠르게 발전하고 있어서,"}, {"start": 1996.609, "end": 1998.859, "text": "사회 전반에 스며드는 데는 시간이"}, {"start": 1998.909, "end": 2000.91, "text": "조금 걸릴 뿐이라고 생각해요."}, {"start": 2000.91, "end": 2004.006, "text": "이미 수많은 사람이 AI를 사용하고 있고,"}, {"start": 2004.006, "end": 2007.91, "text": "제가 알기로는 역사상 가장 빠르게 도입된 기술입니다."}, {"start": 2007.91, "end": 2008.866, "text": "그리고 이를 통해"}, {"start": 2008.866, "end": 2011.31, "text": "엄청난 가치를 얻고 있는 분들도 많습니다."}, {"start": 2011.31, "end": 2013.365, "text": "제게는 편향된 표본이겠지만,"}, {"start": 2013.415, "end": 2015.566, "text": "\"ChatGPT가 전 세계의"}, {"start": 2015.616, "end": 2017.91, "text": "물을 다 써버린다\"는 말보다는"}, {"start": 2017.91, "end": 2020.435, "text": "\"이 끔찍한 병의 치료법을 찾을 수 있었다\"는"}, {"start": 2020.485, "end": 2022.91, "text": "분들의 목소리를 훨씬 더 많이 듣고 있어요."}, {"start": 2022.91, "end": 2024.91, "text": "분명 그런 우려도 존재하긴 하죠."}, {"start": 2024.91, "end": 2028.083, "text": "그리고 우리 업계도 이 제품들을 더 쓰기 쉽고,"}, {"start": 2028.083, "end": 2030.195, "text": "사람들이 많은 가치를 쉽게 얻을"}, {"start": 2030.245, "end": 2032.109, "text": "수 있도록 노력해야 합니다."}, {"start": 2032.11, "end": 2034.445, "text": "ChatGPT의 물 사용량에 대해"}, {"start": 2034.445, "end": 2036.91, "text": "떠도는 이야기를 본 적이 있는데요."}, {"start": 2036.91, "end": 2039.48, "text": "ChatGPT 질문을 한 번 할 때마다 샤워기를"}, {"start": 2039.53, "end": 2041.309, "text": "6시간 동안 틀어놓는 것과 같고,"}, {"start": 2041.309, "end": 2043.205, "text": "그 물은 영영 돌아오지 않고"}, {"start": 2043.255, "end": 2045.91, "text": "그냥 사라져 버린다는 식의 이야기였죠."}, {"start": 2045.91, "end": 2049.11, "text": "지금 제 앞에 정확한 계산 수치가 있는 건 아니지만,"}, {"start": 2049.11, "end": 2052.601, "text": "제 기억으로는—틀릴 수도 있지만"}, {"start": 2052.651, "end": 2054.909, "text": "거의 근접한 수치로—"}, {"start": 2054.909, "end": 2056.621, "text": "ChatGPT 질의 3만"}, {"start": 2056.671, "end": 2058.909, "text": "8천 번당 사용되는 물의 양은,"}, {"start": 2058.91, "end": 2060.608, "text": "캘리포니아에서 아몬드 딱 한 알을 생산하는 데 들어가는 물의 양과 같습니다."}, {"start": 2060.658, "end": 2064.95, "text": "사용되는 수자원의 양과 거의 비슷합니다."}, {"start": 2065.0, "end": 2066.701, "text": "정말 그렇습니다."}, {"start": 2066.751, "end": 2072.8, "text": "이건 완전한, 아시다시피, 총체적인 물 사용량 계산입니다."}, {"start": 2072.8, "end": 2078.223, "text": "단순히 한 데이터 센터에서 사용되는 물이 아니죠. 이것이 어디서 왔는지에 대한 의문이 있습니다."}, {"start": 2078.273, "end": 2083.8, "text": "아몬드 12개를 한 번에 먹는 사람들은 대부분 물 관점에서 끔찍한 일을 한다고 느끼지 않으니까요."}, {"start": 2083.8, "end": 2088.476, "text": "음, 데이터 센터가 한때 증발 냉각을"}, {"start": 2088.526, "end": 2091.8, "text": "사용했던 것은 사실입니다."}, {"start": 2091.8, "end": 2101.371, "text": "하지만 오랫동안 그렇게 하지 않았습니다. 현대의 매우 큰 데이터 센터를 보면, 사무실 건물과 비슷한 양의 물을 사용합니다."}, {"start": 2101.421, "end": 2104.8, "text": "사람들이 싱크대와 화장실을 사용하는 정도죠."}, {"start": 2104.8, "end": 2107.472, "text": "음, 그것은 강력한 밈이었고 반박하기 어려웠지만,"}, {"start": 2107.523, "end": 2109.8, "text": "어떤 조사에도 견디지 못한다고 생각합니다."}, {"start": 2109.8, "end": 2112.8, "text": "제 말은, 다른 하나는 내 일자리를 빼앗아갈 것이라는 거죠."}, {"start": 2112.8, "end": 2113.8, "text": "나를 대체할 겁니다."}, {"start": 2113.8, "end": 2116.959, "text": "그것들은 물과 같고, 나를 대체하고, 콘텐츠를 훔치고,"}, {"start": 2117.009, "end": 2120.8, "text": "아시다시피, 콘텐츠를 훔치고 가치를 돌려주지 않는다고 생각합니다."}, {"start": 2120.8, "end": 2122.8, "text": "하지만 흥미롭게도 에너지는 아니죠."}, {"start": 2122.8, "end": 2124.8, "text": "음, 에너지는 물과 같은 범주에 넣겠습니다."}, {"start": 2124.8, "end": 2125.8, "text": "소비니까요."}, {"start": 2125.8, "end": 2127.8, "text": "자원 소비."}, {"start": 2127.8, "end": 2129.623, "text": "일자리 문제에 대해서는"}, {"start": 2129.673, "end": 2131.8, "text": "두 가지 생각이 있습니다."}, {"start": 2131.8, "end": 2133.8, "text": "하나는 실제 일자리 영향이 있을 거라는 겁니다."}, {"start": 2133.8, "end": 2137.58, "text": "사람들이 할 일이 없을 거라는 생각은 하지 않습니다."}, {"start": 2137.63, "end": 2144.8, "text": "우리는 다른 사람들을 돌보고, 다른 사람들과 함께 일하고 싶어 하도록 너무나도 타고났기 때문입니다."}, {"start": 2144.8, "end": 2145.8, "text": "세상이 발전하면서"}, {"start": 2145.85, "end": 2148.8, "text": "사람들이 무엇을 원하는지에 대한 훌륭한 직관을 가지고 있습니다."}, {"start": 2148.8, "end": 2151.8, "text": "음, AI가 아무리 똑똑해져도 그것은 근본적으로 인간적인 것이라고 생각합니다."}, {"start": 2151.8, "end": 2156.52, "text": "하지만 그렇다고 해서 일자리가 변화하지 않을 것이라는 의미는 아닙니다."}, {"start": 2156.57, "end": 2164.8, "text": "다른 모든 기술과 마찬가지로 기술에 의해 더 잘 수행되는 일들이 있을 것이고, 사람들은 더 나은 일자리로 나아갈 것입니다."}, {"start": 2164.8, "end": 2165.8, "text": "이것은 오랫동안 계속되어 왔습니다."}, {"start": 2165.8, "end": 2168.8, "text": "모든 기술을 없애고 다시 밭에서 일하고 싶지는 않습니다."}, {"start": 2168.8, "end": 2170.994, "text": "반면에, 일자리 영향은 제가 예상했던 것보다,"}, {"start": 2171.044, "end": 2172.8, "text": "어쩌면 바랐던 것보다 더 낮았습니다."}, {"start": 2172.8, "end": 2174.925, "text": "저는 우리 모두가 사람들에게"}, {"start": 2174.975, "end": 2178.8, "text": "더 나은 일자리가 제공되기를 바란다고 생각합니다."}, {"start": 2178.8, "end": 2181.71, "text": "그리고 우리 모두는 인간의 고된 노동과 노고가 해결되기를 바랄 것입니다."}, {"start": 2181.76, "end": 2186.18, "text": "어쩌면 이 기술 수준에서는 우리가 생각했던 것만큼 충분하지 않았을 수도 있습니다. 그리고 저는 그것이 AI 산업에 대한 정당한 비판이라고 생각합니다."}, {"start": 2186.23, "end": 2187.95, "text": "콘텐츠 무단 도용 문제에 대해서는"}, {"start": 2187.95, "end": 2189.87, "text": "요즘은 예전만큼 많이 거론되지 않는 것 같아요."}, {"start": 2189.87, "end": 2191.95, "text": "콘텐츠 제작자들 사이에서"}, {"start": 2191.95, "end": 2193.55, "text": "더 두드러지게 나타나는 것 같은데요."}, {"start": 2193.55, "end": 2195.87, "text": "소셜 미디어에서도 꽤 자주 보이잖아요."}, {"start": 2196.87, "end": 2198.47, "text": "'이 영상은 AI 없이 제작되었습니다' 같은 것들이요."}, {"start": 2198.47, "end": 2199.31, "text": "네, 맞아요."}, {"start": 2199.31, "end": 2202.19, "text": "저는 앞으로 완전히 새로운 종류의 콘텐츠와"}, {"start": 2202.19, "end": 2204.59, "text": "새로운 형태의 예술이 탄생할 거라고 확신합니다."}, {"start": 2204.59, "end": 2207.43, "text": "과거에 카메라가 처음 개발되었을 때"}, {"start": 2207.43, "end": 2210.55, "text": "사람들이 했던 이야기들을 돌아보면요,"}, {"start": 2210.55, "end": 2212.67, "text": "이것이 화가들에게 어떤 영향을 미칠지에 대한 논쟁이 있었죠."}, {"start": 2212.67, "end": 2215.35, "text": "그리고 당시 사람들은 사진을"}, {"start": 2215.35, "end": 2216.95, "text": "새로운 예술 매체로 생각하지 않았을 겁니다."}, {"start": 2216.95, "end": 2219.55, "text": "분명 그렇게 생각하지 않았을 거라고 장담해요."}, {"start": 2221.03, "end": 2223.59, "text": "앞으로 새로운 방식의 콘텐츠 창작이 나타날 테지만,"}, {"start": 2223.59, "end": 2225.19, "text": "대부분은 크게 신경 쓰지 않을 수도 있어요."}, {"start": 2225.19, "end": 2227.11, "text": "창작자와의 관계라는 것은"}, {"start": 2227.11, "end": 2228.71, "text": "그 사람 자체와의 깊은 유대에 가깝기 때문에"}, {"start": 2228.71, "end": 2230.292, "text": "더 나은 영상을 만들기 위해"}, {"start": 2230.292, "end": 2232.19, "text": "AI를 쓰든 말든 상관없으니까요."}, {"start": 2232.19, "end": 2233.39, "text": "대표님의 재단은"}, {"start": 2233.39, "end": 2236.95, "text": "제가 보기에 세계에서 가장 자본력이 풍부한 편인데,"}, {"start": 2236.95, "end": 2240.59, "text": "지역 사회와의 소통이나 기여 측면에서"}, {"start": 2240.59, "end": 2241.73, "text": "더 많은 역할을 할 수 있지 않을까요?"}, {"start": 2241.73, "end": 2242.95, "text": "특히 창작자들을 대상으로 말씀이신가요?"}, {"start": 2242.95, "end": 2246.91, "text": "아뇨, 이런 부정적인 여론에 전반적으로 대응해서"}, {"start": 2246.91, "end": 2250.11, "text": "\"우리가 앞장서서 도서관을 짓겠다\"는 식으로 나서는 거죠."}, {"start": 2250.11, "end": 2250.63, "text": "뭐든 간에요."}, {"start": 2250.63, "end": 2253.19, "text": "산업혁명 당시 부를 재투자했던"}, {"start": 2253.19, "end": 2255.63, "text": "사람들로부터 얻을 수 있는 교훈도 많았잖아요."}, {"start": 2255.63, "end": 2257.34, "text": "제가 생각하기에 우리가"}, {"start": 2257.39, "end": 2259.67, "text": "할 수 있는 가장 중요한 일은"}, {"start": 2259.67, "end": 2263.07, "text": "사람들에게 유용한 훌륭한 AI 제품을 만들고,"}, {"start": 2263.07, "end": 2265.465, "text": "기술과 경제적 힘이 전 세계에"}, {"start": 2265.515, "end": 2267.909, "text": "널리 퍼지도록 하는 것입니다."}, {"start": 2267.91, "end": 2269.59, "text": "사람들이 이 도구와"}, {"start": 2269.59, "end": 2271.63, "text": "그 도구의 혜택을 온전히 누릴 수 있도록 하고,"}, {"start": 2271.63, "end": 2274.27, "text": "우리가 보고 있는 미래를 적극적으로 지지하는 것이죠."}, {"start": 2274.27, "end": 2276.79, "text": "그와 더불어 물론 부차적으로는"}, {"start": 2276.79, "end": 2278.59, "text": "지역 사회에 더 많은 투자를 해야 한다고 생각합니다."}, {"start": 2278.59, "end": 2281.39, "text": "AI가 대규모 투자를 가능케 할 풍요를"}, {"start": 2281.39, "end": 2283.07, "text": "가져다줄 테니까요."}, {"start": 2283.07, "end": 2285.71, "text": "정말 혁신적이고 강력한 혜택은"}, {"start": 2285.71, "end": 2290.99, "text": "이 기술을 사람들의 손에 쥐어주어"}, {"start": 2290.99, "end": 2293.004, "text": "그들이 자신의 커뮤니티를 위해"}, {"start": 2293.004, "end": 2295.27, "text": "활용하게 만드는 데서 올 겁니다."}, {"start": 2295.27, "end": 2297.51, "text": "우리가 가서 \"당신들에게 필요한 건 도서관이다\","}, {"start": 2297.51, "end": 2298.91, "text": "\"학교가 필요하다\"고 일방적으로 지시하는 게 아니라요."}, {"start": 2298.91, "end": 2301.59, "text": "저는 회의 사이사이에 맥락을 전환하느라 많은 시간을 보냅니다."}, {"start": 2301.87, "end": 2304.79, "text": "다음 회의가 시작되기 전에 내용을 정리할 틈도 없죠."}, {"start": 2304.79, "end": 2307.75, "text": "다행히 Granola는 백그라운드에서 항상 실행됩니다."}, {"start": 2307.75, "end": 2308.31, "text": "손쉽게 사용할 수 있죠."}, {"start": 2308.34, "end": 2312.14, "text": "통화 중에도 어디서나 작동하는 회의용 AI 메모장입니다."}, {"start": 2312.14, "end": 2314.591, "text": "회의에서 나눈 대화를 기억하고 유용한 요약을 정리하기 위해"}, {"start": 2314.591, "end": 2315.74, "text": "Granola를 사용합니다."}, {"start": 2315.74, "end": 2318.52, "text": "팀원들과 함께 처리해야 할 업무를 완벽히 파악하기 위해"}, {"start": 2318.52, "end": 2319.489, "text": "매일 사용하고 있죠."}, {"start": 2319.539, "end": 2322.127, "text": "이메일과 연동되어 신속하게 검토 후 보낼 수 있는"}, {"start": 2322.177, "end": 2325.34, "text": "후속 조치를 제안해 주므로 소중한 시간을 아낄 수 있습니다."}, {"start": 2325.34, "end": 2327.536, "text": "Granola는 제 업무 흐름의 핵심일 뿐 아니라,"}, {"start": 2327.536, "end": 2329.34, "text": "사실상 저의 '제2의 뇌'나 다름없습니다."}, {"start": 2329.34, "end": 2332.59, "text": "granola.ai/sources에서 Granola를 이용해 보시고,"}, {"start": 2332.59, "end": 2335.84, "text": "프로모션 코드 SOURCES를 입력해 3개월 할인 혜택을 받아보세요."}, {"start": 2335.84, "end": 2338.195, "text": "Mercury는 저와 같은 스타트업을 위해"}, {"start": 2338.195, "end": 2340.14, "text": "탄생한 혁신적인 금융 솔루션입니다."}, {"start": 2340.14, "end": 2342.518, "text": "미디어 사업을 시작하기로 결심했을 때,"}, {"start": 2342.518, "end": 2344.924, "text": "Mercury는 빠르게 설정할 수 있는"}, {"start": 2344.974, "end": 2347.84, "text": "가장 직관적이고 완벽한 뱅킹 솔루션이었습니다."}, {"start": 2347.84, "end": 2351.74, "text": "인터페이스가 직관적이고 심플하여 매일 소중한 시간을 절약해 줍니다."}, {"start": 2351.74, "end": 2352.94, "text": "저는 지출 내역과 청구서,"}, {"start": 2352.94, "end": 2355.34, "text": "인보이스 관리에 Mercury를 활용하고 있습니다."}, {"start": 2355.34, "end": 2356.546, "text": "팀원들에게 권한을 위임하여"}, {"start": 2356.596, "end": 2359.699, "text": "제가 원하는 방식 그대로 업무가 차질 없이 진행되도록 할 수 있어"}, {"start": 2359.7, "end": 2360.64, "text": "매우 만족스럽습니다."}, {"start": 2360.64, "end": 2364.54, "text": "제가 특히 만족하는 부분은 AI에 대한 Mercury의 선구적인 접근 방식입니다."}, {"start": 2364.54, "end": 2366.84, "text": "기존의 전통 은행들은 과거에 머물러 있지만,"}, {"start": 2366.84, "end": 2370.34, "text": "Mercury는 오늘날 최신 소프트웨어가 작동하는 방식에 최적화되어 있습니다."}, {"start": 2370.34, "end": 2373.371, "text": "자체 내장된 커맨드 어시스턴트를 활용해 현금 흐름을 분석하고"}, {"start": 2373.421, "end": 2374.34, "text": "자금을 이동시키며,"}, {"start": 2374.39, "end": 2375.0, "text": "가장 간편하고 모든 기능을 갖춘 뱅킹 솔루션이었습니다."}, {"start": 2375.5, "end": 2378.29, "text": "빠르고 손쉽게 계좌를 개설할 수 있었죠."}, {"start": 2378.34, "end": 2379.885, "text": "이 기능을 평소에 자주 쓰는데,"}, {"start": 2379.885, "end": 2383.34, "text": "Mercury 측에서도 제가 최상위 사용자 중 한 명이라고 하더군요."}, {"start": 2383.34, "end": 2385.34, "text": "그러니 절 믿어보세요."}, {"start": 2385.34, "end": 2387.685, "text": "어디서든 비즈니스에 필요한 실시간 재무 데이터를"}, {"start": 2387.735, "end": 2389.539, "text": "간편하게 확인할 수 있게 되었습니다."}, {"start": 2390.5, "end": 2393.29, "text": "자세한 정보는 mercury.com에서 확인하세요."}, {"start": 2393.34, "end": 2394.657, "text": "Mercury는 핀테크 기업으로,"}, {"start": 2394.657, "end": 2396.34, "text": "FDIC 보험이 적용되는 은행이 아닙니다."}, {"start": 2396.34, "end": 2398.65, "text": "금융 서비스는 FDIC 회원사인 Choice Financial"}, {"start": 2398.7, "end": 2400.739, "text": "Group 및 Column N.A.를 통해 제공됩니다."}, {"start": 2400.74, "end": 2402.12, "text": "Framer는 웹사이트를 디자인,"}, {"start": 2402.12, "end": 2405.34, "text": "관리, 배포하는 동일한 캔버스에 AI 에이전트를 통합한 웹사이트 빌더입니다."}, {"start": 2405.34, "end": 2407.932, "text": "자신만의 감각과 주도권을 잃지 않으면서도"}, {"start": 2407.982, "end": 2410.34, "text": "훨씬 더 빠르게 작업할 수 있습니다."}, {"start": 2410.34, "end": 2412.315, "text": "Framer는 podcast.sources.news에서"}, {"start": 2412.365, "end": 2414.34, "text": "서비스되는 Sources 팟캐스트 웹사이트를 구동하며,"}, {"start": 2414.34, "end": 2415.656, "text": "이곳에서 신규 에피소드와"}, {"start": 2415.706, "end": 2418.34, "text": "대본 등 다양한 콘텐츠를 만나보실 수 있습니다."}, {"start": 2418.34, "end": 2421.158, "text": "Framer 전문가를 통해 사이트 활용법을 알아보시거나,"}, {"start": 2421.158, "end": 2423.34, "text": "지금 무료로 웹사이트 제작을 시작해 보세요."}, {"start": 2423.39, "end": 2424.0, "text": "동일한 캔버스에 AI 에이전트를 통합한 빌더입니다."}, {"start": 2424.5, "end": 2437.0, "text": "framer.com/sources에서 프로 연간 플랜 30% 할인을 받으세요."}, {"start": 2437.5, "end": 2455.0, "text": "AI의 유용함은 주어지는 맥락에 달려 있으며,"}, {"start": 2455.5, "end": 2465.95, "text": "아틀라시안의 지라가 이를 완벽히 해결합니다."}, {"start": 2466.0, "end": 2469.5, "text": "Jira를 사용하면 업무 컨텍스트를 손쉽게 공유할 수 있습니다."}, {"start": 2469.55, "end": 2472.95, "text": "아틀라시안의 지라가 이를 완벽히 해결합니다."}, {"start": 2473.0, "end": 2475.394, "text": "에이전트에 직접 작업을 할당하거나 MCP를 통해"}, {"start": 2475.394, "end": 2476.5, "text": "도구를 연결해 보세요."}, {"start": 2476.5, "end": 2478.661, "text": "수많은 링크와 메시지를 뒤지며 무엇이,"}, {"start": 2478.661, "end": 2480.0, "text": "누구에 의해 결정되었는지"}, {"start": 2480.0, "end": 2483.0, "text": "일일이 확인하는 데 드는 시간을 줄이고,"}, {"start": 2483.0, "end": 2485.5, "text": "실제 프로덕트 배포에 더 많은 시간을 집중할 수 있습니다."}, {"start": 2485.55, "end": 2489.95, "text": "자세한 내용은 jira.com에서 확인해 보세요."}, {"start": 2490.0, "end": 2493.5, "text": "\"지난 12개월은 역대 최고가 아니었고 대부분 제 탓이지만,"}, {"start": 2493.5, "end": 2496.772, "text": "앞으로 역대 최고의 12개월을 맞이하게 될 것\"이라고"}, {"start": 2496.822, "end": 2497.5, "text": "하셨는데요."}, {"start": 2497.5, "end": 2499.5, "text": "어떤 의미로 하신 말씀인가요?"}, {"start": 2499.5, "end": 2501.5, "text": "- 최고의 12개월이요, 네. - 네."}, {"start": 2501.5, "end": 2503.882, "text": "회사로서 분명 몇 번의 실수가 있었던 것 같습니다."}, {"start": 2503.882, "end": 2505.5, "text": "주기적으로 일어날 수 있는 일이죠."}, {"start": 2505.5, "end": 2506.936, "text": "여러 베팅 포트폴리오를"}, {"start": 2506.986, "end": 2509.5, "text": "시도하다 보면 어떤 건 더 잘 풀리고,"}, {"start": 2509.5, "end": 2512.5, "text": "어떤 건 덜 풀리기도 하니까요."}, {"start": 2512.5, "end": 2514.71, "text": "하지만 제품 방향성 측면에서도 그렇고,"}, {"start": 2514.71, "end": 2516.5, "text": "특히 연구 부문의 사전 학습에서"}, {"start": 2516.5, "end": 2519.5, "text": "저희가 목표했던 수준에 미치지 못했던 것 같습니다."}, {"start": 2519.5, "end": 2522.8, "text": "하지만 지금은 저희가 역대 해온 것 중 최고일 뿐만 아니라,"}, {"start": 2522.8, "end": 2525.8, "text": "업계 최고 수준으로 실행해 나가고 있다고 생각합니다."}, {"start": 2526.05, "end": 2527.68, "text": "이 분야의 그 어떤 기업보다도요"}, {"start": 2527.68, "end": 2530.66, "text": "내리막 뒤의 상승세가 더 짜릿하듯,"}, {"start": 2530.66, "end": 2532.98, "text": "지금 정말 즐겁습니다."}, {"start": 2532.98, "end": 2536.68, "text": "출시를 앞둔 모델들의 개발 속도나"}, {"start": 2536.68, "end": 2539.42, "text": "회사가 하나로 뭉쳐 집중하는 모습을 보면요."}, {"start": 2539.42, "end": 2540.527, "text": "여러 부서에서"}, {"start": 2540.577, "end": 2543.739, "text": "수많은 어려운 결정을 내려야 했지만,"}, {"start": 2543.74, "end": 2546.18, "text": "모두 한마음으로 같은 방향을 향하고 있습니다."}, {"start": 2546.18, "end": 2548.74, "text": "지금 분위기는 정말 좋습니다."}, {"start": 2548.74, "end": 2550.22, "text": "그 이야기도 나눠보고 싶지만,"}, {"start": 2550.22, "end": 2551.7, "text": "잠시 이 점을 짚고 넘어가죠."}, {"start": 2551.7, "end": 2553.629, "text": "지난 한 해 동안 정말 많은 일이 있었는데요."}, {"start": 2553.679, "end": 2555.569, "text": "되돌아봤을 때 회사의"}, {"start": 2555.619, "end": 2557.679, "text": "모멘텀을 잃게 만들었던"}, {"start": 2557.68, "end": 2560.46, "text": "결정적인 순간들이 있었나요?"}, {"start": 2560.46, "end": 2561.956, "text": "사전 학습을 언급하셨고"}, {"start": 2562.006, "end": 2564.5, "text": "항상 연구팀과 긴밀하셨던 걸 아는데,"}, {"start": 2564.5, "end": 2566.68, "text": "그 부분에 대해 좀 더 설명해 주실 수 있나요?"}, {"start": 2566.68, "end": 2569.62, "text": "제품 측면에서 너무 많은 걸 하려 했던 것 같습니다."}, {"start": 2569.62, "end": 2573.3, "text": "물론 그것들도 실제로 매우 훌륭한 시도들이었지만,"}, {"start": 2573.3, "end": 2576.529, "text": "가장 중요한 핵심만큼 가치 있는 건 아니었습니다."}, {"start": 2576.579, "end": 2578.612, "text": "가장 중요한 건 인공지능의"}, {"start": 2578.662, "end": 2581.42, "text": "범용적 역량을 밀어붙이는 것이었죠."}, {"start": 2581.42, "end": 2584.129, "text": "웹 브라우저나 소라 같은 프로젝트도 진행했지만,"}, {"start": 2584.179, "end": 2585.179, "text": "지금은 사람들에게"}, {"start": 2585.23, "end": 2588.679, "text": "진정한 지능 서비스를 제공하는 데 전력을 다하고 있습니다."}, {"start": 2588.68, "end": 2591.98, "text": "저희 모델들은 현재 세계 최고 수준에 도달했고,"}, {"start": 2591.98, "end": 2595.18, "text": "앞으로 몇 달 동안 훨씬 더 발전할 것입니다."}, {"start": 2595.18, "end": 2598.18, "text": "많은 분들이 놀라운 결과물들을 만들어내고 있죠."}, {"start": 2598.18, "end": 2601.129, "text": "하지만 바로 거기에만 집중했어야 했습니다."}, {"start": 2601.179, "end": 2603.898, "text": "제가 모두에게 '이게 핵심이니 곁가지 작업에"}, {"start": 2603.948, "end": 2606.099, "text": "얽매이지 말자'고 못박았어야 했죠."}, {"start": 2606.1, "end": 2610.1, "text": "리더십 변화에 대해 살펴보면요,"}, {"start": 2610.1, "end": 2613.18, "text": "약 1년 전 피지 시모를 영입해 회사의 많은 부분을 맡기셨습니다."}, {"start": 2613.18, "end": 2616.629, "text": "하지만 건강 문제로 그녀가 물러나게 되었고,"}, {"start": 2616.679, "end": 2617.679, "text": "지금은"}, {"start": 2617.73, "end": 2620.679, "text": "공동 창업자인 그렉 브록먼과 함께"}, {"start": 2620.68, "end": 2623.18, "text": "역할을 나누어 공동으로 회사를 이끌고 계십니다."}, {"start": 2623.18, "end": 2626.68, "text": "이 체제가 앞으로도 계속 유지될 것으로 보시나요,"}, {"start": 2626.68, "end": 2629.68, "text": "아니면 일시적인 조치인가요?"}, {"start": 2629.68, "end": 2632.629, "text": "저는 아주 훌륭하게 돌아가고 있다고 생각합니다."}, {"start": 2632.679, "end": 2635.444, "text": "물론 계속해서 새로운 리더들을 영입하고"}, {"start": 2635.494, "end": 2636.679, "text": "승진시키겠지만요."}, {"start": 2636.68, "end": 2640.68, "text": "피지의 일은 정말 안타깝고"}, {"start": 2640.68, "end": 2643.22, "text": "그 빈자리를 채우는 것도 쉽지 않지만요."}, {"start": 2643.22, "end": 2645.68, "text": "그래도 지금 흐름이 좋고, 그렉과 저도 잘 해내고 있습니다."}, {"start": 2645.68, "end": 2648.18, "text": "회사도... 모든 일이 잘 풀릴 때는 확실히 느낌이 오니까요."}, {"start": 2648.55, "end": 2651.05, "text": "올바른 방향으로 나아가고 있는 것 같아요."}, {"start": 2651.55, "end": 2654.35, "text": "당신과 그렉은 의사 결정을 어떻게 함께 내리나요?"}, {"start": 2654.35, "end": 2656.75, "text": "누가 무엇을 결정하고, 의견이 팽팽할 때는 어떻게 해결하나요?"}, {"start": 2656.95, "end": 2659.06, "text": "우리는 대화를 정말 많이 해요."}, {"start": 2659.06, "end": 2660.55, "text": "항상 이야기를 나누죠."}, {"start": 2660.75, "end": 2662.724, "text": "그리고 큰 회사이다 보니 저와"}, {"start": 2662.775, "end": 2664.75, "text": "그렉 둘만의 문제는 아니에요."}, {"start": 2665.05, "end": 2667.49, "text": "연구 프로그램을 이끄는 훌륭하고"}, {"start": 2667.54, "end": 2669.55, "text": "재능 있는 인재들이 있고,"}, {"start": 2669.75, "end": 2672.189, "text": "비즈니스를 운영하는 믿을 수 없을 만큼"}, {"start": 2672.239, "end": 2673.75, "text": "뛰어난 사람들도 있어요."}, {"start": 2674.05, "end": 2677.55, "text": "우리는 다 함께 많은 이야기를 나눕니다."}, {"start": 2677.75, "end": 2681.35, "text": "초창기에는 일단 시도해보고 잘되면 빠르게 적응하면서"}, {"start": 2681.35, "end": 2685.05, "text": "결정에 대해 지나치게 논쟁하지 않는 것이 좋다고 생각했어요."}, {"start": 2685.25, "end": 2687.486, "text": "하지만 지금 규모에서는 올바른 결정을"}, {"start": 2687.536, "end": 2689.55, "text": "내리기 위해 많은 시간을 들이고,"}, {"start": 2689.55, "end": 2692.75, "text": "신중하게 두 번 재고 한 번 자르는 방식이 훨씬 낫다는 것을 배웠죠."}, {"start": 2693.05, "end": 2694.185, "text": "거의 정확히 1년 전,"}, {"start": 2694.185, "end": 2696.55, "text": "샌프란시스코에서 주최하신 만찬에서 함께했었죠."}, {"start": 2696.55, "end": 2700.05, "text": "그때가 GPT-5 출시 즈음이었는데요."}, {"start": 2700.05, "end": 2701.475, "text": "그런 자리를 한 번 더 해야겠네요."}, {"start": 2701.475, "end": 2703.05, "text": "잊고 있었는데 참 즐거웠어요. 맞아요."}, {"start": 2703.25, "end": 2705.35, "text": "정말 그랬죠. 많은 이야기가 오갔지만,"}, {"start": 2705.35, "end": 2706.55, "text": "그때 제가 느꼈던 점은"}, {"start": 2706.55, "end": 2708.772, "text": "샘이 영원히 CEO로 남는 것에 대해"}, {"start": 2708.772, "end": 2711.55, "text": "크게 열정이 없으신 것처럼 보였다는 것입니다."}, {"start": 2711.55, "end": 2713.75, "text": "지난 1년 동안 그 생각에 변화가 있었나요?"}, {"start": 2713.95, "end": 2716.75, "text": "지금은 1년 전보다 훨씬 더 좋은 시간을 보내고 있어요."}, {"start": 2716.75, "end": 2719.75, "text": "정말 즐겁고, 오랫동안 이 일을 계속할 계획입니다."}, {"start": 2720.05, "end": 2722.75, "text": "작년에는 분위기가 훨씬 더 험난했던 것 같아요."}, {"start": 2722.95, "end": 2724.872, "text": "맞아요, 전적으로 동의해요."}, {"start": 2724.872, "end": 2727.05, "text": "단지 회사 분위기뿐만이 아니라,"}, {"start": 2727.05, "end": 2730.05, "text": "테크 업계 전체와 AI 분야 모두에게"}, {"start": 2730.1, "end": 2731.75, "text": "힘든 시기였으니까요."}, {"start": 2731.95, "end": 2733.35, "text": "AI 거품론도 큰 걱정거리였죠."}, {"start": 2733.35, "end": 2736.05, "text": "그랬죠, 그 모든 상황들이 정말 지치게 만들었어요."}, {"start": 2736.35, "end": 2737.724, "text": "하지만 지금 분명한 건,"}, {"start": 2737.724, "end": 2740.05, "text": "우리가 놀라운 일을 해냈다는 생각입니다."}, {"start": 2740.25, "end": 2743.55, "text": "개인적으로는 고통스러운 경험이기도 했지만,"}, {"start": 2743.55, "end": 2747.05, "text": "충분히 가치 있었고 다시 하라면 기꺼이 할 것이며 지금은 좋은 시간을 보내고 있어요."}, {"start": 2747.349, "end": 2749.489, "text": "제가 아스트라 데모를 보았을 때 눈에"}, {"start": 2749.539, "end": 2752.75, "text": "띄었던 또 다른 점은 말씀하신 컴퓨터 사용 기능인데요."}, {"start": 2752.949, "end": 2754.288, "text": "에이전트가 컴퓨터와"}, {"start": 2754.338, "end": 2757.55, "text": "각종 기업용 소프트웨어를 직접 다루는 것은,"}, {"start": 2757.55, "end": 2758.971, "text": "실제로 보여주신 것처럼"}, {"start": 2759.021, "end": 2763.05, "text": "본격적인 규모로 확장될 때 엄청난 파급력을 지닐 것 같습니다."}, {"start": 2763.25, "end": 2765.069, "text": "이 점에 대해 깊이 고민해보셨는지,"}, {"start": 2765.069, "end": 2767.75, "text": "세상이 어떻게 적응해야 한다고 보시는지 궁금합니다."}, {"start": 2768.88, "end": 2770.8, "text": "컴퓨터 제어 기능은 저도 깜짝 놀랐어요."}, {"start": 2770.8, "end": 2773.76, "text": "오랫동안 기대해왔던 분야였지만 매번 실망만 했었거든요."}, {"start": 2773.76, "end": 2776.8, "text": "기존 모델들은 컴퓨터를 조작하는 능력이 그리 좋지 못했죠."}, {"start": 2776.8, "end": 2780.4, "text": "항상 너무 느렸거나 제대로 작동하지 않았습니다."}, {"start": 2780.4, "end": 2783.611, "text": "그런데 Astra는 컴퓨터 조작 면에서"}, {"start": 2783.661, "end": 2786.719, "text": "거의 인간 수준에 도달한 느낌이에요."}, {"start": 2786.719, "end": 2787.927, "text": "왜 그런지는 몰라도,"}, {"start": 2787.977, "end": 2792.48, "text": "AGI로 가는 여정에서 '정말 해내고 있구나' 싶은 순간으로 와닿았습니다."}, {"start": 2792.48, "end": 2794.586, "text": "감정적으로도 큰 울림이 있었고,"}, {"start": 2794.586, "end": 2796.32, "text": "정말 대단하다고 느껴졌죠."}, {"start": 2796.32, "end": 2797.557, "text": "그리고 컴퓨터로"}, {"start": 2797.607, "end": 2801.32, "text": "하던 온갖 번거로운 허드렛일들이 떠올랐어요."}, {"start": 2801.32, "end": 2804.112, "text": "누가 어디로 메시지를 보냈는지 몰라 메신저를"}, {"start": 2804.162, "end": 2805.559, "text": "뒤적이며 찾곤 했는데,"}, {"start": 2805.559, "end": 2808.029, "text": "이젠 모델에게 요청하기만 하면 되니까요."}, {"start": 2808.079, "end": 2812.285, "text": "컴퓨터에서 힘들게 무언가를 찾아 헤매야 했던 과거로는"}, {"start": 2812.335, "end": 2814.8, "text": "정말 돌아가고 싶지 않더라고요."}, {"start": 2814.8, "end": 2817.678, "text": "그저 제가 원하는 결과만 설명하고 싶을 뿐이죠."}, {"start": 2817.678, "end": 2819.56, "text": "저는 아주 게으른 사용자거든요."}, {"start": 2819.56, "end": 2822.606, "text": "일일이 클릭하거나 연결할 필요 없이..."}, {"start": 2822.606, "end": 2824.96, "text": "직접 설정하는 건 질색이거든요."}, {"start": 2824.96, "end": 2826.64, "text": "온갖 커넥터를 세팅하는 것도 귀찮으니,"}, {"start": 2826.64, "end": 2828.88, "text": "그냥 제 컴퓨터로 알아서 처리해주길 바랄 뿐입니다."}, {"start": 2828.88, "end": 2832.085, "text": "AI가 소프트웨어를 직접 다룰 수 있게 된 데에는"}, {"start": 2832.135, "end": 2833.442, "text": "많은 의미가 있지만,"}, {"start": 2833.442, "end": 2835.029, "text": "대체로 긍정적이라고 봐요."}, {"start": 2835.079, "end": 2837.452, "text": "사람들이 컴퓨터 앞에서 해야 하는 지루하고"}, {"start": 2837.502, "end": 2839.36, "text": "반복적인 일이 너무나 많으니까요."}, {"start": 2839.36, "end": 2842.516, "text": "Astra 이전 모델에서는 겪어보지 못했던 경험인데,"}, {"start": 2842.516, "end": 2843.989, "text": "요즘엔 자주 겪고 있어요."}, {"start": 2844.039, "end": 2848.491, "text": "시간도 꽤 걸리고 귀찮기 짝이"}, {"start": 2848.541, "end": 2851.88, "text": "없는 작업이 생기면요."}, {"start": 2851.88, "end": 2853.423, "text": "직접 하는 대신 모델에게"}, {"start": 2853.473, "end": 2856.559, "text": "무엇을 할지 말해두고 아이들과 놀아주러 갑니다."}, {"start": 2856.559, "end": 2858.585, "text": "그리고 30분 뒤에 돌아와"}, {"start": 2858.635, "end": 2860.659, "text": "보면 전부 완료되어 있죠."}, {"start": 2860.66, "end": 2862.589, "text": "정말 환상적인 경험이에요."}, {"start": 2862.639, "end": 2865.034, "text": "하지만 이제는 미국 정부가"}, {"start": 2865.085, "end": 2867.48, "text": "출시 전에 귀사의 모델이나"}, {"start": 2867.48, "end": 2869.086, "text": "다른 첨단 랩의 모델 역량을"}, {"start": 2869.136, "end": 2871.599, "text": "사전 검증하기 시작하는 시대가 되었습니다."}, {"start": 2871.6, "end": 2875.587, "text": "2025년 상원 청문회에서도 직접 경고하셨듯이,"}, {"start": 2875.587, "end": 2877.069, "text": "이러한 검증 절차가"}, {"start": 2877.119, "end": 2879.23, "text": "중국 같은 경쟁국에 맞선 미국의 경쟁력에"}, {"start": 2879.28, "end": 2881.199, "text": "'재앙'이 될 수 있다고 말씀하셨죠."}, {"start": 2881.199, "end": 2884.271, "text": "게다가 최근 GPT-5.6의"}, {"start": 2884.321, "end": 2885.96, "text": "초기 출시 때도"}, {"start": 2885.96, "end": 2888.446, "text": "트럼프 행정부에서 출시를 통제해달라고 요청했고,"}, {"start": 2888.446, "end": 2889.76, "text": "결국 따라야만 했는데요..."}, {"start": 2889.79, "end": 2891.59, "text": "...당시 그것이 표준이 되어서는 안 된다고 하셨죠."}, {"start": 2891.59, "end": 2893.857, "text": "상황이 그렇게 흘러가선 안 된다고 말씀해 오신 것 같은데,"}, {"start": 2893.857, "end": 2894.939, "text": "여전히 그쪽으로 가고 있네요."}, {"start": 2894.989, "end": 2899.081, "text": "아닙니다. 저는 수년 동안 어떤 형태로든 국제적인 규제 프레임워크가"}, {"start": 2899.131, "end": 2900.789, "text": "필요하다고 주장해 왔습니다."}, {"start": 2900.789, "end": 2902.818, "text": "하지만 특히 정부가 모델 출시 전에"}, {"start": 2902.868, "end": 2904.789, "text": "사전 심사하는 부분에 대해서는요."}, {"start": 2904.789, "end": 2907.698, "text": "제가 반대했던 부분은 정부가 어떤 고객에게"}, {"start": 2907.748, "end": 2911.289, "text": "모델 사용을 허용할지 일일이 지정하는 것이었습니다."}, {"start": 2911.289, "end": 2912.726, "text": "정부 차원에서 모델을 검증하고"}, {"start": 2912.776, "end": 2915.289, "text": "공통 기준을 공유하는 것은 매우 훌륭한 생각입니다."}, {"start": 2915.289, "end": 2917.781, "text": "이상적으로는, 정부가 특정 기업에는 접근을 허용하고"}, {"start": 2917.831, "end": 2920.59, "text": "다른 기업에는 허용하지 않는 식이어선 안 된다고 봅니다."}, {"start": 2920.59, "end": 2923.835, "text": "그렇다면 미국은 이러한 방식을 도입하기 시작했지만"}, {"start": 2923.885, "end": 2926.289, "text": "다른 국가들은 그렇지 않은 상황에서,"}, {"start": 2926.29, "end": 2928.924, "text": "지정학적인 경쟁력 측면에서 어떤 영향이 있을까요?"}, {"start": 2928.924, "end": 2930.29, "text": "생각해 보신 적이 있나요?"}, {"start": 2930.29, "end": 2932.939, "text": "다시 말씀드리지만, 올바른 접근법은 국제적인 협력 체계라고 생각합니다."}, {"start": 2932.989, "end": 2935.088, "text": "하지만 현재로서는 선도적인 노력들이"}, {"start": 2935.138, "end": 2937.789, "text": "모두 미국 기업들에 의해 이루어지고 있어서,"}, {"start": 2937.79, "end": 2938.951, "text": "여기서부터 시작하는 것,"}, {"start": 2938.951, "end": 2940.688, "text": "즉 우리가 충분히 앞서 있기 때문에"}, {"start": 2940.688, "end": 2942.739, "text": "속도가 조금 늦춰지더라도 괜찮다고 봅니다."}, {"start": 2942.789, "end": 2944.628, "text": "그리고 안전하고 견고하며"}, {"start": 2944.678, "end": 2947.789, "text": "신뢰할 수 있는 모델을 구축하는 동시에,"}, {"start": 2947.789, "end": 2950.477, "text": "상업적으로도 큰 성과를 거두고 미국이"}, {"start": 2950.527, "end": 2954.289, "text": "계속 주도권을 유지하도록 할 수 있다고 확신합니다."}, {"start": 2954.289, "end": 2955.619, "text": "물론 다른 국가에서"}, {"start": 2955.669, "end": 2959.789, "text": "공개한 오픈 모델이 새로운 보안 패러다임을 구축하기 전에"}, {"start": 2959.789, "end": 2963.48, "text": "대규모 사이버 사고를 일으킨다면 판도가"}, {"start": 2963.53, "end": 2965.989, "text": "크게 바뀔 수도 있습니다."}, {"start": 2965.99, "end": 2967.59, "text": "그런 일이 실제로 일어날 수 있다고 보십니까?"}, {"start": 2967.59, "end": 2969.59, "text": "당연히 일어날 수 있죠."}, {"start": 2969.59, "end": 2972.985, "text": "하지만 한편으로는 사이버 보안의 작동 방식을"}, {"start": 2973.035, "end": 2976.289, "text": "완전히 새롭게 재구성할 기회이기도 합니다."}, {"start": 2976.29, "end": 2978.89, "text": "이러한 에이전트들이 나쁜 일을 할 수도 있지만,"}, {"start": 2978.89, "end": 2980.79, "text": "놀라운 일들도 해낼 수 있으니까요."}, {"start": 2980.79, "end": 2983.457, "text": "방어용 에이전트들을 상시 가동할 수 있다면,"}, {"start": 2983.457, "end": 2985.739, "text": "그것이 올바른 패러다임일지도 모릅니다."}, {"start": 2985.789, "end": 2987.897, "text": "미국 정부가 모델 출시를 불허할 수도"}, {"start": 2987.947, "end": 2989.949, "text": "있는 상황에 대해 준비가 되셨나요?"}, {"start": 2989.95, "end": 2990.99, "text": "고민해 보셨습니까?"}, {"start": 2990.99, "end": 2993.09, "text": "정부가 출시하지 말라고 지시하기 전에,"}, {"start": 2993.09, "end": 2996.29, "text": "저희가 먼저 출시하지 않기로 결정할 것이라 굳게 믿습니다."}, {"start": 2996.29, "end": 2998.189, "text": "경쟁 이야기로 넘어가 보면,"}, {"start": 2998.239, "end": 3000.225, "text": "앤트로픽은 코딩에만 집중하여"}, {"start": 3000.275, "end": 3002.789, "text": "단숨에 지금의 자리로 올라섰습니다."}, {"start": 3002.79, "end": 3004.239, "text": "그렇죠."}, {"start": 3004.289, "end": 3006.714, "text": "그리고 처음에 여러 분야에 너무 많은 베팅을"}, {"start": 3006.764, "end": 3009.289, "text": "하느라 모멘텀을 일부 잃었다고 말씀하셨는데요."}, {"start": 3010.11, "end": 3013.283, "text": "당시 여러분은 보지 못했던 기회를 앤트로픽은"}, {"start": 3013.333, "end": 3016.11, "text": "어떻게 포착했다고 보시는지 궁금합니다."}, {"start": 3016.309, "end": 3017.309, "text": "저희가"}, {"start": 3017.36, "end": 3020.309, "text": "그걸 보지 못했다기보다는..."}, {"start": 3020.41, "end": 3024.31, "text": "일반 소비자 성장이 걷잡을 수 없이 폭발하는 엄청난 상황이었거든요."}, {"start": 3024.41, "end": 3027.71, "text": "코딩 분야도 늘 하고 싶었지만 '당장 너무 급한 일이 있고,"}, {"sta
