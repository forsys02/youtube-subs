rt": 3027.71, "end": 3029.91, "text": "이건 정말 좋은 일이잖아'라고 생각했죠."}, {"start": 3030.01, "end": 3033.21, "text": "그래서 우선순위 측면에서 그걸 놓쳤던 겁니다."}, {"start": 3033.31, "end": 3036.51, "text": "하지만 지금은 시장에서 가장 뛰어난 코딩 제품을 갖고 있고"}, {"start": 3036.51, "end": 3038.41, "text": "미친 듯이 빠르게 성장하고 있어요."}, {"start": 3038.51, "end": 3040.198, "text": "제가 아는 대부분의 사람들,"}, {"start": 3040.198, "end": 3043.91, "text": "심지어 앤트로픽의 골수 사용자들까지도 저희 쪽으로 넘어왔죠."}, {"start": 3044.11, "end": 3046.918, "text": "어느 한 단계에서 뒤처진다고 치명적인 건 아니라고 봐요."}, {"start": 3046.918, "end": 3048.91, "text": "더 나은 모델로 따라잡을 수 있으니까요."}, {"start": 3049.11, "end": 3051.642, "text": "궁금한 점은, 많은 사람들이 AI 시장이"}, {"start": 3051.692, "end": 3054.11, "text": "얼마나 제로섬인지 알고 싶어 하잖아요."}, {"start": 3054.31, "end": 3058.192, "text": "코덱스의 성장이 앤트로픽의 파이를 빼앗아 오는 건가요,"}, {"start": 3058.192, "end": 3059.745, "text": "아니면 그 반대인가요?"}, {"start": 3059.745, "end": 3060.91, "text": "어떻게 보시나요?"}, {"start": 3061.31, "end": 3063.851, "text": "지금은 모두가 다 성장하는 시기라고 봅니다."}, {"start": 3063.851, "end": 3064.91, "text": "물론 나중에는..."}, {"start": 3065.11, "end": 3066.975, "text": "이 시장은 아주 거대해질 것이고"}, {"start": 3067.025, "end": 3069.11, "text": "나중엔 더 제로섬이 될지도 모르죠."}, {"start": 3069.31, "end": 3071.839, "text": "하지만 지금은 모두가..."}, {"start": 3071.839, "end": 3074.91, "text": "저희가 겪고 있는 성장률만 해도"}, {"start": 3075.11, "end": 3078.91, "text": "이런 규모의 회사에서는 상상조차 해본 적 없는 수준입니다."}, {"start": 3079.11, "end": 3082.446, "text": "사람들이 제품에서 얼마나 많은 가치를 얻고 있는지를 보여주며,"}, {"start": 3082.446, "end": 3084.31, "text": "업계 전반에서도 마찬가지일 겁니다."}, {"start": 3084.51, "end": 3088.225, "text": "제품 측면에서는 내부적으로 '머지'라고 불리는,"}, {"start": 3088.275, "end": 3090.198, "text": "ChatGPT와 코덱스를"}, {"start": 3090.248, "end": 3092.909, "text": "결합한 슈퍼 앱을 개발 중이시죠."}, {"start": 3093.11, "end": 3094.11, "text": "이미 시작하셨는데,"}, {"start": 3094.16, "end": 3097.309, "text": "제가 보기엔 아직 좀 다듬어지지 않은 부분들이 있는 것 같아요."}, {"start": 3097.51, "end": 3099.31, "text": "다듬어지지 않은 정도를 넘어서죠. 아주 정중하게 표현해 주셨네요."}, {"start": 3099.51, "end": 3102.81, "text": "네. 최종 완성 단계에 도달하면 어떤 모습일지,"}, {"start": 3102.81, "end": 3106.11, "text": "그리고 그게 어떤 의미를 갖게 될지 궁금합니다."}, {"start": 3106.309, "end": 3111.367, "text": "제가 원하는 건 제가 필요한 건 뭐든지 해줄 수 있는"}, {"start": 3111.417, "end": 3113.51, "text": "AI 인터페이스입니다."}, {"start": 3113.909, "end": 3116.215, "text": "ChatGPT 스타일의 간단한 질문이"}, {"start": 3116.265, "end": 3118.11, "text": "있다면 바로 답해줄 수 있고,"}, {"start": 3118.31, "end": 3121.275, "text": "복잡한 소프트웨어 구축이 필요하면 그걸 만들어주고,"}, {"start": 3121.275, "end": 3123.71, "text": "그 중간 수준의 작업도 다 해낼 수 있죠."}, {"start": 3124.11, "end": 3126.814, "text": "또한 제 컴퓨터나 맥락에 접근해야 한다면 컴퓨터를"}, {"start": 3126.864, "end": 3129.769, "text": "직접 사용해 제 맥락을 찾아낼 수 있는 그런 것이죠."}, {"start": 3129.8, "end": 3132.8, "text": "제가 아까 말씀드렸듯이 전 아주 게으른 사용자거든요."}, {"start": 3132.8, "end": 3134.255, "text": "내가 지금 어느 탭에 있는지,"}, {"start": 3134.255, "end": 3136.8, "text": "어떤 모드에 있는지 일일이 신경 쓰고 싶지 않아요."}, {"start": 3136.8, "end": 3139.579, "text": "새로운 수학을 발견할 수 있을 만큼"}, {"start": 3139.629, "end": 3140.8, "text": "똑똑한 AI라면"}, {"start": 3140.8, "end": 3144.0, "text": "자신이 뭘 해야 하는지 직관적으로 알아차릴 수 있어야죠."}, {"start": 3144.0, "end": 3147.3, "text": "ChatGPT 사용자가 방금 10억 명을 돌파했습니다. - 네. 엄청난 이정표인데요."}, {"start": 3147.3, "end": 3149.796, "text": "하지만 달성하는 데 당초 예상하셨던 것보다"}, {"start": 3149.846, "end": 3151.8, "text": "시간이 좀 더 걸린 것 같은데요?"}, {"start": 3151.8, "end": 3154.8, "text": "초기에는 성장세가 폭발적이었잖아요."}, {"start": 3154.8, "end": 3157.186, "text": "그 점에 대해 이야기를 듣고 싶습니다."}, {"start": 3157.186, "end": 3159.8, "text": "지난 12개월간 성장이 예상보다 더뎠나요?"}, {"start": 3159.8, "end": 3161.638, "text": "저희가 코딩에 집중하면서,"}, {"start": 3161.688, "end": 3166.609, "text": "원래 챗 제품에 투입할 수 있었던 많은 컴퓨팅 자원을 코딩 쪽으로"}, {"start": 3166.659, "end": 3168.3, "text": "재할당하기로 했습니다."}, {"start": 3168.3, "end": 3170.138, "text": "그래서 딱히 놀랍진 않았습니다."}, {"start": 3170.138, "end": 3172.3, "text": "그게 시급한 과제라고 판단했으니까요."}, {"start": 3172.3, "end": 3176.0, "text": "그렇다면 성장은 컴퓨팅 자원을 어디에 배치하느냐에 직결된다는 건가요? - 100% 그렇습니다. - 네."}, {"start": 3176.0, "end": 3179.104, "text": "더 효율적인 모델을 만들 테니 컴퓨팅 제약이"}, {"start": 3179.154, "end": 3182.128, "text": "곧 완화될 거라는 기대를 항상 하고 있고,"}, {"start": 3182.129, "end": 3184.3, "text": "언젠가 그렇게 되길 바랍니다만."}, {"start": 3184.3, "end": 3188.675, "text": "하지만 효율성을 개선할 때마다 전 세계의 토큰 수요가"}, {"start": 3188.725, "end": 3192.8, "text": "계속 치솟으면서 그 여유분을 다 흡수해 버립니다."}, {"start": 3192.8, "end": 3193.76, "text": "그 말씀은 이해하지만,"}, {"start": 3193.76, "end": 3196.8, "text": "동시에 ChatGPT가 어떻게 다음 10억 명에 도달할지 궁금합니다."}, {"start": 3196.8, "end": 3199.897, "text": "인터넷이나 소셜 미디어가 성장했던 것처럼"}, {"start": 3199.947, "end": 3200.932, "text": "선형적일까요,"}, {"start": 3200.933, "end": 3203.0, "text": "아니면 기복이 더 심할까요?"}, {"start": 3203.0, "end": 3206.767, "text": "그리고 Codex와 API 비즈니스가 있는 지금,"}, {"start": 3206.767, "end": 3209.0, "text": "그게 얼마나 중요하긴 한가요?"}, {"start": 3209.0, "end": 3211.231, "text": "앞서 통합에 대해 이야기했지만,"}, {"start": 3211.231, "end": 3213.24, "text": "결국 이 모든 것들이 하나로"}, {"start": 3213.29, "end": 3215.3, "text": "합쳐지게 될 거라고 봅니다."}, {"start": 3215.3, "end": 3218.455, "text": "통합 이전 한동안 저는 ChatGPT 사용을"}, {"start": 3218.505, "end": 3221.793, "text": "멈추고 모든 질문을 Codex에 물어봤었어요."}, {"start": 3221.793, "end": 3224.0, "text": "아시다시피 게으른 사용자니까요."}, {"start": 3224.0, "end": 3226.202, "text": "지금은 그저 ChatGPT를 쓰다가"}, {"start": 3226.252, "end": 3228.57, "text": "'Work' 탭을 클릭해 보고 \"와!"}, {"start": 3228.571, "end": 3231.085, "text": "이런 대단한 일도 할 수 있네?\" 하며,"}, {"start": 3231.085, "end": 3232.489, "text": "에이전트가 자신을 위해"}, {"start": 3232.489, "end": 3236.0, "text": "작업해 줄 거라곤 생각지도 못했던 분들이 많을 겁니다."}, {"start": 3236.0, "end": 3238.83, "text": "그래서 결국 다 하나로 합쳐질 것이고,"}, {"start": 3238.88, "end": 3244.146, "text": "사람들은 이게 Chat인지 Codex인지 Work인지 신경 쓰지 않고"}, {"start": 3244.196, "end": 3247.8, "text": "범용 AI 구독 서비스를 이용하게 될 것입니다."}, {"start": 3247.85, "end": 3250.95, "text": "'필요한 일이 있으니 처리해달라'고만 하면 되는 거죠."}, {"start": 3251.0, "end": 3254.0, "text": "곧 아예 요청할 필요조차 없어질 겁니다."}, {"start": 3254.0, "end": 3257.8, "text": "훨씬 능동적으로 알아서 유용한 일들을 처리해 줄 테니까요."}, {"start": 3257.8, "end": 3260.8, "text": "그럼 최종 종착지는 단 하나의 궁극적인 구독 서비스인가요?"}, {"start": 3261.0, "end": 3262.8, "text": "한 명의 사용자로서 제가 원하는 바입니다."}, {"start": 3262.8, "end": 3264.63, "text": "이 주제를 돌려 말해왔지만,"}, {"start": 3264.68, "end": 3267.0, "text": "1년 전 큰 위험을 무릅쓰셨잖아요."}, {"start": 3267.0, "end": 3269.5, "text": "OpenAI가 진행해 온 대규모 컴퓨팅 인프라 구축에 대해서요."}, {"start": 3269.5, "end": 3270.2, "text": "맞습니다."}, {"start": 3270.2, "end": 3272.8, "text": "그로 인해 AI 거품론에 대한 공포를 불러일으켰고,"}, {"start": 3272.8, "end": 3276.5, "text": "동시에 사람들은 너무 무리하는 것 아니냐고 생각했죠."}, {"start": 3276.5, "end": 3278.358, "text": "앤트로픽의 다리오 CEO 등은"}, {"start": 3278.408, "end": 3280.5, "text": "무모한 도박을 한다고 비판했고요."}, {"start": 3280.5, "end": 3282.411, "text": "하지만 지금 보면 그 결정이"}, {"start": 3282.461, "end": 3284.5, "text": "옳았음이 증명된 것 같습니다."}, {"start": 3284.5, "end": 3287.0, "text": "세상은 여전히 컴퓨팅 자원에 굶주려 있고,"}, {"start": 3287.0, "end": 3290.5, "text": "경쟁사들보다 많다 해도 여전히 부족한 상태로 보입니다."}, {"start": 3290.5, "end": 3293.5, "text": "동시에 토큰 비용을 엄청나게 낮추고 계시잖아요."}, {"start": 3293.5, "end": 3294.2, "text": "네."}, {"start": 3294.2, "end": 3298.0, "text": "첫 추론용 자체 칩인 '할라피뇨' 출시도 앞두고 있고요."}, {"start": 3298.0, "end": 3299.0, "text": "그럼에도"}, {"start": 3299.05, "end": 3302.0, "text": "현재 추진 중인 대규모 컴퓨팅 구축과"}, {"start": 3302.0, "end": 3305.5, "text": "이와 관련된 천문학적인 투자 규모를 볼 때,"}, {"start": 3305.5, "end": 3307.0, "text": "위험하다고 느끼는 부분이 조금이라도 있나요?"}, {"start": 3307.0, "end": 3309.5, "text": "저희 자체의 컴퓨팅 구축 계획은 전혀 걱정하지 않습니다."}, {"start": 3309.5, "end": 3312.5, "text": "오히려 전 세계적인 컴퓨팅 구축 흐름이 우려되죠."}, {"start": 3312.5, "end": 3315.0, "text": "저희가 구축하려는 모든 컴퓨팅 자원은"}, {"start": 3315.0, "end": 3317.5, "text": "매우 수익성 있게 활용할 수 있을 거라고 봅니다."}, {"start": 3317.5, "end": 3319.07, "text": "하지만 지속 불가능하고"}, {"start": 3319.12, "end": 3322.0, "text": "무모해 보이는 조짐들이 나타나고 있어요."}, {"start": 3322.0, "end": 3325.5, "text": "우후죽순 생겨나는 신생 네오 클라우드 업체들이라든가,"}, {"start": 3325.5, "end": 3327.724, "text": "내년에 엄청난 규모의 컴퓨팅을"}, {"start": 3327.775, "end": 3330.0, "text": "짓겠다고 주장하는 사람들이죠."}, {"start": 3330.0, "end": 3333.0, "text": "이를 뒷받침할 만한 매출도 없고,"}, {"start": 3333.0, "end": 3335.5, "text": "확실한 구매자도 없는 상황에서 말입니다."}, {"start": 3335.5, "end": 3337.228, "text": "네, 세상 전체가 움직이는"}, {"start": 3337.278, "end": 3339.5, "text": "양상을 보면 분명 우려가 듭니다."}, {"start": 3339.5, "end": 3342.5, "text": "저희가 약속하고 추진하는 계획에는 강한 확신이 있지만요."}, {"start": 3342.5, "end": 3345.5, "text": "하지만 그 말씀하신 여파가 분명 영향을 미칠 수 있잖아요."}, {"start": 3345.5, "end": 3348.5, "text": "경제 전체가 무너진다면, 네, 당연히 영향이 있겠죠."}, {"start": 3348.5, "end": 3351.858, "text": "하지만 저희가 약속한 컴퓨팅 비용을"}, {"start": 3351.908, "end": 3353.5, "text": "감당하는 면에서는"}, {"start": 3353.5, "end": 3356.0, "text": "자신 있습니다."}, {"start": 3356.0, "end": 3359.5, "text": "지금 사람들은 '비용은 상관없다'는 분위기인 것 같아요."}, {"start": 3359.5, "end": 3363.0, "text": "'무작정 대규모로 짓고 나면 누군가 더 비싸게 사겠지'라는 식이죠."}, {"start": 3363.0, "end": 3364.896, "text": "그리고 저희가 기울이고"}, {"start": 3364.946, "end": 3367.0, "text": "있는 노력이 성공한다면,"}, {"start": 3367.0, "end": 3370.0, "text": "컴퓨팅 비용을 대폭 낮추고"}, {"start": 3370.0, "end": 3372.0, "text": "컴퓨팅 효율성을 획기적으로 개선하여... ```"}, {"start": 3372.05, "end": 3374.0, "text": "효율을 극대화하는 데 성공한다면,"}, {"start": 3374.0, "end": 3374.95, "text": "어리석은 투자 결정을 내린 이들이 몰락할 것입니다."}, {"start": 3375.0, "end": 3377.31, "text": "누군가는 어리석은 재무적 결정을"}, {"start": 3377.36, "end": 3379.4, "text": "내린 세상이 될 수도 있죠."}, {"start": 3379.7, "end": 3383.5, "text": "그런 일은 거의 모든 호황기마다 일어나는 법입니다."}, {"start": 3383.5, "end": 3385.5, "text": "대부분 그랬듯이요."}, {"start": 3385.5, "end": 3387.8, "text": "세상의 끝도 아니고, 실제로 그렇게 되더라도 크게 놀랄 일은 아닙니다."}, {"start": 3388.0, "end": 3390.165, "text": "OpenAI가 업계에 컴퓨팅 자원을 공급하는"}, {"start": 3390.215, "end": 3392.199, "text": "공급업체가 되는 그림도 그리고 계신가요?"}, {"start": 3392.7, "end": 3394.8, "text": "어... 당장은 아닙니다."}, {"start": 3394.8, "end": 3397.0, "text": "지금은 저희가 쓸 컴퓨팅도 필요한 상황이니까요."}, {"start": 3397.2, "end": 3400.2, "text": "내부에서 논의 중이지만 아직 결정되지 않았다는 뉘앙스로 들리네요."}, {"start": 3400.4, "end": 3401.4, "text": "사람들은 재귀적으로"}, {"start": 3401.45, "end": 3404.5, "text": "자가 개선되는 AI 모델에 대해 많은 이야기를 나눕니다."}, {"start": 3404.6, "end": 3408.5, "text": "하지만 이를 물리적 세계에서 실현하는 역량에 대해서는 별로 이야기하지 않죠."}, {"start": 3408.599, "end": 3410.622, "text": "하지만 로보틱스와 자체 칩 프로그램,"}, {"start": 3410.672, "end": 3413.199, "text": "공급망 투자까지 모두 맞물려 결실을 맺는다면,"}, {"start": 3413.4, "end": 3417.0, "text": "그리고 훨씬 저렴하게 데이터센터를 짓고 우수한 칩을 갖추게 된다면,"}, {"start": 3417.0, "end": 3420.0, "text": "그때 가서 검토해 볼 수도 있겠죠?"}, {"start": 3420.8, "end": 3424.0, "text": "하지만 지금 당장 그런 계획이 있느냐고 묻는다면 아닙니다."}, {"start": 3424.0, "end": 3427.7, "text": "아직은 그런 것까지 신경 쓸 여유가 없는 상태니까요."}, {"start": 3427.8, "end": 3431.2, "text": "재귀적 자가 개선(RSI)을 언급해 주셔서 반가운데요,"}, {"start": 3431.2, "end": 3435.0, "text": "지금 샌프란시스코에서는 RSI에 대한 이야기가 정말 뜨겁습니다."}, {"start": 3435.3, "end": 3439.0, "text": "IPO 신청 당시 직원들에게 보내셨던 메모가 유출된 적이 있었죠."}, {"start": 3439.0, "end": 3441.801, "text": "거기서 '잠재적인 RSI 도약이"}, {"start": 3441.851, "end": 3443.5, "text": "더 빨라 보일수록,"}, {"start": 3443.5, "end": 3445.058, "text": "IPO를 늦추는 것이"}, {"start": 3445.108, "end": 3447.8, "text": "더 유리할 수 있다'고 하셨는데요."}, {"start": 3448.0, "end": 3450.5, "text": "그건 어떤 의미였나요?"}, {"start": 3450.8, "end": 3454.5, "text": "상장 기업으로 전환한다는 것은 매우 까다로운 일이라고 생각합니다."}, {"start": 3454.5, "end": 3456.679, "text": "사람들은 인센티브에 반응하고,"}, {"start": 3456.729, "end": 3458.5, "text": "주가가 오르기를 바라며,"}, {"start": 3458.5, "end": 3461.5, "text": "분기 실적을 놓치고 싶어 하지 않으니까요."}, {"start": 3461.5, "end": 3463.625, "text": "저는 세상의 안전을 위해 결정을"}, {"start": 3463.675, "end": 3466.8, "text": "내릴 때 그 결정이 최대한 수월하길 바랍니다."}, {"start": 3467.3, "end": 3470.5, "text": "예를 들어 '훈련을 중단해야 한다'거나 '배포를 멈춰야 한다'면서"}, {"start": 3470.5, "end": 3471.5, "text": "단기적으로"}, {"start": 3471.55, "end": 3474.5, "text": "막대한 매출 타격을 입게 되는 상황이 올 때,"}, {"start": 3474.5, "end": 3478.0, "text": "갓 상장한 기업으로서 받는 압박까지 겹치지 않는 편이 좋겠죠."}, {"start": 3478.099, "end": 3479.16, "text": "사실 1년 전만 해도"}, {"start": 3479.21, "end": 3482.199, "text": "초지능(Superintelligence)에 이르는 경로가"}, {"start": 3482.2, "end": 3485.5, "text": "이렇게 단기적인 궤도에 들어설 거라고는 생각지 못했습니다."}, {"start": 3485.6, "end": 3488.0, "text": "하지만 지금은 일어날 수도 있다고 봅니다."}, {"start": 3488.0, "end": 3490.0, "text": "반드시 일어난다고 확신하는 건 아니지만,"}, {"start": 3490.0, "end": 3492.0, "text": "저희가 엄청나게 빠른 진전을 이루어내고 있거든요. ```"}, {"start": 3492.05, "end": 3493.667, "text": "진전이 워낙 빠르기 때문이며,"}, {"start": 3493.667, "end": 3497.833, "text": "상장 시점보다 저희 사명이 훨씬 중요하므로"}, {"start": 3497.833, "end": 3502.0, "text": "사명에 가장 부합하는 선택을 할 것입니다."}, {"start": 3502.0, "end": 3505.0, "text": "로봇 사업 현황도 듣고 싶습니다."}, {"start": 3505.0, "end": 3508.0, "text": "휴머노이드를 만드시나요,"}, {"start": 3508.0, "end": 3511.0, "text": "로봇 데이터센터인가요, 아니면 둘 다인가요?"}, {"start": 3511.0, "end": 3515.75, "text": "휴머노이드는 반드시 만들 것이며 다른 형태도 개발할 겁니다."}, {"start": 3515.75, "end": 3520.5, "text": "세상은 인간에 맞춰 설계되어 있습니다."}, {"start": 3520.5, "end": 3525.25, "text": "문을 열고, 타이핑을 치고, 주방을 청소하는 등"}, {"start": 3525.25, "end": 3530.0, "text": "인간의 형태에 맞추는 것이 가장 자연스럽습니다."}, {"start": 3530.0, "end": 3533.0, "text": "물론 데이터센터용 로봇은 다른 형태겠죠."}, {"start": 3533.0, "end": 3536.0, "text": "하지만 외형보다 훨씬 중요한 건"}, {"start": 3536.0, "end": 3539.0, "text": "로봇을 움직이게 하는 두뇌(AI)를 완성하는 일입니다."}, {"start": 3539.0, "end": 3540.0, "text": "결국 휴머노이드를 개발 중이신 거군요?"}, {"start": 3540.0, "end": 3542.0, "text": "네, 만들 것입니다."}, {"start": 3542.0, "end": 3545.0, "text": "일상에 어떻게 도입될까요?"}, {"start": 3545.0, "end": 3548.0, "text": "모두가 개인용 로봇을 갖게 될까요?"}, {"start": 3548.0, "end": 3551.75, "text": "언젠가는요. 당장 최우선 순위는 아닙니다."}, {"start": 3551.75, "end": 3555.5, "text": "데이터센터 구축이나 생산 로봇이 먼저겠지만,"}, {"start": 3555.5, "end": 3559.25, "text": "언젠가는 모두가 개인 로봇을 가져야 한다고 봅니다."}, {"start": 3559.25, "end": 3563.0, "text": "저 역시 귀찮은 일을 대신해 줄 로봇을 꼭 갖고 싶습니다."}, {"start": 3563.0, "end": 3569.4, "text": "조니 아이브와의 기기 협업도 있죠."}, {"start": 3569.4, "end": 3575.8, "text": "일상을 상시 경청하며 맥락을 파악하는 기기가"}, {"start": 3575.8, "end": 3582.2, "text": "꿈이라고 하셨는데,"}, {"start": 3582.2, "end": 3588.6, "text": "유용하겠지만 사생활 감시의 악몽이 될 수도 있습니다."}, {"start": 3588.6, "end": 3595.0, "text": "대중의 반발에 대해 어떻게 생각하십니까?"}, {"start": 3595.0, "end": 3599.333, "text": "저희는 프라이버시에 대해 엄격한 기준을 적용해 왔습니다."}, {"start": 3599.333, "end": 3603.667, "text": "기업 데이터를 학습에 쓰지 않고"}, {"start": 3603.667, "end": 3608.0, "text": "데이터를 보관하지 않겠다는 약속이 대표적이죠."}, {"start": 3608.0, "end": 3612.5, "text": "AI가 일상에 깊숙이 침투할수록"}, {"start": 3613.51, "end": 3616.51, "text": "프라이버시가 극도로 중요해집니다."}, {"start": 3616.51, "end": 3619.51, "text": "그리고 제가 우려하는 한 가지는,"}, {"start": 3619.51, "end": 3620.51, "text": "다르게 생각하며"}, {"start": 3620.56, "end": 3623.51, "text": "이렇게 밀어붙이는 다른 움직임들이 있다는 점입니다."}, {"start": 3623.51, "end": 3626.126, "text": "\"안전 위험이 너무 커서 기존과 같은 방식의"}, {"start": 3626.176, "end": 3629.01, "text": "AI 프라이버시는 존재할 수 없다\"면서 말이죠."}, {"start": 3629.01, "end": 3632.21, "text": "저는 일종의 AI 비밀유지특권법이 마련되어야 한다고 봅니다."}, {"start": 3632.21, "end": 3635.268, "text": "정부조차도 기업에 사용자의 대화 기록 등을"}, {"start": 3635.318, "end": 3638.51, "text": "강제로 제출하도록 강요할 수 없어야 합니다."}, {"start": 3638.51, "end": 3641.51, "text": "의사나 변호사와 상담할 때 비밀유지특권이 적용되는 것처럼요."}, {"start": 3641.51, "end": 3643.81, "text": "ChatGPT와 대화할 때는 그게 없는데, 당연히 보장되어야 한다고 생각합니다."}, {"start": 3643.81, "end": 3645.006, "text": "하지만 방금 말씀하신 맥락에서,"}, {"start": 3645.006, "end": 3647.891, "text": "변호사나 의사 역시 고객 데이터로 할 수 있는 일에 많은 제한을 받습니다."}, {"start": 3647.891, "end": 3649.51, "text": "단순히 외부에 공유하는 문제뿐만이 아니죠."}, {"start": 3649.51, "end": 3652.566, "text": "그런 감독 조치가 귀사가 데이터를 활용하는 방식에도 확대되어야 한다고 보시나요?"}, {"start": 3652.566, "end": 3654.51, "text": "- 네, 바로 그 부분을 말씀드리려던 참이었습니다."}, {"start": 3654.51, "end": 3658.01, "text": "정부가 할 수 있는 권한에도 법적 제한이 있어야 하지만,"}, {"start": 3658.01, "end": 3660.343, "text": "기업 또한 AI와 공유된 데이터에 대해"}, {"start": 3660.343, "end": 3662.01, "text": "많은 제한을 받아야 합니다."}, {"start": 3662.01, "end": 3664.086, "text": "특히 컴퓨터 화면을 보고 메시지를 듣고"}, {"start": 3664.136, "end": 3666.51, "text": "대화를 나누는 기기가 있다면 더더욱 그렇죠."}, {"start": 3666.51, "end": 3667.51, "text": "사람들이 지금보다"}, {"start": 3667.56, "end": 3670.51, "text": "훨씬 더 진지하게 관심을 가져야 할 사안이라고 생각합니다."}, {"start": 3671.0, "end": 3675.0, "text": "법제화 이전인 지금, 오픈AI는"}, {"start": 3677.01, "end": 3680.973, "text": "아마 인류 역사상 축적된 가장 강력한 개인 프로필 데이터를"}, {"start": 3681.023, "end": 3682.51, "text": "보유하고 계실 텐데요."}, {"start": 3682.51, "end": 3684.271, "text": "저희는 데이터가 어떻게 사용되는지에"}, {"start": 3684.321, "end": 3687.01, "text": "대해 매우 강력한 내부 통제 시스템을 갖추고 있으며,"}, {"start": 3687.01, "end": 3690.51, "text": "사용자분들께 확실한 프라이버시 보장을 제공하고 있습니다."}, {"start": 3690.51, "end": 3692.381, "text": "이 새로운 기기의"}, {"start": 3692.431, "end": 3694.51, "text": "출시가 가까워지면,"}, {"start": 3694.51, "end": 3697.279, "text": "주변 환경과 상시 소통하는 앰비언트 컴퓨팅 기기를 위해"}, {"start": 3697.279, "end": 3700.51, "text": "개발 중인 새로운 프라이버시 제어 기술을 공개하게 될 것입니다."}, {"start": 3700.51, "end": 3703.51, "text": "하지만 말씀하셨듯이 저희가"}, {"start": 3703.51, "end": 3707.01, "text": "역대 가장 방대한 개인 데이터베이스 중 하나를 보유한 것은 맞습니다."}, {"start": 3707.01, "end": 3711.065, "text": "Apple이 영업비밀 침해와 인력 빼가기 혐의로 공개적으로"}, {"start": 3711.115, "end": 3712.51, "text": "소송을 제기했는데요,"}, {"start": 3712.51, "end": 3714.664, "text": "조니 아이브와 함께 이 기기를 개발하기 위해"}, {"start": 3714.664, "end": 3716.01, "text": "직원들을 채용했다는 것이죠."}, {"start": 3716.01, "end": 3717.968, "text": "이에 대해 근거 없는"}, {"start": 3718.018, "end": 3720.51, "text": "주장이라며 일축하셨습니다."}, {"start": 3720.51, "end": 3721.52, "text": "하지만 이 소송으로"}, {"start": 3721.57, "end": 3725.51, "text": "인해 기기 개발 작업에 차질이 생기거나 늦어질까 우려되지는 않으신지요?"}, {"start": 3725.51, "end": 3728.51, "text": "전혀 아닙니다. 우선 저는 Apple의 엄청난 광팬이고요,"}, {"start": 3728.51, "end": 3731.51, "text": "그 소송 소식에 무척 씁쓸하고 안타까웠습니다."}, {"start": 3732.02, "end": 3735.58, "text": "처음 그 소식을 들었을 때 전 이렇게 생각했습니다."}, {"start": 3735.58, "end": 3738.46, "text": "'정말 심각하네, 누군가 큰 잘못을 저질렀나 보다'고요."}, {"start": 3738.46, "end": 3741.94, "text": "저희는 다른 회사의 지식재산권을 원치도 않고,"}, {"start": 3741.94, "end": 3745.26, "text": "다른 회사 IP를 빼돌려 가져오는 사람도 절대 원하지 않습니다."}, {"start": 3745.26, "end": 3747.298, "text": "만약 자체 조사를 통해 누군가"}, {"start": 3747.348, "end": 3749.26, "text": "그랬다는 사실을 발견한다면,"}, {"start": 3749.26, "end": 3752.1, "text": "당연히 즉시 해고하고 엄정하게 대처할 것입니다."}, {"start": 3752.1, "end": 3755.34, "text": "하지만 잘못한 것이 없는 사람이라면 마땅히 보호할 것입니다."}, {"start": 3755.34, "end": 3757.54, "text": "그리고 이번 사안을 면밀히 검토해 본 결과,"}, {"start": 3757.54, "end": 3761.38, "text": "이 경우는 잘못을 저지르지 않은 사례라고 확신합니다."}, {"start": 3761.54, "end": 3763.7, "text": "저희는 그 점에 대해 일부 소명하고자 했으며,"}, {"start": 3763.7, "end": 3765.72, "text": "앞으로 진행될 과정에서 더 명확히 드러날 것입니다."}, {"start": 3766.25, "end": 3767.705, "text": "제가 이해하기로는 이것 때문에"}, {"start": 3767.705, "end": 3769.25, "text": "속도가 느려질 것 같진 않아요."}, {"start": 3769.75, "end": 3772.25, "text": "하드웨어 기기 형태에 대해서는 어떻게 생각하시나요?"}, {"start": 3772.55, "end": 3774.25, "text": "예전엔 별로 안 좋아하신다고 들었는데요."}, {"start": 3774.35, "end": 3776.145, "text": "스마트 안경은 어떠세요?"}, {"start": 3776.145, "end": 3777.25, "text": "AI 안경이요."}, {"start": 3777.55, "end": 3780.75, "text": "저는 별로예요. 카메라나 녹화 표시등이 켜진 채로"}, {"start": 3780.85, "end": 3783.75, "text": "사람들과 이야기하는 게 무척 불편하거든요."}, {"start": 3783.85, "end": 3785.25, "text": "네, 그건 좀 부담스럽긴 하죠."}, {"start": 3785.35, "end": 3787.75, "text": "하지만 다른 형태의 기기들도 많잖아요."}, {"start": 3787.85, "end": 3789.75, "text": "훌륭한 폼 팩터들이 정말 많죠."}, {"start": 3789.85, "end": 3792.75, "text": "저희는 몇 가지 소수의 기기 형태를 시도할 것 같아요."}, {"start": 3792.85, "end": 3795.75, "text": "예를 들면 테이블 위에 어울리는 기기도 있을 것이고,"}, {"start": 3795.85, "end": 3798.25, "text": "주머니 속에 쏙 들어가는 기기도 있을 테고요."}, {"start": 3798.35, "end": 3801.75, "text": "그리고 몸에 직접 착용하는 형태도 있을 겁니다."}, {"start": 3801.85, "end": 3805.55, "text": "그런 기기들을 모두 출시하기까지는 시간이 좀 걸리겠지만,"}, {"start": 3805.75, "end": 3809.55, "text": "가장 큰 적응이 필요한 부분은 바로"}, {"start": 3809.65, "end": 3812.75, "text": "'능동적인 컴퓨터'라는 개념에 익숙해지는 것일 겁니다."}, {"start": 3812.85, "end": 3814.25, "text": "그렇군요."}, {"start": 3814.3, "end": 3818.2, "text": "오픈AI 로드맵에서 하드웨어 기기는"}, {"start": 3818.25, "end": 3821.25, "text": "소비자용 기기는 존립에 필수적인 요소인가요,"}, {"start": 3821.35, "end": 3823.55, "text": "아니면 단순히 부가적인 것인가요?"}, {"start": 3823.65, "end": 3825.672, "text": "추진하시는 사명과 관련해서,"}, {"start": 3825.672, "end": 3826.75, "text": "앞서 말씀하셨듯"}, {"start": 3826.85, "end": 3830.25, "text": "가짓수를 많이 줄였음에도 여전히 진행 중인 일이 많잖아요."}, {"start": 3830.75, "end": 3833.25, "text": "아직은 잘 모르겠습니다. 다만 제 생각에는,"}, {"start": 3833.35, "end": 3836.25, "text": "제게는 강한 직관이 하나 있습니다."}, {"start": 3836.35, "end": 3839.55, "text": "완전히 새롭고 획기적인 컴퓨터의 한 종류이자,"}, {"start": 3839.65, "end": 3843.55, "text": "우리가 기술을 사용하는 방식에 있어 역사적으로"}, {"start": 3843.65, "end": 3846.75, "text": "수십 년에 한 번씩만 나타나는 새로운 카테고리가 존재한다는 것이죠."}, {"start": 3846.85, "end": 3849.55, "text": "하지만 쉽게 믿기 힘든 주장일 수도 있으니,"}, {"start": 3849.65, "end": 3851.794, "text": "제 말만 듣지 마시고 직접 기기를"}, {"start": 3851.844, "end": 3853.75, "text": "보고 판단해 주셨으면 합니다."}, {"start": 3853.85, "end": 3854.55, "text": "네."}, {"start": 3854.6, "end": 3857.0, "text": "몇 년 뒤 사람들은"}, {"start": 3857.35, "end": 3859.75, "text": "몇 년 뒤에는 어떤 모습으로 기억되길 바라시나요?"}, {"start": 3859.85, "end": 3862.25, "text": "꽤 단순해요. 저희가 세상에 선보이는 제품들을"}, {"start": 3862.35, "end": 3864.75, "text": "사람들이 진심으로 사랑해 주길 바랍니다."}, {"start": 3864.849, "end": 3867.192, "text": "예를 들면 '덕분에 사업을"}, {"start": 3867.242, "end": 3869.25, "text": "시작할 수 있었어요',"}, {"start": 3869.35, "end": 3872.75, "text": "'아이에게 멋진 생일 파티를 열어줄 수 있었어요',"}, {"start": 3872.85, "end": 3875.75, "text": "'이 질병을 치료할 수 있었어요' 같은 이야기들 말이죠."}, {"start": 3875.85, "end": 3878.75, "text": "최근에 한 분을 만났는데,"}, {"start": 3878.85, "end": 3882.75, "text": "반려견을 위한 mRNA 암 백신을 개발하는 데 도움을 받고는"}, {"start": 3882.85, "end": 3885.75, "text": "다른 사람들을 위해 그 일을 해주는 회사를 차리셨더라고요."}, {"start": 3885.85, "end": 3889.75, "text": "앞으로 이 기술이 해낼 일들에 비하면 그런 이야기들조차 작아 보일 만큼 발전하길 바랍니다."}, {"start": 3890.429, "end": 3891.429, "text": "몇 년 후,"}, {"start": 3891.48, "end": 3894.51, "text": "지금의 수많은 AI에 대한 두려움 속에서"}, {"start": 3894.51, "end": 3896.9, "text": "사람들이 \"그 회사가 가장 책임감 있는 기업이었고,"}, {"start": 3896.9, "end": 3898.127, "text": "매 순간 우리 모두를 위해"}, {"start": 3898.127, "end": 3900.23, "text": "현명한 결정을 내렸다\"고 말해주길 바랍니다."}, {"start": 3900.23, "end": 3903.521, "text": "그리고 그들이 잘되고 있어 기쁩니다."}, {"start": 3903.571, "end": 3904.23, "text": "왜냐하면"}, {"start": 3904.23, "end": 3907.63, "text": "기술을 올바르게 이끄는 훌륭한 역할을 해내고 있다고 생각하거든요."}, {"start": 3907.63, "end": 3909.741, "text": "전혀 다른 접근 방식을 취하는"}, {"start": 3909.791, "end": 3912.429, "text": "수많은 다른 기업들도 보셨을 겁니다."}, {"start": 3912.43, "end": 3915.085, "text": "우리는 안전에 대한 신념을 일관되게 지켜왔지만,"}, {"start": 3915.085, "end": 3917.23, "text": "틀렸을 때는 기꺼이 바로잡아 왔습니다."}, {"start": 3917.23, "end": 3920.554, "text": "하지만 우리가 '반복적 배포' 전략을 시작했을"}, {"start": 3920.605, "end": 3923.929, "text": "때 AI 안전 커뮤니티는 이를 몹시 싫어했죠."}, {"start": 3923.929, "end": 3925.763, "text": "하지만 돌이켜보면 그것이"}, {"start": 3925.813, "end": 3927.929, "text": "명백히 옳았다고 생각합니다."}, {"start": 3927.929, "end": 3930.109, "text": "모두가 반대할 때조차 우리가 진정으로"}, {"start": 3930.159, "end": 3933.429, "text": "믿는 바를 추진할 용기가 있었다는 점이 다행스럽습니다."}, {"start": 3933.43, "end": 3935.738, "text": "그리고 대부분 우리의 판단이 옳았고,"}, {"start": 3935.738, "end": 3937.879, "text": "틀렸을 때는 즉시 수정해 왔습니다."}, {"start": 3937.929, "end": 3939.507, "text": "그것이야말로 안전하고"}, {"start": 3939.557, "end": 3943.429, "text": "견고한 시스템을 구축하는 올바른 길이라고 봅니다."}, {"start": 3943.43, "end": 3945.886, "text": "앞으로도 계속 그렇게 해나가기를 바라며,"}, {"start": 3945.886, "end": 3948.23, "text": "사람들도 이를 알아봐 주길 기대합니다."}, {"start": 3948.23, "end": 3950.777, "text": "초지능을 향해 개발을 이어가고 계신데,"}, {"start": 3950.777, "end": 3953.879, "text": "개인적으로는 어떻게 준비하고 계신지 궁금합니다."}, {"start": 3953.929, "end": 3955.685, "text": "만들고 계신 기술 너머의 삶이"}, {"start": 3955.735, "end": 3957.929, "text": "어떤 모습일지 그려보신 적이 있나요?"}, {"start": 3957.929, "end": 3961.089, "text": "놀라울 정도로 지금의 모습과 비슷할 것이라고"}, {"start": 3961.139, "end": 3961.929, "text": "생각합니다."}, {"start": 3961.93, "end": 3964.089, "text": "사람들은 여전히 가족들과 어울리고,"}, {"start": 3964.089, "end": 3966.879, "text": "사랑에 빠지고, 다투기도 하고, 취미를 즐기며"}, {"start": 3966.929, "end": 3970.343, "text": "즐거움을 찾고 지극히 인간다운 경험을"}, {"start": 3970.393, "end": 3971.929, "text": "해나갈 것입니다."}, {"start": 3971.93, "end": 3975.073, "text": "스트레스를 받거나 불안해하기도 하고,"}, {"start": 3975.073, "end": 3977.379, "text": "서로를 위해 가치를 창출하고"}, {"start": 3977.429, "end": 3979.529, "text": "온갖 색다른 놀이를 즐기며"}, {"start": 3979.579, "end": 3982.429, "text": "주변 사람들을 깊이 아낄 것입니다."}, {"start": 3982.43, "end": 3985.43, "text": "지금과 크게 다르지 않기를 바랍니다."}, {"start": 3985.43, "end": 3989.43, "text": "인간적인 경험이 더욱 풍요로워지고"}, {"start": 3989.43, "end": 3991.263, "text": "사람들이 더 큰 자율성과 자유,"}, {"start": 3991.263, "end": 3994.879, "text": "풍요를 누리며 더 많은 것을 해내고 더 건강해지기를 바랍니다."}, {"start": 3994.929, "end": 3997.831, "text": "다 함께 미래를 결정할 수 있는"}, {"start": 3997.881, "end": 3999.929, "text": "더 큰 힘을 갖게 되고"}, {"start": 3999.93, "end": 4001.22, "text": "세상은 더 빠르게 나아지되,"}, {"start": 4001.22, "end": 4004.23, "text": "인간적인 경험은 여전히 고유한 인간의 영역으로 남길 희망합니다."}, {"start": 4004.28, "end": 4007.0, "text": "향후 12개월 동안"}, {"start": 4007.0, "end": 4008.88, "text": "오픈AI가 직면한 가장 큰 위험은 무엇인가요?"}, {"start": 4008.93, "end": 4010.43, "text": "제 생각에는..."}, {"start": 4010.65, "end": 4012.45, "text": "안전이나 정렬, 보안에서 실패하는 것이죠."}, {"start": 4012.65, "end": 4016.15, "text": "제 생각엔 지금부터 12개월 후에는"}, {"start": 4016.15, "end": 4018.45, "text": "매우 강력한 역량을 가진 모델을 갖게 될 수도 있고,"}, {"start": 4018.65, "end": 4020.801, "text": "우리가 초지능으로의 전환을"}, {"start": 4020.851, "end": 4022.849, "text": "잘 이끌어갈 수 있다면,"}, {"start": 4022.849, "end": 4026.391, "text": "우리가 그 해법을 찾아낸 세상 속에서"}, {"start": 4026.441, "end": 4027.15, "text": "말이죠."}, {"start": 4027.45, "end": 4030.65, "text": "사람들에게 어떻게 힘을 실어줄지,"}, {"start": 4030.65, "end": 4034.45, "text": "권력이 지나치게 집중되지 않도록 어떻게 보장할지,"}, {"start": 4034.65, "end": 4037.054, "text": "모든 영역에 걸쳐 안전성을"}, {"start": 4037.104, "end": 4038.65, "text": "어떻게 확보할지,"}, {"start": 4038.85, "end": 4042.65, "text": "사람들이 미래에 자신의 삶을 개선하는 데 있어"}, {"start": 4042.65, "end": 4046.15, "text": "스스로 주도권을 쥐고 있다고 느 let player;
let isMutedState = true;

function handleUnmute() {
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});

let syncInterval;
let activityTimeout;
let isUserPositioned = false;
let userBottomPercent = 12;

function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) {
        subsEl.classList.remove('ui-hidden');
        if(isUserPositioned) {
            subsEl.style.bottom = Math.min(88, userBottomPercent + 4) + '%';
        } else {
            subsEl.style.bottom = '';
        }
    }
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) {
                subsEl.classList.add('ui-hidden');
                if(isUserPositioned) {
                    subsEl.style.bottom = userBottomPercent + '%';
                } else {
                    subsEl.style.bottom = '';
                }
            }
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}

function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div>`;
    }
    const subsContainer = document.getElementById('subtitles');
    if(subsContainer && subsContainer.innerHTML !== currentHtml){
        subsContainer.innerHTML = currentHtml;
    }
}

let isDragging=false, startY, currentBottomPx, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

// 자막 더블 클릭 / 더블 탭 시 기본 위치로 초기화 🔄✨
document.addEventListener('dblclick', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        isUserPositioned = false;
        if(subEl) subEl.style.bottom = '';
        resetActivity();
    }
});

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottomPx = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}

function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    let targetBottomPx = currentBottomPx - dy;
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let bottomPercent = Math.max(2, Math.min(85, (targetBottomPx / vh) * 100));
    subEl.style.bottom = bottomPercent + '%';
    if(e.cancelable) e.preventDefault();
}

function dragEnd(e) {
    if(!isDragging) return;
    isDragging = false;
    subEl.classList.remove('dragging');
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let style = window.getComputedStyle(subEl);
    let bottomPx = parseFloat(style.bottom) || 0;
    userBottomPercent = Math.max(2, Math.min(85, (bottomPx / vh) * 100));
    isUserPositioned = true;
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1.5, Math.min(15, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / (initialDist || 1);
        currentFontSize = Math.max(1.5, Math.min(15, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});

</script>
