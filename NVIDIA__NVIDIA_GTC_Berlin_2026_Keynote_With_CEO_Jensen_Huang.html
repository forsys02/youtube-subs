.0, "text": "기지국은 카메라 대신,"}, {"start": 3957.5, "end": 3959.5, "text": "스피커나 마이크 대신,"}, {"start": 3959.7, "end": 3963.2, "text": "전파를 사용하여 세상을 감지합니다."}, {"start": 3963.8, "end": 3966.8, "text": "그리고 정보를 처리해 추론한 다음,"}, {"start": 3967.0, "end": 3969.2, "text": "세상과 상호작용하는데요,"}, {"start": 3969.4, "end": 3971.0, "text": "바로 빔포밍(Beamforming)을 사용합니다."}, {"start": 3971.2, "end": 3973.5, "text": "따라서 사실상 이것은,"}, {"start": 3973.7, "end": 3975.8, "text": "하나의 애플리케이션이자 기술로서,"}, {"start": 3976.0, "end": 3978.8, "text": "AI에 완벽하게 부합하는 분야입니다."}, {"start": 3979.0, "end": 3982.45, "text": "AI는 우리가 통신을 수행하는 방식을 혁명적으로 바꿀 것이며,"}, {"start": 3983.0, "end": 3986.5, "text": "주파수 효율성을 엄청나게 향상시킬 것입니다."}, {"start": 3986.7, "end": 3989.0, "text": "우리가 레이 트레이싱에서 해냈던 것과 똑같이 말이죠."}, {"start": 3989.2, "end": 3992.65, "text": "여러분이 보신 모든 그래픽은 100% 레이 트레이싱된 것인데,"}, {"start": 3993.0, "end": 3995.8, "text": "과거에 필요하다고 생각했던 연산량과,"}, {"start": 3996.0, "end": 3998.2, "text": "지금 AI를 적용했을 때의 연산량은,"}, {"start": 3998.4, "end": 4000.2, "text": "무려 100만 대 1의 차이가 납니다."}, {"start": 4000.5, "end": 4003.8, "text": "마찬가지로 우리는 통신 네트워크에,"}, {"start": 4004.0, "end": 4007.5, "text": "주파수 효율성의 거대한 도약을 가져올 것입니다."}, {"start": 4007.8, "end": 4011.25, "text": "하지만 그 이상으로 우리는 이 모든 기지국 타워들을 혁신할 것입니다."}, {"start": 4012.0, "end": 4015.5, "text": "서구권 전역에 약 10만 개의 사이트가 있고,"}, {"start": 4015.7, "end": 4019.2, "text": "약 100기가와트 규모의 분산 데이터센터에 해당하는데,"}, {"start": 4019.5, "end": 4021.8, "text": "이는 장차 미래에 거듭날 것입니다,"}, {"start": 4022.0, "end": 4024.2, "text": "바로 분산형 AI 인프라로 말이죠."}, {"start": 4024.5, "end": 4027.8, "text": "이곳 유럽의 많은 기업들과 파트너십을 맺게 되어 기쁘며,"}, {"start": 4028.0, "end": 4030.0, "text": "바로 지난주에,"}, {"start": 4030.2, "end": 4032.8, "text": "거의 8년 동안 이 기술을 연구한 끝에,"}, {"start": 4033.0, "end": 4036.5, "text": "엔비디아는 최초의 상용 전화 통화에 성공했습니다,"}, {"start": 4036.7, "end": 4039.2, "text": "노키아와 함께 T-모바일 네트워크 상에서 말이죠."}, {"start": 4039.5, "end": 4042.2, "text": "이제 쿠다가 전화를 걸 수 있게 된 것입니다,"}, {"start": 4042.4, "end": 4044.2, "text": "기존의 방식대로요."}, {"start": 4044.5, "end": 4046.2, "text": "일단 그것이 가능해지면,"}, {"start": 4046.4, "end": 4048.2, "text": "그 위에 AI 계층을 얹을 수 있습니다."}, {"start": 4048.4, "end": 4050.0, "text": "이제 진정한 혁명이 시작될 것입니다."}, {"start": 4050.2, "end": 4052.2, "text": "우리에게는 정말 흥미진진한 기회입니다."}, {"start": 4052.5, "end": 4054.8, "text": "또 다른 피지컬 AI 애플리케이션으로,"}, {"start": 4055.0, "end": 4057.0, "text": "제가 엄청나게 기대하고 있는 분야는,"}, {"start": 4057.2, "end": 4060.2, "text": "본질적으로 로봇 방사선 치료입니다."}, {"start": 4060.5, "end": 4063.5, "text": "종양은 모양이 계속 변하고,"}, {"start": 4063.7, "end": 4067.0, "text": "치료를 받는 동안 환자의 신체도 계속 움직입니다."}, {"start": 4067.5, "end": 4070.95, "text": "이 적응형 로봇 방사선 치료 시스템은,"}, {"start": 4071.7, "end": 4074.5, "text": "변화하는 환경을 실시간으로 지각하고,"}, {"start": 4074.7, "end": 4076.8, "text": "종양이 어디에 있는지 파악하여,"}, {"start": 4077.0, "end": 4079.0, "text": "완벽하게 영역을 분할(Segment)한 뒤,"}, {"start": 4079.2, "end": 4082.5, "text": "그에 맞춰 방사선 치료를 정밀하게 조준합니다."}, {"start": 4082.7, "end": 4085.5, "text": "본질적으로 로봇 수술의 일종입니다, 네, 박수 부탁드립니다."}, {"start": 4091.5, "end": 4094.2, "text": "이것은 로봇 수술의 한 형태입니다."}, {"start": 4095.0, "end": 4098.5, "text": "물론 가장 규모가 크고 가장 가까운 시일 내에 실현될,"}, {"start": 4098.7, "end": 4102.2, "text": "모두가 인정하는 로보틱스 및 피지컬 AI 애플리케이션은,"}, {"start": 4102.4, "end": 4105.2, "text": "우리가 10년 넘게 매진해 온 분야입니다."}, {"start": 4105.5, "end": 4108.5, "text": "그리고 이제 우리는 인식하고 있습니다,"}, {"start": 4108.7, "end": 4112.15, "text": "모든 단일 자동차 기업들이 자사의 차량을,"}, {"start": 4112.7, "end": 4115.8, "text": "차량 호출(Ride-hailing) 플릿의 일부로 만들고 싶어 한다는 것을요."}, {"start": 4116.0, "end": 4118.2, "text": "오늘날에도 차량 호출 서비스가 있죠,"}, {"start": 4118.4, "end": 4121.5, "text": "우버가 있고, 이곳 유럽에는,"}, {"start": 4121.7, "end": 4125.2, "text": "볼트(Bolt)가 있으며, 그랩이나 리프트 등,"}, {"start": 4125.4, "end": 4128.0, "text": "다양한 차량 호출 서비스들이 존재합니다."}, {"start": 4128.2, "end": 4131.0, "text": "미래에는 로보택시들이 등장하여,"}, {"start": 4131.2, "end": 4134.5, "text": "그러한 차량 호출 서비스에 똑같이 연결될 것입니다."}, {"start": 4134.8, "end": 4137.0, "text": "하지만 단 하나의 브랜드로만 이루어지지는 않을 것입니다."}, {"start": 4137.8, "end": 4140.5, "text": "우리는 이러한 시스템을 구축하는 것이,"}, {"start": 4140.7, "end": 4144.2, "text": "엄청나게 많은 비용이 든다는 것을 깨달았습니다, 특히 그 위에 올라가는 소프트웨어 말이죠."}, {"start": 4145.0, "end": 4148.5, "text": "그래서 우리는 하나의 표준 아키텍처를 만들기로 결정했습니다."}, {"start": 4150.0, "end": 4152.0, "text": "14개의 서로 다른 카메라와,"}, {"start": 4152.2, "end": 4155.2, "text": "9개의 레이더 시스템, 3개의 라이다,"}, {"start": 4155.4, "end": 4157.2, "text": "수많은 초음파 센서들이,"}, {"start": 4157.4, "end": 4160.8, "text": "센서들로 이루어진 보호 고치(Cocoon)를 형성하고,"}, {"start": 4161.0, "end": 4164.2, "text": "듀얼 엔비디아 GPU 시스템으로 구동되어,"}, {"start": 4164.4, "end": 4166.8, "text": "자율주행(AV) 컴퓨팅 시스템을 이룹니다."}, {"start": 4167.2, "end": 4169.8, "text": "우리는 이를 산업 표준으로 만들었으며,"}, {"start": 4170.0, "end": 4173.45, "text": "이제 수많은 자동차 플릿에 잇달아 설계 반영되고 있습니다."}, {"start": 4174.2, "end": 4177.5, "text": "그 위에는 자율주행 소프트웨어 기업들이 올라가는데,"}, {"start": 4177.7, "end": 4180.2, "text": "사실 우리 역시 그중 하나로서,"}, {"start": 4180.4, "end": 4183.85, "text": "자율주행 로보택시 역량을 구축하고 있으며,"}, {"start": 4184.2, "end": 4187.65, "text": "이는 다시 차량 호출 서비스로 연결됩니다."}, {"start": 4188.2, "end": 4190.5, "text": "이러한 생태계가 현재 구축되고 있습니다."}, {"start": 4190.8, "end": 4194.2, "text": "전 세계는 연간 약 1조 마일을 이동하는데요,"}, {"start": 4194.5, "end": 4197.95, "text": "미래에는 그중 상당수 마일이 마일당 1~2달러 수준으로,"}, {"start": 4198.4, "end": 4201.85, "text": "로보택시를 통해 이루어질 것입니다."}, {"start": 4202.2, "end": 4204.8, "text": "따라서 이것은 하나의 거대한 기회이지만,"}, {"start": 4205.0, "end": 4207.2, "text": "극도로 파편화되어 있습니다."}, {"start": 4207.5, "end": 4210.5, "text": "그래서 산업 표준인 하이페리온(Hyperion)을 만들고,"}, {"start": 4210.7, "end": 4213.0, "text": "전체 생태계와 협력함으로써,"}, {"start": 4213.2, "end": 4215.8, "text": "본질적으로 하나의 거대한 가상 플릿을 구축하여,"}, {"start": 4216.0, "end": 4218.0, "text": "모두가 연결될 수 있게 한 것입니다."}, {"start": 4218.8, "end": 4221.5, "text": "오늘 정말 자랑스럽게 발표합니다,"}, {"start": 4221.7, "end": 4225.15, "text": "4개의 브랜드, 4개의 차량 라인업이 추가로 합류합니다."}, {"start": 4226.0, "end": 4228.0, "text": "폭스바겐 밴(VW Van),"}, {"start": 4228.2, "end": 4231.0, "text": "이보다 더 상징적인 차량은 상상하기조차 힘들죠,"}, {"start": 4231.2, "end": 4233.5, "text": "재규어 랜드로버(JLR)의 신차,"}, {"start": 4234.2, "end": 4236.2, "text": "볼보 플릿,"}, {"start": 4236.4, "end": 4238.8, "text": "그리고 메르세데스의 차세대 차량까지,"}, {"start": 4239.0, "end": 4241.2, "text": "모두 하이페리온 호환 시스템을 갖추고,"}, {"start": 4241.4, "end": 4244.0, "text": "이 네트워크의 일원이 될 것입니다,"}, {"start": 4244.2, "end": 4246.5, "text": "바로 이 차량 호출 네트워크 로보택시 플릿 말이죠."}, {"start": 4246.8, "end": 4248.5, "text": "하이페리온에 오신 것을 환영합니다!"}, {"start": 4254.5, "end": 4257.8, "text": "다음 주요 산업은,"}, {"start": 4258.0, "end": 4261.5, "text": "다음 위대한 산업이자 엄청나게 거대해질 분야는,"}, {"start": 4261.7, "end": 4264.0, "text": "바로 휴머노이드 로보틱스입니다."}, {"start": 4264.2, "end": 4266.8, "text": "로보틱스가 구현하기 어려운 데에는 이유가 있습니다."}, {"start": 4267.0, "end": 4270.5, "text": "수행해야 할 온갖 작업들이 저마다 무척 다양하기 때문입니다."}, {"start": 4271.0, "end": 4273.8, "text": "특수한 형태(Configuration)를 만들다 보면,"}, {"start": 4274.0, "end": 4276.5, "text": "그 다양한 작업 하나하나마다 말이죠,"}, {"start": 4276.7, "end": 4280.15, "text": "로보틱스 산업이 온갖 상이한 형태들로 조각조각 쪼개지게 됩니다."}, {"start": 4281.2, "end": 4284.2, "text": "이는 기술의 선순환 플라이휠이 작동하는 것을 가로막습니다."}, {"start": 4284.5, "end": 4286.8, "text": "휴대전화가 그토록 빠르게 발전한 이유,"}, {"start": 4287.0, "end": 4289.5, "text": "개인용 컴퓨터가 그토록 빠르게 발전한 이유,"}, {"start": 4289.7, "end": 4293.15, "text": "엔비디아의 NV링크 72가 그토록 빠르게 발전한 이유는,"}, {"start": 4293.7, "end": 4295.8, "text": "그러한 표준화된 구성 덕분에,"}, {"start": 4296.0, "end": 4298.2, "text": "수많은 고객이 이를 사용할 수 있었고,"}, {"start": 4298.4, "end": 4301.2, "text": "그로 인해 물량 규모가 확보되었으며,"}, {"start": 4301.4, "end": 4304.0, "text": "그 물량이 기술 플라이휠을 돌려서,"}, {"start": 4304.2, "end": 4307.5, "text": "놀라울 정도로 빠르게 더 빠르고 더 훌륭해졌기 때문입니다."}, {"start": 4308.0, "end": 4311.5, "text": "따라서 우리에게는 로봇 구성 형태가 필요한데,"}, {"start": 4311.7, "end": 4314.2, "text": "가능한 한 가장 표준화된 형태여야 합니다."}, {"start": 4315.0, "end": 4318.2, "text": "휴머노이드 로보틱스는 분명 그런 잠재력을 가지고 있습니다."}, {"start": 4318.4, "end": 4320.8, "text": "모든 작업에 100% 완벽하지는 않겠지만,"}, {"start": 4321.0, "end": 4322.8, "text": "수많은 작업에 두루 적용될 수 있으며,"}, {"start": 4323.0, "end": 4325.5, "text": "그 결과 가장 큰 물량을 차지하는,"}, {"start": 4325.7, "end": 4328.0, "text": "로보틱스 구성 형태가 될 가능성이 높습니다."}, {"start": 4328.5, "end": 4330.8, "text": "여기에 우리가 AI만 만들어낸다면,"}, {"start": 4331.0, "end": 4333.0, "text": "로봇이 아주 빠르게 학습할 수 있게 해주는 AI 말이죠,"}, {"start": 4333.2, "end": 4336.2, "text": "중소·중견기업들의 경우,"}, {"start": 4336.4, "end": 4339.85, "text": "로봇을 가르치고 프로그래밍할 전담 로보틱스 팀이 없더라도,"}, {"start": 4340.5, "end": 4343.8, "text": "이제 로봇에게 해야 할 일을 직접 보여주기만 하면 됩니다."}, {"start": 4344.0, "end": 4347.5, "text": "그러면 로봇은 범용 역량과 범용 지능을 갖추고 있기 때문에,"}, {"start": 4347.7, "end": 4350.2, "text": "빠르게 학습하고 적응할 수 있을 것입니다."}, {"start": 4350.5, "end": 4353.2, "text": "따라서 이 분야가 바로,"}, {"start": 4353.4, "end": 4356.2, "text": "다음 주요 기술 플랫폼이 될 가능성이 매우 높습니다."}, {"start": 4356.5, "end": 4358.5, "text": "우리는 수많은 기업들과 협력하고 있으며,"}, {"start": 4358.7, "end": 4360.2, "text": "이곳 유럽의 많은 기업들도 알아보실 수 있을 겁니다."}, {"start": 4360.5, "end": 4362.8, "text": "이것은 여러분에게 찾아온 위대한 기회입니다."}, {"start": 4363.5, "end": 4366.95, "text": "그 어떤 나라, 그 어떤 지역도 이만큼 헌신한 곳은 없습니다,"}, {"start": 4367.7, "end": 4371.15, "text": "메카트로닉스와 전자공학, 기계 시스템을 만드는 데 있어서,"}, {"start": 4372.0, "end": 4375.45, "text": "유럽 지역만큼 정밀함과 장인정신의 경지에 오른 곳은 없죠."}, {"start": 4376.5, "end": 4379.8, "text": "이곳의 수많은 기업들은 제조 분야에서 타의 추종을 불허합니다."}, {"start": 4380.0, "end": 4383.2, "text": "이 분야가 바로 다음 대규모 양산 산업이 될 것이며,"}, {"start": 4383.4, "end": 4386.2, "text": "보시다시피 이미 수많은 기업들이 참여하고 있습니다."}, {"start": 4386.4, "end": 4389.0, "text": "여러분과 파트너가 되어 정말 기쁩니다."}, {"start": 4397.2, "end": 4399.8, "text": "자, 이제 구축하기 위해서는,"}, {"start": 4400.0, "end": 4402.2, "text": "피지컬 AI 시스템을 구축하려면,"}, {"start": 4402.5, "end": 4404.8, "text": "세 가지 컴퓨터가 필요합니다."}, {"start": 4405.2, "end": 4408.5, "text": "첫 번째 컴퓨터는 우리가 계속 이야기해 왔고 모두가 잘 아는 것,"}, {"start": 4408.7, "end": 4410.8, "text": "바로 AI 모델을 훈련하는 컴퓨터입니다."}, {"start": 4411.2, "end": 4413.2, "text": "두 번째 컴퓨터는,"}, {"start": 4413.4, "end": 4416.8, "text": "AI가 자신의 기술(Skill)을 수행하는 법을 학습하는 곳입니다."}, {"start": 4417.2, "end": 4419.8, "text": "AI를 프로그래밍하자마자 곧바로,"}, {"start": 4420.0, "end": 4423.45, "text": "물리적 세계로 내보내서 마음대로 움직여보라고 할 수는 없습니다."}, {"start": 4424.2, "end": 4426.8, "text": "반드시 디지털 트윈 안에서 먼저 수행해야 합니다."}, {"start": 4427.2, "end": 4430.2, "text": "우리는 옴니버스라는 디지털 트윈을 만들었으며,"}, {"start": 4430.4, "end": 4432.8, "text": "우리가 이에 대해 반복해서 이야기하는 것을 보셨을 겁니다."}, {"start": 4433.0, "end": 4436.45, "text": "실제로 방금 전 모든 쿠다-X 라이브러리를 보셨을 때도,"}, {"start": 4437.0, "end": 4440.2, "text": "그 모든 것이 디지털 트윈 세계 안에서 이루어지고 있었습니다."}, {"start": 4440.4, "end": 4442.0, "text": "그 디지털 트윈 세계가 바로 옴니버스입니다."}, {"start": 4442.2, "end": 4445.5, "text": "옴니버스는 온갖 플랫폼과 도구들에 연결된 라이브러리입니다."}, {"start": 4445.7, "end": 4449.2, "text": "지멘스, 다쏘, 케이던스 등 수많은 곳에 연결되어 있죠."}, {"start": 4449.5, "end": 4452.95, "text": "이처럼 디지털 트윈 시스템들이 구축되는 모습을 보실 수 있습니다."}, {"start": 4453.5, "end": 4455.0, "text": "이것이 두 번째 컴퓨터입니다."}, {"start": 4455.5, "end": 4459.0, "text": "세 번째 컴퓨터는 로보틱스 컴퓨터입니다."}, {"start": 4459.5, "end": 4461.8, "text": "그 컴퓨터는 자율주행차나,"}, {"start": 4462.0, "end": 4463.8, "text": "로보택시의 경우,"}, {"start": 4464.0, "end": 4466.0, "text": "우리가 하이페리온이라고 부릅니다."}, {"start": 4466.2, "end": 4469.5, "text": "하이페리온은 컴퓨터 자체와,"}, {"start": 4469.7, "end": 4473.15, "text": "기능 안전 시스템, 능동 안전 시스템,"}, {"start": 4473.8, "end": 4476.0, "text": "그리고 운영체제로 구성되는데,"}, {"start": 4476.2, "end": 4478.2, "text": "피지컬 AI 안전을 위해 설계된 운영체제입니다."}, {"start": 4478.8, "end": 4482.25, "text": "우리는 로보틱스 시스템에 대해서도 정확히 똑같은 작업을 해내야 합니다."}, {"start": 4483.0, "end": 4486.2, "text": "그리하여 여러분이 연구를 시작하고,"}, {"start": 4486.4, "end": 4488.5, "text": "자체 로보틱스 시스템을 개발하기 시작할 때마다,"}, {"start": 4488.7, "end": 4491.5, "text": "맨바닥부터 시작해 얼기설기 짜맞추느라,"}, {"start": 4491.7, "end": 4494.2, "text": "모든 소프트웨어와 컴퓨팅 시스템,"}, {"start": 4494.4, "end": 4496.2, "text": "센서들과 모든 기계 시스템들을 일일이 결합할 필요가 없게 하는 것이죠."}, {"start": 4496.4, "end": 4498.8, "text": "그 작업만 해도 수년이 걸릴 테니까요."}, {"start": 4499.2, "end": 4502.65, "text": "그래서 우리는 레퍼런스 로봇을 만들기로 결정했습니다."}, {"start": 4503.2, "end": 4505.5, "text": "바로 엔비디아 애자일 원(Agile ONE)으로,"}, {"start": 4505.7, "end": 4507.8, "text": "애자일 로보틱스와의 파트너십으로 탄생했습니다."}, {"start": 4508.0, "end": 4510.5, "text": "이 로봇은 앞으로,"}, {"start": 4516.0, "end": 4519.45, "text": "내년 1분기에 출시될 예정입니다."}, {"start": 4520.2, "end": 4522.8, "text": "내부에 컴퓨터가 탑재되어 사전 조립된 상태로 제공되며,"}, {"start": 4523.0, "end": 4525.0, "text": "소프트웨어가 통합되어 있어서,"}, {"start": 4525.2, "end": 4528.65, "text": "개봉 즉시 꽤 훌륭한 성능을 발휘할 수 있을 것입니다."}, {"start": 4529.5, "end": 4531.8, "text": "따라서 이것은 훌륭한 출발점이 될 것이며,"}, {"start": 4532.0, "end": 4535.0, "text": "로보틱스 개발을 가속화하는 플라이휠이 될 것입니다."}, {"start": 4536.2, "end": 4539.65, "text": "자, 이제 오늘 연설을 마무리하면서,"}, {"start": 4540.0, "end": 4541.8, "text": "우리가 처음 시작했던 곳에서부터 이야기해 보겠습니다."}, {"start": 4542.0, "end": 4544.0, "text": "엔비디아는 PC 혁명에서 시작했습니다."}, {"start": 4544.2, "end": 4546.2, "text": "때는 1993년이었고,"}, {"start": 4546.4, "end": 4549.0, "text": "PC 혁명이 막 시작되려던 참이었습니다."}, {"start": 4549.2, "end": 4552.0, "text": "기억하시겠지만 윈도우 95가 그 흐름에 터보차저를 달아주었죠."}, {"start": 4552.8, "end": 4555.5, "text": "그 이후로 우리는 GPU를 발명했고,"}, {"start": 4555.7, "end": 4559.15, "text": "프로그래밍 가능한 셰이딩과 실시간 레이 트레이싱을 선보였으며,"}, {"start": 4559.7, "end": 4562.0, "text": "컴퓨팅 모델에 쿠다를 추가하여,"}, {"start": 4562.2, "end": 4565.2, "text": "현대 AI 혁명에 불을 지피는 데 기여했습니다."}, {"start": 4566.2, "end": 4569.65, "text": "그리고 4년 전, 우리는 고민하기 시작했습니다,"}, {"start": 4570.0, "end": 4573.45, "text": "이 새로운 시대를 맞아 개인용 컴퓨터를 재구상하려면 무엇을 할 수 있을까 하고 말이죠."}, {"start": 4574.0, "end": 4576.4, "text": "개인용 컴퓨터가 단순히 여러분의 도구,"}, {"start": 4576.6, "end": 4578.8, "text": "즉 개인용 컴퓨터 도구에 그치는 것이 아니라,"}, {"start": 4579.0, "end": 4581.5, "text": "여러분의 개인 에이전트,"}, {"start": 4581.7, "end": 4583.8, "text": "즉 개인 비서가 되는 것입니다."}, {"start": 4584.2, "end": 4586.8, "text": "그리고 이 컴퓨터와 상호작용하는 방식은,"}, {"start": 4587.0, "end": 4589.8, "text": "본질적으로 동반자(Companion)가 되어,"}, {"start": 4590.0, "end": 4593.2, "text": "여러분이 일하는 것을 도와주는 존재가 되는 것입니다."}, {"start": 4594.0, "end": 4596.6, "text": "그러려면 이 컴퓨터에는 들어가야 합니다,"}, {"start": 4596.8, "end": 4599.2, "text": "제가 오늘 말씀드린 5가지 요소가 정확히 다 있어야 하죠."}, {"start": 4600.2, "end": 4602.5, "text": "모델이 있어야 하는데, 로컬에서 실행될 수도 있고,"}, {"start": 4602.7, "end": 4604.8, "text": "클라우드에서 실행될 수도 있습니다."}, {"start": 4605.0, "end": 4606.8, "text": "하네스가 필요하고,"}, {"start": 4607.0, "end": 4610.5, "text": "보안 런타임인 오픈쉘이 필요하며,"}, {"start": 4610.7, "end": 4614.15, "text": "여러분의 PC에 상주하기 때문에 접근 권한이 필요합니다,"}, {"start": 4614.7, "end": 4617.0, "text": "바로 지식과 도구에 대한 접근 권한 말이죠."}, {"start": 4617.5, "end": 4620.0, "text": "좋은 소식은 엔비디아가 가속해 왔다는 점입니다,"}, {"start": 4620.2, "end": 4622.5, "text": "아주 오랫동안 도구들을 가속해 왔죠."}, {"start": 4622.8, "end": 4625.2, "text": "우리가 컴퓨터를 하나 만들어서,"}, {"start": 4625.4, "end": 4628.5, "text": "OpenGL과 DirectX를 가속할 수 있고,"}, {"start": 4628.7, "end": 4631.8, "text": "쿠다의 모든 것과 엔비디아가 그동안 개발한 모든 것이,"}, {"start": 4632.0, "end": 4634.0, "text": "이 컴퓨터 위에서 돌아가게만 할 수 있다면 어떨까요?"}, {"start": 4634.2, "end": 4635.5, "text": "바로 이것입니다!"}, {"start": 4635.7, "end": 4638.0, "text": "마이크로소프트와 4년간의 파트너십 끝에,"}, {"start": 4638.2, "end": 4640.2, "text": "우리는 RTX 스파크(Spark)를 탄생시켰습니다."}, {"start": 4640.4, "end": 4643.0, "text": "이것은 완전히 새로운 컴퓨터 라인업입니다."}, {"start": 4643.2, "end": 4646.65, "text": "말 그대로 수천 년의 엔지니어링 시간이 여기에 투입되었습니다."}, {"start": 4647.2, "end": 4649.8, "text": "우리는 4년 동안 비밀리에 이를 개발해 왔으며,"}, {"start": 4650.0, "end": 4652.8, "text": "N1X라는 칩을 만들어냈고,"}, {"start": 4653.0, "end": 4655.2, "text": "그리고 최근 이를 공식 발표했습니다,"}, {"start": 4655.4, "end": 4657.5, "text": "전체 PC 산업계와 힘을 합쳐서 말이죠."}, {"start": 4658.0, "end": 4660.2, "text": "우리는 데스크톱과 노트북,"}, {"start": 4660.4, "end": 4662.5, "text": "그리고 워크스테이션을 만들었습니다."}, {"start": 4662.8, "end": 4665.0, "text": "이 작은 장치가 무려 1페타플롭스입니다."}, {"start": 4665.2, "end": 4667.5, "text": "1페타플롭스가 어느 정도인지 체감하실 수 있게 말씀드리면,"}, {"start": 4667.7, "end": 4671.15, "text": "2016년에 저는 1페타플롭스의 연산 성능과,"}, {"start": 4672.0, "end": 4674.8, "text": "128기가바이트의 메모리를 갖춘,"}, {"start": 4675.0, "end": 4677.8, "text": "1페타플롭스와 128기가바이트 시스템을,"}, {"start": 4678.0, "end": 4680.8, "text": "오픈AI라는 한 작은 회사에 전달했었습니다."}, {"start": 4681.2, "end": 4683.5, "text": "그런데 지금 제 손에 들린 이것이 바로 1페타플롭스이자,"}, {"start": 4683.7, "end": 4686.0, "text": "128기가바이트입니다."}, {"start": 4694.2, "end": 4696.5, "text": "물론 유일한 차이점이라면,"}, {"start": 4696.7, "end": 4698.5, "text": "이것은 제가 이렇게 한 손으로 들 수 있는 반면,"}, {"start": 4698.7, "end": 4701.8, "text": "DGX-1은 두 사람이 낑낑대며 계단 위로 날라야 했다는 점이죠."}, {"start": 4702.2, "end": 4705.2, "text": "이것이 바로 완전히 새로운 RTX 스파크 PC입니다."}, {"start": 4705.5, "end": 4708.2, "text": "그리고 만약 여러분이 컴패니언 워크스테이션을 원하신다면,"}, {"start": 4708.4, "end": 4711.8, "text": "카티아와 다쏘의 모든 소프트웨어,"}, {"start": 4712.0, "end": 4714.2, "text": "오토데스크와 어도비,"}, {"start": 4714.4, "end": 4716.8, "text": "케이던스와 시놉시스를 모두 돌릴 수 있는,"}, {"start": 4717.0, "end": 4719.2, "text": "직접 장만하실 수도 있습니다,"}, {"start": 4719.4, "end": 4721.5, "text": "윈도우를 구동하는 DGX 스테이션을 말이죠."}, {"start": 4722.0, "end": 4724.5, "text": "이 시스템은 20페타플롭스의 성능과,"}, {"start": 4724.7, "end": 4726.8, "text": "그리고 754기가바이트의,"}, {"start": 4727.0, "end": 4729.0, "text": "메모리를 갖추고 있습니다."}, {"start": 4729.5, "end": 4731.0, "text": "실로 경이롭죠."}, {"start": 4731.2, "end": 4733.5, "text": "그리고 물론 데스크톱 버전도 있습니다."}, {"start": 4733.8, "end": 4736.8, "text": "이 모든 제품들은 현재 출시되어 있으며,"}, {"start": 4737.0, "end": 4739.5, "text": "그리고 RTX 스파크 기반의 DGX 스테이션,"}, {"start": 4739.7, "end": 4741.8, "text": "즉 DGX 스파크 기술이 들어간 모델,"}, {"start": 4742.0, "end": 4745.0, "text": "즉 윈도우 기반 DGX 스테이션은 올해 말에 출시될 예정입니다."}, {"start": 4745.2, "end": 4747.2, "text": "자, 이제 질문은 이것입니다."}, {"start": 4747.5, "end": 4750.8, "text": "지금까지 저는 에이전트의 5가지 구성 요소에 대해 말씀드렸는데요,"}, {"start": 4751.2, "end": 4753.8, "text": "그렇다면 과연 그것을 어떻게 만들까요?"}, {"start": 4754.0, "end": 4756.0, "text": "에이전트는 어떻게 구축하는 걸까요?"}, {"start": 4756.2, "end": 4758.8, "text": "저러한 컴퓨터 위에서 돌아가거나 클라우드에서 돌아가고,"}, {"start": 4759.0, "end": 4761.2, "text": "혹은 온프레미스 어딘가에서 실행되는 에이전트 말이죠."}, {"start": 4761.8, "end": 4764.8, "text": "정답은 정말이지 아주 쉽습니다, 바로 이렇게 하시면 됩니다."}, {"start": 4765.2, "end": 4767.2, "text": "에이전트를 만드는 방법은,"}, {"start": 4767.4, "end": 4770.2, "text": "에이전트에게 대신 만들어 달라고 요청하는 것입니다."}, {"start": 4778.2, "end": 4781.5, "text": "자, 바로 이것이 그 프롬프트인데요,"}, {"start": 4782.0, "end": 4784.4, "text": "바로 앞으로 실행할 프롬프트입니다,"}, {"start": 4784.6, "end": 4786.8, "text": "다음 애플리케이션을 구동할 프롬프트이죠."}, {"start": 4787.0, "end": 4790.45, "text": "지금부터 여러분이 보시게 될 것은 로보틱스 애플리케이션입니다."}, {"start": 4791.2, "end": 4794.2, "text": "이 데모를 보시는 동안 꼭 기억해 주십시오,"}, {"start": 4794.4, "end": 4797.5, "text": "이 개인용 컴퓨터 위에서 에이전트가 실행되고 있으며,"}, {"start": 4798.2, "end": 4801.65, "text": "이 데모는 세 대의 컴퓨터에 걸쳐 구동됩니다."}, {"start": 4802.0, "end": 4804.2, "text": "첫 번째 컴퓨터는 훈련용이고,"}, {"start": 4804.4, "end": 4806.5, "text": "두 번째는 디지털 트윈이며,"}, {"start": 4807.0, "end": 4810.2, "text": "세 번째는 그렇게 만들어진 AI를,"}, {"start": 4810.4, "end": 4813.0, "text": "로봇 컴퓨터 자체에 탑재하는 것입니다."}, {"start": 4813.5, "end": 4816.2, "text": "자, 두 가지 핵심 아이디어입니다."}, {"start": 4816.4, "end": 4819.8, "text": "첫 번째 아이디어는 에이전트를 어떻게 만들고 실행하며,"}, {"start": 4820.0, "end": 4822.2, "text": "무엇을 하는 데 쓸 수 있는가이고,"}, {"start": 4822.8, "end": 4826.25, "text": "두 번째는 세 대의 컴퓨터로 구성되는,"}, {"start": 4827.0, "end": 4829.5, "text": "피지컬 AI 컴퓨팅 모델입니다, 함께 보시죠."}, {"start": 4840.2, "end": 4843.5, "text": "허깅페이스의 로봇인 마이크로덕(MicroDuck)을 만나보십시오."}, {"start": 4843.8, "end": 4847.25, "text": "엔비디아 RTX 스파크로 이 로봇에게 보고 걷는 법을 가르쳐 보겠습니다."}, {"start": 4850.0, "end": 4852.2, "text": "에이전트 하네스로는 헤르메스(Hermes)를 사용하고,"}, {"start": 4852.5, "end": 4855.95, "text": "모델로는 네모트론과 오픈AI의 GPT-6 아스트라(Astra)를 사용하며,"}, {"start": 4856.5, "end": 4859.8, "text": "쿠다-X로 가속된 도구들인 프리캐드(FreeCAD), 블렌더(Blender),"}, {"start": 4860.0, "end": 4863.2, "text": "아이작 심(Isaac Sim), 뉴턴 물리 엔진, 그리고 아이작 랩을 활용합니다."}, {"start": 4863.5, "end": 4865.8, "text": "모든 작업은 제 RTX 스파크에서 실행하되,"}, {"start": 4866.0, "end": 4868.5, "text": "대규모 워크로드가 필요할 때만 클라우드로 확장(Burst)합니다."}, {"start": 4869.2, "end": 4872.65, "text": "먼저, 장애물 코스와 마이크로덕이 배워야 할 내용을 설명합니다."}, {"start": 4874.2, "end": 4877.5, "text": "RTX 스파크에서 헤르메스와 네모트론이 코스를 계획하고,"}, {"start": 4877.7, "end": 4880.2, "text": "필요한 모든 오브젝트 목록을 작성합니다."}, {"start": 4883.0, "end": 4885.2, "text": "그다음부터는 아스트라가 이어받아,"}, {"start": 4885.4, "end": 4888.2, "text": "프리캐드를 사용해 3D 오브젝트를 모델링하고,"}, {"start": 4888.8, "end": 4891.8, "text": "블렌더를 사용해 재질을 입히며,"}, {"start": 4893.0, "end": 4896.45, "text": "옴니버스 심레디(SimReady) 라이브러리로 물리적 속성을 추가합니다."}, {"start": 4898.0, "end": 4901.2, "text": "아이작 심에서 아스트라가 전체 장면을 구성합니다."}, {"start": 4905.0, "end": 4908.45, "text": "아스트라는 마이크로덕의 관절과 액추에이터, 링크를 리깅하고,"}, {"start": 4911.5, "end": 4914.95, "text": "뉴턴 물리 엔진으로 마이크로덕이 어떻게 움직이는지 시뮬레이션합니다."}, {"start": 4917.8, "end": 4920.0, "text": "이제 훈련이 시작됩니다."}, {"start": 4921.0, "end": 4923.2, "text": "클라우드에서 수천 마리의 마이크로덕이,"}, {"start": 4923.4, "end": 4925.5, "text": "아이작 랩에서 병렬로 훈련합니다."}, {"start": 4930.5, "end": 4933.0, "text": "넘어질 때마다 하나씩 교훈을 얻으며,"}, {"start": 4936.0, "end": 4938.8, "text": "매 순간 행동 정책(Policy)을 개선해 나갑니다."}, {"start": 4939.5, "end": 4942.8, "text": "옴니버스 라이브러리는 마이크로덕의 카메라를 시뮬레이션하여,"}, {"start": 4943.0, "end": 4944.8, "text": "사물을 보는 법을 가르칩니다."}, {"start": 4945.2, "end": 4947.8, "text": "지각 능력과 물리 법칙이 함께 작동함에 따라,"}, {"start": 4948.0, "end": 4950.2, "text": "마이크로덕은 장애물을 피하고,"}, {"start": 4950.4, "end": 4953.8, "text": "좁은 공간을 통과하며 주변 환경에 적응할 수 있게 됩니다."}, {"start": 4962.0, "end": 4964.8, "text": "이제 훈련된 정책을 RTX 스파크로 다운로드한 뒤,"}, {"start": 4965.0, "end": 4967.2, "text": "네모트론과 아이작 심을 사용하여,"}, {"start": 4967.4, "end": 4970.5, "text": "다중 로봇 조율 환경에서 마이크로덕을 평가합니다."}, {"start": 4975.0, "end": 4978.2, "text": "검증된 정책을 실제 오리 로봇에 배포하면,"}, {"start": 4979.8, "end": 4981.8, "text": "드디어 힘차게 걸어 나갑니다."}, {"start": 4982.0, "end": 4985.2, "text": "엔비디아 RTX 스파크로 AI 에이전트와,"}, {"start": 4985.4, "end": 4988.5, "text": "가속된 도구들을 여러분의 노트북에서 바로 구축하고 실행해 보십시오."}, {"start": 4998.8, "end": 5001.0, "text": "안녕, 친구들!"}, {"start": 5002.0, "end": 5003.8, "text": "오, 그래요?"}, {"start": 5004.2, "end": 5006.8, "text": "좋아요, 이리 와보세요, 여기로 와봐요."}, {"start": 5007.8, "end": 5010.0, "text": "분들께 걸을 수 있다는 걸 보여주세요."}, {"start": 5011.5, "end": 5013.8, "text": "카메라도 달려 있군요."}, {"start": 5014.8, "end": 5016.5, "text": "오, 그래요?"}, {"start": 5018.8, "end": 5020.8, "text": "넘어지지 않게 조심해요."}, {"start": 5022.0, "end": 5024.0, "text": "다들 앉아볼 수 있나요?"}, {"start": 5032.0, "end": 5033.8, "text": "좋아요, 이제 일어서 보세요."}, {"start": 5034.0, "end": 5035.5, "text": "낮잠 한번 자볼까요?"}, {"start": 5036.0, "end": 5037.8, "text": "낮잠 자보세요."}, {"start": 5039.0, "end": 5041.2, "text": "낮잠을 좀 자야겠네요."}, {"start": 5042.8, "end": 5044.5, "text": "좋아요, 다시 일어서요!"}, {"start": 5045.5, "end": 5048.5, "text": "너희가 바로 이 안에서 만들어졌다는 거 알고 있었니?"}, {"start": 5048.7, "end": 5051.0, "text": "RTX 스파크 위에서 태어났단다."}, {"start": 5051.2, "end": 5053.0, "text": "나도 알아."}, {"start": 5053.2, "end": 5055.5, "text": "그리고 클라우드에서 훈련받았지,"}, {"start": 5055.7, "end": 5058.2, "text": "수많은 엔비디아 슈퍼컴퓨터 위에서 말이야."}, {"start": 5058.5, "end": 5061.5, "text": "그리고 바로 여기 RTX 스파크에서 기술들을 배웠단다,"}, {"start": 5061.7, "end": 5063.8, "text": "옴니버스 디지털 트윈 안에서 말이지."}, {"start": 5064.0, "end": 5065.8, "text": "정말 놀랍지 않니?"}, {"start": 5066.0, "end": 5067.8, "text": "나도 알아."}, {"start": 5068.0, "end": 5069.8, "text": "그렇고말고."}, {"start": 5070.0, "end": 5072.0, "text": "너희들 정말 너무 귀엽구나."}, {"start": 5072.2, "end": 5075.5, "text": "그리고 너희의,"}, {"start": 5075.7, "end": 5077.8, "text": "부모님 회사는 폴렌(Pollen)이라고 불리지,"}, {"start": 5078.0, "end": 5080.2, "text": "철자가 P-O-L-L-E-N 맞니?"}, {"start": 5080.4, "end": 5081.8, "text": "응, 그렇지."}, {"start": 5082.0, "end": 5083.8, "text": "폴렌 로보틱스(Pollen Robotics) 말이야."}, {"start": 5084.0, "end": 5086.2, "text": "그런데 듣자 하니,"}, {"start": 5086.4, "end": 5088.5, "text": "모두가 너희를 너무나 좋아해서 완판되었다더구나."}, {"start": 5090.0, "end": 5093.5, "text": "그러니 여러분, 폴렌 웹사이트에 한번 가보십시오."}, {"start": 5093.8, "end": 5095.5, "text": "이 방송을 보시는 모든 분들,"}, {"start": 5095.7, "end": 5097.8, "text": "아마 2천만 명쯤 시청하고 계실 텐데요,"}, {"start": 5098.0, "end": 5099.8, "text": "보시는 모든 분들은 폴렌 웹사이트에 가셔서,"}, {"start": 5100.0, "end": 5101.8, "text": "주문을 넣어 보십시오."}, {"start": 5102.5, "end": 5105.2, "text": "이 스타트업은 직원이 한 10명 정도인 것 같은데,"}, {"start": 5105.4, "end": 5107.5, "text": "주문 폭주로 서버가 터질지도 모르겠네요, 펑 하고요!"}, {"start": 5107.8, "end": 5109.8, "text": "정말 흥미진진할 겁니다."}, {"start": 5110.0, "end": 5111.5, "text": "모두가 한 마리씩 입양해야 합니다."}, {"start": 5111.7, "end": 5113.2, "text": "너희들 정말 너무 귀엽다."}, {"start": 5113.4, "end": 5116.5, "text": "RTX 스파크만 있으면 너희에게 새로운 기술들을 계속 가르칠 수 있지, 안 그러니?"}, {"start": 5116.8, "end": 5118.2, "text": "어이, 어이!"}, {"start": 5118.8, "end": 5121.5, "text": "오, 저것 좀 보세요, 정말 대단하네요."}, {"start": 5122.0, "end": 5124.2, "text": "공중제비도 돌 수 있니?"}, {"start": 5133.5, "end": 5135.8, "text": "아, 너무 좋네요."}, {"start": 5136.0, "end": 5138.0, "text": "정말 유쾌합니다."}, {"start": 5138.5, "end": 5140.2, "text": "와, 대단해요."}, {"start": 5140.5, "end": 5142.8, "text": "좋습니다, 자, 이제 마무리해 볼까요?"}, {"start": 5143.0, "end": 5145.2, "text": "오늘 우리는 무엇에 대해 이야기했습니까?"}, {"start": 5145.4, "end": 5147.6, "text": "우리는 유럽에 대해 이야기했습니다,"}, {"start": 5147.8, "end": 5149.8, "text": "자체적인 AI 경제를 구축하는 유럽 말이죠."}, {"start": 5150.0, "end": 5152.2, "text": "그리고 그 시작은 바로 인프라입니다."}, {"start": 5152.4, "end": 5154.6, "text": "우리는 또한 완전히 새로운 시스템을 발표했습니다,"}, {"start": 5154.8, "end": 5156.8, "text": "바로 DSX 파드(Pod)라고 불리는 시스템이죠."}, {"start": 5157.0, "end": 5159.5, "text": "여러분이 AI 팩토리를 쉽게 구축할 수 있도록 했습니다."}, {"start": 5159.7, "end": 5162.0, "text": "그리고 이러한 AI 팩토리들은,"}, {"start": 5162.2, "end": 5164.2, "text": "이제 단순히 모델만 실행하는 것이 아니라,"}, {"start": 5164.5, "end": 5166.2, "text": "얘야, 집중해야지!"}, {"start": 5166.5, "end": 5168.8, "text": "집중해, 이리 와봐, 여기로 와."}, {"start": 5169.0, "end": 5170.8, "text": "이리 와서 집중하렴."}, {"start": 5171.0, "end": 5173.2, "text": "이 AI 팩토리들은 단순히,"}, {"start": 5173.4, "end": 5175.2, "text": "그래, 잘했어, 거기 앉아 있으렴."}, {"start": 5175.5, "end": 5178.2, "text": "단순히 AI 모델만 실행하는 데 그치지 않고,"}, {"start": 5178.5, "end": 5180.8, "text": "전체 에이전트를 실행합니다."}, {"start": 5181.0, "end": 5183.8, "text": "그리고 이 에이전트는 5가지 요소로 구성됩니다."}, {"start": 5184.0, "end": 5187.45, "text": "지각과 추론, 계획 및 행동을 수행하는 거대 언어 모델이 있고,"}, {"start": 5188.5, "end": 5190.6, "text": "그리고 이와 함께 맞물려 돌아가는,"}, {"start": 5190.8, "end": 5192.8, "text": "하네스가 있습니다,"}, {"start": 5193.0, "end": 5195.8, "text": "본질적으로 외골격 역할을 하는 그 하네스는,"}, {"start": 5196.0, "end": 5199.2, "text": "보안 런타임 내부에 자리 잡고 실행됩니다,"}, {"start": 5199.4, "end": 5201.5, "text": "우리가 오픈쉘이라고 부르는 보안 환경이죠."}, {"start": 5201.7, "end": 5204.5, "text": "벌써 수많은 기업들이 이를 전폭적으로 지원하고 있습니다."}, {"start": 5204.7, "end": 5208.15, "text": "여기에 지식과 도구에 대한 접근 권한을 부여합니다."}, {"start": 5209.0, "end": 5212.45, "text": "그리고 이 에이전트는 이러한 컴퓨터들 위에서 구동되지만,"}, {"start": 5213.2, "end": 5215.8, "text": "우리는 또한 이를 다음 세대로 확장하고 있으며,"}, {"start": 5216.0, "end": 5219.0, "text": "바로 거기서 너희들이 등장하는 피지컬 AI가 펼쳐집니다."}, {"start": 5219.5, "end": 5221.8, "text": "자, 이것이 오늘 우리가 나눈 이야기입니다."}, {"start": 5222.0, "end": 5224.2, "text": "누구나 에이전트를 구축할 수 있으며,"}, {"start": 5224.4, "end": 5227.8, "text": "유럽의 모든 기업이 AI 기업으로 거듭날 것입니다."}, {"start": 5228.2, "end": 5231.2, "text": "모두가 AI 기업이 될 것이라는 점에는 의심의 여지가 없습니다."}, {"start": 5231.5, "end": 5233.6, "text": "그리고 우리는 번창하는 AI 경제를,"}, {"start": 5233.8, "end": 5235.8, "text": "이곳 유럽에서 맞이하게 될 것입니다."}, {"start": 5236.0, "end": 5239.45, "text": "33년이 흐른 지금, 실로 경이로운 여정이었는데요,"}, {"start": 5240.0, "end": 5242.8, "text": "우리가 정말 멋진 영상을 하나 만들었습니다."}, {"start": 5243.0, "end": 5244.2, "text": "너희도 같이 볼래?"}, {"start": 5244.4, "end": 5246.5, "text": "좋아, 이리 와봐, 여기로 조금만 와봐."}, {"start": 5246.7, "end": 5248.0, "text": "조금만 이쪽으로 오렴."}, {"start": 5248.2, "end": 5250.2, "text": "우리가 길을 비켜줄게, 이리 온."}, {"start": 5251.8, "end": 5254.2, "text": "전속력으로, 전속력으로 달려!"}, {"start": 5257.8, "end": 5260.5, "text": "도대체 저 무대 다음 순서를 우리가 어떻게 이어가죠?"}, {"start": 5261.0, "end": 5264.45, "text": "음, 이 관객들을 훨씬 더 열광하게 만들 수 있는 방법이 딱 하나 있지."}, {"start": 5265.8, "end": 5267.5, "text": "그게 뭔데요?"}, {"start": 5272.0, "end": 5274.0, "text": "분들, 믿기지 않으실 겁니다!"}, {"start": 5274.2, "end": 5277.65, "text": "GTC가 지금 완전 유로비전(Eurovision) 무대로 변신했습니다!"}, {"start": 5280.2, "end": 5283.2, "text": "베를린에서 기조연설이 시작되고,"}, {"start": 5283.4, "end": 5285.8, "text": "AI의 새로운 장이 열립니다."}, {"start": 5286.0, "end": 5288.5, "text": "당신 곁에서 함께 일하는 에이전트들,"}, {"start": 5288.7, "end": 5291.2, "text": "드디어 유럽의 시대가 도래했습니다!"}, {"start": 5291.4, "end": 5293.8, "text": "만약 우리가 GTC에서 한 이야기를 놓치셨다면,"}, {"start": 5294.0, "end": 5296.2, "text": "여러분을 위해 핵심만 쏙쏙 정리해 드리겠습니다,"}, {"start": 5296.4, "end": 5299.0, "text": "독일 여러분!"}, {"start": 5300.2, "end": 5302.8, "text": "이것은 세상이 지금 어떻게,"}, {"start": 5303.0, "end": 5305.2, "text": "새로운 인프라를 구축하고 있는가에 관한 이야기입니다."}, {"start": 5305.4, "end": 5308.0, "text": "처음에는 발전소가 에너지 규모를 키웠고,"}, {"start": 5308.2, "end": 5311.2, "text": "그다음엔 데이터센터가 등장해 메일 알림을 울렸죠."}, {"start": 5311.5, "end": 5314.0, "text": "이제 우리는 석탄을 와트(전력)로 바꾸던 터빈의 시대를 훌쩍 넘어,"}, {"start": 5314.2, "end": 5317.0, "text": "모래(실리콘)를 사고(지능)로 바꾸는 AI 팩토리의 시대에 살고 있습니다."}, {"start": 5317.2, "end": 5319.5, "text": "석유도 비켜나고 S&P 지수도 비켜나세요,"}, {"start": 5319.7, "end": 5322.2, "text": "훨씬 더 투자할 가치가 높은 것이 있습니다, 바로 GPU죠!"}, {"start": 5322.5, "end": 5325.2, "text": "자산처럼 일하며 수익을 창출하고,"}, {"start": 5325.4, "end": 5328.0, "text": "생긴 건 칩 같지만 현금인출기처럼 작동하죠."}, {"start": 5328.2, "end": 5330.5, "text": "여러분이 쉬는 동안에도 매출을 만들어내니,"}, {"start": 5330.7, "end": 5334.0, "text": "현금 흐름이 이 색소폰 연주보다도 더 부드럽게 흘러갑니다!"}, {"start": 5347.8, "end": 5350.5, "text": "에이전트는 코딩을 하고 결정을 내리죠,"}, {"start": 5350.7, "end": 5353.5, "text": "자유를 주되 그들의 임무는 확실히 통제하세요."}, {"start": 5353.8, "end": 5356.2, "text": "베라 위의 오픈쉘이 목록을 꼼꼼히 확인하니,"}, {"start": 5356.4, "end": 5358.8, "text": "인증 정보가 없다면 접근은 즉시 기각됩니다!"}, {"start": 5359.0, "end": 5361.5, "text": "블루필드 위의 센트리는 결코 퇴근하는 법이 없죠,"}, {"start": 5361.7, "end": 5364.2, "text": "데이비드 핫셀호프처럼 든든하게 샌드박스를 지켜냅니다."}, {"start": 5364.5, "end": 5367.0, "text": "우리는 AI를 발전시키되 위험은 엄격히 제한합니다,"}, {"start": 5367.2, "end": 5369.8, "text": "우리는 책임감 있는 낙관주의자니까요!"}, {"start": 5370.0, "end": 5372.8, "text": "RTX 스파크는 에이전트를 안전하고 총명하게 유지하고,"}, {"start": 5373.0, "end": 5375.5, "text": "스팟 요금제는 가격을 딱 알맞게 지켜줍니다."}, {"start": 5375.7, "end": 5378.2, "text": "양자 연산부터 게이밍까지 하나로 모두 해내죠,"}, {"start": 5378.4, "end": 5381.8, "text": "왜냐하면 재미(Fun) 없이는 호환성(Fungible)이라는 단어도 쓸 수 없으니까요!"}, {"start": 5384.5, "end": 5386.5, "text": "AI는 이제 신체를 얻어 법칙을 배우고 있습니다,"}, {"start": 5386.7, "end": 5389.5, "text": "중력과 마찰력을 익히고 실제 도구를 사용하죠."}, {"start": 5389.7, "end": 5392.0, "text": "아이작 랩과 코스모스로 스스로 훈련하니,"}, {"start": 5392.2, "end": 5395.0, "text": "학자금 대출 없는 로봇 전용 대학교나 다름없습니다!"}, {"start": 5395.2, "end": 5397.8, "text": "DSX 파드는 AI를 완벽한 싱크로 맞춰주고,"}, {"start": 5398.0, "end": 5400.8, "text": "더 적은 전력으로 더 뛰어난 두뇌를 구현하는 생각하는 레고 블록 같죠."}, {"start": 5401.0, "end": 5403.8, "text": "cuVS와 네모트론, 그리고 쿠모가 여기에 있으니,"}, {"start": 5404.0, "end": 5406.8, "text": "베를린의 계산원보다도 더 빠르게 지식을 척척 처리해 냅니다!"}, {"start": 5407.0, "end": 5409.5, "text": "유럽의 풀스택, 체크리스트의 모든 준비를 마쳤고,"}, {"start": 5409.7, "end": 5412.2, "text": "AI의 5단 케이크를 아침 식사처럼 거뜬히 해치웁니다."}, {"start": 5412.5, "end": 5415.0, "text": "유럽 생태계가 이제 레이스를 선도하고 있으며,"}, {"start": 5415.2, "end": 5417.8, "text": "오픈소스를 사랑하죠, 허깅페이스에 물어보면 알 수 있습니다!"}, {"start": 5418.0, "end": 5420.2, "text": "유럽 대륙이 비상하고 있으며,"}, {"start": 5420.4, "end": 5423.0, "text": "최고의 순간은 아직 오지 않았습니다!"}, {"start": 5423.5, "end": 5426.0, "text": "자, 유럽의 모든 이들이여,"}, {"start": 5426.2, "end": 5429.5, "text": "하나 되어 함께 노래합시다!"}, {"start": 5434.0, "end": 5435.8, "text": "우리는 유럽입니다!"}, {"start": 5436.0, "end": 5437.5, "text": "우리는 유럽입니다! (독일어: Wir sind Europa!)"}, {"start": 5437.7, "end": 5439.0, "text": "우리는 유럽입니다! (프랑스어: Nous sommes l'Europe!)"}, {"start": 5439.2, "end": 5440.5, "text": "우리는 유럽입니다! (이탈리아어: Siamo l'Europa!)"}, {"start": 5440.7, "end": 5442.0, "text": "우리는 유럽입니다! (스페인어: Somos Europa!)"}, {"start": 5442.2, "end": 5443.5, "text": "우리는 유럽입니다! (폴란드어: Jesteśmy Europą!)"}, {"start": 5443.7, "end": 5444.8, "text": "우리는 유럽입니다! (네덜란드어: Wij zijn Europa!)"} const hasDubAudio=false;
let audioMode='orig'; // 🎬 유튜브 원음이 기본 디폴트!
let dubAudio=document.getElementById('dub-audio'); // 초기 조기 바인딩 ⚡
let dubHudTimeout=null;
let player;
let isMutedState = true;

function showAudioHud(text) {
    const hud = document.getElementById('audio-hud');
    if (!hud) return;
    hud.textContent = text;
    hud.classList.add('show');
    clearTimeout(dubHudTimeout);
    dubHudTimeout = setTimeout(() => {
        hud.classList.remove('show');
    }, 1200);
}

function updateAudioTrackButtonUI() {
    const btn = document.getElementById('audio-track-btn');
    const optOrig = document.getElementById('opt-orig');
    const optDub = document.getElementById('opt-dub');
    if (!btn) return;
    if (audioMode === 'dub') {
        if (optOrig) optOrig.classList.remove('active');
        if (optDub) optDub.classList.add('active');
        btn.title = '🎙️ MP3 더빙 음원 재생 중 (클릭 또는 Alt+A / D: 원음 전환)';
    } else {
        if (optDub) optDub.classList.remove('active');
        if (optOrig) optOrig.classList.add('active');
        btn.title = '🎬 유튜브 원음 재생 중 (클릭 또는 Alt+A / D: 더빙 전환)';
    }
}

function toggleAudioTrack() {
    if (!hasDubAudio || !dubAudio) return;
    audioMode = (audioMode === 'dub' ? 'orig' : 'dub');
    updateAudioTrackButtonUI();

    if (audioMode === 'dub') {
        if (player && typeof player.mute === 'function') {
            try { player.mute(); } catch(e) {}
        }
        dubAudio.muted = false;
        if (player && typeof player.getCurrentTime === 'function') {
            const curT = player.getCurrentTime();
            dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
        }
        if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === 1) {
            dubAudio.play().catch(e => {});
        }
        showAudioHud('🎙️ 더빙 음원으로 전환');
    } else {
        dubAudio.pause();
        dubAudio.muted = true;
        if (player && typeof player.unMute === 'function') {
            try {
                player.unMute();
                player.setVolume(100);
            } catch(e) {}
        }
        showAudioHud('🎬 유튜브 원음으로 전환');
    }
}

function handleUnmute() {
    if (!dubAudio && hasDubAudio) dubAudio = document.getElementById('dub-audio');
    if (hasDubAudio && dubAudio && audioMode === 'dub') {
        dubAudio.muted = false;
        if (player && typeof player.getCurrentTime === 'function') {
            const curT = player.getCurrentTime();
            dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
        }
        if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === 1) {
            dubAudio.play().catch(e => {});
        }
        if (player && typeof player.mute === 'function') {
            try { player.mute(); } catch(e) {}
        }
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
        return;
    }
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    // 🛡️ [F1 키: 브라우저 도움말 팝업 차단]
    if (e.key === 'F1' || e.keyCode === 112) {
        e.preventDefault();
        return;
    }
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // 🎙️ Alt+A 또는 D 키: 원음 ↔ 더빙 음원 토글!
    if ((e.altKey && (e.key === 'a' || e.key === 'A')) || (e.key.toLowerCase() === 'd' && !e.ctrlKey && !e.altKey && !e.metaKey)) {
        if (hasDubAudio) {
            toggleAudioTrack();
            e.preventDefault();
            return;
        }
    }

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) {
            player.pauseVideo();
            if (hasDubAudio && dubAudio) dubAudio.pause();
        } else {
            player.playVideo();
            if (hasDubAudio && dubAudio && audioMode === 'dub') {
                const curT = player.getCurrentTime();
                dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
                dubAudio.play().catch(e => {});
            }
        }
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        const target = Math.max(0, player.getCurrentTime() - 5);
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        const target = player.getCurrentTime() + 5;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        const curV = player.getVolume();
        const nextV = Math.min(100, curV + 5);
        player.setVolume(nextV);
        if (hasDubAudio && dubAudio) dubAudio.volume = nextV / 100;
        showAudioHud('🔊 볼륨 ' + nextV + '%');
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        const curV = player.getVolume();
        const nextV = Math.max(0, curV - 5);
        player.setVolume(nextV);
        if (hasDubAudio && dubAudio) dubAudio.volume = nextV / 100;
        showAudioHud('🔉 볼륨 ' + nextV + '%');
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        if (hasDubAudio && audioMode === 'dub' && dubAudio) {
            dubAudio.muted = !dubAudio.muted;
            showAudioHud(dubAudio.muted ? '🔇 더빙 음소거' : '🔊 더빙 소리 켬');
        } else {
            player.isMuted() ? player.unMute() : player.mute();
        }
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        const target = Math.max(0, player.getCurrentTime() - 10);
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        const target = player.getCurrentTime() + 10;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        const target = player.getDuration() * fraction;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    }
});

        subsEl.classList.remove('ui-hidden');
        if(isUserPositioned) {
            subsEl.style.bottom = Math.min(88, userBottomPercent + 4) + '%';
        } else {
            subsEl.style.bottom = '';
        }
    }
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(topControls) topControls.classList.add('fade-out');
            if(subsEl) {
                subsEl.classList.add('ui-hidden');
                if(isUserPositioned) {
                    subsEl.style.bottom = userBottomPercent + '%';
                } else {
                    subsEl.style.bottom = '';
                }
            }
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function startSyncTimer(intervalMs) {
    if (syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(updateSubs, intervalMs);
}

function onPlayerStateChange(event){
    resetActivity();
    if(event.data == YT.PlayerState.PLAYING){
        // 재생 시작 시 브라우저 정책이 풀렸으면 자동 언뮤트 시도
        if (isMutedState) {
            autoUnmuteOnUserAction();
        }
        if (hasDubAudio && dubAudio && audioMode === 'dub') {
            try { player.mute(); } catch(e) {}
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
            const curTime = player.getCurrentTime();
            const maxT = dubAudio.duration ? Math.min(curTime, dubAudio.duration) : curTime;
            if (Math.abs(dubAudio.currentTime - maxT) > 0.08) {
                dubAudio.currentTime = maxT;
            }
            dubAudio.play().catch(e => {});
        }
        // 재생 중일 때는 100ms 정밀 싱크
        startSyncTimer(100);
    } else {
        if (hasDubAudio && dubAudio && !dubAudio.paused) {
            dubAudio.pause();
        }
        // 일시정지나 버퍼링 중에도 시크바 이동 시 자막 갱신 및 오디오 위치 대기를 위해 250ms로 유지! ⏱️
        startSyncTimer(250);
    }
}

function updateSubs(){
    if (!player || typeof player.getCurrentTime !== 'function') return;
    const t = player.getCurrentTime();

    if (hasDubAudio && dubAudio && audioMode === 'dub') {
        const isPlaying = (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
        // 유튜브 원음 소리가 광고나 외부 조작으로 풀렸을 경우 즉각 차단 🛡️
        if (player.isMuted && !player.isMuted()) {
            try { player.mute(); } catch(e) {}
        }
        // 유튜브 볼륨 슬라이더 조작 시 더빙 볼륨 실시간 연동 🎚️
        if (player.getVolume) {
            const pv = player.getVolume() / 100;
            if (Math.abs(dubAudio.volume - pv) > 0.02) {
                dubAudio.volume = pv;
            }
        }
        // 재생 중일 때 동기화
        if (isPlaying) {
            // 일시정지 상태였다면 자동 재생 ⚡
            if (dubAudio.paused) {
                const maxT = dubAudio.duration ? Math.min(t, dubAudio.duration) : t;
                dubAudio.currentTime = maxT;
                dubAudio.play().catch(e => {});
            }
            // 싱크 드리프트 0.12초 이상 시 미세 보정 ⏱️
            const drift = Math.abs(dubAudio.currentTime - t);
            if (drift > 0.12) {
                const maxT = dubAudio.duration ? Math.min(t, dubAudio.duration) : t;
                dubAudio.currentTime = maxT;
            }
            // 배속 동기화
            if (player.getPlaybackRate && dubAudio.playbackRate !== player.getPlaybackRate()) {
                dubAudio.playbackRate = player.getPlaybackRate();
            }
        } else {
            // 일시정지 중일 때: 시크바 이동에 대비하여 오디오 위치만 조용히 대기 동기화 🎯
            if (dubAudio.duration) {
                const maxT = Math.min(t, dubAudio.duration);
                if (Math.abs(dubAudio.currentTime - maxT) > 0.15) {
                    dubAudio.currentTime = maxT;
                }
            }
        }
    }

    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div>`;
    }
    const subsContainer = document.getElementById('subtitles');
    if(subsContainer && subsContainer.innerHTML !== currentHtml){
        subsContainer.innerHTML = currentHtml;
    }
}

let isDragging=false, startY, currentBottomPx, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

// 자막 더블 클릭 / 더블 탭 시 기본 위치로 초기화 🔄✨
document.addEventListener('dblclick', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        isUserPositioned = false;
        if(subEl) subEl.style.bottom = '';
        resetActivity();
    }
});

function dragStart(e) {
    if(!e.target.closest('#subtitles') && !e.target.classList.contains('sub-line')) return;
    isDragging = true;
    subEl.classList.add('dragging');
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let style = window.getComputedStyle(subEl);
    currentBottomPx = parseFloat(style.bottom) || 0;
    if(e.cancelable) e.preventDefault();
}

function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    let targetBottomPx = currentBottomPx - dy;
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let bottomPercent = Math.max(2, Math.min(85, (targetBottomPx / vh) * 100));
    subEl.style.bottom = bottomPercent + '%';
    if(e.cancelable) e.preventDefault();
}

function dragEnd(e) {
    if(!isDragging) return;
    isDragging = false;
    subEl.classList.remove('dragging');
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let style = window.getComputedStyle(subEl);
    let bottomPx = parseFloat(style.bottom) || 0;
    userBottomPercent = Math.max(2, Math.min(85, (bottomPx / vh) * 100));
    isUserPositioned = true;
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1.5, Math.min(15, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / (initialDist || 1);
        currentFontSize = Math.max(1.5, Math.min(15, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
