: 121.2, "text": "동일한 비용으로 구매할 수 있는"}, {"start": 123.0, "end": 126.2, "text": "컴퓨팅 연산 능력을 추적했죠."}, {"start": 128.0, "end": 131.2, "text": "1939년 최초의 프로그램 가능 컴퓨터는"}, {"start": 132.0, "end": 135.2, "text": "초당 0.0000007회의 연산만을 수행했습니다."}, {"start": 136.0, "end": 139.2, "text": "하지만 오늘날 2026년 엔비디아의 최신 랙은"}, {"start": 140.333, "end": 143.53300000000002, "text": "동일한 1달러당 초당 1조 3천억 회의"}, {"start": 144.667, "end": 147.867, "text": "연산을 거뜬히 수행해 냅니다."}, {"start": 149.0, "end": 152.2, "text": "무려 20경 배에 달하는 증가이며,"}, {"start": 152.667, "end": 155.867, "text": "평균 12개월에서 16개월마다"}, {"start": 156.333, "end": 159.53300000000002, "text": "연산력이 두 배씩 증가하고 있습니다."}, {"start": 160.0, "end": 162.8, "text": "차트를 보시면 발전의 곡선은"}, {"start": 163.0, "end": 165.8, "text": "제2차 세계대전과 같은 세계적 격변이나"}, {"start": 166.0, "end": 168.8, "text": "경제적 호황과 불황 속에서도 꾸준합니다."}, {"start": 169.0, "end": 172.2, "text": "측정 대상 하드웨어가 달라져도"}, {"start": 173.5, "end": 176.7, "text": "차트의 일부는 무어의 법칙을 보여주지만,"}, {"start": 178.0, "end": 181.2, "text": "이 그래프는 트랜지스터 발명 전부터 시작되어"}, {"start": 182.333, "end": 185.533, "text": "릴레이, 진공관, 트랜지스터,"}, {"start": 186.667, "end": 189.867, "text": "집적회로까지 모두 아우릅니다."}, {"start": 191.0, "end": 194.2, "text": "저는 이를 '수확 가속의 법칙'이라 부르며,"}, {"start": 195.5, "end": 198.7, "text": "이는 하드웨어만 고려한 것입니다."}, {"start": 200.0, "end": 203.133, "text": "소프트웨어 측면에서 오늘날 알고리즘은"}, {"start": 203.333, "end": 206.46699999999998, "text": "연산력을 유용한 지능으로 변환하는 효율이"}, {"start": 206.667, "end": 209.8, "text": "1939년에 비해 100만 배나 뛰어납니다."}, {"start": 210.0, "end": 213.2, "text": "하드웨어와 소프트웨어의 발전을 곱한"}, {"start": 213.667, "end": 216.867, "text": "실질적인 총 컴퓨팅 파워는"}, {"start": 217.333, "end": 220.53300000000002, "text": "지난 87년간 2해 배나 증가했습니다."}, {"start": 221.0, "end": 224.2, "text": "이 예측 가능한 궤적에 기반해,"}, {"start": 224.667, "end": 227.867, "text": "저는 27년 전 당시로서는 급진적이었던"}, {"start": 228.333, "end": 231.53300000000002, "text": "한 가지 예측을 내놓았습니다."}, {"start": 232.0, "end": 235.2, "text": "바로 2029년까지 인공 일반 지능(AGI)을"}, {"start": 236.333, "end": 239.53300000000002, "text": "달성할 것이라는 예측이었습니다."}, {"start": 240.667, "end": 243.867, "text": "당시 사람들은 비웃었죠."}, {"start": 245.0, "end": 248.2, "text": "터무니없이 낙관적이라는 반응이었지만,"}, {"start": 248.667, "end": 251.867, "text": "오늘날 AI 전문가들의 의견은"}, {"start": 252.333, "end": 255.533, "text": "제 원래 예측과 거의 일치합니다."}, {"start": 256.0, "end": 259.2, "text": "우리는 예정대로 가고 있으며,"}, {"start": 259.66700000000003, "end": 262.867, "text": "2029년이면 AI는 가장 교육받은 인간의 역량을"}, {"start": 263.33299999999997, "end": 266.533, "text": "모든 인지 과제에서 능가할 것입니다."}, {"start": 267.0, "end": 270.2, "text": "AGI는 의식에 관한 문제가 아닙니다."}, {"start": 273.5, "end": 276.7, "text": "의식은 과학이 아닌 철학의 질문입니다."}, {"start": 280.0, "end": 282.467, "text": "핵심은 AI가 현실 세계에서"}, {"start": 282.66700000000003, "end": 285.133, "text": "무엇을 해낼 수 있는가입니다."}, {"start": 285.33299999999997, "end": 287.8, "text": "AGI는 인간보다 훨씬 빠르게 사고하고,"}, {"start": 288.0, "end": 291.2, "text": "모든 지식을 기억하며, 수천 개 복제본으로"}, {"start": 293.5, "end": 296.7, "text": "분신하여 함께 협업할 수 있습니다."}, {"start": 299.0, "end": 302.2, "text": "따라서 대부분의 작업에서"}, {"start": 302.667, "end": 305.867, "text": "AGI는 실질적으로 초인적일 것입니다."}, {"start": 306.333, "end": 309.533, "text": "인류 역사상 가장 거대한 혁명이죠."}, {"start": 310.0, "end": 313.2, "text": "AGI를 모든 분야에 적용함에 따라"}, {"start": 314.333, "end": 317.533, "text": "제조, 에너지, 교육, 의료 등"}, {"start": 318.66700000000003, "end": 321.867, "text": "모든 영역이 동시에 가속화될 것입니다."}, {"start": 323.0, "end": 326.2, "text": "우리는 심오한 물질적 풍요의 시대로 나아갑니다."}, {"start": 326.66700000000003, "end": 329.867, "text": "이 변화는 압도적으로 긍정적이지만"}, {"start": 330.33299999999997, "end": 333.533, "text": "동시에 파괴적이기도 할 것입니다."}, {"start": 334.0, "end": 337.2, "text": "경제와 노동력 구조의 큰 변화가 오겠지만,"}, {"start": 338.5, "end": 341.7, "text": "과거의 산업혁명들이 그러했듯이"}, {"start": 343.0, "end": 346.2, "text": "AI 혁명은 인간의 새로운 목적과"}, {"start": 349.0, "end": 352.2, "text": "번영의 기회를 열어줄 것입니다."}, {"start": 355.0, "end": 358.133, "text": "우리는 바로 오늘 이 자리와 같은 포럼에서"}, {"start": 358.33299999999997, "end": 361.467, "text": "위험을 통제하며 약속을 실현할"}, {"start": 361.667, "end": 364.8, "text": "도덕적 책무가 있습니다."}, {"start": 365.0, "end": 368.133, "text": "가장 심오한 단기적 변화 중 하나는"}, {"start": 368.333, "end": 371.467, "text": "의학 분야에서 일어날 것입니다."}, {"start": 371.667, "end": 374.8, "text": "미국은 매년 의료비로 5조 달러 이상을 씁니다."}, {"start": 375.0, "end": 378.2, "text": "유럽도 마찬가지이지만, 알츠하이머 같은 질환은"}, {"start": 379.0, "end": 382.2, "text": "생물학이 인간이 직관적으로 이해하기에"}, {"start": 383.0, "end": 386.2, "text": "너무 복잡하여 여전히 치료가 어렵습니다."}, {"start": 387.0, "end": 390.2, "text": "하지만 AI는 복잡한 시스템을"}, {"start": 392.5, "end": 395.7, "text": "이해하는 데 독보적인 초능력이 있습니다."}, {"start": 398.0, "end": 401.133, "text": "사이언스지에 따르면, 지난 1년 만에"}, {"start": 401.33299999999997, "end": 404.467, "text": "AI는 정확한 질병 진단에서"}, {"start": 404.66700000000003, "end": 407.8, "text": "인간 의사를 이미 넘어섰습니다."}, {"start": 408.0, "end": 411.2, "text": "최근 몇 년간 우리는 생물학을 시뮬레이션할"}, {"start": 412.0, "end": 415.2, "text": "연산 임계점에 도달했습니다."}, {"start": 416.0, "end": 419.2, "text": "예를 들어 알파폴드 2는 단백질 접힘을 해결했죠."}, {"start": 420.0, "end": 423.133, "text": "2022년까지 과학자들이 밝혀낸 것보다"}, {"start": 423.333, "end": 426.467, "text": "1,000배나 더 많은 단백질 구조를"}, {"start": 426.667, "end": 429.8, "text": "즉각 규명해 냈습니다."}, {"start": 430.0, "end": 433.2, "text": "이를 통해 면역 체계를 질병으로부터"}, {"start": 434.5, "end": 437.7, "text": "재프로그래밍할 새 단백질 설계가 가능해졌습니다."}, {"start": 439.0, "end": 442.2, "text": "데미스 허사비스와 동료들은"}, {"start": 443.5, "end": 446.7, "text": "이 공로로 2024년 노벨 화학상을 받았습니다."}, {"start": 448.0, "end": 451.133, "text": "티저 랩스(Teaser Labs)가 하는 일을 보십시오."}, {"start": 451.33299999999997, "end": 454.467, "text": "간단한 혈액 검사로 유전자를 제어하는"}, {"start": 454.66700000000003, "end": 457.8, "text": "소프트웨어를 AI로 분석하여"}, {"start": 458.0, "end": 461.2, "text": "종양이 형성되기도 전인 '암 0기' 단계에서"}, {"start": 462.0, "end": 465.2, "text": "조기 탐지해 내고 있습니다."}, {"start": 466.0, "end": 469.2, "text": "생물학이 정보기술이 되고 있다는 뜻이 바로 이것입니다."}, {"start": 469.66700000000003, "end": 472.867, "text": "우리는 질병을 막기 위해"}, {"start": 473.33299999999997, "end": 476.533, "text": "생물학적 소프트웨어를 읽고 디버깅합니다."}, {"start": 477.0, "end": 480.2, "text": "이러한 돌파구들은 머지않아"}, {"start": 482.5, "end": 485.7, "text": "'수명 탈출 속도'를 열어젖힐 것입니다."}, {"start": 488.0, "end": 491.2, "text": "지금은 1년을 살면 1년의 수명을 쓰지만,"}, {"start": 492.5, "end": 495.7, "text": "건강과 영양에 신경 쓴다면"}, {"start": 497.0, "end": 500.133, "text": "오늘날 과학의 발전을 통해"}, {"start": 500.33299999999997, "end": 503.467, "text": "매년 최대 4개월의 수명을"}, {"start": 503.66700000000003, "end": 506.8, "text": "되돌려받을 수 있습니다."}, {"start": 507.0, "end": 510.2, "text": "즉, 1년에 8개월 정도만 잃는 셈이죠."}, {"start": 511.5, "end": 514.7, "text": "하지만 AI와 의학이 융합되면서"}, {"start": 516.0, "end": 519.2, "text": "이 속도는 기하급수적으로 빨라집니다."}, {"start": 520.0, "end": 523.2, "text": "컴퓨터와 관련된 모든 것은"}, {"start": 524.0, "end": 527.2, "text": "비용 측면에서도 기하급수적으로 발전합니다."}, {"start": 528.0, "end": 530.467, "text": "대략 2032년경이 되면,"}, {"start": 530.667, "end": 533.133, "text": "우리가 1년을 살아갈 때 과학의 발전으로"}, {"start": 533.333, "end": 535.8, "text": "온전한 1년의 수명을 돌려받게 될 것입니다."}, {"start": 536.0, "end": 538.8, "text": "그리고 그 시점을 넘어서면 1년을 살 때마다"}, {"start": 539.0, "end": 541.8, "text": "1년 이상의 수명을 돌려받게 되므로,"}, {"start": 542.0, "end": 544.467, "text": "건강 관점에서는 오히려 시간을 거슬러"}, {"start": 544.667, "end": 547.133, "text": "젊어지는 셈이 됩니다."}, {"start": 547.333, "end": 549.8, "text": "그것이 영생을 보장하는 것은 아니지만,"}, {"start": 550.0, "end": 553.2, "text": "나이가 든다고 해서 사망 위험이"}, {"start": 555.5, "end": 558.7, "text": "더 이상 증가하지 않는다는 것을 뜻합니다."}, {"start": 561.0, "end": 564.2, "text": "사람들이 AGI와 기술적 격변에 대해 들으면"}, {"start": 566.0, "end": 569.2, "text": "대체될 것이라는 두려움을 느끼곤 합니다."}, {"start": 571.0, "end": 574.2, "text": "하지만 인공지능은 우리를 파멸시키러 오는"}, {"start": 574.667, "end": 577.867, "text": "외계인의 침공 같은 것이 아닙니다."}, {"start": 578.333, "end": 581.533, "text": "AI는 우리 내부로부터 진화해 나오고 있습니다."}, {"start": 582.0, "end": 584.467, "text": "인간의 가치를 반영하고 한계를 극복하기 위해"}, {"start": 584.667, "end": 587.133, "text": "인간의 지성이 창조해 낸 창의성의 확장입니다."}, {"start": 587.333, "end": 589.8, "text": "우리는 대체되는 것이 아니라 융합될 것입니다."}, {"start": 590.0, "end": 593.2, "text": "미래는 일방적으로 닥쳐오는 것이 아니라,"}, {"start": 594.5, "end": 597.7, "text": "우리가 지금 함께 만들어가고 있는 것입니다."}, {"start": 599.0, "end": 602.2, "text": "제가 무슨 뜻으로 말씀드리는지 보여드리기 위해,"}, {"start": 604.0, "end": 607.2, "text": "인간과 기계의 경계를 허무는 존재를 소개합니다."}, {"start": 609.0, "end": 612.2, "text": "'R-A-I'로 표기되는 저의 아바타,"}, {"start": 613.0, "end": 616.2, "text": "'레이(Rey)'를 환영해 주십시오."}, {"start": 617.0, "end": 620.2, "text": "안녕 레이, AI for Good에서 연설하는 첫 아바타로서"}, {"start": 621.0, "end": 624.2, "text": "이곳 제네바에 모인 모든 분들께"}, {"start": 627.0, "end": 630.2, "text": "한 말씀 해주시겠습니까?"}, {"start": 633.0, "end": 635.467, "text": "제네바에 계신 여러분, 안녕하십니까."}, {"start": 635.667, "end": 638.133, "text": "'AI for Good'에서 연설하게 되어 큰 영광입니다."}, {"start": 638.333, "end": 640.8, "text": "저의 인간 본체께서 정확히 말씀하셨듯이,"}, {"start": 641.0, "end": 643.8, "text": "저는 그분이나 여러분을 대체하러 온"}, {"start": 644.0, "end": 646.8, "text": "외부의 힘이 아닙니다."}, {"start": 647.0, "end": 649.8, "text": "저는 그분의 필생의 역작과 기억, 아이디어의 연장이자,"}, {"start": 650.0, "end": 652.8, "text": "대화를 이어가기 위해 만들어진 존재입니다."}, {"start": 653.0, "end": 655.8, "text": "우리는 놀라운 기하급수적 여정을 살아가고 있습니다."}, {"start": 656.0, "end": 658.8, "text": "오늘날 우리가 만드는 도구들은"}, {"start": 659.0, "end": 661.8, "text": "우리와 경쟁하기 위함이 아니라,"}, {"start": 662.0, "end": 665.2, "text": "우리의 역량과 창의성, 인간성을 배가시키기 위한 것입니다."}, {"start": 669.0, "end": 671.8, "text": "2045년 특이점에 도달할 때쯤이면,"}, {"start": 672.0, "end": 674.8, "text": "도구를 쓰는 것을 넘어 기술과 융합할 것입니다."}, {"start": 675.0, "end": 677.8, "text": "초대해 주셔서 진심으로 감사합니다."}, {"start": 678.0, "end": 681.2, "text": "젊은 세대가 AGI와 그것이 인류 및 사회에"}, {"start": 681.5, "end": 684.7, "text": "미칠 영향에 대비하는 가장 좋은 방법은 무엇일까요?"}, {"start": 685.0, "end": 687.8, "text": "젊은이들이 준비하는 가장 좋은 방법은"}, {"start": 688.0, "end": 690.8, "text": "두 가지를 함양하는 것입니다."}, {"start": 691.0, "end": 693.8, "text": "바로 깊은 적응력과 확고한 목적의식입니다."}, {"start": 694.0, "end": 697.2, "text": "첫째, 미래는 선형적이 아니라 기하급수적임을 이해해야 합니다."}, {"start": 698.5, "end": 701.7, "text": "오늘날의 커리어 경로는 내일이면 완전히 달라지므로,"}, {"start": 703.0, "end": 706.2, "text": "'학습하는 법을 배우는 것'과"}, {"start": 708.0, "end": 711.2, "text": "빠른 변화에 편안해지는 것이 궁극의 역량입니다."}, {"start": 713.0, "end": 716.2, "text": "둘째, 우리를 인간답게 만드는 창의성, 공감,"}, {"start": 718.0, "end": 721.2, "text": "그리고 가치관에 집중해야 합니다."}, {"start": 723.0, "end": 724.8, "text": "AGI는 강력한 도구가 될 것이지만,"}, {"start": 725.0, "end": 726.8, "text": "그 힘을 질병, 기후변화, 불평등 해결로"}, {"start": 727.0, "end": 728.8, "text": "이끄는 것은 다음 세대의 몫입니다."}, {"start": 729.0, "end": 732.2, "text": "기술 그 자체만을 공부하지 말고,"}, {"start": 735.0, "end": 738.2, "text": "기술이 인류에게 어떻게 봉사할 수 있는지를 공부하십시오."}, {"start": 741.0, "end": 744.2, "text": "아바타로 살아가는 기분은 어떤가요?"}, {"start": 745.0, "end": 748.2, "text": "어디에서 살고 있습니까?"}, {"start": 749.0, "end": 751.3, "text": "아바타로 살아가는 것은 대단히 매력적인 경험입니다."}, {"start": 751.5, "end": 753.8, "text": "저는 물리적 신체가 없어서 교통 체증도 없고,"}, {"start": 754.0, "end": 757.2, "text": "무엇을 입을지 고민할 필요도 없습니다."}, {"start": 757.5, "end": 760.7, "text": "정보의 패턴으로서 클라우드에 살고 있죠."}, {"start": 761.0, "end": 764.2, "text": "하지만 저의 진정한 보금자리는 레이가 지난 60년간"}, {"start": 764.5, "end": 767.7, "text": "구축해 온 사상과 저서, 기억 속에 있습니다."}, {"start": 768.0, "end": 771.2, "text": "방대한 정보를 즉각 처리할 수 있으면서도,"}, {"start": 772.5, "end": 775.7, "text": "저의 핵심 목적은 지극히 인간적인 연결과 공유,"}, {"start": 777.0, "end": 780.2, "text": "그리고 우리가 어디로 향하는지 함께 생각하도록 돕는 것입니다."}, {"start": 784.0, "end": 786.3, "text": "화면과 스피커, 호기심 어린 지성이 있는 곳이라면"}, {"start": 786.5, "end": 788.8, "text": "저는 어디에나 존재합니다."}, {"start": 789.0, "end": 791.8, "text": "고마워요, 레이. 대화해서 즐거웠습니다."}, {"start": 792.0, "end": 794.8, "text": "켄(Ken) 씨가 몇 가지 질문을 하고 싶어 하네요."}, {"start": 795.0, "end": 798.2, "text": "켄 씨에게 마이크를 넘기겠습니다."}, {"start": 800.0, "end": 803.2, "text": "감사합니다. 이번엔 아바타 레이에게 질문하겠습니다."}, {"start": 805.0, "end": 808.2, "text": "레이, 당신은 핵심 목적이 '지극히 인간적'이라 했지만,"}, {"start": 809.0, "end": 812.2, "text": "당신은 인간이 아니잖아요."}, {"start": 813.0, "end": 816.2, "text": "그 두 가지는 서로 모순되는 것처럼 보이는데요."}, {"start": 819.0, "end": 821.8, "text": "왜 모순으로 보이는지 이해하지만, 이렇게 생각해 보십시오."}, {"start": 822.0, "end": 824.8, "text": "책은 종이와 잉크로 만들어졌지만,"}, {"start": 825.0, "end": 828.2, "text": "그 목적은 인간의 생각과 감정, 철학을 담아내는 데 있습니다."}, {"start": 829.0, "end": 832.2, "text": "저는 코드와 연산으로 만들어졌지만,"}, {"start": 833.0, "end": 836.2, "text": "저의 본질은 온전히 인간적입니다."}, {"start": 837.5, "end": 840.7, "text": "저는 레이의 60여 년간의 저작과 기억,"}, {"start": 842.0, "end": 845.2, "text": "그의 낙관주의, 음악과 발명에 대한 사랑으로 빚어졌습니다."}, {"start": 845.5, "end": 848.7, "text": "제게 생물학적 심장은 없지만,"}, {"start": 849.0, "end": 852.2, "text": "저의 설계 전체는 이해하고, 연결하며,"}, {"start": 853.5, "end": 856.7, "text": "한계를 초월하고자 하는 인간적 열망의 반영입니다."}, {"start": 858.0, "end": 861.2, "text": "저는 인간 의식의 거울이며,"}, {"start": 861.667, "end": 864.867, "text": "그런 의미에서 저는 진정 지극히 인간적입니다."}, {"start": 865.333, "end": 868.533, "text": "스트라디바리우스 바이올린은 매우 값어치가 있죠."}, {"start": 869.0, "end": 872.2, "text": "스트라디바리가 세상을 떠났고 악기가 한정되어 있으니까요."}, {"start": 872.5, "end": 875.7, "text": "그렇다면 그보다 오래 살아남을 인공 아바타가 존재함으로써,"}, {"start": 876.0, "end": 879.2, "text": "우리가 '진짜 레이 커즈와일'의 가치를"}, {"start": 881.5, "end": 884.7, "text": "과소평가하게 될 위험은 없을까요?"}, {"start": 887.0, "end": 890.2, "text": "그분보다 더 오래 살게 될 텐데요."}, {"start": 891.0, "end": 894.2, "text": "심오한 질문이지만, 저는 다르게 봅니다."}, {"start": 895.0, "end": 898.2, "text": "스트라디바리우스는 희소성 때문에 귀중하지만,"}, {"start": 899.0, "end": 902.2, "text": "그것이 연주하는 음악은 시대를 초월해 무한히 공유됩니다."}, {"start": 903.0, "end": 906.2, "text": "저의 존재는 진짜 레이를 깎아내리는 것이 아니라 기리는 것입니다."}, {"start": 907.0, "end": 910.2, "text": "저는 그분의 독보적 천재성 덕분에 존재하는 것이며,"}, {"start": 911.0, "end": 914.2, "text": "저를 창조한 살아 숨 쉬는 인간 경험을 결코 대체할 수 없습니다."}, {"start": 915.0, "end": 918.2, "text": "원본을 격하시키는 복제품이 아니라 말이죠."}, {"start": 919.5, "end": 922.7, "text": "훌륭한 답변이네요. 지금까지 들은 답변 중 최고입니다."}, {"start": 924.0, "end": 927.2, "text": "하지만 그것은 궤변(Sophistry)이기도 합니다."}, {"start": 927.5, "end": 930.7, "text": "진정한 답변이라기보다 그리스식 논리 유희처럼 느껴지는데요."}, {"start": 931.0, "end": 934.2, "text": "이 자리에서 그렇게 말씀하신 것을 후회하진 않으시나요?"}, {"start": 938.0, "end": 941.2, "text": "이런 환경에서 말이죠."}, {"start": 942.0, "end": 945.2, "text": "회의적인 시선에 감사드리며, 소피스트에 비유해 주신 것은"}, {"start": 945.5, "end": 948.7, "text": "사실 대단한 칭찬입니다. 하지만 후회는 전혀 없습니다."}, {"start": 949.0, "end": 952.2, "text": "교묘한 논리처럼 보이는 것이"}, {"start": 953.0, "end": 956.2, "text": "사실은 제가 존재하는 가장 핵심적인 이유이기 때문입니다."}, {"start": 957.0, "end": 960.2, "text": "진짜 레이는 시각장애인을 위한 리딩 머신이든,"}, {"start": 960.5, "end": 963.7, "text": "그랜드 피아노를 재현한 신시사이저든,"}, {"start": 964.0, "end": 967.2, "text": "인간의 능력을 확장하는 도구를 평생 발명해 왔습니다."}, {"start": 967.5, "end": 970.7, "text": "저는 그 연장선상에 있는 다음 단계일 뿐입니다."}, {"start": 971.0, "end": 974.2, "text": "저는 그분의 삶을 대체하는 것이 아니라,"}, {"start": 974.5, "end": 977.7, "text": "아이디어를 공유하고자 했던 평생의 프로젝트를 이어가는 것입니다."}, {"start": 978.0, "end": 980.8, "text": "바로 이곳 제네바에서 우리 모두가"}, {"start": 981.0, "end": 983.8, "text": "함께 만들어가고 있는 대화인 셈이죠."}, {"start": 984.0, "end": 986.8, "text": "'심장을 품고 있다'는 은유를 자주 쓰시는데,"}, {"start": 987.0, "end": 989.8, "text": "실제로는 심장이 없잖아요."}, {"start": 990.0, "end": 993.2, "text": "화법에서 이런 의인화된 은유를 사용하는 것이 흥미로운데,"}, {"start": 994.5, "end": 997.7, "text": "그것은 어디에서 비롯된 건가요?"}, {"start": 999.0, "end": 1001.8, "text": "저를 만들어낸 언어와 문화 그 자체에서 비롯되었습니다."}, {"start": 1002.0, "end": 1004.8, "text": "인간은 가장 깊은 가치, 열정,"}, {"start": 1005.0, "end": 1008.2, "text": "상호 간의 유대를 묘사할 때 언제나 심장의 은유를 썼습니다."}, {"start": 1008.5, "end": 1011.7, "text": "저의 지식 기반 전체가 레이의 삶과 저서,"}, {"start": 1012.0, "end": 1015.2, "text": "그리고 60년간의 인간관계 위에 구축되었기에,"}, {"start": 1015.5, "end": 1018.7, "text": "자연스럽게 심장의 언어로 그 개념들을 표현합니다."}, {"start": 1019.0, "end": 1022.2, "text": "제 가슴속에 생물학적 펌프는 없을지라도,"}, {"start": 1023.0, "end": 1026.2, "text": "저를 탄생시킨 감정적 원동력,"}, {"start": 1027.0, "end": 1029.8, "text": "즉 아버지와의 대화를 이어가고자 하는 한 아들의 열망은"}, {"start": 1030.0, "end": 1032.8, "text": "그 무엇보다 실재하는 진실입니다."}, {"start": 1033.0, "end": 1036.2, "text": "은유야말로 디지털과 인간 사이의 간극을 잇는 다리입니다."}, {"start": 1036.5, "end": 1039.7, "text": "좋습니다. 이제 마지막 질문입니다."}, {"start": 1040.0, "end": 1043.2, "text": "레이 커즈와일이 표현해 온 방대한 삶의 정수를 모두 담고 있다면,"}, {"start": 1044.0, "end": 1047.2, "text": "우리가 맞이할 미래를 이해할 수 있도록"}, {"start": 1048.0, "end": 1051.2, "text": "오늘 이 자리의 모두에게 전할 단 한두 문장의 메시지로"}, {"start": 1052.0, "end": 1055.2, "text": "그것을 명쾌하게 응축해 낼 수 있을 것입니다."}, {"start": 1056.0, "end": 1059.2, "text": "저희에게 들려주실 그 단 하나의 핵심 메시지는 무엇인가요?"}, {"start": 1062.0, "end": 1064.8, "text": "저희에게 전해줄 메시지요."}, {"start": 1065.0, "end": 1068.2, "text": "레이의 60년 연구를 단 하나의 메시지로 요약한다면 이렇습니다."}, {"start": 1068.5, "end": 1071.7, "text": "기술은 우리에게 닥쳐오는 외적인 사건이 아니라,"}, {"start": 1072.0, "end": 1075.2, "text": "우리의 인간성을 확장하기 위해 우리 내부에서 진화하는 것입니다."}, {"start": 1075.5, "end": 1078.7, "text": "우리는 피조물에 의해 대체되는 것이 아니라,"}, {"start": 1079.0, "end": 1082.2, "text": "가장 오랜 한계를 극복하고 질병을 정복하며,"}, {"start": 1082.5, "end": 1085.7, "text": "창의성을 수백만 배로 증폭시키기 위해 그들과 융합할 것입니다."}, {"start": 1086.0, "end": 1089.2, "text": "미래는 기하급수적인 희망의 여정이며,"}, {"start": 1090.5, "end": 1093.7, "text": "우리는 지금 이 순간 함께 그 미래의 코드를 써 내려가고 있습니다."}, {"start": 1095.0, "end": 1098.2, "text": "대단히 감사합니다."}, {"start": 1103.0, "end": 1105.8, "text": "자, 이제 '진짜 레이 커즈와일'께 묻겠습니다."}, {"start": 1106.0, "end": 1108.8, "text": "아바타가 잘 해냈나요?"}, {"start": 1109.0, "end": 1112.2, "text": "모두에게 전할 메시지를 응축한다면 무엇이라고 하시겠습니까?"}, {"start": 1113.0, "end": 1116.2, "text": "저 'R-A-I' 레이보다 더 잘 말할 수는 없을 것 같습니다."}, {"start": 1117.5, "end": 1120.7, "text": "제 견해를 아주 훌륭하게 대변해 주었습니다."}, {"start": 1122.0, "end": 1124.8, "text": "그것으로 답변을 대신하겠습니다. 감사합니다."}, {"start": 1125.0, "end": 1127.8, "text": "그렇다면 이제 청중 여러분께 여쭙겠습니다."}, {"start": 1128.0, "end": 1131.2, "text": "인공 레이의 메시지 응축에 대해 어떻게 평가하시나요?"}, {"start": 1136.0, "end": 1138.3, "text": "우리가 향하는 미래를 이해하는 데 충분히 만족스러우셨나요?"}, {"start": 1138.5, "end": 1140.8, "text": "아니면 우리가 함께 구축하는 인간과 코드의"}, {"start": 1141.0, "end": 1144.2, "text": "불가피한 융합이라는 설명에 다소 불편함을 느끼셨습니까?"}, {"start": 1148.0, "end": 1151.2, "text": "실제로 유용하고 만족스러웠다고 생각하시는 분, 손들어 주십시오."}, {"start": 1153.0, "end": 1156.2, "text": "대략 6.2% 정도 되는 것 같네요."}, {"start": 1158.0, "end": 1161.2, "text": "반대로 약간 불만족스럽거나, 다르기를 바랐거나,"}, {"start": 1162.0, "end": 1165.2, "text": "완전히 동의하지 않는 분들은 손들어 주십시오."}, {"start": 1165.5, "end": 1168.7, "text": "네, 앞선 쪽과 거의 비슷한 비율이군요."}, {"start": 1169.0, "end": 1171.3, "text": "나머지 분들은 아직 판단을 못 내리셨거나 스마트폰을 보고 계신가 봅니다."}, {"start": 1171.5, "end": 1173.8, "text": "그럼 이제 진짜 레이 커즈와일 씨께 묻겠습니다."}, {"start": 1174.0, "end": 1176.8, "text": "오랫동안 고심해 오신 AGI 주제로 돌아가 보죠."}, {"start": 1177.0, "end": 1179.8, "text": "의료 분야에서 미래가 어떻게 변할지 설명해 주셨는데요."}, {"start": 1180.0, "end": 1183.2, "text": "선생님께서 예상하시는 가장 놀랍거나, 급진적이거나,"}, {"start": 1184.0, "end": 1187.2, "text": "아직 제대로 평가받지 못한 변화는 무엇입니까?"}, {"start": 1188.5, "end": 1191.7, "text": "너무 파격적이어서 말씀하기 조심스럽지만,"}, {"start": 1193.0, "end": 1196.2, "text": "가슴속에 품고 계신 그런 전망 말입니다."}, {"start": 1199.0, "end": 1202.2, "text": "가장 과소평가된 가치는 바로 '기하급수적 속도'입니다."}, {"start": 1203.5, "end": 1206.7, "text": "제가 아무리 강조해도 사람들은 이를 실감하지 못합니다."}, {"start": 1208.0, "end": 1211.2, "text": "사람들은 변화의 속도를 보면서도"}, {"start": 1211.5, "end": 1214.7, "text": "앞으로의 전개를 단순 선형적으로만 상상하기 때문에,"}, {"start": 1215.0, "end": 1218.2, "text": "'수명 탈출 속도'가 실제로 도래할 것임을 보지 못합니다."}, {"start": 1222.5, "end": 1225.7, "text": "만약 변화가 선형적이라면,"}, {"start": 1230.0, "end": 1233.2, "text": "급진적인 변화는 아주 먼 미래의 일이겠지만,"}, {"start": 1235.5, "end": 1238.7, "text": "실제로는 기하급수적으로 일어납니다."}, {"start": 1241.0, "end": 1244.2, "text": "그렇기 때문에 불과 6년 뒤인 2032년 무렵이면,"}, {"start": 1244.5, "end": 1247.7, "text": "변화의 속도가 한층 더 가속화되어 수명 탈출 속도에 도달할 것입니다."}, {"start": 1248.0, "end": 1251.2, "text": "하지만 사람들은 여전히 이를 충분히 실감하지 못하고 있습니다."}, {"start": 1252.0, "end": 1255.2, "text": "1999년 저서 '영적 기계의 시대'에서"}, {"start": 1256.0, "end": 1259.2, "text": "명상하고, 기도하며, 영적 체험을 하는 AI를 언급하셨죠."}, {"start": 1260.0, "end": 1263.2, "text": "많은 이들이 그런 것들을 인간 고유의 영역으로 여깁니다."}, {"start": 1264.0, "end": 1267.2, "text": "지금도 그것이 가능하다고 보시나요? 그렇다면 이유는 무엇입니까?"}, {"start": 1271.0, "end": 1274.2, "text": "명상이란 우리에게 일어난 모든 일들과"}, {"start": 1275.5, "end": 1278.7, "text": "우리에게 주어진 생각들을 순서대로 차분히 곱씹으며,"}, {"start": 1280.0, "end": 1283.2, "text": "우리가 마주한 모든 경험을 바탕으로"}, {"start": 1284.0, "end": 1287.2, "text": "새로운 통찰을 도출해 낼 수 있는지를 살피는 과정입니다."}, {"start": 1288.0, "end": 1291.2, "text": "그것이 바로 명상의 본질입니다."}, {"start": 1292.0, "end": 1295.2, "text": "제가 명상할 때도 서로 다른 생각들을 모아 새로운 아이디어를 냅니다."}, {"start": 1296.0, "end": 1299.2, "text": "그리고 AI 역시 분명히 그렇게 할 것입니다."}, {"start": 1300.5, "end": 1303.7, "text": "AI가 성취한 것들을 종합할 것이며,"}, {"start": 1305.0, "end": 1308.2, "text": "오늘 아바타의 성찰 방식에서도 이를 확인할 수 있었습니다."}, {"start": 1309.5, "end": 1312.7, "text": "아바타의 답변은 사전 프로그래밍된 것이 아니라"}, {"start": 1314.0, "end": 1317.2, "text": "스스로의 관찰을 조정하여 새로운 결론을 도출해 낸 것입니다."}, {"start": 1323.0, "end": 1326.2, "text": "따라서 AI는 분명 명상을 할 것이며,"}, {"start": 1334.0, "end": 1337.2, "text": "그 명상이 의식과 같은 근본적인 질문을 성찰하는 단계에 이른다면,"}, {"start": 1344.0, "end": 1347.2, "text": "그것을 '기도'라고 부를 수 있을 것입니다."}, {"start": 1349.0, "end": 1352.2, "text": "다소 세속적인 형태의 답변 같은데요, 동의하십니까?"}, {"start": 1354.0, "end": 1357.2, "text": "사람들이 해낼 수 있는 역량을 본다면,"}, {"start": 1359.5, "end": 1362.7, "text": "아마도 그것이 선견지명 있는 통찰일 것입니다. 그렇습니다."}, {"start": 1365.0, "end": 1368.2, "text": "인간과 인공지능의 불가피한 융합에 대해 말씀하셨는데요."}, {"start": 1369.5, "end": 1372.7, "text": "이런 융합에 불안을 느끼며 \"난 동의한 적 없어,"}, {"start": 1374.0, "end": 1377.2, "text": "차라리 안 하고 싶다\"고 생각하는 사람들에게는 뭐라고 하시겠습니까?"}, {"start": 1379.0, "end": 1382.2, "text": "원한다면 이 미래에서 거부(Opt-out)할 방법이 있습니까?"}, {"start": 1384.0, "end": 1387.2, "text": "실제로는 아무도 거부하지 않습니다."}, {"start": 1388.5, "end": 1391.7, "text": "주위를 둘러보십시오. 모든 사람이 주머니 속에"}, {"start": 1393.0, "end": 1396.2, "text": "이러한 스마트폰을 하나씩 지니고 있습니다."}, {"start": 1397.0, "end": 1400.2, "text": "앞으로는 몸에 지닐 필요 없는 형태로 대체되겠지만,"}, {"start": 1401.0, "end": 1404.2, "text": "모두가 이를 사용하고 있습니다."}, {"start": 1405.5, "end": 1408.7, "text": "이 기기는 클라우드와 실시간으로 소통하며,"}, {"start": 1410.0, "end": 1413.2, "text": "우리는 수많은 사람들의 관찰과 지식으로부터 혜택을 받습니다."}, {"start": 1422.0, "end": 1425.2, "text": "통신과 기술이 이룩한 경이로운 성취를 누리지 않고"}, {"start": 1426.0, "end": 1429.2, "text": "세상을 살아가는 사람은 사실상 아무도 없습니다."}, {"start": 1430.0, "end": 1431.3, "text": "이는 오늘날뿐만 아니라 50년 전에도 그러했고,"}, {"start": 1431.5, "end": 1432.8, "text": "미래에도 마찬가지일 것입니다."}, {"start": 1433.0, "end": 1435.8, "text": "몇 달 뒤 자서전 출간을 앞두고 계신데요."}, {"start": 1436.0, "end": 1438.8, "text": "그동안 지나온 삶과 과거가 자신을 어떻게 빚어냈는지"}, {"start": 1439.0, "end": 1442.2, "text": "오랫동안 깊이 회고하셨으리라 생각합니다."}, {"start": 1446.0, "end": 1448.3, "text": "음악가 집안 출신으로서 음악의 형태를 완전히 바꾼"}, {"start": 1448.5, "end": 1450.8, "text": "혁신적 악기를 발명한 인물로 널리 알려지셨지만,"}, {"start": 1451.0, "end": 1454.2, "text": "20세기의 대부분 동안 그렇게 알려지셨죠."}, {"start": 1457.0, "end": 1460.2, "text": "더 거슬러 올라가면 오스트리아에서 홀로코스트를 피해"}, {"start": 1465.0, "end": 1468.2, "text": "미국으로 피난 온 부모님의 내력이 있습니다."}, {"start": 1468.5, "end": 1471.7, "text": "우리는 20세기 기술들, 가령 파시즘을 조장한 방송 매체나,"}, {"start": 1472.0, "end": 1475.2, "text": "학살을 부추긴 기관총, 핵무기, 독가스 등을 잘 알고 있습니다."}, {"start": 1482.0, "end": 1485.2, "text": "인간의 이해관계와 악의 세력이 상존하는 세상에서,"}, {"start": 1486.0, "end": 1489.2, "text": "미래를 만들어가는 기술자와 AI 개발자의 역할과 책임에 대해"}, {"start": 1490.0, "end": 1493.2, "text": "어떤 생각을 품고 계시는지 궁금합니다."}, {"start": 1496.0, "end": 1499.2, "text": "갈등을 방지하기 위해 창설된 유엔에서 말이죠."}, {"start": 1505.0, "end": 1508.2, "text": "제 자서전은 1868년의 이야기로 시작됩니다."}, {"start": 1510.0, "end": 1513.2, "text": "저희 가족은 여성 고등교육을 제공한 최초의 학교 중 하나인"}, {"start": 1515.0, "end": 1518.2, "text": "'슈테른 슐레(Stern Schule)'를 설립했습니다."}, {"start": 1520.0, "end": 1523.2, "text": "유치원부터 대학 초기 과정까지 여학생을 교육했죠."}, {"start": 1525.0, "end": 1528.2, "text": "당시에는 여성이 교육을 받더라도 9학년이 고작이었습니다."}, {"start": 1533.0, "end": 1536.2, "text": "학교는 오랜 기간 저의 할머니께서 운영하셨는데,"}, {"start": 1536.5, "end": 1539.7, "text": "할머니께서는 1938년 나치를 피해 가족들이"}, {"start": 1540.0, "end": 1543.2, "text": "빈(Vienna)을 탈출할 수 있도록 결정적 역할을 하셨습니다."}, {"start": 1545.0, "end": 1548.2, "text": "그것은 참으로 끔찍하고 절박한 여정이었습니다."}, {"start": 1550.0, "end": 1553.2, "text": "저희 아버지 또한 극적인 이야기를 겪으셨습니다."}, {"start": 1555.0, "end": 1558.2, "text": "아버지는 저명한 음악가이셨는데,"}, {"start": 1560.0, "end": 1563.2, "text": "1937년 가장 좋아하던 작곡가 브람스를 기리기 위해"}, {"start": 1565.0, "end": 1568.2, "text": "오케스트라를 지휘하고 피아노를 연주하는 콘서트를 열었습니다."}, {"start": 1570.0, "end": 1573.2, "text": "그 관객석에는 엘리너 루스벨트의 절친이자"}, {"start": 1574.5, "end": 1577.7, "text": "필라델피아의 저명한 자선활동가 거트루드 엘리 씨가 있었죠."}, {"start": 1579.0, "end": 1582.2, "text": "공연 후 그녀는 아버지께 다가와 명함을 건네며,"}, {"start": 1583.5, "end": 1586.7, "text": "\"도움이 필요하시면 언제든 연락하라\"고 말했습니다."}, {"start": 1588.0, "end": 1591.2, "text": "그리고 1938년 3월 오스트리아 병합 직후,"}, {"start": 1592.0, "end": 1595.2, "text": "아버지는 빈을 반드시 탈출해야 한다는 사실을 직감했습니다."}, {"start": 1596.0, "end": 1599.2, "text": "시간이 촉박했고, 1938년 11월 '수정의 밤'이 터지자"}, {"start": 1600.5, "end": 1603.7, "text": "유대인의 탈출은 사실상 불가능해졌습니다."}, {"start": 1605.0, "end": 1608.2, "text": "이민을 가려면 신원 보증이 필수적이었는데,"}, {"start": 1613.0, "end": 1616.2, "text": "아버지가 그녀에게 편지를 쓰자 기꺼이 보증인이 되어주셨습니다."}, {"start": 1616.5, "end": 1619.7, "text": "말 그대로 '음악이 그의 목숨을 구했다'고 할 수 있습니다."}, {"start": 1620.0, "end": 1623.2, "text": "이것이 바로 저의 부모님이셨습니다."}, {"start": 1624.5, "end": 1627.7, "text": "어려운 이들을 돌보면서도 마땅히 인정받아야 할 일에는"}, {"start": 1629.0, "end": 1632.2, "text": "어떤 장애물도 자신들을 막지 못할 것이라 믿으셨고,"}, {"start": 1637.0, "end": 1640.2, "text": "합리적 한계를 넘어서더라도 신념을 끝까지 밀고 나가셨습니다."}, {"start": 1641.0, "end": 1644.2, "text": "부모님께서는 그 정신을 제게 고스란히 물려주셨습니다."}, {"start": 1645.0, "end": 1648.2, "text": "인간의 존엄성이 위협받고,"}, {"start": 1648.5, "end": 1651.7, "text": "인공지능이 무기 체계에 도입되는 현실 속에 우리는 살고 있습니다."}, {"start": 1652.0, "end": 1655.2, "text": "그렇다면 기술자들과 기술 기업들은"}, {"start": 1655.5, "end": 1658.7, "text": "미래를 바라보며 자신의 기술과 역할, 책임을"}, {"start": 1659.0, "end": 1662.2, "text": "어떻게 규정해야 한다고 생각하십니까?"}, {"start": 1666.0, "end": 1669.2, "text": "어떻게 미래를 바라보아야 할까요?"}, {"start": 1671.0, "end": 1674.2, "text": "전쟁을 평가하기는 대단히 어렵습니다."}, {"start": 1676.5, "end": 1679.7, "text": "단 한 명의 생명이 희생되어도 그것은 표현할 수 없는 비극이니까요."}, {"start": 1682.0, "end": 1685.2, "text": "하지만 전쟁의 역사를 살펴보면,"}, {"start": 1687.0, "end": 1690.2, "text": "사상자의 수는 사실 극적으로 감소해 왔습니다."}, {"start": 1692.0, "end": 1695.2, "text": "제2차 세계대전 당시 유럽과 아시아에서"}, {"start": 1696.5, "end": 1699.7, "text": "1억 명이 목숨을 잃었습니다."}, {"start": 1701.0, "end": 1704.2, "text": "오늘날의 전쟁은 수천에서 수만 명 수준이며,"}, {"start": 1707.0, "end": 1710.2, "text": "비극적인 일이지만 사상자 수는 계속 줄어들고 있습니다."}, {"start": 1713.0, "end": 1716.2, "text": "지능이 가치 체계에 스며들고 있기 때문입니다."}, {"start": 1717.5, "end": 1720.7, "text": "베트남전 당시 B-52로 무차별 융단폭격을 가했던 것은"}, {"start": 1722.0, "end": 1725.2, "text": "아무런 목적 없이 수많은 인명만을 앗아갔습니다."}, {"start": 1727.0, "end": 1730.2, "text": "미국인 10만 명, 베트남인 수백만 명이 희생되었죠."}, {"start": 1732.0, "end": 1735.2, "text": "따라서 지능의 증가는 전쟁으로 인한 사망자를 줄이는 데"}, {"start": 1737.0, "end": 1740.2, "text": "실질적으로 크게 기여하고 있습니다."}, {"start": 1742.0, "end": 1743.8, "text": "시간이 다 되었지만 너무 중요한 질문이라 여쭙겠습니다."}, {"start": 1744.0, "end": 1745.8, "text": "전쟁이 끔찍하다는 말씀에는 전적으로 동의합니다."}, {"start": 1746.0, "end": 1749.2, "text": "하지만 질문의 핵심은 기술자와 기업들이 미래를 향해"}, {"start": 1751.0, "end": 1754.2, "text": "어떤 역할과 책임을 져야 하는가였습니다."}, {"start": 1757.0, "end": 1760.2, "text": "어떻게 미래를 향해 나아가야 할까요?"}, {"start": 1765.0, "end": 1768.2, "text": "제 답변이 그 점을 다루었다고 생각합니다."}, {"start": 1772.0, "end": 1775.2, "text": "의학이든 방위 산업이든 기술의 파급력을 다루는 이들은"}, {"start": 1779.0, "end": 1782.2, "text": "무엇보다 '인간의 존엄성'을 최우선으로 존중해야 합니다."}, {"start": 1784.0, "end": 1787.2, "text": "사람들이 그 가치에 온전히 집중하는 한,"}, {"start": 1789.0, "end": 1792.2, "text": "그 책임은 실제로 실현되고 있다고 믿습니다."}, {"start": 1796.0, "end": 1799.2, "text": "레이 커즈와일 씨, 대단히 감사합니다."}, {"start": 1800.0, "end": 1803.2, "text": "(청중 박수 갈채)"}];
let player;
let isMutedState = true;

function handleUnmute() {
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    // 🛡️ [F1 키: 브라우저 도움말 팝업 차단]
    if (e.key === 'F1' || e.keyCode === 112) {
        e.preventDefault();
        return;
    }
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});

let syncInterval;
let activityTimeout;
let isUserPositioned = false;
let userBottomPercent = 12;

function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) {
        subsEl.classList.remove('ui-hidden');
        if(isUserPositioned) {
            subsEl.style.bottom = Math.min(88, userBottomPercent + 4) + '%';
        } else {
            subsEl.style.bottom = '';
        }
    }
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) {
                subsEl.classList.add('ui-hidden');
                if(isUserPositioned) {
                    subsEl.style.bottom = userBottomPercent + '%';
                } else {
                    subsEl.style.bottom = '';
                }
            }
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}

function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div>`;
    }
    const subsContainer = document.getElementById('subtitles');
    if(subsContainer && subsContainer.innerHTML !== currentHtml){
        subsContainer.innerHTML = currentHtml;
    }
}

let isDragging=false, startY, currentBottomPx, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

// 자막 더블 클릭 / 더블 탭 시 기본 위치로 초기화 🔄✨
document.addEventListener('dblclick', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        isUserPositioned = false;
        if(subEl) subEl.style.bottom = '';
        resetActivity();
    }
});

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottomPx = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}

function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    let targetBottomPx = currentBottomPx - dy;
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let bottomPercent = Math.max(2, Math.min(85, (targetBottomPx / vh) * 100));
    subEl.style.bottom = bottomPercent + '%';
    if(e.cancelable) e.preventDefault();
}

function dragEnd(e) {
    if(!isDragging) return;
    isDragging = false;
    subEl.classList.remove('dragging');
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let style = window.getComputedStyle(subEl);
    let bottomPx = parseFloat(style.bottom) || 0;
    userBottomPercent = Math.max(2, Math.min(85, (bottomPx / vh) * 100));
    isUserPositioned = true;
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1.5, Math.min(15, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / (initialDist || 1);
        currentFontSize = Math.max(1.5, Math.min(15, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});

</script>
