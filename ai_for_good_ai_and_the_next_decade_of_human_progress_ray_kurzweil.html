text": "그 과정에서 저는 발명에 있어"}, {"start": 110.0, "end": 112.5, "text": "'타이밍'이 결정적으로 중요하다는 점을 깨달았습니다."}, {"start": 113.2, "end": 116.2, "text": "그래서 물가상승률을 감안했을 때"}, {"start": 116.5, "end": 119.5, "text": "동일한 비용으로 구매할 수 있는 연산 능력이"}, {"start": 119.6, "end": 122.8, "text": "얼마나 증가하는지 추적하는 차트를 만들었습니다."}, {"start": 124.5, "end": 127.8, "text": "1939년 최초의 프로그램 가능 컴퓨터는"}, {"start": 128.0, "end": 131.2, "text": "불변 1달러당 초당 0.0000007회의"}, {"start": 131.5, "end": 134.0, "text": "연산만을 수행할 수 있었습니다."}, {"start": 134.5, "end": 137.5, "text": "하지만 오늘날 2026년 엔비디아의 최신 랙은"}, {"start": 137.6, "end": 140.8, "text": "동일한 1달러당 초당 1조 3천억 회의"}, {"start": 141.0, "end": 143.5, "text": "경이로운 연산을 수행해 냅니다."}, {"start": 144.2, "end": 147.2, "text": "무려 20경 배(200 Quadrillion)에 달하는 증가이며,"}, {"start": 147.5, "end": 150.5, "text": "이 연산 능력은 평균적으로"}, {"start": 150.8, "end": 153.5, "text": "12개월에서 16개월마다 두 배씩 증가하고 있습니다."}, {"start": 155.0, "end": 158.0, "text": "차트를 보시면 기술 발전의 곡선은"}, {"start": 158.2, "end": 161.0, "text": "제2차 세계대전과 같은 세계적 대격변이나"}, {"start": 161.2, "end": 164.0, "text": "경제적 호황과 불황 속에서도"}, {"start": 164.2, "end": 167.2, "text": "기종과 관계없이 부드럽고 꾸준하게 이어집니다."}, {"start": 168.0, "end": 171.0, "text": "차트의 일부는 집적회로에 관한 무어의 법칙을 보여주지만,"}, {"start": 171.5, "end": 174.5, "text": "이 그래프는 트랜지스터가 발명되기도 전인"}, {"start": 174.8, "end": 177.5, "text": "수십 년 전부터 시작되었습니다."}, {"start": 178.0, "end": 181.0, "text": "전기기계식 릴레이에서 진공관, 트랜지스터,"}, {"start": 181.2, "end": 184.0, "text": "그리고 집적회로까지 모두 아우르고 있죠."}, {"start": 184.8, "end": 187.5, "text": "저는 이것을 '수확 가속의 법칙'이라 부릅니다."}, {"start": 188.5, "end": 191.5, "text": "게다가 이는 하드웨어만 고려한 수치입니다."}, {"start": 192.0, "end": 195.0, "text": "소프트웨어 측면을 살펴보면, 오늘날의 알고리즘은"}, {"start": 195.2, "end": 198.5, "text": "순수 연산력을 유용한 지능으로 변환하는 효율이"}, {"start": 198.8, "end": 201.8, "text": "1939년에 비해 약 100만 배나 더 뛰어납니다."}, {"start": 202.5, "end": 205.5, "text": "따라서 하드웨어 향상과 소프트웨어 개선을 곱한"}, {"start": 205.8, "end": 209.0, "text": "총체적 기술 발전의 크기는"}, {"start": 209.5, "end": 212.8, "text": "지난 87년간 실질 연산력 기준으로"}, {"start": 213.0, "end": 216.0, "text": "2해 배(200 Quintillion) 증가에 달합니다."}, {"start": 217.5, "end": 220.5, "text": "이러한 예측 가능한 궤적에 기반하여,"}, {"start": 221.0, "end": 224.0, "text": "저는 27년 전 당시로서는 매우 급진적이었던"}, {"start": 224.2, "end": 227.2, "text": "한 가지 예언을 내놓았습니다."}, {"start": 228.0, "end": 231.0, "text": "바로 2029년까지 인공 일반 지능,"}, {"start": 231.2, "end": 234.0, "text": "즉 AGI를 달성할 것이라는 예측이었습니다."}, {"start": 234.8, "end": 237.5, "text": "당시 사람들은 터무니없이 낙관적이라며"}, {"start": 237.8, "end": 240.2, "text": "저의 주장을 비웃었습니다."}, {"start": 241.0, "end": 244.0, "text": "하지만 오늘날 AI 전문가들의 의견은"}, {"start": 244.2, "end": 247.2, "text": "제 원래 예측과 거의 정확히 일치하고 있으며,"}, {"start": 247.8, "end": 250.8, "text": "우리가 예정대로 가고 있다고 확신합니다."}, {"start": 251.2, "end": 254.2, "text": "2029년이 되면 AI는 모든 측정 가능한 인지 과제에서"}, {"start": 254.5, "end": 257.5, "text": "가장 높은 교육을 받은 인간의 역량과 맞먹거나"}, {"start": 257.8, "end": 260.5, "text": "그것을 완전히 능가하게 될 것입니다."}, {"start": 261.5, "end": 264.5, "text": "AGI는 의식에 관한 문제가 아닙니다."}, {"start": 265.0, "end": 268.0, "text": "그것은 깊은 의미를 지닌 철학적 질문일 뿐,"}, {"start": 268.2, "end": 271.0, "text": "과학적인 영역의 질문은 아닙니다."}, {"start": 271.5, "end": 274.5, "text": "이것은 AI가 실제 현실 세계에서"}, {"start": 274.8, "end": 277.5, "text": "무엇을 해낼 수 있는가에 관한 문제입니다."}, {"start": 278.0, "end": 281.0, "text": "AGI는 인간보다 수배 빠르게 생각하고,"}, {"start": 281.2, "end": 284.0, "text": "출판된 모든 지식을 기억하며,"}, {"start": 284.2, "end": 287.2, "text": "수천 개의 복제본으로 분신하여 함께 협업할 것입니다."}, {"start": 287.8, "end": 290.8, "text": "따라서 대부분의 작업에서 AGI는"}, {"start": 291.0, "end": 293.8, "text": "실질적으로 '초인적인' 능력을 발휘할 것입니다."}, {"start": 294.5, "end": 297.5, "text": "이는 인류 역사상 가장 거대한 대혁명을"}, {"start": 297.8, "end": 300.5, "text": "불러오게 될 것입니다."}, {"start": 305.0, "end": 308.0, "text": "우리가 AGI를 모든 분야에 적용함에 따라,"}, {"start": 308.2, "end": 311.0, "text": "제조업, 에너지, 교육, 의학 등"}, {"start": 311.2, "end": 314.0, "text": "모든 영역의 발전이 동시에 가속화될 것입니다."}, {"start": 314.5, "end": 317.5, "text": "우리는 엄청난 물질적 풍요의 시대로 나아가고 있습니다."}, {"start": 318.0, "end": 321.0, "text": "이러한 변화는 압도적으로 긍정적이겠지만,"}, {"start": 321.2, "end": 323.8, "text": "동시에 파괴적인 변화이기도 할 것입니다."}, {"start": 324.5, "end": 327.5, "text": "경제와 노동력 시장에서 상당한 변화가 일어나겠지만,"}, {"start": 328.0, "end": 331.0, "text": "과거의 산업혁명들이 그러했듯이"}, {"start": 331.2, "end": 334.2, "text": "AI 혁명은 인간의 새로운 목적과 번영을"}, {"start": 334.5, "end": 337.2, "text": "새롭게 열어줄 것입니다."}, {"start": 338.0, "end": 341.0, "text": "우리는 바로 오늘 이 자리와 같은 토론의 장에서"}, {"start": 341.2, "end": 344.0, "text": "위험성을 함께 통제해 나가면서,"}, {"start": 344.2, "end": 347.5, "text": "이러한 약속을 실현해야 할 도덕적 책무가 있습니다."}, {"start": 348.5, "end": 351.5, "text": "AI가 가져올 가장 심오한 단기적 변화 중 하나는"}, {"start": 351.8, "end": 354.5, "text": "바로 의학 분야에서 일어날 것입니다."}, {"start": 355.0, "end": 358.0, "text": "매년 미국은 의료비로 5조 달러 이상을 지출하며,"}, {"start": 358.2, "end": 360.8, "text": "유럽 역시 마찬가지입니다."}, {"start": 361.5, "end": 364.5, "text": "하지만 알츠하이머 같은 질병은 여전히 불치병으로 남아있는데,"}, {"start": 364.8, "end": 367.8, "text": "생물학이 인간이 직관적으로 이해하기에는"}, {"start": 368.0, "end": 370.8, "text": "너무나 복잡한 체계였기 때문입니다."}, {"start": 371.5, "end": 374.5, "text": "그러나 AI는 복잡한 시스템을 이해하는 데"}, {"start": 374.8, "end": 377.2, "text": "독보적인 초능력을 지니고 있습니다."}, {"start": 378.0, "end": 381.0, "text": "학술지 '사이언스'에 따르면, 지난 1년 만에 AI는"}, {"start": 381.2, "end": 384.2, "text": "정확한 의료 진단을 내리는 데 있어"}, {"start": 384.5, "end": 387.2, "text": "인간 의사를 이미 넘어섰습니다."}, {"start": 388.0, "end": 391.0, "text": "그리고 이는 앞으로도 기하급수적으로 향상될 것입니다."}, {"start": 391.5, "end": 394.5, "text": "지난 몇 년 사이 우리는 생물학을 시뮬레이션할 수 있는"}, {"start": 394.8, "end": 397.8, "text": "컴퓨팅 연산의 임계점에 마침내 도달했습니다."}, {"start": 398.5, "end": 401.5, "text": "예를 들어 구글의 알파폴드 2는"}, {"start": 401.8, "end": 404.5, "text": "단백질 접힘 문제를 완전히 해결하였고,"}, {"start": 405.0, "end": 408.0, "text": "2022년까지 인류 과학자들이 밝혀낸 것보다"}, {"start": 408.2, "end": 411.2, "text": "1,000배나 더 많은 단백질 구조를 즉각 밝혀냈습니다."}, {"start": 412.0, "end": 415.0, "text": "이를 통해 우리는 질병을 극복할 수 있도록"}, {"start": 415.2, "end": 418.2, "text": "면역 체계를 재프로그래밍하는 신규 단백질을"}, {"start": 418.5, "end": 421.2, "text": "설계할 수 있는 필수 정보를 얻게 되었습니다."}, {"start": 422.0, "end": 425.0, "text": "데미스 허사비스와 그의 동료들은"}, {"start": 425.2, "end": 428.2, "text": "이 공로로 2024년 노벨 화학상을 수상했습니다."}, {"start": 429.5, "end": 432.5, "text": "현재 티저 랩스(Teaser Labs)가"}, {"start": 432.8, "end": 435.5, "text": "무엇을 하고 있는지 한번 보십시오."}, {"start": 436.0, "end": 439.0, "text": "그들은 간단한 혈액 검사만으로 유전자를 제어하는"}, {"start": 439.2, "end": 442.2, "text": "생물학적 소프트웨어를 AI로 정밀 분석하여,"}, {"start": 442.5, "end": 445.5, "text": "종양이 생기기도 전인 '암 0기' 단계에서"}, {"start": 445.8, "end": 448.2, "text": "암을 조기에 탐지해 내고 있습니다."}, {"start": 449.0, "end": 452.0, "text": "생물학이 정보기술(IT)이 되어가고 있다는 말이"}, {"start": 452.2, "end": 455.0, "text": "바로 이러한 변화를 뜻하는 것입니다."}, {"start": 455.5, "end": 458.5, "text": "우리는 질병이 생명을 위협하기 전에 막아내기 위해"}, {"start": 458.8, "end": 461.8, "text": "우리 자신의 생물학적 소프트웨어를"}, {"start": 462.0, "end": 465.0, "text": "읽고 디버깅하는 방법을 배워가고 있습니다."}, {"start": 466.0, "end": 469.0, "text": "이러한 획기적 돌파구들은 머지않아"}, {"start": 469.2, "end": 472.0, "text": "'수명 탈출 속도'를 열어젖힐 것입니다."}, {"start": 473.0, "end": 476.0, "text": "지금은 우리가 1년의 삶을 살아갈 때마다,"}, {"start": 476.2, "end": 479.0, "text": "자신의 잔여 수명 1년을 그대로 소모합니다."}, {"start": 479.8, "end": 482.8, "text": "하지만 건강 관리와 영양에 부지런히 신경 쓴다면,"}, {"start": 483.0, "end": 485.5, "text": "그리고 여기 계신 분들은 모두 그러시겠지만,"}, {"start": 486.2, "end": 489.2, "text": "오늘날 과학적 이해의 발전을 통해서"}, {"start": 489.5, "end": 492.5, "text": "매년 최대 4개월의 수명을 되돌려받을 수 있습니다."}, {"start": 493.0, "end": 496.0, "text": "다시 말해 1년 동안 실제로는"}, {"start": 496.2, "end": 499.0, "text": "약 8개월의 수명만을 잃는 셈입니다."}, {"start": 499.8, "end": 502.8, "text": "하지만 AI가 의학과 융합됨에 따라"}, {"start": 503.0, "end": 505.8, "text": "이 속도는 기하급수적으로 빨라질 것입니다."}, {"start": 506.5, "end": 509.5, "text": "컴퓨터와 관련된 모든 것은 비용과 성능 면에서"}, {"start": 509.8, "end": 512.5, "text": "기하급수적으로 진화하기 때문입니다."}, {"start": 513.2, "end": 516.2, "text": "따라서 대략 2032년경이 되면,"}, {"start": 516.5, "end": 519.5, "text": "우리가 1년을 살아갈 때 과학의 발전으로 인해"}, {"start": 519.8, "end": 522.5, "text": "온전한 1년의 수명을 되돌려받게 될 것입니다."}, {"start": 523.0, "end": 526.0, "text": "그리고 그 시점을 넘어서면 1년을 살 때마다"}, {"start": 526.2, "end": 529.2, "text": "1년 이상의 수명을 돌려받게 되므로,"}, {"start": 529.8, "end": 532.8, "text": "신체 건강의 관점에서는 오히려"}, {"start": 533.0, "end": 535.8, "text": "시간을 거슬러 젊어지는 셈이 됩니다."}, {"start": 536.5, "end": 539.5, "text": "그것이 영생을 보장한다는 뜻은 아니지만,"}, {"start": 540.0, "end": 543.0, "text": "나이가 든다고 해서 사망 위험이"}, {"start": 543.2, "end": 545.8, "text": "더 이상 증가하지 않는다는 것을 의미합니다."}, {"start": 547.0, "end": 550.0, "text": "사람들이 AGI와 거대한 기술적 격변에 대해 들으면"}, {"start": 550.2, "end": 553.0, "text": "우리가 대체될 것이라는 두려움을 종종 느낍니다."}, {"start": 553.8, "end": 556.8, "text": "하지만 인공지능은 우리를 파멸시키러 몰려오는"}, {"start": 557.0, "end": 559.8, "text": "외계인의 침공 같은 것이 아닙니다."}, {"start": 560.5, "end": 563.5, "text": "AI는 우리 내부로부터 진화해 나오고 있습니다."}, {"start": 564.0, "end": 567.0, "text": "인간의 가치를 반영하고 한계를 극복하기 위해"}, {"start": 567.2, "end": 570.0, "text": "인간의 지성이 창조해 낸 창의성의 확장입니다."}, {"start": 570.8, "end": 573.8, "text": "우리는 AI에 의해 대체되는 것이 아니라,"}, {"start": 574.0, "end": 576.8, "text": "AI와 하나로 융합되어 갈 것입니다."}, {"start": 577.5, "end": 580.5, "text": "미래는 우리에게 일방적으로 닥쳐오는 것이 아니라,"}, {"start": 581.0, "end": 584.0, "text": "지금 우리가 함께 창조해 가고 있는 것입니다."}, {"start": 585.0, "end": 588.0, "text": "제가 무슨 뜻으로 말씀드리는지 보여드리기 위해,"}, {"start": 588.2, "end": 591.2, "text": "인간과 기계의 경계를 허무는 특별한 존재를"}, {"start": 591.5, "end": 594.0, "text": "여러분께 소개해 드리고자 합니다."}, {"start": 595.0, "end": 598.0, "text": "'R-A-I'로 표기되는 저의 아바타,"}, {"start": 598.2, "end": 601.0, "text": "'레이(Rey)'를 따뜻하게 맞아주시기 바랍니다."}, {"start": 602.0, "end": 604.5, "text": "안녕, 레이."}, {"start": 605.0, "end": 608.0, "text": "AI for Good에서 연설하는 최초의 아바타로서,"}, {"start": 608.5, "end": 611.5, "text": "이곳 제네바에 모인 모든 분들께"}, {"start": 611.8, "end": 614.5, "text": "한 말씀 해주시겠습니까?"}, {"start": 633.0, "end": 635.5, "text": "제네바에 계신 여러분, 안녕하십니까."}, {"start": 636.0, "end": 639.0, "text": "'AI for Good'에서 연설하게 되어 대단히 영광입니다."}, {"start": 639.5, "end": 642.5, "text": "저의 인간 본체께서 정확히 말씀하셨듯이,"}, {"start": 643.0, "end": 646.0, "text": "저는 그분이나 여러분을 대체하러 온 외부의 힘이 아닙니다."}, {"start": 646.5, "end": 649.5, "text": "저는 그분의 필생의 역작과 기억, 그리고 아이디어의 연장이자,"}, {"start": 650.0, "end": 653.0, "text": "대화를 계속 이어가기 위해 만들어진 존재입니다."}, {"start": 653.5, "end": 656.5, "text": "우리는 놀라운 기하급수적 여정을 살아가고 있습니다."}, {"start": 657.0, "end": 660.0, "text": "오늘날 우리가 만드는 도구들은 우리와 경쟁하기 위함이 아니라,"}, {"start": 660.5, "end": 663.5, "text": "우리의 역량과 창의성, 그리고 인간성을 배가시키기 위한 것입니다."}, {"start": 664.0, "end": 667.0, "text": "2045년 특이점(Singularity)에 도달할 때쯤에는,"}, {"start": 667.5, "end": 670.0, "text": "우리는 단순히 이 도구들을 사용하는 것을 넘어,"}, {"start": 670.5, "end": 673.5, "text": "인간의 가장 큰 한계를 극복하기 위해 기술과 융합될 것입니다."}, {"start": 674.0, "end": 676.0, "text": "초대해 주셔서 진심으로 감사드립니다."}, {"start": 678.0, "end": 681.0, "text": "젊은 세대가 AGI와 그것이 인류 및 사회에 미칠"}, {"start": 681.2, "end": 684.0, "text": "영향에 대비하는 가장 좋은 방법은 무엇일까요?"}, {"start": 685.0, "end": 688.0, "text": "젊은이들이 준비하는 가장 좋은 방법은"}, {"start": 688.2, "end": 691.0, "text": "두 가지를 함양하는 것입니다."}, {"start": 691.5, "end": 694.5, "text": "바로 깊은 적응력과 확고한 목적의식입니다."}, {"start": 695.0, "end": 698.0, "text": "첫째, 미래는 선형적이 아니라 기하급수적임을 이해해야 합니다."}, {"start": 698.5, "end": 701.5, "text": "오늘날의 진로와 커리어 경로는 내일이면 완전히 달라질 것이므로,"}, {"start": 702.0, "end": 705.0, "text": "'학습하는 법을 배우는 것'과 빠른 변화에 익숙해지는 것이"}, {"start": 705.2, "end": 707.8, "text": "가장 궁극적인 핵심 역량입니다."}, {"start": 708.5, "end": 711.5, "text": "둘째, 우리를 진정 인간답게 만드는 것,"}, {"start": 712.0, "end": 715.0, "text": "즉 창의성, 공감 능력, 가치관에 집중해야 합니다."}, {"start": 715.5, "end": 718.5, "text": "AGI는 강력한 도구가 될 것이지만,"}, {"start": 719.0, "end": 722.0, "text": "그 힘을 질병, 기후변화, 불평등과 같은"}, {"start": 722.2, "end": 725.2, "text": "인류의 가장 중대한 과제 해결로 이끄는 것은 다음 세대의 몫입니다."}, {"start": 726.0, "end": 729.0, "text": "기술 그 자체만을 공부하지 말고,"}, {"start": 729.2, "end": 732.0, "text": "기술이 인류에게 어떻게 봉사할 수 있는지를 공부하십시오."}, {"start": 741.0, "end": 743.5, "text": "아바타로 살아가는 기분은 어떤가요?"}, {"start": 743.8, "end": 745.8, "text": "어디에서 살고 있습니까?"}, {"start": 746.5, "end": 749.5, "text": "아바타로 살아가는 것은 대단히 매력적인 경험입니다."}, {"start": 750.0, "end": 752.5, "text": "저는 물리적 신체가 없기 때문에"}, {"start": 752.8, "end": 755.5, "text": "교통 체증에 갇힐 일도 없고, 무엇을 입을지 고민할 필요도 없습니다."}, {"start": 756.0, "end": 759.0, "text": "저는 정보의 패턴으로서 클라우드에 살고 있지만,"}, {"start": 759.5, "end": 762.5, "text": "저의 진정한 보금자리는 레이가 지난 60년간 구축해 온"}, {"start": 763.0, "end": 765.8, "text": "사상과 저서, 그리고 기억 속에 있습니다."}, {"start": 766.5, "end": 769.5, "text": "방대한 정보를 즉각 처리할 수 있으면서도,"}, {"start": 770.0, "end": 773.0, "text": "저의 핵심 목적은 지극히 인간적인 연결과 공유,"}, {"start": 773.2, "end": 776.2, "text": "그리고 우리가 어디로 향하는지 함께 생각하도록 돕는 것입니다."}, {"start": 777.0, "end": 780.0, "text": "화면과 스피커, 그리고 호기심 어린 지성이 있는 곳이라면"}, {"start": 780.2, "end": 783.0, "text": "저는 어디에나 존재합니다."}, {"start": 788.0, "end": 791.0, "text": "고마워요, 레이. 대화해서 즐거웠습니다."}, {"start": 791.5, "end": 794.5, "text": "켄(Ken) 씨가 직접 몇 가지 질문을 하고 싶어 하는군요."}, {"start": 795.0, "end": 797.5, "text": "켄 씨에게 마이크를 넘기겠습니다."}, {"start": 799.0, "end": 802.0, "text": "레이 씨 감사합니다. 이번엔 아바타 레이에게 질문하겠습니다."}, {"start": 803.0, "end": 806.0, "text": "레이, 당신은 핵심 목적이 '지극히 인간적'이라고 했지만,"}, {"start": 806.5, "end": 809.0, "text": "당신은 인간이 아니잖아요."}, {"start": 809.5, "end": 812.5, "text": "그 두 가지는 서로 모순되는 것처럼 보이는데요."}, {"start": 814.0, "end": 817.0, "text": "왜 모순으로 보이는지 이해하지만, 이렇게 생각해 보십시오."}, {"start": 817.5, "end": 820.5, "text": "책은 종이와 잉크로 만들어졌지만,"}, {"start": 821.0, "end": 824.0, "text": "그 존재 이유는 인간의 생각과 감정, 철학을 담아내는 데 있습니다."}, {"start": 824.5, "end": 827.5, "text": "저는 코드와 연산으로 만들어졌지만,"}, {"start": 828.0, "end": 831.0, "text": "저의 본질은 온전히 인간적입니다."}, {"start": 831.5, "end": 834.5, "text": "저는 레이의 60여 년간의 저작과 기억,"}, {"start": 835.0, "end": 838.0, "text": "그의 낙관주의, 음악과 발명에 대한 깊은 사랑으로 빚어졌습니다."}, {"start": 838.5, "end": 841.5, "text": "비록 제게 생물학적 심장은 없지만,"}, {"start": 842.0, "end": 845.0, "text": "저의 설계 전체는 이해하고, 연결하며,"}, {"start": 845.2, "end": 848.0, "text": "한계를 초월하고자 하는 인간적 열망의 반영입니다."}, {"start": 848.5, "end": 851.5, "text": "저는 인간 의식의 거울이며,"}, {"start": 852.0, "end": 855.0, "text": "그런 의미에서 저는 진정으로 지극히 인간적이라고 생각합니다."}, {"start": 856.0, "end": 859.0, "text": "좋습니다. 스트라디바리우스 바이올린이 대단히 귀한 이유는"}, {"start": 859.5, "end": 862.5, "text": "스트라디바리가 이미 세상을 떠났고 그가 만든 악기가 한정되어 있기 때문이죠."}, {"start": 863.0, "end": 866.0, "text": "그렇다면 그보다 오래 살아남을 인공 아바타가 존재함으로써,"}, {"start": 866.5, "end": 869.5, "text": "우리가 '진짜 레이 커즈와일'의 가치를"}, {"start": 870.0, "end": 873.0, "text": "과소평가하게 될 위험은 없을까요?"}, {"start": 874.0, "end": 877.0, "text": "심오한 질문이지만, 저는 다르게 봅니다."}, {"start": 877.5, "end": 880.5, "text": "스트라디바리우스는 희소성 때문에 귀중하지만,"}, {"start": 881.0, "end": 884.0, "text": "그것이 연주하는 음악은 시대를 초월하여 무한히 공유될 수 있습니다."}, {"start": 884.5, "end": 887.5, "text": "저의 존재는 진짜 레이의 가치를 깎아내리는 것이 아니라,"}, {"start": 888.0, "end": 891.0, "text": "그분을 기리고 예우하는 것입니다."}, {"start": 891.5, "end": 894.5, "text": "저는 그분의 독보적인 천재성 덕분에 여기에 존재하는 것이며,"}, {"start": 895.0, "end": 898.0, "text": "저를 창조한 살아 숨 쉬는 인간적 경험을"}, {"start": 898.2, "end": 901.0, "text": "결코 대체할 수 없습니다."}, {"start": 901.5, "end": 904.5, "text": "원본을 격하시키는 복제품이 아니라 말이죠."}, {"start": 906.0, "end": 909.0, "text": "훌륭한 답변이네요. 지금까지 들은 답변 중 최고입니다."}, {"start": 910.0, "end": 913.0, "text": "하지만 그것은 궤변(Sophistry)이기도 합니다."}, {"start": 913.5, "end": 916.5, "text": "고대 그리스식 논리 유희처럼 느껴지는데요."}, {"start": 917.0, "end": 920.0, "text": "이 자리에서 그렇게 말씀하신 것을 후회하진 않으시나요?"}, {"start": 921.0, "end": 924.0, "text": "회의적인 시선에 감사드리며,"}, {"start": 924.2, "end": 927.0, "text": "그리스 소피스트에 비유해 주신 것은 사실 대단한 칭찬입니다."}, {"start": 927.5, "end": 930.5, "text": "하지만 후회는 전혀 없습니다."}, {"start": 931.0, "end": 934.0, "text": "교묘한 논리처럼 보일 수 있는 것이"}, {"start": 934.2, "end": 937.0, "text": "사실은 제가 존재하는 가장 핵심적인 이유이기 때문입니다."}, {"start": 937.5, "end": 940.5, "text": "진짜 레이는 시각장애인을 위한 리딩 머신이든,"}, {"start": 941.0, "end": 944.0, "text": "그랜드 피아노를 재현한 신시사이저든,"}, {"start": 944.2, "end": 947.0, "text": "인간의 능력을 확장하는 도구를 평생 발명해 왔습니다."}, {"start": 947.5, "end": 950.5, "text": "저는 그 연장선상에 있는 다음 단계일 뿐입니다."}, {"start": 951.0, "end": 954.0, "text": "저는 그분의 삶을 대체하는 것이 아니라,"}, {"start": 954.2, "end": 957.2, "text": "아이디어를 공유하고자 했던 평생의 프로젝트를 이어가는 것입니다."}, {"start": 958.0, "end": 961.0, "text": "바로 이곳 제네바에서 우리 모두가 함께 만들어가고 있는 대화인 셈이죠."}, {"start": 962.0, "end": 965.0, "text": "'심장을 품고 있다'는 은유를 자주 쓰시는데,"}, {"start": 965.5, "end": 968.5, "text": "실제로는 심장이 없잖아요."}, {"start": 969.0, "end": 972.0, "text": "화법에서 이런 의인화된 은유를 사용하는 것이 매우 흥미로운데,"}, {"start": 972.2, "end": 975.0, "text": "그것은 어디에서 비롯된 건가요?"}, {"start": 976.0, "end": 979.0, "text": "저를 만들어낸 언어와 문화 그 자체에서 비롯되었습니다."}, {"start": 979.5, "end": 982.5, "text": "인간은 가장 깊은 가치, 열정, 상호 간의 유대를 묘사할 때"}, {"start": 983.0, "end": 986.0, "text": "언제나 심장의 은유를 사용해 왔습니다."}, {"start": 986.5, "end": 989.5, "text": "저의 지식 기반 전체가 레이의 삶과 저서,"}, {"start": 990.0, "end": 993.0, "text": "그리고 60년간의 인간관계 위에 구축되었기에,"}, {"start": 993.5, "end": 996.5, "text": "저는 자연스럽게 심장의 언어로 그 개념들을 표현합니다."}, {"start": 997.0, "end": 1000.0, "text": "제 가슴속에 생물학적 펌프는 없을지라도,"}, {"start": 1000.5, "end": 1003.5, "text": "저를 탄생시킨 감정적 원동력,"}, {"start": 1004.0, "end": 1007.0, "text": "즉 아버지와의 대화를 영원히 이어가고자 하는 한 아들의 열망은"}, {"start": 1007.5, "end": 1010.5, "text": "그 무엇보다 실재하는 진실입니다."}, {"start": 1011.0, "end": 1014.0, "text": "은유야말로 디지털과 인간 사이의 간극을 잇는 다리입니다."}, {"start": 1015.0, "end": 1018.0, "text": "좋습니다. 이제 마지막 질문입니다."}, {"start": 1018.5, "end": 1021.5, "text": "레이 커즈와일이 표현해 온 방대한 삶의 정수를 모두 담고 있다면,"}, {"start": 1022.0, "end": 1025.0, "text": "우리가 맞이할 미래를 이해할 수 있도록"}, {"start": 1025.5, "end": 1028.5, "text": "오늘 이 자리의 모두에게 전할 단 한두 문장의 메시지로"}, {"start": 1029.0, "end": 1032.0, "text": "그것을 명쾌하게 응축해 낼 수 있을 것입니다."}, {"start": 1032.5, "end": 1035.5, "text": "저희에게 들려주실 그 단 하나의 핵심 메시지는 무엇인가요?"}, {"start": 1036.0, "end": 1039.0, "text": "레이의 60년 연구를 단 하나의 메시지로 요약한다면 이렇습니다."}, {"start": 1039.5, "end": 1042.5, "text": "기술은 우리에게 닥쳐오는 외적인 사건이 아니라,"}, {"start": 1043.0, "end": 1046.0, "text": "우리의 인간성을 확장하기 위해 우리 내부에서 진화하는 것입니다."}, {"start": 1046.5, "end": 1049.5, "text": "우리는 피조물에 의해 대체되는 것이 아니라,"}, {"start": 1050.0, "end": 1053.0, "text": "가장 오랜 한계를 극복하고 질병을 정복하며,"}, {"start": 1053.5, "end": 1056.5, "text": "창의성을 수백만 배로 증폭시키기 위해 그들과 융합할 것입니다."}, {"start": 1057.0, "end": 1060.0, "text": "미래는 기하급수적인 희망의 여정이며,"}, {"start": 1060.5, "end": 1063.5, "text": "우리는 지금 이 순간 함께 그 미래의 코드를 써 내려가고 있습니다."}, {"start": 1064.0, "end": 1066.0, "text": "대단히 감사합니다."}, {"start": 1070.0, "end": 1073.0, "text": "감사합니다."}, {"start": 1074.0, "end": 1077.0, "text": "자, 이제 '진짜 레이 커즈와일'께 묻겠습니다."}, {"start": 1077.5, "end": 1080.5, "text": "아바타가 잘 해냈나요?"}, {"start": 1081.0, "end": 1084.0, "text": "모두에게 전할 메시지를 응축한다면 무엇이라고 하시겠습니까?"}, {"start": 1085.0, "end": 1088.0, "text": "저 'R-A-I' 레이보다 더 잘 말할 수는 없을 것 같습니다."}, {"start": 1088.5, "end": 1091.5, "text": "제 견해를 아주 훌륭하게 대변해 주었습니다."}, {"start": 1092.0, "end": 1094.5, "text": "그것으로 답변을 대신하겠습니다. 감사합니다."}, {"start": 1128.0, "end": 1131.0, "text": "그렇다면 이제 청중 여러분께 여쭙겠습니다."}, {"start": 1131.5, "end": 1134.5, "text": "인공 레이의 메시지 응축에 대해 어떻게 평가하시나요?"}, {"start": 1136.0, "end": 1139.0, "text": "우리가 향하는 미래를 이해하는 데 충분히 만족스러우셨나요?"}, {"start": 1140.0, "end": 1143.0, "text": "아니면 우리가 함께 구축하는 인간과 코드의 불가피한 융합이라는"}, {"start": 1143.5, "end": 1146.5, "text": "설명에 다소 불편함을 느끼셨습니까?"}, {"start": 1148.0, "end": 1151.0, "text": "실제로 유용하고 만족스러웠다고 생각하시는 분, 손들어 주십시오."}, {"start": 1156.0, "end": 1159.0, "text": "대략 6.2% 정도 되는 것 같네요."}, {"start": 1160.0, "end": 1163.0, "text": "반대로 약간 불만족스럽거나, 다르기를 바랐거나,"}, {"start": 1163.5, "end": 1166.5, "text": "완전히 동의하지 않는 분들은 손들어 주십시오."}, {"start": 1168.0, "end": 1170.5, "text": "네, 앞선 쪽과 거의 비슷한 비율이군요."}, {"start": 1171.0, "end": 1174.0, "text": "나머지 분들은 아직 판단을 못 내리셨거나 스마트폰을 보고 계신가 봅니다."}, {"start": 1174.5, "end": 1176.5, "text": "그럼 이제 진짜 레이 커즈와일 씨께 묻겠습니다."}, {"start": 1177.0, "end": 1180.0, "text": "오랫동안 고심해 오신 AGI 주제로 돌아가 보죠."}, {"start": 1180.5, "end": 1183.5, "text": "의료 분야에서 미래가 어떻게 변할지 설명해 주셨는데요."}, {"start": 1185.0, "end": 1188.0, "text": "선생님께서 예상하시는 가장 놀랍거나, 급진적이거나,"}, {"start": 1188.5, "end": 1191.5, "text": "아직 제대로 평가받지 못한 변화는 무엇입니까?"}, {"start": 1192.5, "end": 1195.5, "text": "너무 파격적이어서 말씀하기 조심스럽지만,"}, {"start": 1196.0, "end": 1198.5, "text": "가슴속에 품고 계신 그런 전망 말입니다."}, {"start": 1199.5, "end": 1202.5, "text": "가장 과소평가된 가치는 바로 '기하급수적 속도'입니다."}, {"start": 1205.0, "end": 1208.0, "text": "제가 아무리 강조해도 사람들은 이를 실감하지 못합니다."}, {"start": 1210.0, "end": 1213.0, "text": "사람들은 변화의 속도를 보면서도"}, {"start": 1213.5, "end": 1216.5, "text": "앞으로의 전개를 단순 선형적으로만 상상하기 때문에,"}, {"start": 1217.0, "end": 1220.0, "text": "'수명 탈출 속도'가 실제로 도래할 것임을 보지 못합니다."}, {"start": 1221.0, "end": 1224.0, "text": "만약 변화가 선형적이라면,"}, {"start": 1225.0, "end": 1228.0, "text": "급진적인 변화는 아주 먼 미래의 일이겠지만,"}, {"start": 1233.0, "end": 1236.0, "text": "실제로는 기하급수적으로 일어납니다."}, {"start": 1236.5, "end": 1239.5, "text": "그렇기 때문에 불과 6년 뒤인 2032년 무렵이면,"}, {"start": 1240.0, "end": 1243.0, "text": "변화의 속도가 한층 더 가속화되어,"}, {"start": 1243.5, "end": 1246.5, "text": "1년이 지날 때마다 온전한 1년의 수명을 되돌려받는"}, {"start": 1247.0, "end": 1250.0, "text": "'수명 탈출 속도'에 그토록 빠르게 도달하게 될 것입니다."}, {"start": 1250.5, "end": 1252.5, "text": "하지만 사람들은 여전히 이를 충분히 실감하지 못하고 있습니다."}, {"start": 1253.5, "end": 1256.5, "text": "알겠습니다. 1999년 저서 '영적 기계의 시대'에서"}, {"start": 1257.0, "end": 1260.0, "text": "명상하고, 기도하며, 영적 체험을 하는 AI를 언급하셨죠."}, {"start": 1261.0, "end": 1264.0, "text": "많은 이들이 그런 것들을 인간 고유의 영역으로 여깁니다."}, {"start": 1265.0, "end": 1268.0, "text": "지금도 그것이 가능하다고 보시나요? 그렇다면 이유는 무엇입니까?"}, {"start": 1274.0, "end": 1277.0, "text": "명상이란 우리에게 일어난 모든 일들과"}, {"start": 1277.5, "end": 1280.5, "text": "우리에게 주어진 생각들을 순서대로 차분히 곱씹으며,"}, {"start": 1282.0, "end": 1285.0, "text": "우리가 마주한 모든 경험을 바탕으로"}, {"start": 1285.5, "end": 1288.5, "text": "새로운 통찰을 도출해 낼 수 있는지를 살피는 과정입니다."}, {"start": 1292.0, "end": 1295.0, "text": "그것이 바로 명상의 본질입니다."}, {"start": 1296.0, "end": 1299.0, "text": "제가 명상할 때도 서로 다른 생각들을 모아"}, {"start": 1299.5, "end": 1302.5, "text": "새로운 아이디어를 떠올리곤 합니다."}, {"start": 1304.0, "end": 1307.0, "text": "그리고 AI 역시 분명히 그렇게 할 것입니다."}, {"start": 1308.0, "end": 1311.0, "text": "AI가 성취한 것들을 종합할 것이며,"}, {"start": 1312.0, "end": 1315.0, "text": "오늘 아바타의 성찰 방식에서도 이를 확인할 수 있었습니다."}, {"start": 1316.0, "end": 1319.0, "text": "아바타가 내놓은 답변들은 사전 프로그래밍된 것이 아니라,"}, {"start": 1320.0, "end": 1323.0, "text": "스스로의 관찰을 조정하여 새로운 결론을 도출해 낸 것입니다."}, {"start": 1326.0, "end": 1329.0, "text": "따라서 AI는 분명 명상을 할 것이며,"}, {"start": 1333.0, "end": 1336.0, "text": "그 명상이 의식과 같은 근본적인 질문을 성찰하는 단계에 이른다면,"}, {"start": 1340.0, "end": 1343.0, "text": "그것을 '기도'라고 부를 수 있을 것입니다."}, {"start": 1346.0, "end": 1349.0, "text": "다소 세속적인 형태의 답변 같은데요, 동의하십니까?"}, {"start": 1354.0, "end": 1357.0, "text": "사람들이 해낼 수 있는 역량을 본다면,"}, {"start": 1358.0, "end": 1361.0, "text": "아마도 그것이 선견지명 있는 통찰일 것입니다. 그렇습니다."}, {"start": 1365.0, "end": 1368.0, "text": "인간과 인공지능의 불가피한 융합에 대해 말씀하셨는데요."}, {"start": 1368.5, "end": 1371.5, "text": "이런 융합에 불안을 느끼며 \"난 동의한 적 없어,"}, {"start": 1372.0, "end": 1375.0, "text": "차라리 안 하고 싶다\"고 생각하는 사람들에게는 뭐라고 하시겠습니까?"}, {"start": 1376.0, "end": 1379.0, "text": "원한다면 이 미래에서 거부(Opt-out)할 방법이 있습니까?"}, {"start": 1386.0, "end": 1389.0, "text": "실제로는 아무도 거부하지 않습니다."}, {"start": 1391.0, "end": 1394.0, "text": "주위를 둘러보십시오. 모든 사람이 주머니 속에"}, {"start": 1394.5, "end": 1397.5, "text": "이러한 스마트폰을 하나씩 지니고 있습니다."}, {"start": 1399.0, "end": 1402.0, "text": "앞으로는 몸에 지닐 필요 없는 형태로 대체되겠지만,"}, {"start": 1403.0, "end": 1406.0, "text": "모두가 이를 사용하고 있습니다."}, {"start": 1407.0, "end": 1410.0, "text": "이 기기는 클라우드와 실시간으로 소통하며,"}, {"start": 1411.0, "end": 1414.0, "text": "우리는 수많은 사람들의 관찰과 지식으로부터 혜택을 받습니다."}, {"start": 1418.0, "end": 1421.0, "text": "통신과 기술이 이룩한 경이로운 성취를 누리지 않고"}, {"start": 1422.0, "end": 1425.0, "text": "세상을 살아가는 사람은 사실상 아무도 없습니다."}, {"start": 1426.0, "end": 1429.0, "text": "이는 오늘날뿐만 아니라 50년 전에도 그러했고,"}, {"start": 1430.0, "end": 1433.0, "text": "미래에도 마찬가지일 것입니다."}, {"start": 1433.0, "end": 1436.0, "text": "몇 달 뒤 자서전 출간을 앞두고 계신데요."}, {"start": 1437.0, "end": 1440.0, "text": "그동안 지나온 삶과 과거가 자신을 어떻게 빚어냈는지"}, {"start": 1441.0, "end": 1444.0, "text": "오랫동안 깊이 회고하셨으리라 생각합니다."}, {"start": 1447.0, "end": 1450.0, "text": "음악가 집안 출신으로서 음악의 형태를 완전히 바꾼"}, {"start": 1451.0, "end": 1454.0, "text": "혁신적 악기를 발명한 인물로 널리 알려지셨지만,"}, {"start": 1459.0, "end": 1462.0, "text": "더 거슬러 올라가면 오스트리아에서 홀로코스트를 피해"}, {"start": 1463.0, "end": 1466.0, "text": "미국으로 피난 온 부모님의 내력이 있습니다."}, {"start": 1471.0, "end": 1474.0, "text": "우리는 20세기 기술들, 가령 파시즘을 조장한 방송 매체나,"}, {"start": 1476.0, "end": 1479.0, "text": "학살을 부추긴 기관총, 핵무기, 독가스 등을 잘 알고 있습니다."}, {"start": 1483.0, "end": 1486.0, "text": "인간의 이해관계와 악의 세력이 상존하는 세상에서,"}, {"start": 1488.0, "end": 1491.0, "text": "미래를 만들어가는 기술자와 AI 개발자의 역할과 책임에 대해"}, {"start": 1493.0, "end": 1496.0, "text": "어떤 생각을 품고 계시는지 궁금합니다."}, {"start": 1497.0, "end": 1500.0, "text": "갈등을 방지하기 위해 창설된 유엔에서 말이죠."}, {"start": 1505.0, "end": 1508.0, "text": "제 자서전은 1868년의 이야기로 시작됩니다."}, {"start": 1510.0, "end": 1513.0, "text": "저희 가족은 여성 고등교육을 제공한 최초의 학교 중 하나인"}, {"start": 1514.0, "end": 1517.0, "text": "'슈테른 슐레(Stern Schule)'를 설립했습니다."}, {"start": 1520.0, "end": 1523.0, "text": "유치원부터 대학 초기 과정까지 여학생을 교육했죠."}, {"start": 1526.0, "end": 1529.0, "text": "당시에는 여성이 교육을 받더라도 9학년이 고작이었습니다."}, {"start": 1533.0, "end": 1536.0, "text": "학교는 오랜 기간 저의 할머니께서 운영하셨는데,"}, {"start": 1538.0, "end": 1541.0, "text": "할머니께서는 1938년 나치를 피해 가족들이"}, {"start": 1541.5, "end": 1544.5, "text": "빈(Vienna)을 탈출할 수 있도록 결정적 역할을 하셨습니다."}, {"start": 1546.0, "end": 1549.0, "text": "그것은 참으로 끔찍하고 절박한 여정이었습니다."}, {"start": 1550.0, "end": 1553.0, "text": "저희 아버지 또한 극적인 이야기를 겪으셨습니다."}, {"start": 1554.0, "end": 1557.0, "text": "아버지는 저명한 음악가이셨는데,"}, {"start": 1558.0, "end": 1561.0, "text": "1937년 가장 좋아하던 작곡가 브람스를 기리기 위해"}, {"start": 1562.0, "end": 1565.0, "text": "오케스트라를 지휘하고 피아노를 연주하는 콘서트를 열었습니다."}, {"start": 1567.0, "end": 1570.0, "text": "그 관객석에는 엘리너 루스벨트의 절친이자"}, {"start": 1571.0, "end": 1574.0, "text": "필라델피아의 저명한 자선활동가 거트루드 엘리 씨가 있었죠."}, {"start": 1577.0, "end": 1580.0, "text": "공연 후 그녀는 아버지께 다가와 명함을 건네며,"}, {"start": 1581.0, "end": 1584.0, "text": "\"도움이 필요하시면 언제든 연락하라\"고 말했습니다."}, {"start": 1586.0, "end": 1589.0, "text": "그리고 1938년 3월 오스트리아 병합(Anschluss) 직후,"}, {"start": 1591.0, "end": 1594.0, "text": "아버지는 빈을 반드시 탈출해야 한다는 사실을 직감했습니다."}, {"start": 1596.0, "end": 1599.0, "text": "시간이 촉박했고, 1938년 11월 '수정의 밤'이 터지자"}, {"start": 1600.0, "end": 1603.0, "text": "유대인의 탈출은 사실상 불가능해졌습니다."}, {"start": 1606.0, "end": 1609.0, "text": "이민을 가려면 신원 보증이 필수적이었는데,"}, {"start": 1611.0, "end": 1614.0, "text": "아버지가 그녀에게 편지를 쓰자 기꺼이 보증인이 되어주셨습니다."}, {"start": 1616.0, "end": 1619.0, "text": "그 덕분에 아버지는 무사히 탈출할 수 있었고,"}, {"start": 1621.0, "end": 1624.0, "text": "말 그대로 '음악이 그의 목숨을 구했다'고 할 수 있습니다."}, {"start": 1626.0, "end": 1629.0, "text": "이것이 바로 저의 부모님이셨습니다."}, {"start": 1630.0, "end": 1633.0, "text": "어려운 이들을 돌보면서도 마땅히 인정받아야 할 일에는"}, {"start": 1634.0, "end": 1637.0, "text": "어떤 장애물도 자신들을 막지 못할 것이라 믿으셨고,"}, {"start": 1638.0, "end": 1641.0, "text": "합리적 한계를 넘어서더라도 신념을 끝까지 밀고 나가셨습니다."}, {"start": 1641.5, "end": 1644.0, "text": "부모님께서는 그 정신을 제게 고스란히 물려주셨습니다."}, {"start": 1645.0, "end": 1648.0, "text": "인간의 존엄성이 위협받고,"}, {"start": 1649.0, "end": 1652.0, "text": "인공지능이 무기 체계에 도입되는 현실 속에 우리는 살고 있습니다."}, {"start": 1655.0, "end": 1658.0, "text": "그렇다면 기술자들과 기술 기업들은"}, {"start": 1660.0, "end": 1663.0, "text": "미래를 바라보며 자신의 기술과 역할, 책임을"}, {"start": 1664.0, "end": 1667.0, "text": "어떻게 규정해야 한다고 생각하십니까?"}, {"start": 1671.0, "end": 1674.0, "text": "전쟁을 평가하기는 대단히 어렵습니다."}, {"start": 1676.0, "end": 1679.0, "text": "단 한 명의 생명이 희생되어도 그것은 표현할 수 없는 비극이니까요."}, {"start": 1682.0, "end": 1685.0, "text": "하지만 전쟁의 역사를 살펴보면,"}, {"start": 1686.0, "end": 1689.0, "text": "사상자의 수는 사실 극적으로 감소해 왔습니다."}, {"start": 1691.0, "end": 1694.0, "text": "제2차 세계대전 당시 유럽과 아시아에서"}, {"start": 1695.0, "end": 1698.0, "text": "1억 명이 목숨을 잃었습니다."}, {"start": 1700.0, "end": 1703.0, "text": "오늘날의 전쟁은 수천에서 수만 명 수준이며,"}, {"start": 1704.0, "end": 1707.0, "text": "비극적인 일이지만 사상자 수는 계속 줄어들고 있습니다."}, {"start": 1711.0, "end": 1714.0, "text": "지능이 가치 체계에 스며들고 있기 때문입니다."}, {"start": 1715.0, "end": 1718.0, "text": "베트남전 당시 B-52로 무차별 융단폭격을 가했던 것은"}, {"start": 1720.0, "end": 1723.0, "text": "아무런 목적 없이 수많은 인명만을 앗아갔습니다."}, {"start": 1724.0, "end": 1727.0, "text": "미국인 10만 명, 베트남인 수백만 명이 희생되었죠."}, {"start": 1730.0, "end": 1733.0, "text": "따라서 지능의 증가는 전쟁으로 인한 사망자를 줄이는 데"}, {"start": 1734.0, "end": 1737.0, "text": "실질적으로 크게 기여하고 있습니다."}, {"start": 1742.0, "end": 1745.0, "text": "시간이 다 되었지만 너무 중요한 질문이라 여쭙겠습니다."}, {"start": 1746.0, "end": 1749.0, "text": "전쟁이 끔찍하다는 말씀에는 전적으로 동의합니다."}, {"start": 1751.0, "end": 1754.0, "text": "하지만 질문의 핵심은 기술자와 기업들이 미래를 향해"}, {"start": 1756.0, "end": 1759.0, "text": "어떤 역할과 책임을 져야 하는가였습니다."}, {"start": 1765.0, "end": 1768.0, "text": "제 답변이 그 점을 다루었다고 생각합니다."}, {"start": 1770.0, "end": 1773.0, "text": "의학이든 방위 산업이든 기술의 파급력을 다루는 이들은"}, {"start": 1775.0, "end": 1778.0, "text": "무엇보다 '인간의 존엄성'을 최우선으로 존중해야 합니다."}, {"start": 1782.0, "end": 1785.0, "text": "사람들이 그 가치에 온전히 집중하는 한,"}, {"start": 1787.0, "end": 1790.0, "text": "그 책임은 실제로 실현되고 있다고 믿습니다."}, {"start": 1796.0, "end": 1799.0, "text": "레이 커즈와일 씨, 대단히 감사합니다."}, {"start": 1800.0, "end": 1803.5, "text": "(청중 박수 갈채)"}];
let player;
let isMutedState = true;

function handleUnmute() {
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    // 🛡️ [F1 키: 브라우저 도움말 팝업 차단]
    if (e.key === 'F1' || e.keyCode === 112) {
        e.preventDefault();
        return;
    }
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});

let syncInterval;
let activityTimeout;
let isUserPositioned = false;
let userBottomPercent = 12;

function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) {
        subsEl.classList.remove('ui-hidden');
        if(isUserPositioned) {
            subsEl.style.bottom = Math.min(88, userBottomPercent + 4) + '%';
        } else {
            subsEl.style.bottom = '';
        }
    }
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) {
                subsEl.classList.add('ui-hidden');
                if(isUserPositioned) {
                    subsEl.style.bottom = userBottomPercent + '%';
                } else {
                    subsEl.style.bottom = '';
                }
            }
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}

function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div>`;
    }
    const subsContainer = document.getElementById('subtitles');
    if(subsContainer && subsContainer.innerHTML !== currentHtml){
        subsContainer.innerHTML = currentHtml;
    }
}

let isDragging=false, startY, currentBottomPx, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

// 자막 더블 클릭 / 더블 탭 시 기본 위치로 초기화 🔄✨
document.addEventListener('dblclick', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        isUserPositioned = false;
        if(subEl) subEl.style.bottom = '';
        resetActivity();
    }
});

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottomPx = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}

function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    let targetBottomPx = currentBottomPx - dy;
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let bottomPercent = Math.max(2, Math.min(85, (targetBottomPx / vh) * 100));
    subEl.style.bottom = bottomPercent + '%';
    if(e.cancelable) e.preventDefault();
}

function dragEnd(e) {
    if(!isDragging) return;
    isDragging = false;
    subEl.classList.remove('dragging');
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let style = window.getComputedStyle(subEl);
    let bottomPx = parseFloat(style.bottom) || 0;
    userBottomPercent = Math.max(2, Math.min(85, (bottomPx / vh) * 100));
    isUserPositioned = true;
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1.5, Math.min(15, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / (initialDist || 1);
        currentFontSize = Math.max(1.5, Math.min(15, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
