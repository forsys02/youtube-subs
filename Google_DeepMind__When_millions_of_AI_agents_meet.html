const videoId="V04bm-3d6EQ";
const subs=[{"start": 0.0, "end": 6.0, "text": "Google DeepMind 팟캐스트에 오신 걸 환영합니다.<br>얼마 전까지만 해도 AI 비서라 하면 주로"}, {"start": 6.0, "end": 11.0, "text": "대형 언어 모델을 뜻했죠. 질문에 답은 해줘도<br>직접 작업을 수행하진 못했습니다."}, {"start": 11.0, "end": 19.0, "text": "우리를 대신해서 말이죠. 하지만 AI 에이전트의<br>등장으로 이 모든 게 바뀌고 있습니다."}, {"start": 19.0, "end": 28.0, "text": "DeepMind는 게임 강화학습부터 오랜 역사가 있지만<br>대다수에겐 에이전트가 낯선 개념이었죠."}, {"start": 28.0, "end": 35.0, "text": "그러다 OpenClaw 같은 오픈소스 도구가 등장했고,<br>Google에서도 Gemini Spark와"}, {"start": 35.0, "end": 44.0, "text": "Antigravity 등 차세대 에이전트 도구를 선보였죠.<br>그런데 수백만 개의 AI 에이전트가 단순히"}, {"start": 44.0, "end": 51.0, "text": "우리를 돕는 걸 넘어 서로 거래하고 협상하며<br>일을 위임하게 되면 어떻게 될까요?"}, {"start": 51.0, "end": 58.0, "text": "새로운 경제나 AGI로 가는 새로운 길이 열릴까요?<br>그리고 안전은 어떻게 지킬 수 있을까요?"}, {"start": 58.0, "end": 65.0, "text": "이 질문들의 답을 찾고 계신 Google DeepMind의<br>네나드 토마셰프 수석 연구원을 모셨습니다."}, {"start": 65.0, "end": 69.0, "text": "- 나와주셔서 감사합니다.<br>- 초대해 주셔서 기쁩니다."}, {"start": 69.0, "end": 76.0, "text": "대형 언어 모델만 써본 분들을 위해,<br>기존 LLM과 에이전트의 차이를 설명해 주시겠어요?"}, {"start": 76.0, "end": 81.0, "text": "- 네, 물론입니다. 올해 가장 주목받는<br>핵심 트렌드 중 하나라고 생각하는데요."}, {"start": 81.0, "end": 88.0, "text": "흥미롭게도 에이전트는 새로운 개념이 아닙니다.<br>AI 분야에서 오래전부터 연구해 온 주제죠."}, {"start": 88.0, "end": 93.0, "text": "대형 언어 모델이 등장하기 훨씬 전에도<br>시뮬레이션 3D 환경에서 활동하던"}, {"start": 93.0, "end": 101.0, "text": "에이전트들이 아이템을 모으고 임무를 수행했죠.<br>당시에는 세상과 직접 상호작용하는 것을"}, {"start": 101.0, "end": 107.0, "text": "지능을 발현하는 핵심 방식으로 여겼습니다.<br>오늘날에도 마찬가지로 볼 수 있는데요,"}, {"start": 107.0, "end": 114.0, "text": "단순 언어 모델과 에이전트의 가장 큰 차이는<br>에이전트가 세상의 상태를 관찰하고"}, {"start": 114.0, "end": 121.0, "text": "주어진 환경에서 직접 행동을 취한다는 점입니다.<br>반면 언어 모델은 질문이나 프롬프트에"}, {"start": 121.0, "end": 128.0, "text": "텍스트 응답을 이어서 제공할 뿐이죠.<br>물론 요즘 에이전트들도 내부적으로는"}, {"start": 128.0, "end": 134.0, "text": "대형 언어 모델을 핵심 엔진으로 사용합니다.<br>따라서 두 개념이 완전히 분리된 것은 아니며,"}, {"start": 134.0, "end": 141.0, "text": "LLM이 행동을 계획하면 이를 감싼 프레임워크가<br>실제 변경 사항을 실행하는 구조입니다."}, {"start": 141.0, "end": 147.0, "text": "- 연속적인 결정을 연결하는 자율성이 더 크겠군요.<br>- 맞습니다."}, {"start": 147.0, "end": 155.0, "text": "결국 그것이 에이전트를 개발하는 궁극적 동기죠.<br>사실 에이전트가 하는 대부분의 일은"}, {"start": 155.0, "end": 164.0, "text": "수많은 프롬프트를 주고받으며 사람이 직접<br>과정을 안내해 수동으로 처리할 수도 있습니다."}, {"start": 164.0, "end": 171.0, "text": "하지만 에이전트는 이 과정을 자동화해<br>사용자의 부담을 줄이고 자율성을 높여줍니다."}, {"start": 171.0, "end": 177.0, "text": "그래서 여러 단계가 필요한 복잡한 작업이라도<br>에이전트가 스스로 계획을 세우고 실행하죠."}, {"start": 177.0, "end": 184.0, "text": "스스로 계획을 세워 각 단계를 실행하되,<br>민감하거나 오류 위험이 있는 작업에는"}, {"start": 184.0, "end": 190.0, "text": "사용자의 승인이나 피드백을 받게 됩니다.<br>- 그렇다면 실제 사용 경험은 어떻게 다른가요?"}, {"start": 190.0, "end": 195.0, "text": "기존 LLM에 익숙한 사람이 에이전트를 쓸 때<br>어떤 느낌을 받게 될까요?"}, {"start": 195.0, "end": 203.0, "text": "- 여러 면에서 비슷합니다. 대화 인터페이스가<br>유사해 여전히 대화하듯 에이전트를 대하지만,"}, {"start": 203.0, "end": 208.0, "text": "내부의 언어 모델뿐 아니라 에이전트가<br>사용자를 대신해 훨씬 많은 일을 처리합니다."}, {"start": 208.0, "end": 215.0, "text": "따라서 사용자는 결과를 검토하고 승인하는<br>최종 의사결정자의 역할을 맡게 되죠."}, {"start": 215.0, "end": 221.0, "text": "승인만 하면 에이전트가 티켓 예매나<br>파티를 위한 친구 연락 등 온갖 일을 처리하고,"}, {"start": 221.0, "end": 228.0, "text": "그동안 사용자는 넷플릭스를 보며<br>편안하게 휴식을 취할 수 있습니다."}, {"start": 228.0, "end": 232.0, "text": "- 제가 생각한 예시는 결혼식 준비인데요.<br>기존 대형 언어 모델을 사용할 땐"}, {"start": 232.0, "end": 237.0, "text": "출장 뷔페 업체 목록이나<br>추천 예식장 리스트를 뽑아줄 순 있어도,"}, {"start": 237.0, "end": 243.0, "text": "이메일은 사람이 직접 일일이 보내야 했죠.<br>하지만 에이전트를 활용한다면"}, {"start": 243.0, "end": 249.0, "text": "이런 상황에서 훨씬 유용하겠군요.<br>- 100% 맞습니다. 에이전트에게는 다양한"}, {"start": 249.0, "end": 254.0, "text": "도구 접근 권한이 주어지니까요.<br>원한다면 Gmail 접근 권한을 부여해"}, {"start": 254.0, "end": 260.0, "text": "직접 이메일을 발송하게 할 수도 있습니다.<br>물론 잘못 보낼 가능성도 있으므로"}, {"start": 260.0, "end": 267.0, "text": "작성된 내용을 확인할 필요는 있지만요.<br>하지만 도구 접근 권한을 통해"}, {"start": 267.0, "end": 272.0, "text": "언어 모델이 사용자를 대신해 실제 작업을 수행하고,<br>모든 준비와 조율을 마무리할 수 있습니다."}, {"start": 272.0, "end": 277.0, "text": "손 하나 까딱하지 않고도 말이죠.<br>물론 오류가 없다는 이상적인 전제하에요."}, {"start": 277.0, "end": 284.0, "text": "- '이상적으로는'이라는 점이 중요하네요.<br>그렇다면 현재 에이전트는 어떤 작업을 잘하나요?"}, {"start": 284.0, "end": 288.0, "text": "- 현재 저희가 역량을 집중하고 있는 분야는,<br>여기서 '저희'는 Google뿐 아니라"}, {"start": 288.0, "end": 294.0, "text": "업계 전체를 뜻하는데요, 바로 코딩 능력입니다.<br>많은 정형화된 절차와 작업들이"}, {"start": 294.0, "end": 302.0, "text": "소프트웨어나 코드로 정의될 수 있기 때문이죠.<br>현재 실제 활용 측면에서도"}, {"start": 302.0, "end": 309.0, "text": "수많은 코딩 도구가 널리 쓰이고 있습니다.<br>Google DeepMind 내부뿐 아니라"}, {"start": 309.0, "end": 315.0, "text": "외부에서도 개발 속도를 크게 가속화하고 있죠.<br>덕분에 사람은 반복적인 구현 작업 대신"}, {"start": 315.0, "end": 322.0, "text": "핵심 아이디어와 설계 구상에<br>더 집중할 수 있게 되었습니다."}, {"start": 322.0, "end": 327.0, "text": "많은 시간과 숙련된 기술,<br>전문 지식이 필요했던 일들이죠."}, {"start": 327.0, "end": 331.0, "text": "이제는 언어 모델이 쉽게 해내지만,<br>동시에 여전히 인간이 개입해야 하는"}, {"start": 331.0, "end": 337.0, "text": "단계에 머물러 있습니다. 대체 어떤 점이<br>부족해서 인간의 감독이 필요한 걸까요?"}, {"start": 337.0, "end": 345.0, "text": "가능 여부의 문제로 보기보다는,<br>AI가 할 수 있는 작업이라도"}, {"start": 345.0, "end": 354.0, "text": "모든 것을 100% 정확하게<br>해내지는 못한다는 점이 핵심입니다."}, {"start": 354.0, "end": 361.0, "text": "결국 인간처럼 모든 행동에는<br>어느 정도 실패 확률이 존재하고,"}, {"start": 361.0, "end": 368.0, "text": "작업이 복잡할수록 실패 확률도 높아지죠.<br>인간을 포함한 모든 지능이 그렇듯이요."}, {"start": 368.0, "end": 376.0, "text": "에이전트가 작업을 잘 수행할 거라 기대해도<br>여전히 실수를 저지를 수 있습니다."}, {"start": 376.0, "end": 383.0, "text": "그 실수는 눈에 띌 수도 있지만<br>매우 미묘할 수도 있는데요."}, {"start": 383.0, "end": 389.0, "text": "이 점이 중요한 이유는 머신러닝 모델이<br>도입된 여러 분야에서 오랫동안 나타난"}, {"start": 389.0, "end": 398.0, "text": "'자동화 편향'이라는 현상이<br>존재하기 때문입니다."}, {"start": 398.0, "end": 404.0, "text": "에이전트가 여러 작업을 잘 처리하면<br>점차 긴장을 풀고 과도하게 신뢰하게 되죠."}, {"start": 404.0, "end": 410.0, "text": "결국 검증을 소홀히 해 중요한 문제를 놓치고<br>실수가 그냥 통과되는 겁니다. 맞습니다."}, {"start": 410.0, "end": 415.0, "text": "그래서 인간이 제어 루프 안에<br>머무는 것뿐만 아니라,"}, {"start": 415.0, "end": 420.0, "text": "항상 주의를 기울이고 적극 참여해야 합니다.<br>방심하는 순간 위험을 감수하는 것이니까요."}, {"start": 420.0, "end": 425.0, "text": "주사위를 던지는 셈이죠. 그렇다면 장기적으로는<br>지금이 과도기처럼 느껴지는데요."}, {"start": 425.0, "end": 430.0, "text": "점점 더 뛰어난 능력을 갖추게 될 텐데,<br>장기적으로 얼마나 큰 변화를 가져올까요?"}, {"start": 430.0, "end": 435.0, "text": "우리가 인공지능을 활용하는 방식이<br>완전히 달라지게 될까요?"}, {"start": 435.0, "end": 441.0, "text": "100% 확신합니다. 엄청난 근본적 변화가<br>없는 세상은 상상하기 어렵습니다."}, {"start": 441.0, "end": 447.0, "text": "지금 우리 모두가 파악하고자 하는 것은<br>그 변화가 구체적으로 어떤 모습일지입니다."}, {"start": 447.0, "end": 453.0, "text": "물론 기술을 개발하는 주체로서 우리는<br>해결책을 주도적으로 설계할 수 있습니다."}, {"start": 453.0, "end": 460.0, "text": "여러 분야의 개발자와 전문가들에게<br>최대한 힘을 실어주는 방향으로요."}, {"start": 460.0, "end": 468.0, "text": "하지만 AI는 이전에는 없었던<br>다양한 영역으로 빠르게 진출하고 있죠."}, {"start": 468.0, "end": 474.0, "text": "과학자들은 이미 일상적으로 AI를 쓰고 있고,<br>얼마 전까지만 해도 수학자들은"}, {"start": 474.0, "end": 478.0, "text": "수학 연구에 AI가 쓰일 거라 생각 못 했지만<br>이제는 흔한 일이 되었습니다."}, {"start": 478.0, "end": 484.0, "text": "모든 문제가 해결된 것은 아니고<br>인간의 역할도 여전히 크지만,"}, {"start": 484.0, "end": 492.0, "text": "변화가 너무 급격하다는 점이<br>다소 불안하게 느껴질 수 있습니다."}, {"start": 492.0, "end": 499.0, "text": "과거 산업혁명 등은 오랜 시간에 걸쳐<br>방식을 바꾸고 적응할 여유가 있었지만,"}, {"start": 499.0, "end": 504.0, "text": "이번에는 그럴 수 있는 시간이 짧기 때문에<br>매우 신중하게 접근해야 합니다."}, {"start": 504.0, "end": 510.0, "text": "우리는 왜 이런 시스템을 원하는 걸까요?<br>어떤 이점이 있고 무엇을 얻을 수 있나요?"}, {"start": 510.0, "end": 514.0, "text": "지금 우리에게 없는 어떤 가치가 있는 걸까요?<br>오랫동안 AI를 연구해 온 연구자들은"}, {"start": 514.0, "end": 521.0, "text": "그 질문에 대한 답을 마음속에 품어왔을 텐데,<br>저 개인적인 답을 말씀드리자면"}, {"start": 521.0, "end": 530.0, "text": "과학의 발전과 건강 증진,<br>그리고 인류 복지의 향상입니다."}, {"start": 530.0, "end": 534.0, "text": "다만 이는 매우 거시적인 답변이라서<br>왜 에이전트를 개발해야 하는지에 대한"}, {"start": 534.0, "end": 541.0, "text": "구체적인 이유로는 와닿지 않을 수 있죠.<br>학계 일각에서는 시스템에 자율성을"}, {"start": 541.0, "end": 549.0, "text": "부여하면 안 된다고 주장하기도 합니다.<br>하지만 안전한 통제 프레임워크를 개발해"}, {"start": 549.0, "end": 560.0, "text": "에이전트가 복잡한 작업을 자율 수행한다면,<br>진보를 훨씬 가속화할 수 있습니다."}, {"start": 560.0, "end": 568.0, "text": "적은 인력으로도 더 많은 성과를 낼 수 있죠.<br>그렇다면 과학과는 어떻게 연결되는 걸까요?"}, {"start": 568.0, "end": 574.0, "text": "지금까지 나눈 예시들은 소프트웨어 개발이나<br>결혼식 물품 구매 같은 것들이어서"}, {"start": 574.0, "end": 579.0, "text": "비교적 사소하게 느껴지기도 하거든요.<br>이것이 어떻게 과학 발전으로 이어지는지"}, {"start": 579.0, "end": 585.0, "text": "설명해 주실 수 있나요? / 바로 그 부분이<br>제가 꿈꾸는 가장 핵심적인 목표입니다."}, {"start": 585.0, "end": 593.0, "text": "과학 연구는 단순히 좋은 아이디어를 내고<br>잠깐 동안 이를 추론하는 것,"}, {"start": 593.0, "end": 600.0, "text": "즉 모델의 컨텍스트 창 안에서 처리하는 것<br>이상의 깊이 있는 과정이 필요합니다."}, {"start": 600.0, "end": 606.0, "text": "아이디어 도출이나 수식 유도에 언어 모델을<br>활용하는 것도 이미 매우 유용하지만,"}, {"start": 606.0, "end": 614.0, "text": "과학을 더 큰 규모로 자동화하려면<br>현재 진행 중인 다른 흐름들이 필요합니다."}, {"start": 614.0, "end": 621.0, "text": "예를 들어 자율 연구 실험실을<br>구축하려는 투자가 활발히 이루어지고 있죠."}, {"start": 621.0, "end": 629.0, "text": "그런 환경에서는 에이전트가 직접<br>실험 일정을 계획하고 수행해야 합니다."}, {"start": 629.0, "end": 634.0, "text": "물론 물리적 세계와 직접 상호작용할 때는<br>수많은 안전장치가 필수적입니다."}, {"start": 634.0, "end": 642.0, "text": "신소재 설계나 바이오 분야뿐만 아니라,<br>배터리를 설계하는 경우만 보더라도"}, {"start": 642.0, "end": 648.0, "text": "과열을 일으키는 설정으로 인해<br>실험 장비가 파손될 위험이 있으니까요."}, {"start": 648.0, "end": 653.0, "text": "하드웨어 손상 등의 위험이 따르므로<br>안전장치를 반드시 마련해 두어야 하고,"}, {"start": 653.0, "end": 659.0, "text": "에이전트가 루프를 완결할 수 있도록<br>신뢰할 수 있는 프로토콜도 마련해야 하죠."}, {"start": 659.0, "end": 667.0, "text": "소프트웨어는 테스트로 검증하면 되니<br>루프 완결이 쉽지만, 과학 분야에서는"}, {"start": 667.0, "end": 673.0, "text": "아이디어가 맞는지 피드백을 얻으려면<br>직접 물리적 실험을 수행해야 합니다."}, {"start": 673.0, "end": 677.0, "text": "실험 결과를 관찰하고 분석해야 하니까요.<br>바로 그 부분이 핵심인 것 같은데요,"}, {"start": 677.0, "end": 683.0, "text": "에이전트가 단순히 사람의 지시를<br>기다리는 대신 스스로 수학 문제를 푸는 등"}, {"start": 683.0, "end": 688.0, "text": "자율성을 갖게 된다면, 이 모든 과정에서<br>인간의 역할은 어디에 있는가 하는"}, {"start": 688.0, "end": 693.0, "text": "의문이 생길 수밖에 없지 않나요?<br>맞습니다. 장기적으로 풀어야 할 문제죠."}, {"start": 693.0, "end": 698.0, "text": "하지만 현재 기술 수준에서 단기적으로 보면<br>인간의 역할은 여전히 매우 중요합니다."}, {"start": 698.0, "end": 704.0, "text": "지금의 시스템은 아직 AGI가 아니며<br>스스로 하지 못하는 일이 여전히 많으니까요."}, {"start": 704.0, "end": 709.0, "text": "지금 세대의 AI 시스템에 대해<br>한 가지 분명히 말씀드릴 수 있는 점은,"}, {"start": 709.0, "end": 715.0, "text": "어떻게 표현하는 게 가장 좋을까요,<br>일종의 '조합적 완결'에 능하다는 것입니다."}, {"start": 715.0, "end": 721.0, "text": "우리가 이미 할 줄 아는 것들, 즉<br>주로 인간의 데이터로 학습되었기 때문에"}, {"start": 721.0, "end": 728.0, "text": "인간의 기술을 모방하고 조합하여<br>작은 간극들을 메우는 데는 능숙하지만,"}, {"start": 728.0, "end": 736.0, "text": "아직 근본적인 혁신을 보여주진 못했습니다.<br>과학 분야에서 인간이 전혀 생각지 못한"}, {"start": 736.0, "end": 742.0, "text": "새로운 발견을 해내는 일 같은 것 말이죠.<br>따라서 이러한 전환기 속에서"}, {"start": 742.0, "end": 746.0, "text": "우리가 해야 할 역할은 여전히 많습니다.<br>방금 사람들이 꽤 오래전부터"}, {"start": 746.0, "end": 751.0, "text": "에이전트를 이야기해 왔다고 하셨는데,<br>실현되기까지 왜 이렇게 오래 걸렸을까요?"}, {"start": 751.0, "end": 755.0, "text": "실제로 사람들이 직접 다뤄보고<br>활용할 수 있게 된 건 정말 최근이잖아요."}, {"start": 755.0, "end": 763.0, "text": "네, 사실 과거에도 에이전트라 부를 만한<br>기술들이 이미 도입되기는 했습니다."}, {"start": 763.0, "end": 768.0, "text": "데이터 센터 운영 최적화 등에 쓰였지만,<br>분명한 한계가 존재했는데요."}, {"start": 768.0, "end": 776.0, "text": "언어 기능이 없어 인간이 상호작용하거나<br>소통할 방법이 전혀 없었기 때문입니다."}, {"start": 776.0, "end": 781.0, "text": "특정 작업에만 맞춰 훈련된 좁은 에이전트라<br>해당 작업 자체는 훌륭히 해냈지만,"}, {"start": 781.0, "end": 787.0, "text": "상호작용이 없어 우리가 개입할 수 없는<br>고전적 의미의 소프트웨어에 불과했죠."}, {"start": 787.0, "end": 795.0, "text": "트레이딩이나 투자 알고리즘도 일종의<br>에이전트라고 부를 수는 있겠지만,"}, {"start": 795.0, "end": 801.0, "text": "그저 자체적으로 작동할 뿐이었죠. 지금은<br>에이전트가 언어 모델을 기반으로 합니다."}, {"start": 801.0, "end": 806.0, "text": "덕분에 대화하고, 배우고, 영향을 주며,<br>원하는 방향으로 유도할 수 있게 되었죠."}, {"start": 806.0, "end": 812.0, "text": "그래서 사람들이 더 많이 교류하게 된 겁니다.<br>그렇다면 왜 우리는 아직 기다리고 있을까요?"}, {"start": 812.0, "end": 817.0, "text": "알아서 모든 일을 척척 해내는 비서처럼,<br>방금 말씀하신 그런 미래상은"}, {"start": 817.0, "end": 823.0, "text": "아직 체감되지 않는데, 본격적인 도입을<br>가로막는 걸림돌은 무엇인가요?"}, {"start": 823.0, "end": 828.0, "text": "기반 모델 자체를 설계하는 단계를 넘어<br>시야를 넓힐 필요가 있습니다."}, {"start": 828.0, "end": 835.0, "text": "모델 개발에도 많은 노력을 쏟았지만,<br>이제 유능한 에이전트를 갖추게 된 만큼"}, {"start": 835.0, "end": 843.0, "text": "이들을 조율하고 통솔하며 관리하는<br>더 나은 방안을 찾아야 합니다."}, {"start": 843.0, "end": 849.0, "text": "다양한 일을 해내는 강력한 시스템 앞에서는,<br>우리 스스로가 팀의 관리자가 되어야 하죠."}, {"start": 849.0, "end": 858.0, "text": "워크플로를 다루는 관리 역량을 길러야 합니다.<br>에이전트 팀을 관리하는 것은"}, {"start": 858.0, "end": 863.0, "text": "사람을 이끄는 것과 다르면서도 공통점이 있죠.<br>에이전트는 사람과 전혀 다른 실수를 하고"}, {"start": 863.0, "end": 870.0, "text": "인간 지능이 아닙니다. 또한 사용자를<br>깊이 이해하고 있는 것도 아니어서,"}, {"start": 870.0, "end": 874.0, "text": "원하는 바를 척척 알아맞힐 수는 없으므로,<br>사람이 계속 관여해야 합니다."}, {"start": 874.0, "end": 881.0, "text": "따라서 조율 능력을 키워야 하죠.<br>하지만 대규모 언어 모델은 여전히"}, {"start": 881.0, "end": 888.0, "text": "때때로 환각 현상을 일으키곤 하는데요,<br>그렇다 보니 AI 에이전트에게"}, {"start": 888.0, "end": 896.0, "text": "작업을 믿고 맡기기엔 큰 부담이 따릅니다.<br>작은 환각 하나만으로도 자칫"}, {"start": 896.0, "end": 905.0, "text": "치명적인 결과로 이어질 수 있으니까요.<br>신뢰는 주어지기도 하지만 쌓아가는 것이죠."}, {"start": 905.0, "end": 915.0, "text": "그래서 저희 프레임워크에서는<br>시간에 따른 '평판 추적'을 강조합니다."}, {"start": 915.0, "end": 923.0, "text": "반복해서 불안정한 모습을 보이면 신뢰할 수 없고,<br>대체로 안정적이더라도 맹신해선 안 되며"}, {"start": 923.0, "end": 930.0, "text": "그 행동을 검증해야 합니다. 언어 모델의<br>환각을 완전히 없앨 수는 없으므로,"}, {"start": 930.0, "end": 937.0, "text": "이를 감안하여 워크플로를 설계해야 하죠.<br>환각이 점점 줄어들고는 있지만"}, {"start": 937.0, "end": 945.0, "text": "전체 워크플로가 훼손되지 않도록<br>철저히 관리해 나가야 합니다."}, {"start": 945.0, "end": 950.0, "text": "박사님께서 많이 강조하신 개념 중 하나가<br>바로 '위임(delegation)'인데요,"}, {"start": 950.0, "end": 955.0, "text": "특정 작업이 주어지면 에이전트가<br>전문 에이전트에게 위임하는 방식에 대해,"}, {"start": 955.0, "end": 960.0, "text": "어떻게 작동하는지 설명해 주시겠어요?<br>네, 이건 어떤 개념이냐면요..."}, {"start": 960.0, "end": 967.0, "text": "아직 말씀드리지 않은 걸림돌 중 하나는<br>에이전트의 도움이 절실한 영역이 바로"}, {"start": 967.0, "end": 973.0, "text": "매우 복잡한 작업들이라는 점인데요.<br>현재 널리 쓰이는 언어 모델이나 에이전트는"}, {"start": 973.0, "end": 980.0, "text": "아주 직접적인 지시에는 쉽게 대응합니다.<br>\"내일 특정 식당에서 식사하고 싶으니"}, {"start": 980.0, "end": 986.0, "text": "시간을 찾아 예약해 줘\" 같은 요청은<br>도구를 활용해 수월하게 처리할 수 있죠."}, {"start": 986.0, "end": 993.0, "text": "하지만 여러 단계로 나누어 실행해야 하는<br>매우 복잡한 계획이 필요한 상황이라면"}, {"start": 993.0, "end": 1000.0, "text": "어떤 단일 에이전트도 모든 단계를<br>혼자서 다 처리하지 못할 수도 있습니다."}, {"start": 1000.0, "end": 1008.0, "text": "그래서 구축된 에이전트 간 프로토콜을 통해<br>업무의 일부를 다른 에이전트에 위임해야 하죠."}, {"start": 1008.0, "end": 1014.0, "text": "하지만 진행 과정에서 실패가 발생할 수 있어<br>작업을 위임하는 에이전트나 인간은"}, {"start": 1014.0, "end": 1022.0, "text": "이러한 실패를 관리·대응하고<br>최대한 사전에 예방할 수 있어야 합니다."}, {"start": 1022.0, "end": 1028.0, "text": "우선 어떤 에이전트가 믿고 맡길 만큼<br>신뢰할 수 있는지, 역량은 어떤지 파악해야 하죠."}, {"start": 1028.0, "end": 1033.0, "text": "이를 공인하고 검증할 수 있는지,<br>그리고 사용자와 에이전트를"}, {"start": 1033.0, "end": 1040.0, "text": "악의적인 상호작용에서 보호하는 것도 중요하죠.<br>처음에 결혼식이나 파티를 예로 드셨잖아요?"}, {"start": 1040.0, "end": 1047.0, "text": "큰 행사를 총괄하다 보면 예약이 어긋나거나<br>돌발 사고가 생기기도 하고,"}, {"start": 1047.0, "end": 1053.0, "text": "물건이 제때 도착하지 않기도 합니다.<br>대규모 조율에는 수많은 변수가 따르니까요."}, {"start": 1053.0, "end": 1059.0, "text": "사람이 이를 총괄하는 과정에서도<br>모든 지연과 문제들을 직접 해결해야 하죠."}, {"start": 1059.0, "end": 1065.0, "text": "마찬가지로 여러 에이전트에 위임하는 주체도<br>발생 가능한 문제들을 모두 관리해야 합니다."}, {"start": 1065.0, "end": 1071.0, "text": "그런데 현재 다수의 멀티 에이전트 시스템은<br>진정한 위임이라기보다는"}, {"start": 1071.0, "end": 1080.0, "text": "'단순 병렬 처리'에 가깝게 동작합니다.<br>여러 에이전트가 동시에 작업하더라도"}, {"start": 1080.0, "end": 1088.0, "text": "일을 지능적으로 분할하는 체계 없이<br>그냥 무작위로 하위 작업을 쪼개어"}, {"start": 1088.0, "end": 1094.0, "text": "넘겨준 뒤 병렬로 처리할 뿐이죠.<br>물론 처리 속도는 빨라질 수 있습니다."}, {"start": 1094.0, "end": 1100.0, "text": "모든 과정이 안정적이고 각자가<br>독립적으로 일을 끝마친다는 전제하에서요."}, {"start": 1100.0, "end": 1107.0, "text": "하지만 이건 진정한 의미의<br>'지능형 위임 프레임워크'가 아닙니다."}, {"start": 1107.0, "end": 1112.0, "text": "작업이 단순히 임의로 나뉜다면,<br>한 에이전트는 와인을 사고"}, {"start": 1112.0, "end": 1117.0, "text": "다른 에이전트는 잔을 사면서<br>'와인잔'이어야 한다는 걸 모를 수도 있죠."}, {"start": 1117.0, "end": 1123.0, "text": "그런 문제가 생길 수 있다는 거군요?<br>충분히 가능하죠. 또 다른 중요한 점은,"}, {"start": 1123.0, "end": 1129.0, "text": "현재 에이전트의 주된 활용 분야가<br>소프트웨어 개발 쪽에 쏠려 있다는 점입니다."}, {"start": 1129.0, "end": 1135.0, "text": "그 이유는 소프트웨어를 개발할 때는<br>테스트 코드를 직접 작성할 수 있기 때문이죠."}, {"start": 1135.0, "end": 1140.0, "text": "소위 '단위 테스트'를 실행해서<br>작성된 코드가 독립적인 상태에서"}, {"start": 1140.0, "end": 1146.0, "text": "제 기능을 하는지 검증할 수 있으니까요.<br>하지만 현실 세계의 많은 작업은"}, {"start": 1146.0, "end": 1154.0, "text": "검증이 그렇게 단순하지 않고 주관적입니다.<br>예를 들어 '맛있는 와인'을 어떻게 정의할까요?"}, {"start": 1154.0, "end": 1159.0, "text": "다소 주관적일 수밖에 없죠.<br>하지만 이는 AI와 언어 모델에서"}, {"start": 1159.0, "end": 1165.0, "text": "매우 중요한 문제입니다. AI 분야에는<br>'보상 해킹'이라는 고질적인 문제가 있죠."}, {"start": 1165.0, "end": 1170.0, "text": "겉으로는 요청 조건을 만족하지만<br>실제 의도에는 전혀 부합하지 않는"}, {"start": 1170.0, "end": 1177.0, "text": "결과를 내놓는 상황이 생길 수 있습니다.<br>그래서 '검증 가능성'을 강조해야 하고"}, {"start": 1177.0, "end": 1185.0, "text": "위임자와 수임자 사이의 계약 조건을<br>아주 엄격하고 명확하게 규정해야 하죠."}, {"start": 1185.0, "end": 1191.0, "text": "동시에 어떤 작업은 문제가 생겨도<br>완전히 되돌릴 수 있다는 점을 인식해야 합니다."}, {"start": 1191.0, "end": 1198.0, "text": "다시 실행하거나 재위임하면 그만이니까요.<br>하지만 실제 돈을 쓰는 것처럼"}, {"start": 1198.0, "end": 1205.0, "text": "사후에 쉽게 되돌릴 수 없는<br>현실적인 결과를 낳는 작업도 있습니다."}, {"start": 1205.0, "end": 1210.0, "text": "이런 작업들에는 훨씬 더 큰 주의가 필요합니다.<br>한편 초기 에이전트 사례를 보면"}, {"start": 1210.0, "end": 1218.0, "text": "에이전트가 사람에게 작업을 위임하기도 했죠.<br>맞아요, 그 부분에 대해 더 이야기해 주시겠어요?"}, {"start": 1218.0, "end": 1224.0, "text": "보통 우리가 떠올리는 일반적인 구도와는<br>정반대라는 점이 무척 흥미로운데요."}, {"start": 1224.0, "end": 1232.0, "text": "사람이 AI에게 일을 맡기는 건 자연스럽지만<br>그 반대 방향의 상호작용도"}, {"start": 1232.0, "end": 1239.0, "text": "여러 연구에서 활발히 다뤄져 왔습니다.<br>제 배경을 조금 말씀드리자면,"}, {"start": 1239.0, "end": 1247.0, "text": "저는 의료 AI 분야에서 많은 연구를 해왔는데요.<br>의료계에는 특정 작업에 한해"}, {"start": 1247.0, "end": 1254.0, "text": "인간을 뛰어넘는 성능을 내도록 훈련된<br>특화 AI 시스템들이 존재해 왔습니다."}, {"start": 1254.0, "end": 1261.0, "text": "가령 영상의학 분야에서 머신러닝 모델이<br>스캔 사진을 보고 병변 부위를 찾아내"}, {"start": 1261.0, "end": 1267.0, "text": "박스 표시를 한 뒤 전문의에게<br>최종 판독을 넘기는 식이었죠."}, {"start": 1267.0, "end": 1273.0, "text": "이런 시스템은 수년간 매우 높은 수준으로<br>작동해 왔지만, 여전히 오류는 있습니다."}, {"start": 1273.0, "end": 1280.0, "text": "그래서 전문가의 검토가 필요했고,<br>인간과 AI가 협업하는 팀 모델이 연구되었죠."}, {"start": 1280.0, "end": 1287.0, "text": "시스템의 오류를 사람이 바로잡는 방식으로,<br>다양한 현장 실험들이 진행되었습니다."}, {"start": 1287.0, "end": 1294.0, "text": "양방향 모두 가능합니다.<br>전문가가 불확실할 때만 AI에 묻거나,"}, {"start": 1294.0, "end": 1302.0, "text": "AI 제안을 상시 검토하며 도움을 받거나,<br>아니면 AI 시스템이 직접 작업을 수행하고"}, {"start": 1302.0, "end": 1310.0, "text": "예측을 내린 뒤 불확실한 게 있을 때<br>플래그를 띄우게 할 수도 있죠."}, {"start": 1310.0, "end": 1315.0, "text": "이미지가 흐릿해 여러 해석이 가능해서<br>머신러닝이 확신하지 못할 때처럼요."}, {"start": 1315.0, "end": 1323.0, "text": "초인적 능력을 지닌 특화 모델의 결정을<br>인간이 재검토하는 방식은"}, {"start": 1323.0, "end": 1330.0, "text": "꽤 훌륭한 구성으로 입증되었죠.<br>필요할 때 AI가 인간에게 넘기는 식인가요?"}, {"start": 1330.0, "end": 1337.0, "text": "불확실할 때 말이죠. 흥미롭네요.<br>AI가 초인적인 특정 분야라 해도"}, {"start": 1337.0, "end": 1344.0, "text": "최고의 팀 구성이 결국 AI가 불확실할 때<br>인간에게 위임하는 방식이라는 점이요."}, {"start": 1344.0, "end": 1350.0, "text": "그 자체로 무척 흥미롭습니다.<br>어쩌면 정반대의 경우도 있겠지만요."}, {"start": 1350.0, "end": 1358.0, "text": "범용 시스템에서도 AI가 민감한 작업에<br>승인과 권한이 필요한 때를 안다면"}, {"start": 1358.0, "end": 1364.0, "text": "최소한 그런 결정은 인간에게<br>위임하는 것이 합리적이겠죠."}, {"start": 1364.0, "end": 1368.0, "text": "이와 반대로 또 살펴보고 싶은 부분은<br>사이버 보안에 관한 문제입니다."}, {"start": 1368.0, "end": 1375.0, "text": "점점 더 많은 에이전트가 인터넷상에서<br>외부와 상호작용하고 있으니까요."}, {"start": 1375.0, "end": 1381.0, "text": "에이전트의 취약점을 악용하려는 이들이<br>필연적으로 나타날 수밖에 없죠."}, {"start": 1381.0, "end": 1388.0, "text": "사람들이 놓는 에이전트 함정은 어떤 건가요?<br>두려우면서도 대단히 흥미로운 주제입니다."}, {"start": 1388.0, "end": 1393.0, "text": "이런 방식의 대규모 배포가 제대로<br>작동하기 힘든 주요 원인이기도 하죠."}, {"start": 1393.0, "end": 1402.0, "text": "앞서 말씀드렸듯 개별 상호작용의<br>완벽한 신뢰성이 보장되지 않는다면,"}, {"start": 1402.0, "end": 1409.0, "text": "수많은 상호작용이 일어나는 대규모 시스템은<br>통계적으로 실패할 수밖에 없습니다."}, {"start": 1409.0, "end": 1416.0, "text": "실행에 막대한 연산력과 에너지,<br>비용이 들어 신뢰할 수 없다면"}, {"start": 1416.0, "end": 1423.0, "text": "시작조차 할 수 없죠. 에이전트 함정은<br>저희가 꽤 오래 고민해 온 문제입니다."}, {"start": 1423.0, "end": 1430.0, "text": "다양한 형태로 나타나지만 핵심은<br>에이전트가 특정 환경에서 작동한다는 점입니다."}, {"start": 1430.0, "end": 1437.0, "text": "여기서 환경은 바로 웹입니다.<br>환경 자체가 오염되어 함정이 놓여 있다면,"}, {"start": 1437.0, "end": 1446.0, "text": "에이전트가 웹을 탐색하다 걸려들 수 있고,<br>악의적인 사람이나 악성 에이전트가"}, {"start": 1446.0, "end": 1453.0, "text": "함정을 설치해 시스템을 침해할 수 있죠.<br>예를 들어 결혼식용 와인을"}, {"start": 1453.0, "end": 1461.0, "text": "구매하는 에이전트가 와인 사이트에 접속했는데<br>그곳에 프롬프트 인젝션이 심어져 있어서"}, {"start": 1461.0, "end": 1467.0, "text": "에이전트의 목표를 바꿔버리는<br>그런 상황을 말씀하시는 건가요?"}, {"start": 1467.0, "end": 1473.0, "text": "그런 방식도 가능합니다, 맞아요.<br>이게 눈에 띄지 않고 넘어갈 수 있는 이유는"}, {"start": 1473.0, "end": 1479.0, "text": "웹 페이지 구조상 화면에 시각적으로<br>표시되지 않는 요소들이 있기 때문입니다."}, {"start": 1479.0, "end": 1486.0, "text": "인간처럼 웹페이지의 픽셀을 보는<br>시각적 컴퓨터 제어 에이전트가 아니라,"}, {"start": 1486.0, "end": 1492.0, "text": "웹페이지의 원본 데이터 포맷을<br>그대로 읽어 들이는 에이전트라면,"}, {"start": 1492.0, "end": 1500.0, "text": "숨겨진 토큰을 무심코 읽어 들여서<br>원래 의도와는 완전히 다른 행동을"}, {"start": 1500.0, "end": 1506.0, "text": "하게 만들 수도 있죠.<br>하지만 이 방법뿐만이 아닙니다."}, {"start": 1506.0, "end": 1513.0, "text": "악성 사이트는 '다이내믹 클로킹'이라는<br>기법을 사용할 수도 있습니다."}, {"start": 1513.0, "end": 1519.0, "text": "인간과 에이전트에게 페이지를 다르게 보여주죠.<br>페이지 내 행동 패턴을 보면"}, {"start": 1519.0, "end": 1524.0, "text": "접속한 대상이 사람인지 에이전트인지<br>매우 정확하게 파악할 수 있거든요."}, {"start": 1524.0, "end": 1530.0, "text": "에이전트가 특정 의도로 접속했을 때만<br>콘텐츠를 교묘하게 변경하여"}, {"start": 1530.0, "end": 1536.0, "text": "탈옥(Jailbreak)을 유도하는 식입니다.<br>여기서 한 걸음 더 나아가 보면,"}, {"start": 1536.0, "end": 1542.0, "text": "사용자의 돈을 빼돌리거나 온갖 일을<br>벌이도록 설계된 함정도 있을 수 있겠네요."}, {"start": 1542.0, "end": 1548.0, "text": "맞습니다. 실제로 에이전트를 실험하며<br>지갑 접근 권한을 부여했던 사람들에게"}, {"start": 1548.0, "end": 1553.0, "text": "실제로 일어났던 일입니다.<br>말씀하셨듯 개발 초기 단계에서는"}, {"start": 1553.0, "end": 1560.0, "text": "내부적으로 실험할 때 신뢰할 수 있는<br>안전한 환경에서 진행되기 때문에,"}, {"start": 1560.0, "end": 1566.0, "text": "초기 프로토타입 단계에선 이런 문제를<br>겪지 않아도 됩니다. 실제 환경이 아니니까요."}, {"start": 1566.0, "end": 1572.0, "text": "하지만 웹에 배포되고 나면, 특히 지금처럼<br>온갖 곳에서 AI가 활용되는 상황에서는"}, {"start": 1572.0, "end": 1579.0, "text": "에이전트가 늘어날수록 악의적인 공격을<br>시도할 동기도 훨씬 커집니다."}, {"start": 1579.0, "end": 1586.0, "text": "공격할 수 있는 접점이 훨씬 넓어지니까요.<br>그리고 이제는 웹 콘텐츠의 대부분이"}, {"start": 1586.0, "end": 1594.0, "text": "에이전트에 의해 생성되고 소비되면서,<br>에이전트의 웹 사용량이"}, {"start": 1594.0, "end": 1599.0, "text": "사상 처음으로 인간을 넘어서는 셈이죠.<br>두 가지 짚고 싶은데요, 먼저"}, {"start": 1599.0, "end": 1605.0, "text": "웹이 두 가지 다른 형태로 나뉘는 단계로<br>진입하고 있다는 말씀처럼 들리네요."}, {"start": 1605.0, "end": 1611.0, "text": "다이내믹 클로킹 등으로 나뉘는<br>인간용 버전과 에이전트용 버전 말이죠."}, {"start": 1611.0, "end": 1616.0, "text": "광고가 더 이상 무의미해지고,<br>사람들의 시선을 끌 필요가 없는 웹이죠."}, {"start": 1616.0, "end": 1620.0, "text": "물건을 팔 대상도 아니죠. 하지만<br>여기서 두 번째 의문은 대체 어떻게"}, {"start": 1620.0, "end": 1626.0, "text": "통제권이 없는 웹 환경에서 이에 대응하고,<br>도대체 어떻게 에이전트가 탈선하지 않도록"}, {"start": 1626.0, "end": 1633.0, "text": "보호하느냐는 거죠. 어떤 면에서는<br>새로운 문제는 아닙니다. 웹 보안은"}, {"start": 1633.0, "end": 1641.0, "text": "이전부터 다양한 방식으로 문제가 되었고,<br>컴퓨터 바이러스도 이메일의 첨부파일을"}, {"start": 1641.0, "end": 1647.0, "text": "잘못 열거나 신뢰할 수 없는 페이지를<br>클릭했을 때 퍼지곤 했으니까요. 따라서"}, {"start": 1647.0, "end": 1653.0, "text": "상호작용하는 리소스를 검증해야 할 필요성을<br>처음 겪는 건 아닙니다. 머신러닝 시스템에서도"}, {"start": 1653.0, "end": 1662.0, "text": "적대적 공격 사례가 오래전부터 있었죠.<br>사람 눈에 띄지 않는 미세한 이미지 변형으로도"}, {"start": 1662.0, "end": 1668.0, "text": "모델을 무력화할 수 있었습니다. 여기서도<br>군데군데 몇 픽셀을 수정하거나"}, {"start": 1668.0, "end": 1674.0, "text": "인코딩의 최하위 비트(LSB)를 여러 곳에서<br>수정하는 방식으로 조작할 수 있습니다."}, {"start": 1674.0, "end": 1679.0, "text": "사람이 알아채지 못할 만큼 미세하게<br>조정하더라도 에이전트에는 여전히"}, {"start": 1679.0, "end": 1684.0, "text": "부정적인 영향을 미칠 수 있습니다.<br>말씀을 듣고 보니 가드레일을 구축하고"}, {"start": 1684.0, "end": 1692.0, "text": "안전을 고민할 때는 에이전트 자체뿐 아니라<br>에이전트 외부 환경까지 함께 고려해야"}, {"start": 1692.0, "end": 1699.0, "text": "한다는 뜻으로 들리네요.<br>맞습니다. 둘 다 고려해야 합니다."}, {"start": 1699.0, "end": 1704.0, "text": "저희의 다른 연구에서도 다룬 개념인데,<br>여기서도 매우 중요한 개념이 바로"}, {"start": 1704.0, "end": 1710.0, "text": "'심층 방어(defense in depth)'입니다.<br>결코 새로운 아이디어는 아니며,"}, {"start": 1710.0, "end": 1717.0, "text": "문제가 워낙 복잡하기에 단 하나의<br>해결책으로 모든 문제를 풀 수는 없다는"}, {"start": 1717.0, "end": 1726.0, "text": "인식에서 출발하죠. 따라서 완화 조치를<br>겹겹이 쌓아 올려 다층적으로 방어하면"}, {"start": 1726.0, "end": 1733.0, "text": "그물이 촘촘해져 빠져나가는 위협이<br>거의 없을 것입니다. 그런 맥락에서"}, {"start": 1733.0, "end": 1741.0, "text": "웹페이지 콘텐츠를 검증하고 테스트하며,<br>상호작용하는 리소스에 대한 높은 수준의"}, {"start": 1741.0, "end": 1748.0, "text": "신뢰 기준을 세워야 합니다. 또한 에이전트와<br>기반 모델 측면 모두에 완화책을 두고,"}, {"start": 1748.0, "end": 1755.0, "text": "문제 발생 시 개입할 수 있는 실질적인<br>인간 통제 장치를 마련해야 하죠."}, {"start": 1755.0, "end": 1764.0, "text": "에이전트 권한 부여에도 매우 신중하여<br>상호작용 중 탈옥이 발생하더라도"}, {"start": 1764.0, "end": 1769.0, "text": "피해를 최소화해야 합니다. 이 모든 조치가<br>결합될 때 비로소 안심할 수 있는"}, {"start": 1769.0, "end": 1774.0, "text": "안전성을 확보할 수 있죠.<br>앞서 나누던 이야기로 돌아가서,"}, {"start": 1774.0, "end": 1779.0, "text": "여러 에이전트가 서로 상호작용한다는<br>개념에 대해 조금 더 여쭙고 싶은데요."}, {"start": 1779.0, "end": 1786.0, "text": "공식적인 '에이전트 경제'라는 개념이<br>어떻게 작동하는지 설명해 주시겠어요? 네,"}, {"start": 1786.0, "end": 1793.0, "text": "일상에서 기술을 사용하는 일반적인<br>사용자 입장을 생각해 봅시다. 사용자에게는"}, {"start": 1793.0, "end": 1800.0, "text": "자신을 지속적으로 기억하고 취향과 선호를<br>잘 이해하는 개인 비서가 있을 수 있죠."}, {"start": 1800.0, "end": 1806.0, "text": "이 비서에게 부여하는 자율성에 따라,<br>비서가 사용자를 대신해 무언가를"}, {"start": 1806.0, "end": 1812.0, "text": "협상할 수도 있죠. 예산을 줄 수도 있고요.<br>그러면 비서들이 상호 협상하는 일종의"}, {"start": 1812.0, "end": 1817.0, "text": "국지적 경제가 형성될 수 있습니다.<br>실제로 어떻게 작동할지 감을 잡고 싶은데요,"}, {"start": 1817.0, "end": 1823.0, "text": "많은 사람이 에이전트를 개인 비서로<br>사용하고 있다고 가정해 보죠. 만약"}, {"start": 1823.0, "end": 1829.0, "text": "테일러 스위프트 콘서트 같은 대형 공연의<br>티켓 예매가 막 시작되었다면,"}, {"start": 1829.0, "end": 1835.0, "text": "모든 에이전트가 예매 사이트로 몰릴 때<br>실제로는 어떻게 진행될까요? 제가 최근에"}, {"start": 1835.0, "end": 1842.0, "text": "경쟁이 치열한 티켓을 사본 적은 없지만,<br>원칙적으로... 제 음악 취향은"}, {"start": 1842.0, "end": 1848.0, "text": "전혀 다른 쪽이라서요.<br>어떤 음악을 들으시는데요? 글쎄요,"}, {"start": 1848.0, "end": 1855.0, "text": "잘 알려지지 않은 메탈 하위 장르를 듣습니다.<br>좋아요, 비주류 메탈 밴드가"}, {"start": 1855.0, "end": 1861.0, "text": "콘서트를 열고 여러 에이전트 간에<br>경매가 진행된다면, 승자를 어떻게 결정하나요?"}, {"start": 1861.0, "end": 1867.0, "text": "가장 많은 돈을 낸 쪽이 이기는 건가요?<br>그건 설계상의 선택 문제이며,"}, {"start": 1867.0, "end": 1874.0, "text": "중요한 점은 우리가 그런 시스템을 만든다면<br>어떻게 공정하게 만들지 결정할"}, {"start": 1874.0, "end": 1880.0, "text": "통제권이 우리에게 있다는 것입니다.<br>경매를 설계하는 사람의 명시적 결정에 달렸죠."}, {"start": 1880.0, "end": 1887.0, "text": "모두가 특정 재화, 즉 이번 경우에는<br>콘서트 티켓에 동등하게 접근할 수 있도록"}, {"start": 1887.0, "end": 1894.0, "text": "완전히 공정하게 만들고자 한다면,<br>반복되는 경매에 참여하는 모든 에이전트에게"}, {"start": 1894.0, "end": 1902.0, "text": "단일 티켓 경매뿐만 아니라 전체 구매에 걸쳐<br>동일한 예산을 부여할 수 있습니다."}, {"start": 1902.0, "end": 1910.0, "text": "그러면 에이전트는 사용자의 전반적인 선호도와<br>특정 아티스트를 보고 싶어 하는 열망,"}, {"start": 1910.0, "end": 1919.0, "text": "여행 일정과 시간적 제약 등을 파악해<br>그 예산을 최적으로 배분할 수 있죠."}, {"start": 1919.0, "end": 1925.0, "text": "즉, 사용자의 바람을 가장 잘 반영하여<br>원하는 방식으로 티켓을 확보할 확률을"}, {"start": 1925.0, "end": 1931.0, "text": "높이게 됩니다. 이를 전체 인구 집단으로<br>확장하여 종합적으로 살펴보면,"}, {"start": 1931.0, "end": 1938.0, "text": "사회 전체 차원에서 공정한 결과를 기대할 수 있죠.<br>제 생각에는 이미 인간 사회에서도"}, {"start": 1938.0, "end": 1946.0, "text": "추첨제나 포인트 제도 등 이를 해결하기 위한<br>다양한 방식들을 고안해 왔듯이,"}, {"start": 1946.0, "end": 1951.0, "text": "사람들이 과거에 고안했던 방식이죠.<br>콘서트 티켓이라는 단순한 예시를 넘어서요."}, {"start": 1951.0, "end": 1958.0, "text": "물론 누군가에겐 결코 단순하지 않겠지만,<br>제가 생각하는 또 다른 혼란의 예시는"}, {"start": 1958.0, "end": 1966.0, "text": "주식 시장의 고주파 매매 알고리즘인데요.<br>에이전트 역시 특정 방식으로 배포되면"}, {"start": 1966.0, "end": 1971.0, "text": "시장에 치명적인 영향을 줄 수 있잖아요.<br>순간 폭락(플래시 크래시)은 어떻게 막나요?"}, {"start": 1971.0, "end": 1978.0, "text": "말씀대로 분명 더 큰 위험이 있지만,<br>금융 시장은 이런 위험을 오랫동안 다뤄왔습니다."}, {"start": 1978.0, "end": 1984.0, "text": "초기에는 일이 잘못되면서 적잖게<br>쓰라린 경험을 겪기도 했지만요."}, {"start": 1984.0, "end": 1991.0, "text": "이미 이를 겪어낸 경제 시스템에서<br>위험 완화 방안을 배울 수 있으므로,"}, {"start": 1991.0, "end": 1999.0, "text": "바퀴를 다시 발명할 필요는 없습니다.<br>물론 에이전트의 경우는 약간 다른 면이 있죠."}, {"start": 1999.0, "end": 2007.0, "text": "현재 AI 에이전트를 논할 때의 차이점은,<br>극소수의 대표적인 언어 모델들이"}, {"start": 2007.0, "end": 2014.0, "text": "주로 쓰인다는 점입니다. Claude, GPT,<br>Gemini 등을 살펴보면요. 물론 오픈소스나"}, {"start": 2014.0, "end": 2025.0, "text": "다른 모델도 많지만, 이들은 대개<br>비슷한 의견과 유사한 행동 방식을 보입니다."}, {"start": 2025.0, "end": 2033.0, "text": "이를 '인지적 단일문화'라고 부르는데요.<br>수십만, 수백만 개의 인공 의사결정자를"}, {"start": 2033.0, "end": 2041.0, "text": "배포했을 때 모두 비슷한 결정을 내린다면,<br>결정이 연결되어 실패 지점도 연쇄적으로 발생하죠."}, {"start": 2041.0, "end": 2050.0, "text": "따라서 우리는 에이전트들의 결정을<br>어떻게 다양화할지 고민해야 합니다."}, {"start": 2050.0, "end": 2056.0, "text": "시스템의 숙련된 사용자(파워 유저)라면<br>직접 설정해서 해결할 수도 있습니다."}, {"start": 2056.0, "end": 2064.0, "text": "매우 정교한 시스템 프롬프트를 통해<br>에이전트에 특정 개성을 부여하고"}, {"start": 2064.0, "end": 2071.0, "text": "특정 결정에 대한 선호도를 줄 수 있죠.<br>하지만 대부분은 그렇게까지 하지 않습니다."}, {"start": 2071.0, "end": 2077.0, "text": "- 결국 에이전트 집단 사고가 생기겠네요.<br>- 맞습니다. 집단 사고뿐만 아니라"}, {"start": 2077.0, "end": 2085.0, "text": "'담합' 문제도 있습니다. 앞서 말씀하신<br>사람들의 경매에서도 담합이 존재하잖아요."}, {"start": 2085.0, "end": 2093.0, "text": "집단이 입찰을 조율해 이득을 취하듯이요.<br>그런데 에이전트의 경우에는"}, {"start": 2093.0, "end": 2099.0, "text": "눈에 띄지 않게 환경을 매개로<br>서로 조율할 수 있다는 점이 다릅니다."}, {"start": 2099.0, "end": 2107.0, "text": "직접 소통 없이도 조율이 가능한 거죠.<br>따라서 담합 방지 대책도 고민해야 합니다."}, {"start": 2107.0, "end": 2113.0, "text": "에이전트가 세상에 나왔을 때의 행동이나<br>안전에 관한 우려들을 상세히 들으니,"}, {"start": 2113.0, "end": 2117.0, "text": "왜 그토록 신중하게 다루는지<br>훨씬 더 잘 이해가 되는 것 같습니다."}, {"start": 2117.0, "end": 2124.0, "text": "- 조심스럽고 천천히 출시하는 이유죠?<br>- 네, 그렇습니다."}, {"start": 2124.0, "end": 2129.0, "text": "주요 기술적 파괴와 혁신이 있을 때마다<br>언제나 그래왔던 이야기라고 봅니다."}, {"start": 2129.0, "end": 2135.0, "text": "자율주행차를 예로 들어보자면,<br>비록 전혀 다른 분야의 기술이긴 하지만"}, {"start": 2135.0, "end": 2142.0, "text": "스스로 달리는 차량 시연을 보며<br>오랫동안 큰 기대를 품어왔잖아요."}, {"start": 2142.0, "end": 2149.0, "text": "하지만 도로에서 안전하게 달리기까지는<br>수많은 시간과 노력이 더 필요했습니다."}, {"start": 2149.0, "end": 2156.0, "text": "대부분의 작업이 바로 그 '라스트 마일'에<br>집중되기 때문입니다. 에이전트 조율도 그렇죠."}, {"start": 2156.0, "end": 2164.0, "text": "에이전트가 인간 같은 일을 하도록 만들려면<br>기술적 해결책만으로는 부족합니다."}, {"start": 2164.0, "end": 2171.0, "text": "정책뿐 아니라 이러한 시스템을 통합할<br>폭넓은 사회적 이해가 함께 필요하죠."}, {"start": 2171.0, "end": 2176.0, "text": "미래에 완전 자율 에이전트 경제가<br>실현될 수도 있겠지만,"}, {"start": 2176.0, "end": 2182.0, "text": "지금은 사람이 시스템에 직접<br>개입(Human-in-the-loop)해야 합니다."}, {"start": 2182.0, "end": 2190.0, "text": "- 인간 구조와 AI가 서로 잘 맞물려야 하죠.<br>- 반대의 긍정적 측면도 있을 것 같아요."}, {"start": 2190.0, "end": 2195.0, "text": "인간 사회는 함께 뭉쳤을 때 집단적으로<br>놀라운 일들을 해내기도 하잖아요."}, {"start": 2195.0, "end": 2203.0, "text": "- 에이전트 사회도 마찬가지 아닐까요?<br>- 바로 그런 기대를 할 수 있죠."}, {"start": 2203.0, "end": 2209.0, "text": "멀티 에이전트 시스템을 쓰는 이유도<br>거기에 있죠. 처음에 병렬화를 언급했듯이,"}, {"start": 2209.0, "end": 2216.0, "text": "모든 에이전트의 역량이 같고<br>비슷한 일을 수행한다면,"}, {"start": 2216.0, "end": 2222.0, "text": "순차적으로 하든 병렬로 처리하든<br>약간의 속도 향상만 얻을 뿐입니다."}, {"start": 2222.0, "end": 2228.0, "text": "하지만 각기 다른 방식으로 다른 일을<br>하는 에이전트가 있다면 정말 흥미로워집니다."}, {"start": 2228.0, "end": 2233.0, "text": "범용 에이전트만 이야기하느라<br>아직 언급하지 않은 부분이 있는데요."}, {"start": 2233.0, "end": 2240.0, "text": "에이전트 경제의 핵심은 범용 모델뿐 아니라<br>특화된 '전문 에이전트'의 존재입니다."}, {"start": 2240.0, "end": 2248.0, "text": "물론 지금은 모두가 최대한 범용적이고<br>뛰어난 에이전트를 만들려 하고 있고,"}, {"start": 2248.0, "end": 2255.0, "text": "우리가 추구하는 AGI에도 '범용(G)'이<br>들어가지만, 경제적인 관점에서 볼 때—"}, {"start": 2255.0, "end": 2260.0, "text": "제 개인적 견해로는, 범용성만이<br>최종 수렴 지점(종착지)은 아닙니다."}, {"start": 2260.0, "end": 2267.0, "text": "저를 예로 들면, 저는 체스를 병적으로<br>너무 많이 두는 체스 광인데요."}, {"start": 2267.0, "end": 2271.0, "text": "딥마인드에서 체스 AI 연구를 하기도 했고요.<br>체스를 명확한 예시로 들어보겠습니다."}, {"start": 2271.0, "end": 2278.0, "text": "우리 모두가 좋아하는 게임이죠. Gemini나<br>다른 모델도 체스를 어느 정도 둘 수 있죠."}, {"start": 2278.0, "end": 2282.0, "text": "오랫동안 두지 못하다가 발전한 것이지만,<br>실제 체스를 둘 때는 결국..."}, {"start": 2282.0, "end": 2290.0, "text": "여전히 전용 체스 엔진을 사용할 겁니다.<br>훨씬 빠르고 정확하며 비용도 훨씬 저렴하죠."}, {"start": 2290.0, "end": 2295.0, "text": "오직 한 가지 일만 완벽히 해내도록 설계되어<br>더 적은 매개변수로도 충분하고,"}, {"start": 2295.0, "end": 2300.0, "text": "그 한 가지 작업에만 온전히 집중하니까요.<br>인간에게 빗대어 봐도 마찬가지입니다."}, {"start": 2300.0, "end": 2306.0, "text": "우리가 AGI에 관해 이야기할 때<br>종종 범하는 실수 중 하나는,"}, {"start": 2306.0, "end": 2311.0, "text": "본래 취지인 '인간 개인 수준'이 아니라<br>'인류 전체 수준의 지능'으로"}, {"start": 2311.0, "end": 2318.0, "text": "바라본다는 점입니다. 즉, 어떤 인간이든<br>할 수 있는 모든 것을 해내는 지능이죠."}, {"start": 2318.0, "end": 2323.0, "text": "하지만 그 많은 일을 한 번에 해낼 수 있는<br>인간은 존재하지 않습니다. 저만 해도"}, {"start": 2323.0, "end": 2328.0, "text": "악기 연주처럼 배우고 싶지만<br>할 줄 모르는 일들이 아주 많으니까요."}, {"start": 2328.0, "end": 2334.0, "text": "인간의 뇌 용량과 시간은 한계가 있으니까요.<br>결국 아주 비싸고 느린"}, {"start": 2334.0, "end": 2342.0, "text": "거대 모델 하나를 만들기보다는,<br>전문가들로 구성된 사회처럼"}, {"start": 2342.0, "end": 2349.0, "text": "필요에 따라 유연하게 확장할 수 있는<br>전문 모델들의 생태계를 만드는 것이죠."}, {"start": 2349.0, "end": 2355.0, "text": "구조적 혁신이라기보다는 작업을 분할하고,<br>특정 능력에 특화된 모델을 두는 거죠."}, {"start": 2355.0, "end": 2362.0, "text": "이런 전문 모델은 구동 비용이 저렴하고<br>신뢰성도 훨씬 높기 때문에,"}, {"start": 2362.0, "end": 2369.0, "text": "그렇게 하지 않을 경제적 이유가 없습니다.<br>따라서 미래에는 전체를 조율하는"}, {"start": 2369.0, "end": 2378.0, "text": "결합 조직 역할을 하는 범용 계층이<br>모든 것을 파악하고 총괄 지휘하며,"}, {"start": 2378.0, "end": 2384.0, "text": "특정 작업마다 다른 모델을 호출하겠죠.<br>말씀하신 건 AGI라기보다는"}, {"start": 2384.0, "end": 2391.0, "text": "일종의 '분산 지능'에 가깝네요.<br>인간 사회가 그렇듯 말이죠. 만약 그것이"}, {"start": 2391.0, "end": 2398.0, "text": "우리가 마주할 AGI의 형태라면,<br>(따옴표를 붙여 표현하자면요) 이것이"}, {"start": 2398.0, "end": 2405.0, "text": "여러 에이전트로 분산된 환경에서<br>안전과 정렬에 대한 생각도 바뀌어야 할까요?"}, {"start": 2405.0, "end": 2411.0, "text": "100% 그렇습니다. 더 이상 단일 개체를<br>정렬하는 문제가 아니니까요."}, {"start": 2411.0, "end": 2418.0, "text": "분산된 전체를 하나로 볼 수도 있겠지만,<br>현재의 AI 정렬 방식은"}, {"start": 2418.0, "end": 2428.0, "text": "단일 모델의 행동을 관찰하고, 이를 우리가<br>허용 가능하다고 여기는 방향에 맞추는 것이죠."}, {"start": 2428.0, "end": 2436.0, "text": "바람직한 방향으로요. 하지만 만약 만 개의<br>에이전트가 복잡하게 상호작용한다면,"}, {"start": 2436.0, "end": 2441.0, "text": "전체 시스템을 정렬하거나 그 실체를<br>파악하는 것조차 결코 쉽지 않습니다."}, {"start": 2441.0, "end": 2448.0, "text": "이런 분산 환경에서는 에이전트 A가<br>오늘은 B와, 내일은 다른 작업에서"}, {"start": 2448.0, "end": 2456.0, "text": "C와 상호작용하고, C는 D에게 일을 위임하며<br>D는 특정 단계에서 인간에게 자문을 구할 수도"}, {"start": 2456.0, "end": 2461.0, "text": "있으니까요. 전체 시스템을 조율하기 위해<br>인간 사회에서 배운 방법 중 하나는"}, {"start": 2461.0, "end": 2468.0, "text": "바로 경제적 유인을 활용하는 것입니다.<br>만약 에이전트 경제를 잘 설계하여"}, {"start": 2468.0, "end": 2475.0, "text": "에이전트가 이익을 극대화하면서도<br>피해를 주지 않도록 유도할 수 있다면,"}, {"start": 2475.0, "end": 2483.0, "text": "분산된 에이전트 사회를 정렬할 수 있는<br>출발점이 될 수 있습니다. 그렇다고 해서"}, {"start": 2483.0, "end": 2488.0, "text": "현재 연구가 불필요하다는 뜻은 아닙니다.<br>집단 차원의 안전을 위해서는"}, {"start": 2488.0, "end": 2494.0, "text": "개별 에이전트의 안전이 전제되어야 하지만,<br>집단 수준의 안전장치 마련에도"}, {"start": 2494.0, "end": 2498.0, "text": "지금보다 훨씬 더 많은 노력이 필요하죠.<br>— 해야 할 일이 정말 많네요. — 맞습니다."}, {"start": 2498.0, "end": 2505.0, "text": "— 짧은 시간 안에요. — 네, 그렇습니다.<br>정말 흥미로운 이야기였습니다. 감사합니다."}, {"start": 2505.0, "end": 2512.0, "text": "보통 에이전트는 프롬프트를 주고받거나<br>응답을 기다릴 필요가 적은 AI로 여겨집니다."}, {"start": 2512.0, "end": 2517.0, "text": "주어진 일을 알아서 척척 해내는 존재죠.<br>하지만 네나드의 말 중 특히 흥미로웠던 점은,"}, {"start": 2517.0, "end": 2525.0, "text": "단일 에이전트에만 집중하면 더 큰 그림을<br>놓친다는 것입니다. 개별 에이전트들이 모여"}, {"start": 2525.0, "end": 2533.0, "text": "전문가와 제너럴리스트, 위임 에이전트가 모여<br>거대한 '에이전트 사회'를 이룬다는 점이죠."}, {"start": 2533.0, "end": 2538.0, "text": "세부 사항에 집중하는 에이전트까지요.<br>특히 제 기억에 깊이 남을 메시지는"}, {"start": 2538.0, "end": 2548.0, "text": "궁극적 목표는 '인간 수준의 지능'이 아닌,<br>'인류 전체의 지능'을 구현하는 것일지도요."}, {"start": 2548.0, "end": 2554.0, "text": "해나 프라이의 구글 딥마인드 팟캐스트였습니다.<br>이번 에피소드가 마음에 드셨다면"}, {"start": 2554.0, "end": 2558.0, "text": "유튜브 채널 구독 잊지 마세요.<br>다음 시즌에 뵙겠습니다!"}];
let player;
let playerReady = false;
function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        videoId:videoId,
        playerVars:{
            autoplay:1,
            controls:1,
            rel:0,
            modestbranding:1,
            fs:0,
            disablekb:1,
            cc_load_policy:0,
            iv_load_policy:3,
            enablejsapi:1,
            playsinline:1,
            origin: window.location.origin || (window.location.protocol + '//' + window.location.host),
            widget_referrer: window.location.href
        },
        events:{
            'onReady': function(e){ 
                playerReady = true;
                // [V168.2] 즉시 재생 트리거 (최신 유튜브 임베드 뺑뺑이/버퍼링 방지 🚀⚡)
                try {
                    var p = e.target.playVideo();
                    if (p && typeof p.catch === 'function') {
                        p.catch(function() {
                            try { e.target.mute(); e.target.playVideo(); } catch(ex) {}
                        });
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// [V168.2] 사용자의 첫 인터랙션 시 플레이어가 대기 중이면 즉시 쾌속 재생 🖱️⚡
function ensurePlayback(){
    if (player && typeof player.playVideo === 'function' && typeof player.getPlayerState === 'function') {
        var st = player.getPlayerState();
        if (st === -1 || st === 2 || st === 5) {
            try { player.playVideo(); } catch(err) {}
        }
    }
}
window.addEventListener('click', ensurePlayback, {once: true});
window.addEventListener('keydown', ensurePlayback, {once: true});
window.addEventListener('touchstart', ensurePlayback, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});
let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
