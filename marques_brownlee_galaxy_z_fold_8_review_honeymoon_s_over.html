: 222.264, "end": 225.25900000000001, "text": "다른 폴드처럼 가벼운 업무도 거뜬히 하지."}, {"start": 225.25900000000001, "end": 226.651, "text": "하지만 세로로 앱 하나만"}, {"start": 226.651, "end": 228.25900000000001, "text": "띄워 쓰기에도 아주 괜찮아."}, {"start": 228.25900000000001, "end": 229.91899999999998, "text": "가로로 화면을 돌렸을 때는"}, {"start": 229.91899999999998, "end": 231.46, "text": "책 읽기에 아주 유용해."}, {"start": 231.46, "end": 233.496, "text": "오랫동안 손에 쥐고 있어도"}, {"start": 233.496, "end": 236.25900000000001, "text": "아주 얇고 그립감이 훌륭한 기기야."}, {"start": 236.25900000000001, "end": 238.102, "text": "4:3 화면이 영상 시청에"}, {"start": 238.102, "end": 240.34, "text": "별로라고 생각할 수도 있겠지만,"}, {"start": 240.34, "end": 242.659, "text": "놀랍게도 울트라보다"}, {"start": 242.659, "end": 247.3, "text": "와이드스크린 영상을 더 크게 보여줘."}, {"start": 247.3, "end": 249.122, "text": "알고 보면 4:3 화면이 정사각형보다"}, {"start": 249.122, "end": 251.219, "text": "가로로 넓어서 미디어가 크게 나오는 거지."}, {"start": 251.219, "end": 253.637, "text": "그리고 가끔 인터넷에 올라오는"}, {"start": 253.637, "end": 256.66, "text": "구형 또는 최신 4:3 비율 영상들은"}, {"start": 256.66, "end": 258.49, "text": "기가 막히게 잘 보여."}, {"start": 258.49, "end": 261.54, "text": "'오디세이' 영화 같은 것들 말이야."}, {"start": 261.54, "end": 263.185, "text": "얼마나 환상적일지 상상이 가지?"}, {"start": 263.185, "end": 265.22, "text": "박스에서 꺼내자마자 화면에 반할 거야."}, {"start": 265.22, "end": 266.92, "text": "가볍고 열고 닫기도 편한 데다,"}, {"start": 266.92, "end": 268.62, "text": "그냥 다루는 것 자체가 즐겁지."}, {"start": 268.62, "end": 269.819, "text": "게다가 스펙상으로도 훌륭해."}, {"start": 269.72, "end": 270.92, "text": "갤럭시 전용인 최신"}, {"start": 270.92, "end": 272.12, "text": "스냅드래곤 8 Gen Elite가 탑재됐거든."}, {"start": 271.92, "end": 273.67, "text": "삼성도 마침내 배터리에"}, {"start": 273.67, "end": 275.42, "text": "실리콘을 넣기 시작했죠"}, {"start": 275.72, "end": 277.55, "text": "오포, 비보, 샤오미처럼"}, {"start": 277.55, "end": 278.819, "text": "공격적이진 않지만"}, {"start": 278.819, "end": 280.747, "text": "폰에 4,800mAh 용량의"}, {"start": 280.747, "end": 282.42, "text": "배터리를 넣기엔 충분하죠"}, {"start": 282.62, "end": 283.819, "text": "이 정도면 온종일 쓰기에"}, {"start": 283.819, "end": 285.019, "text": "충분하다는 게 증명됐죠"}, {"start": 284.819, "end": 286.319, "text": "화면을 크게 많이 쓰더라도요"}, {"start": 286.319, "end": 287.519, "text": "게다가 45W라는"}, {"start": 287.519, "end": 289.019, "text": "꽤 훌륭한 속도로 충전되는데"}, {"start": 289.019, "end": 291.247, "text": "역대 삼성 폴더블폰 중"}, {"start": 291.247, "end": 292.92, "text": "가장 빠른 속도죠"}, {"start": 293.319, "end": 295.019, "text": "드디어 제대로 해낸 것 같네요"}, {"start": 295.019, "end": 296.42, "text": "하지만 계속 쓰다 보면 말이죠"}, {"start": 296.42, "end": 298.1, "text": "앱을 다 깔고 일상적으로 쓰며"}, {"start": 298.1, "end": 299.36, "text": "패턴이 생기기 시작하고"}, {"start": 299.36, "end": 300.56, "text": "배터리 충방전 사이클을"}, {"start": 300.56, "end": 301.759, "text": "몇 번 거치면서"}, {"start": 301.199, "end": 302.399, "text": "기기를 진짜 깊이 알아가고"}, {"start": 302.399, "end": 303.6, "text": "사용하며 내구성도"}, {"start": 303.6, "end": 304.86, "text": "테스트해 보게 되죠"}, {"start": 304.86, "end": 306.06, "text": "그러면서 점차"}, {"start": 306.06, "end": 307.259, "text": "몇 가지 단점이 보이기 시작하죠"}, {"start": 307.04, "end": 308.6, "text": "처음에는 대수롭지 않게"}, {"start": 308.6, "end": 310.16, "text": "여겼던 부분들 말이에요"}, {"start": 310.16, "end": 311.36, "text": "예를 들어 모든 앱이"}, {"start": 311.36, "end": 312.56, "text": "다 잘 호환되지는 않죠"}, {"start": 312.199, "end": 313.839, "text": "이 화면 비율에 말이죠"}, {"start": 313.839, "end": 315.399, "text": "때로는 그냥 넘길 수 있지만"}, {"start": 315.399, "end": 316.6, "text": "은근히 불편하기도 하고"}, {"start": 316.6, "end": 318.012, "text": "양옆에 어색한 검은색 바가"}, {"start": 318.012, "end": 319.211, "text": "생기기도 하거든요"}, {"start": 318.92, "end": 320.12, "text": "아니면 빈 화면만"}, {"start": 320.12, "end": 321.319, "text": "넓게 남게 되죠."}, {"start": 320.639, "end": 322.012, "text": "하지만 때로는 앱이"}, {"start": 322.012, "end": 324.759, "text": "완전히 먹통이 된다는 뜻이기도 해요."}, {"start": 324.759, "end": 326.721, "text": "제가 '크로시 로드'를 할 때처럼요."}, {"start": 326.721, "end": 327.92, "text": "놀리진 말아 주세요."}, {"start": 327.8, "end": 329.701, "text": "이 폰에선 시작 버튼을"}, {"start": 329.701, "end": 331.92, "text": "아예 누를 수가 없거든요."}, {"start": 331.92, "end": 333.822, "text": "전면 화면은 너무 짧고"}, {"start": 333.822, "end": 336.519, "text": "내부 화면마저 비율이 안 맞아서"}, {"start": 336.519, "end": 337.72, "text": "그렇다 보니"}, {"start": 337.519, "end": 338.72, "text": "그 버튼을 도무지"}, {"start": 338.72, "end": 339.92, "text": "나타나게 할 수가 없어요."}, {"start": 339.15999999999997, "end": 340.36, "text": "이 폰에선 이 게임이"}, {"start": 340.36, "end": 341.56, "text": "말 그대로 플레이 불가인 셈이죠."}, {"start": 341.56, "end": 343.327, "text": "어떤 다른 앱들을 쓰느냐에 따라"}, {"start": 343.327, "end": 345.199, "text": "저보다 이런 문제를 훨씬 더 많이"}, {"start": 345.199, "end": 346.399, "text": "겪으실 수도 있어요."}, {"start": 346.199, "end": 348.199, "text": "플렉스 모드도 지원하지 않죠."}, {"start": 348.199, "end": 349.947, "text": "열고 닫을 때 만족감을 주는"}, {"start": 349.947, "end": 352.15999999999997, "text": "멋진 스프링 힌지를 보셨을 텐데요,"}, {"start": 352.15999999999997, "end": 355.911, "text": "착 감기며 여닫히는 맛은 있지만,"}, {"start": 355.911, "end": 359.04, "text": "울트라처럼 반쯤 열어둔 채로"}, {"start": 359.04, "end": 361.706, "text": "고정하긴 어렵습니다. 억지로 세워둬도"}, {"start": 361.706, "end": 363.839, "text": "이를 활용할 소프트웨어 모드가"}, {"start": 363.839, "end": 365.608, "text": "전혀 지원되지 않거든요."}, {"start": 365.608, "end": 367.92, "text": "스피커 위치도 다소 애매한데요,"}, {"start": 367.92, "end": 369.959, "text": "닫았을 때는 소리도 괜찮고"}, {"start": 369.959, "end": 372.0, "text": "스피커가 각각 전면 상단과"}, {"start": 372.0, "end": 374.632, "text": "하단에 있어 스테레오로 들리지만,"}, {"start": 374.632, "end": 377.12, "text": "화면을 펼치면 두 스피커가 모두"}, {"start": 377.12, "end": 378.68, "text": "왼쪽으로 몰리게 됩니다."}, {"start": 378.68, "end": 381.439, "text": "그래서 영상을 전체 화면으로 볼 때 소리가"}, {"start": 381.439, "end": 383.194, "text": "한쪽으로 치우쳐 들려요. 솔직히 말해"}, {"start": 383.194, "end": 384.6, "text": "소리가 왼쪽에서만 나오니까요."}, {"start": 384.6, "end": 386.548, "text": "그게 바로 느껴집니다. 특정 무선 충전기에"}, {"start": 386.548, "end": 388.16, "text": "위치를 맞추는 것도 다소 번거롭죠."}, {"start": 388.16, "end": 390.293, "text": "특히 스마트폰을 세워두고 높이를 맞춰서"}, {"start": 390.293, "end": 391.92, "text": "정렬해야 하는 경우에 그렇죠."}, {"start": 391.92, "end": 394.427, "text": "차량용 충전기 중 상당수가 작동하지 않아요."}, {"start": 394.427, "end": 397.04, "text": "게다가 이 폰에는 자석이 내장되어 있지 않죠."}, {"start": 397.04, "end": 399.177, "text": "그래서 맥세이프 케이스가 없으면"}, {"start": 399.177, "end": 402.319, "text": "자주 쓰던 충전기들을 쓸 수 없어 아쉽습니다."}, {"start": 402.319, "end": 405.314, "text": "케이스 없이 탁자에 올려두면 덜덜거리고,"}, {"start": 405.314, "end": 408.72, "text": "가장 큰 단점은 카메라 수가 줄었다는 겁니다."}, {"start": 408.72, "end": 412.007, "text": "더 얇고 가벼운 폰이라 배터리를 확보하다 보니"}, {"start": 412.007, "end": 414.639, "text": "카메라를 넣을 공간이 부족했던 거죠."}, {"start": 414.639, "end": 417.274, "text": "그래서 5천만 화소 메인 카메라와"}, {"start": 417.274, "end": 420.639, "text": "초광각 렌즈뿐이고 망원 카메라는 없습니다."}, {"start": 420.639, "end": 423.689, "text": "나쁜 카메라는 아니지만, 일반적인 바형"}, {"start": 423.689, "end": 427.319, "text": "플래그십 스마트폰의 카메라만큼 좋지는 않아요."}, {"start": 427.319, "end": 430.235, "text": "아쉽게도 사진은 그저 평범한 수준입니다."}, {"start": 430.235, "end": 431.959, "text": "아주 선명하지도 않고요."}, {"start": 431.959, "end": 435.002, "text": "색감이 엄청나거나 저조도 성능이"}, {"start": 435.002, "end": 438.759, "text": "뛰어난 것도 아닌 딱 평범한 수준이죠."}, {"start": 438.759, "end": 442.031, "text": "트집 잡는 것처럼 들릴 수 있겠지만,"}, {"start": 442.031, "end": 446.12, "text": "이 폰 가격이 1,900달러라는 점을 고려하면"}, {"start": 446.12, "end": 449.841, "text": "최고급 카메라가 탑재되지 않았다는 사실이"}, {"start": 449.841, "end": 452.04, "text": "더욱 아쉽게 다가옵니다."}, {"start": 452.04, "end": 453.346, "text": "비싸고 좋은 폰이라면"}, {"start": 453.346, "end": 455.959, "text": "당연히 최고의 카메라를 갖춰야 하니까요."}, {"start": 455.959, "end": 458.555, "text": "이 폰을 실제로 사용하기 시작하면서"}, {"start": 458.555, "end": 461.56, "text": "이런 부분들이 눈에 들어오기 시작합니다."}, {"start": 461.56, "end": 465.13, "text": "폰을 깊이 써볼수록 완벽하지 않음을 느끼죠."}, {"start": 465.13, "end": 469.0, "text": "새로운 폼팩터의 신선함에 가려진 부분도 있어요."}, {"start": 469.0, "end": 471.096, "text": "여러 소프트웨어 기능들이 그렇죠."}, {"start": 471.096, "end": 474.36, "text": "안드로이드 17, 원 UI 9의 첫 테스트 기기죠."}, {"start": 474.36, "end": 477.694, "text": "그래서 잠금화면에 배경화면에 맞춰 움직이는"}, {"start": 477.694, "end": 481.319, "text": "멋진 반응형 시계가 생겼는데, 정말 멋집니다."}, {"start": 481.319, "end": 483.803, "text": "그리고 빠른 설정 창에서 음량과 밝기 조절 바가"}, {"start": 483.803, "end": 485.004, "text": "더 두꺼워졌습니다."}, {"start": 484.759, "end": 486.641, "text": "그 외에도 혁신적이진 않지만"}, {"start": 486.641, "end": 489.399, "text": "칭찬해 줄 만한 소소한 변화들이 많아요."}, {"start": 489.399, "end": 491.985, "text": "특히 홈 화면과 내부 화면의 미러링을"}, {"start": 491.985, "end": 494.959, "text": "끌 수 있게 된 점이 아주 마음에 듭니다."}, {"start": 494.959, "end": 496.16, "text": "두 화면을 완전히 독립된 레이아웃으로"}, {"start": 496.16, "end": 497.36, "text": "꾸밀 수 있는 거죠."}, {"start": 496.72, "end": 498.273, "text": "하지만 이 제품이 출시되어"}, {"start": 498.273, "end": 500.16, "text": "익숙해진 지금 제가 고민하는 건"}, {"start": 500.16, "end": 503.163, "text": "애플이 과연 준비 중인"}, {"start": 503.163, "end": 506.92, "text": "폴더블 아이폰의 방향성입니다"}, {"start": 506.92, "end": 508.12, "text": "아마 두 달 뒤쯤"}, {"start": 508.12, "end": 509.319, "text": "공개될 것으로 보이는데요"}, {"start": 508.439, "end": 509.839, "text": "과연 어떤 모습일지 보게 되겠죠"}, {"start": 509.839, "end": 511.293, "text": "이 제품을 통해 그 폰에 대해"}, {"start": 511.293, "end": 512.84, "text": "무엇을 유추해 볼 수 있을까요?"}, {"start": 512.84, "end": 514.48, "text": "크게 세 가지로 정리할 수 있습니다"}, {"start": 514.48, "end": 515.956, "text": "첫째, 앱 지원이"}, {"start": 515.956, "end": 517.6, "text": "핵심이 될 것입니다"}, {"start": 517.6, "end": 518.799, "text": "이는 개발자들이 직접"}, {"start": 518.799, "end": 520.0, "text": "대응해 주어야 하는 부분이죠"}, {"start": 519.72, "end": 520.919, "text": "다행히도 이는"}, {"start": 520.919, "end": 522.12, "text": "애플의 강점 중 하나입니다"}, {"start": 521.558, "end": 522.759, "text": "애플은 이미 개발자들을"}, {"start": 522.759, "end": 523.958, "text": "준비시켜 왔습니다"}, {"start": 523.038, "end": 524.239, "text": "다양한 화면 비율과"}, {"start": 524.239, "end": 525.438, "text": "반응형 앱에 대응하도록요"}, {"start": 525.36, "end": 526.559, "text": "지난 몇 달,"}, {"start": 526.559, "end": 527.759, "text": "아니 몇 년 동안 말이죠"}, {"start": 527.32, "end": 528.519, "text": "이상적으로는 문제점들을"}, {"start": 528.519, "end": 529.799, "text": "많이 보지 않았으면 합니다"}, {"start": 529.799, "end": 531.0, "text": "제가 이 폰에서"}, {"start": 531.0, "end": 532.2, "text": "겪었던 오류들처럼 말이죠"}, {"start": 532.0, "end": 533.2, "text": "둘째는 얇아야"}, {"start": 533.2, "end": 534.44, "text": "승산이 있다는 점입니다"}, {"start": 534.44, "end": 536.076, "text": "이런 폼팩터로 돌아갈 때는"}, {"start": 536.076, "end": 537.48, "text": "두께가 정말 중요합니다"}, {"start": 537.48, "end": 539.317, "text": "배터리와 힌지 기술이"}, {"start": 539.317, "end": 540.517, "text": "더 발전하고"}, {"start": 540.32, "end": 542.039, "text": "디스플레이, 베이퍼 챔버,"}, {"start": 542.039, "end": 543.759, "text": "카메라 등이 작아져야 하죠"}, {"start": 543.759, "end": 544.96, "text": "손에 쥐었을 때"}, {"start": 544.96, "end": 546.159, "text": "가볍고 얇은 느낌은"}, {"start": 545.84, "end": 548.018, "text": "주머니에서 꺼내 쓰고 싶게"}, {"start": 548.018, "end": 550.82, "text": "만드는 데 정말 큰 차이를 줍니다"}, {"start": 550.82, "end": 552.434, "text": "애플은 안타깝게도 예전 아이폰처럼"}, {"start": 552.434, "end": 554.32, "text": "그 폰을 또 찬밥 신세로 만들 거예요."}, {"start": 554.32, "end": 555.519, "text": "실리콘 탄소 배터리를"}, {"start": 555.519, "end": 556.72, "text": "탑재하지 않는 방식으로 말이죠."}, {"start": 556.72, "end": 558.613, "text": "발표하기도 전부터"}, {"start": 558.613, "end": 561.559, "text": "벌써 화가 나려고 하네요."}, {"start": 561.559, "end": 562.759, "text": "그리고 세 번째로,"}, {"start": 562.759, "end": 564.519, "text": "가격이 비쌀 겁니다. [웃음]"}, {"start": 564.519, "end": 567.279, "text": "이미 1,900달러짜리"}, {"start": 567.279, "end": 569.12, "text": "폰인데 말이죠."}, {"start": 569.12, "end": 571.94, "text": "그만한 가치가 있을까요?"}, {"start": 571.94, "end": 573.365, "text": "객관적인 스펙만 보면"}, {"start": 573.365, "end": 575.179, "text": "그리 설득력 있지는 않죠?"}, {"start": 575.179, "end": 577.236, "text": "외부 화면과 내부 화면 모두"}, {"start": 577.236, "end": 578.437, "text": "더 작아졌고"}, {"start": 578.059, "end": 579.259, "text": "배터리도 줄었으며"}, {"start": 579.259, "end": 580.899, "text": "카메라도 더 나빠졌어요."}, {"start": 580.899, "end": 582.1, "text": "칩셋도 다른 플래그십과"}, {"start": 582.1, "end": 583.299, "text": "동일하니까요. "}, {"start": 637.48, "end": 638.679, "text": "자세한 정보를 확인해 보세요."}, {"start": 638.399, "end": 640.039, "text": "하지만 응모 기회를 더 많이 얻고 싶다면,"}, {"start": 640.039, "end": 641.47, "text": "Ridge에서 멋진 제품들을"}, {"start": 641.47, "end": 642.669, "text": "구매하시면 되는데요,"}, {"start": 642.519, "end": 644.679, "text": "제 몇 가지 추천 제품을 소개할게요."}, {"start": 644.679, "end": 645.919, "text": "우선 '릿지 트래커 카드'가 있습니다."}, {"start": 645.919, "end": 648.12, "text": "애플의 Find My 네트워크와 연동되어,"}, {"start": 648.12, "end": 650.039, "text": "잃어버린 물건을 빠르게 찾게 돕고,"}, {"start": 650.039, "end": 652.279, "text": "활성화되면 큰 알림음을 울려 줍니다."}, {"start": 652.279, "end": 654.48, "text": "배터리는 최대 5개월 동안 지속되고,"}, {"start": 654.48, "end": 656.08, "text": "무선 충전도 가능합니다."}, {"start": 656.08, "end": 657.279, "text": "게다가 아주 인기 있는"}, {"start": 657.279, "end": 658.639, "text": "5-in-1 보조배터리도 있죠."}, {"start": 658.639, "end": 661.96, "text": "맥세이프 호환에 USB-C와 라이트닝 케이블,"}, {"start": 661.96, "end": 663.48, "text": "애플워치 충전 패드까지 지원합니다."}, {"start": 663.48, "end": 665.159, "text": "용량은 10,000mAh에 달하죠."}, {"start": 665.159, "end": 667.13, "text": "마지막으로 아토믹 퍼플 보조배터리가"}, {"start": 667.13, "end": 668.48, "text": "얼마나 인기가 많았는지,"}, {"start": 668.48, "end": 671.08, "text": "그 디자인을 지갑에 다시 도입하기로 했죠."}, {"start": 671.08, "end": 672.799, "text": "그래서 맥세이프 버전을 원하신다면,"}, {"start": 672.799, "end": 675.559, "text": "맥세이프가 더 밀착되도록 개선했습니다."}, {"start": 675.559, "end": 677.22, "text": "지갑에 더 납작하고 단단하게"}, {"start": 677.22, "end": 678.879, "text": "아이폰에 부착되도록 말이죠."}, {"start": 678.879, "end": 680.08, "text": "그러니 ridge.com"}, {"start": 680.08, "end": 681.279, "text": "mkbhd에 방문해서"}, {"start": 681.0, "end": 683.799, "text": "확인해 보거나, 적어도 무료로 응모해 보세요."}, {"start": 683.799, "end": 686.059, "text": "혹시 모르는 일이니까요."}, {"start": 686.059, "end": 688.299, "text": "어쨌든 시청해 주셔서 감사합니다."}, {"start": 688.299, "end": 689.909, "text": "다음 영상에서 또 만나요."}, {"start": 689.909, "end": 691.11, "text": "그럼 이만."}];

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});
let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
