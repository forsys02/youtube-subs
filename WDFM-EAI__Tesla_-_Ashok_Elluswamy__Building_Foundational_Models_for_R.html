const videoId="LFh9GAzHg1c";
const subs=[{"start": 0.0, "end": 4.7, "text": "안녕하세요, 테슬라에서 12년째 근무 중인<br>아쇼크 엘루스와미입니다."}, {"start": 5.0, "end": 9.7, "text": "현재 테슬라 AI 팀을 이끌고 있으며,<br>오늘 이 자리에서 발표하게 되어 기쁩니다."}, {"start": 10.0, "end": 14.7, "text": "저희 팀이 진행해 온 연구와 개발,<br>그리고 팀의 사명에 대해 소개해 드리고"}, {"start": 15.0, "end": 20.7, "text": "앞으로의 로드맵을 말씀드리고자 합니다.<br>먼저 말씀드리고 싶은 것은"}, {"start": 21.0, "end": 28.7, "text": "전 세계를 위해 엄청난 풍요를 창출하는 것이<br>테슬라의 궁극적인 사명이라는 점입니다."}, {"start": 29.0, "end": 35.7, "text": "테슬라는 전통적으로 차량 제조사로 알려져 왔으나,<br>더욱 중요한 사실은 차량이 스스로 주행한다는 점입니다."}, {"start": 36.0, "end": 41.7, "text": "모든 차량에는 자율주행에 필요한<br>모든 센서와 컴퓨팅 장치가 탑재되어 있습니다."}, {"start": 42.0, "end": 47.7, "text": "이 화면은 텍사스 오스틴에서 운행 중인<br>저희 로보택시 서비스의 실제 모습입니다."}, {"start": 48.0, "end": 52.7, "text": "운전석에는 아무도 타고 있지 않습니다.<br>승객이 차량을 호출하면"}, {"start": 53.0, "end": 59.7, "text": "차량이 오스틴 시내 전역을 자율주행하여 데려다줍니다.<br>이달 초부터 일반 대중에게 공개되었습니다."}, {"start": 60.0, "end": 64.7, "text": "이전에는 FSD를 감독하기 위한 안전 요원이 탑승했으나<br>이제는 완전히 안전 요원 없이 운영됩니다."}, {"start": 65.0, "end": 68.7, "text": "승객은 차량에 탑승하여<br>이미 입력된 목적지를 확인하고"}, {"start": 69.0, "end": 74.7, "text": "'출발' 버튼만 누르면 차량이 어디든 데려다줍니다.<br>복잡한 교통량의 실제 공공 도로에서 운행되며"}, {"start": 75.0, "end": 81.7, "text": "이 모든 과정은 오직 카메라와 AI만으로 구동됩니다.<br>회사의 미래는 차량에만 머무르지 않습니다."}, {"start": 82.0, "end": 87.7, "text": "기능성을 한 단계 끌어올린<br>휴머노이드 로봇(옵티머스)도 함께 개발하고 있습니다."}, {"start": 88.0, "end": 94.7, "text": "테슬라 차량이 이동 수단의 저비용 확장 가능한 솔루션이라면,<br>휴머노이드 로봇은 물리적 노동을 자동화하는"}, {"start": 95.0, "end": 101.7, "text": "저비용 확장 솔루션입니다.<br>휴머노이드 형태를 선택한 이유는 하위 호환성 때문입니다."}, {"start": 102.0, "end": 106.7, "text": "인간이 현실 세계에서 문제를 해결하듯<br>어떤 임무에든 휴머노이드 로봇을 투입할 수 있습니다."}, {"start": 107.0, "end": 112.7, "text": "인간과 동일한 인터페이스를 사용하므로<br>로봇을 맞이하기 위해 별도의 새 인프라를 구축할 필요가 없죠."}, {"start": 113.0, "end": 118.7, "text": "기존 환경에 즉시 투입되어<br>거대한 영향력을 발휘할 준비가 되어 있습니다."}, {"start": 119.0, "end": 124.7, "text": "로보택시 서비스 외에도, FSD를 구매한<br>모든 테슬라 오너들에게 완전 자율주행을 배포했습니다."}, {"start": 125.0, "end": 130.7, "text": "지금 보시는 영상은 FSD를 활성화한 상태에서<br>소프트웨어가 까다로운 위기 상황을"}, {"start": 131.0, "end": 135.7, "text": "스스로 모면하고 탑승자를 보호한 사례들입니다."}, {"start": 136.0, "end": 144.7, "text": "예를 들어 버스가 다가올 때 차량이 알아서<br>후진하여 길을 양보하는 지능적인 행동을 보여줍니다."}, {"start": 145.0, "end": 149.7, "text": "이러한 기능은 하드웨어 3 및 4가 탑재된<br>모든 테슬라 차량에 적용되어 있습니다."}, {"start": 150.0, "end": 158.7, "text": "안전성 개선 효과는 정량적 수치로도 입증됩니다.<br>차량 플릿 전체의 충돌 발생 전 주행 거리를 비교해 보면,"}, {"start": 159.0, "end": 165.7, "text": "가장 높은 파란색 그래프가 바로<br>FSD를 사용하여 주행한 구간입니다."}, {"start": 166.0, "end": 172.7, "text": "능동 안전 기능만 사용하는 일반 수동 운전도<br>아무 기능이 없는 것에 비해 안전하지만,"}, {"start": 173.0, "end": 178.7, "text": "자율주행으로 차량을 운행하는 것이<br>수동 운전에 비해 훨씬 안전하다는 점이"}, {"start": 179.0, "end": 184.7, "text": "수십억 마일의 연구 데이터에서 명확히 드러납니다.<br>고속도로뿐만 아니라 시내 일반 도로에서도"}, {"start": 185.0, "end": 190.7, "text": "수동 운전 기준 대비 최소 2배 이상 우수합니다."}, {"start": 191.0, "end": 196.7, "text": "따라서 테슬라가 있으시다면 꼭 자율주행을<br>사용하시길 권하며, 저 역시 항상 사용하고 있습니다."}, {"start": 197.0, "end": 202.7, "text": "오늘 발표에서는 소프트웨어 구동 원리와<br>시스템 구축의 기술적 과제,"}, {"start": 203.0, "end": 210.7, "text": "그리고 안전성을 평가하는 방법을 다루겠습니다.<br>우선 테슬라는 엔드투엔드(End-to-End) 방식으로"}, {"start": 211.0, "end": 215.7, "text": "자율주행 소프트웨어를 개발합니다.<br>현대 시대에 당연히 엔드투엔드여야 한다고 생각할 수 있지만,"}, {"start": 216.0, "end": 222.7, "text": "업계 전체가 이에 동의하는 것은 아닙니다.<br>많은 경쟁사들은 인지, 예측, 계획 스택이 분리된"}, {"start": 223.0, "end": 228.7, "text": "모듈형 접근 방식을 여전히 고수하고 있습니다.<br>테슬라는 이러한 모듈 시스템을 모두 배제하고"}, {"start": 229.0, "end": 233.7, "text": "단일 엔드투엔드 신경망을 사용합니다.<br>차량의 8개 카메라 영상뿐만 아니라"}, {"start": 234.0, "end": 241.7, "text": "내비게이션 경로, 차량 속도와 조향 같은 운동학적 상태,<br>오디오 등 원시 센서 입력을 받아"}, {"start": 242.0, "end": 247.7, "text": "차량이 어떻게 행동해야 하는지,<br>다음 조향이나 가감속 동작을 직접 산출합니다."}, {"start": 248.0, "end": 254.7, "text": "그 이유를 설명해 드리겠습니다.<br>모든 것을 규칙이나 모듈 단위로 규정하려 하면"}, {"start": 255.0, "end": 259.7, "text": "'추상화 누수(Leaky abstractions)'가 심하게 발생합니다.<br>원시 측정값의 미세한 불확실성을 하위 시스템에"}, {"start": 260.0, "end": 267.7, "text": "모두 전달하기 어렵고, 각 요소들이 강하게 결합되어 있어<br>관심사를 명확히 분리하기 어렵습니다."}, {"start": 268.0, "end": 272.7, "text": "기존 소프트웨어 공학에서는 관심사를 분리하고<br>모듈화하라고 가르치지만,"}, {"start": 273.0, "end": 277.7, "text": "현실 세계의 로보틱스에서는 매우 어렵습니다.<br>정보가 고밀도로 흘러야 합니다."}, {"start": 278.0, "end": 283.7, "text": "몇 가지 예를 들어보겠습니다.<br>반대편 차선으로 넘어가는 것은 위험하므로"}, {"start": 284.0, "end": 291.7, "text": "고속으로 달려오는 마주 오는 차를 피해<br>절대 역주행 차선에 들어가선 안 됩니다."}, {"start": 292.0, "end": 296.7, "text": "하지만 도로 앞에 큰 물웅덩이가 있다면 어떨까요?<br>'웅덩이를 피하라'는 별도 규칙을 추가할 수 있지만,"}, {"start": 297.0, "end": 302.7, "text": "이제 '웅덩이를 밟을 것인가, 반대 차선으로 피할 것인가'라는<br>작은 트롤리 딜레마를 풀어야 합니다."}, {"start": 303.0, "end": 307.7, "text": "이는 두 조건뿐만 아니라 반대편에 차가 오는지,<br>반대편에 차가 없더라도 시야가 확보되었는지 등"}, {"start": 308.0, "end": 313.7, "text": "다양한 변수에 따라 결정됩니다.<br>따라서 전체 장면을 총체적으로 고려해 판단해야 하며,"}, {"start": 314.0, "end": 321.7, "text": "독립적인 규칙이나 논리 요소만으로는 결정할 수 없습니다."}, {"start": 322.0, "end": 325.7, "text": "또 다른 예로, 도로를 건너려는 닭 무리가 있습니다.<br>왼쪽 화면을 보시면 FSD는"}, {"start": 326.0, "end": 329.7, "text": "닭들이 길을 건널 때까지 끈기 있게 기다립니다.<br>자세히 보시면 뒤처진 닭 한 마리가 더 있는데,"}, {"start": 330.0, "end": 335.7, "text": "마지막 닭까지 모두 건널 때까지 기다린 후<br>자율적으로 출발합니다. 왜 건넜을까요? FSD를 시험해보려고요."}, {"start": 336.0, "end": 339.9, "text": "반면 오른쪽 화면을 보시면 거위 무리가 도로에 있습니다."}, {"start": 340.0, "end": 344.5, "text": "이 상황은 차량 내에 사람이 없는 상태에서<br>스마트 호출(Smart Summon)을 사용 중인 모습입니다."}, {"start": 345.0, "end": 350.5, "text": "거위들은 길을 건너지 않고 그냥 서 있을 뿐이어서,<br>차량이 뒤로 물러선 뒤 돌아서 피해 갑니다."}, {"start": 351.0, "end": 355.5, "text": "새들의 다리가 어떻게 움직이는지 같은 미세한 단서를 보고<br>길을 건너려는 의도인지 아닌지를 판단해"}, {"start": 356.0, "end": 361.5, "text": "적절한 조치를 취해야 합니다.<br>모듈형 시스템이라면 닭 다리 감지기를 따로 만들고"}, {"start": 362.0, "end": 364.5, "text": "움직임을 예측해 제어해야 할 텐데,<br>이는 지나치게 복잡합니다."}, {"start": 365.0, "end": 369.5, "text": "엔드투엔드 시스템에서는 픽셀 정보가<br>곧바로 제어로 직접 흘러갑니다."}, {"start": 370.0, "end": 375.5, "text": "또한 결정론적인 지연 시간(Deterministic Latency)을 보장합니다.<br>실제 주행에서는 실시간으로 동작을 생성해야 하므로"}, {"start": 376.0, "end": 383.5, "text": "오랜 시간 계산할 수 없습니다. 신경망을 사용하면<br>지연 시간을 제어하기 훨씬 수월하고"}, {"start": 384.0, "end": 390.5, "text": "시스템 수준에서 검증하기도 매우 쉽습니다.<br>무엇보다 '씁쓸한 교훈(The Bitter Lesson)'의 올바른 편에 서 있죠."}, {"start": 391.0, "end": 396.5, "text": "수작업 엔지니어링 대신 신경망 크기, 데이터,<br>학습 연산량, 보상 확장에 베팅하는 것입니다."}, {"start": 397.0, "end": 402.5, "text": "그렇다면 왜 모든 기업이 이 방식을 쓰지 않을까요?<br>왜 테슬라 등 극소수 기업만 이를 수행할 수 있을까요?"}, {"start": 403.0, "end": 409.5, "text": "첫 번째는 '차원의 저주(Curse of Dimensionality)'입니다.<br>차량에는 8개의 고해상도(500만 화소) 카메라가 장착되어 있고"}, {"start": 410.0, "end": 413.5, "text": "높은 프레임 레이트로 동작합니다.<br>일시정지 표지판에서 누가 먼저 도착했는지 기억해야 하듯"}, {"start": 414.0, "end": 419.5, "text": "판단을 내리려면 상당한 크기의 히스토리 문맥이 필요합니다."}, {"start": 420.0, "end": 425.5, "text": "이론상 무한한 히스토리가 필요할 수도 있지만,<br>30초의 히스토리만 유지한다고 가정해 봅시다."}, {"start": 426.0, "end": 431.5, "text": "신경망으로 유입되는 바이트 양을 토큰화 방식에 따라 계산해 보면,<br>대략 20억 개의 토큰이 신경망으로 들어옵니다."}, {"start": 432.0, "end": 438.5, "text": "그리고 최종적으로 다음 시점의 조향각과 가감속이라는<br>단 2개의 액션을 출력해야 합니다."}, {"start": 439.0, "end": 443.5, "text": "20억 개의 토큰 입력을 압축해 2개의 동작을 산출하는 것이죠.<br>단순히 아무 2바이트나 출력하는 것이 아니라"}, {"start": 444.0, "end": 447.5, "text": "정확한 2개의 액션을 취해야 하므로,<br>거대한 데이터 스트림 속에서"}, {"start": 448.0, "end": 453.5, "text": "왜 이 동작을 해야 하는지 인과 관계를 이해해야 합니다.<br>나뭇가지가 흔들려서 브레이크를 밟는 식의"}, {"start": 454.0, "end": 458.5, "text": "거짓 상관관계(Spurious correlation)를 학습해선 안 되며,<br>앞차가 방향지시등을 켰기 때문에 제동한다는"}, {"start": 459.0, "end": 464.5, "text": "올바른 인과적 매핑을 학습해야 합니다.<br>다행히 테슬라의 플릿 규모는 매우 큽니다."}, {"start": 465.0, "end": 473.5, "text": "대략적인 규모로 보면 전체 플릿은<br>매일 500년 분량의 주행 데이터를 생성해 냅니다."}, {"start": 474.0, "end": 479.5, "text": "하지만 대부분의 데이터는 고속도로 정속 주행처럼<br>단조롭고 흥미롭지 않습니다."}, {"start": 480.0, "end": 485.5, "text": "모든 데이터를 수집한 뒤 필터링하는 것은 엄청난 자원 낭비이므로,<br>무엇이 '흥미로운 데이터'인지 사전에 식별합니다."}, {"start": 486.0, "end": 490.5, "text": "스쿨버스가 있다거나 소방차가 지나가는 등<br>특별한 상황을 감지하여"}, {"start": 491.0, "end": 496.5, "text": "평범한 데이터의 바다에서 가치 있는 데이터를 선별 추출합니다.<br>대규모 플릿 덕분에 다른 곳에서는 수집하기 어려운"}, {"start": 497.0, "end": 501.5, "text": "희귀 데이터를 빠르게 모을 수 있습니다."}, {"start": 502.0, "end": 506.5, "text": "이런 데이터는 직접 수집하기가<br>정말 어렵습니다. 연출하기도 불가능하죠."}, {"start": 507.0, "end": 511.5, "text": "수많은 행위자와 극심한 교통량이 얽혀 있고<br>매우 위험할 수 있기 때문입니다."}, {"start": 512.0, "end": 515.5, "text": "이러한 상황은 매일 발생하지만<br>개별적으로는 매우 드물게 일어납니다."}, {"start": 516.0, "end": 520.5, "text": "하지만 테슬라의 대규모 플릿 전체에서는<br>이런 데이터를 방대하게 수집할 수 있습니다."}, {"start": 521.0, "end": 526.5, "text": "이 데이터를 모아 시스템을 학습시키면<br>뛰어난 예방 안전성과 희귀 상황 일반화 성능을 얻게 됩니다."}, {"start": 527.0, "end": 534.5, "text": "여기 한 가지 예가 있습니다. FSD가 주행 중인데<br>전방 차량이 미끄러지기 시작합니다."}, {"start": 535.0, "end": 538.5, "text": "가드레일 쪽으로 미끄러지는 상황인데,"}, {"start": 539.0, "end": 545.5, "text": "자율주행 소프트웨어가 이를 매우 일찍 감지하고<br>자동으로 제동하여 충돌을 회피했습니다."}, {"start": 546.0, "end": 550.5, "text": "자칫 또 다른 충돌 사고로 이어질 뻔했죠.<br>여기서 강조하고 싶은 점은"}, {"start": 551.0, "end": 556.5, "text": "시스템이 얼마나 일찍 반응하는가입니다.<br>여기 차량 속도 그래프를 보시면"}, {"start": 557.0, "end": 568.5, "text": "계획된 속도 곡선에서 보듯<br>이미 이 시점부터 감속을 시작합니다."}, {"start": 569.0, "end": 572.5, "text": "전방 차량은 아직 충돌조차 하지 않았습니다.<br>단순히 차선을 변경하는 것처럼 보일 수도 있죠."}, {"start": 573.0, "end": 577.5, "text": "단지 이 차선에서 저 차선으로 이동 중이었지만,<br>시스템은 이미 무언가 잘못되었음을 감지했습니다."}, {"start": 578.0, "end": 584.5, "text": "상황이 이상하다는 것을 알아차리고<br>상당한 수준의 제동을 미리 가하기 시작합니다."}, {"start": 585.0, "end": 589.5, "text": "실제 사건이 일어나기 수초 전에<br>위험을 예측하기 때문에 사람들은 놀라기도 합니다."}, {"start": 590.0, "end": 597.5, "text": "따라서 예측 지능이 반드시 필요합니다.<br>\"전방 차량의 요 레이트(회전율)가"}, {"start": 598.0, "end": 602.5, "text": "차선 변경에 필요한 것보다 과도하다.<br>저 차가 충돌할 수 있고,"}, {"start": 603.0, "end": 607.5, "text": "우리 경로로 튕겨 나올 수 있으니<br>지금 즉시 감속해야 한다\"라는 식의"}, {"start": 608.0, "end": 613.5, "text": "3차 추론(Third-order intelligence)이<br>실시간으로 이루어져야 합니다."}, {"start": 614.0, "end": 616.5, "text": "주변에 다른 차량들도 다가오고 있고<br>수많은 바이트 정보가 쏟아지는 상황에서"}, {"start": 617.0, "end": 622.5, "text": "올바른 단서에 집중하여 결론을 내리고<br>자신 있게 브레이크를 밟아야 합니다."}, {"start": 623.0, "end": 629.5, "text": "이 모든 데이터가 필요한 이유는<br>단순히 동네를 돌아다니기 위해서가 아닙니다."}, {"start": 630.0, "end": 634.5, "text": "엔드투엔드 시스템이라고 하면<br>내부 동작을 이해할 수 없는 것 아니냐,"}, {"start": 635.0, "end": 640.5, "text": "오류가 나면 어떻게 디버깅하느냐고 묻습니다.<br>엔드투엔드 모델이라도"}, {"start": 641.0, "end": 645.5, "text": "시스템에 온갖 프로브(탐침)를 연결하여<br>주변 환경을 제대로 이해하는지 확인할 수 있습니다."}, {"start": 646.0, "end": 650.5, "text": "단순히 다음 동작을 도출하는 것에 더해<br>추론 과정을 점검할 수도 있습니다."}, {"start": 651.0, "end": 655.5, "text": "추론 트레이스를 살펴보며<br>취한 동작과 논리적 일관성이 있는지 확인하죠."}, {"start": 656.0, "end": 661.5, "text": "여기서의 추론은 전통적인 LLM처럼<br>텍스트 기반 추론에만 국한되지 않습니다."}, {"start": 662.0, "end": 666.5, "text": "기하학적 추론도 활용할 수 있습니다.<br>차량과 장애물의 위치, 앞으로의 이동 방향 등을 파악하죠."}, {"start": 667.0, "end": 671.5, "text": "모든 추론을 추론(테스트) 시점에<br>반드시 생성할 필요는 없습니다."}, {"start": 672.0, "end": 675.5, "text": "학습 시점에 이러한 추론 기능을 연결해두고<br>테스트 시점에는 분리하여"}, {"start": 676.0, "end": 679.5, "text": "디버깅에만 사용하거나<br>암묵적 추론으로 내재화할 수 있습니다."}, {"start": 680.0, "end": 686.5, "text": "추론을 명시적으로 출력할 필요가 없는 것이죠.<br>그중 한 형태가 앞서 언급한 3D 추론입니다."}, {"start": 687.0, "end": 694.5, "text": "예를 들어 차량 주변 3D 공간을 표현하기 위해<br>가우시안 스플래팅을 활용할 수 있습니다."}, {"start": 695.0, "end": 700.5, "text": "저희가 잘하는 부분 중 하나는,<br>전통적인 가우시안 스플래팅의 경우"}, {"start": 701.0, "end": 707.5, "text": "학습 뷰에 가까울 때는 매우 훌륭하지만<br>학습 뷰 매니폴드를 벗어나"}, {"start": 708.0, "end": 713.5, "text": "멀리 떨어진 새로운 뷰로 이동하면<br>일반화 성능이 급격히 떨어집니다."}, {"start": 714.0, "end": 717.5, "text": "차량 비디오 클립에 기존 가우시안 스플래팅을<br>적용하면 맨 왼쪽 영상처럼 나옵니다."}, {"start": 718.0, "end": 726.5, "text": "가운데 영상은 테슬라의 자체 생성형 가우시안 스플래팅으로,<br>학습 뷰를 벗어나도 뛰어난 일반화 성능을 보여줍니다."}, {"start": 727.0, "end": 734.5, "text": "차량 종류 등 시맨틱(의미 정보)도<br>매우 정확하게 인식하는 것을 볼 수 있습니다."}, {"start": 735.0, "end": 740.5, "text": "게다가 기존 가우시안 스플래팅보다<br>훨씬 빠른 속도로 동작합니다."}, {"start": 741.0, "end": 747.5, "text": "기존 방식은 30분 이상 걸릴 수 있지만,<br>테슬라 시스템은 수백 밀리초 단위로 실행됩니다."}, {"start": 748.0, "end": 753.5, "text": "어떤 초기화 과정도 필요 없이<br>전부 순수 신경망 기반으로 구동됩니다."}, {"start": 754.0, "end": 759.5, "text": "그리고 이는 제어 동작을 출력하는<br>동일한 신경망의 일부입니다."}, {"start": 760.0, "end": 766.5, "text": "즉 기하학을 이해하고 차량 주변의 3D 구조를<br>제어 동작과 함께 설명하고 생성할 수 있습니다."}, {"start": 767.0, "end": 773.5, "text": "또 다른 시연을 보여드리겠습니다.<br>상단의 카메라 영상들을 입력으로 받아"}, {"start": 774.0, "end": 778.5, "text": "상호작용이 가능한 완전한 3D 월드를 생성합니다.<br>자유롭게 시점을 이동해 볼 수 있죠."}, {"start": 779.0, "end": 785.5, "text": "카메라 시점뿐만 아니라 3D 뷰 전체에서<br>신경망이 세상을 어떻게 인식하는지 볼 수 있습니다."}, {"start": 786.0, "end": 790.5, "text": "이를 통해 올바른 상관관계를 학습하는 데<br>결정적인 도움을 받게 됩니다."}, {"start": 791.0, "end": 796.5, "text": "이미지 공간의 픽셀들이 어느 차량에<br>속하는지 등을 정확히 파악하는 것이죠."}, {"start": 797.0, "end": 805.5, "text": "기하학적 추론 외에도<br>텍스트 기반 추론도 가능합니다."}, {"start": 806.0, "end": 812.5, "text": "예를 들어 도로가 통제된 상황에서<br>언어와 영상 지시를 결합하여 추론할 수 있습니다."}, {"start": 813.0, "end": 818.5, "text": "\"우회로 표지판이 있으니 좌회전해야 한다\"라고<br>상황을 추론할 수 있죠."}, {"start": 819.0, "end": 825.5, "text": "이처럼 주변 세계를 포괄적으로 이해하게 됩니다.<br>물론 추론 시점에 이 많은 토큰을 전부 생성하는 것은"}, {"start": 826.0, "end": 831.5, "text": "차량이 실시간으로 동작을 제어해야 하므로<br>상당히 어려운 과제입니다."}, {"start": 1012.0, "end": 1016.5, "text": "매우 짧은 시간 안에 이렇게 많은 수의<br>토큰을 전부 생성하기는 어렵기 때문입니다."}, {"start": 1017.0, "end": 1020.5, "text": "차량은 실시간으로 제어 동작을 출력해야 하니까요.<br>하지만 이러한 추론의 상당 부분은"}, {"start": 1021.0, "end": 1024.5, "text": "명시적으로 표출하지 않고 암묵적으로 내재화하거나,<br>학습 시점에 오프라인으로 처리하여"}, {"start": 1025.0, "end": 1032.5, "text": "신경망 내부에 지식을 증류(Distillation)할 수 있습니다.<br>마지막 과제는 '평가(Evaluation)'입니다."}, {"start": 1033.0, "end": 1037.5, "text": "개인적으로 세 가지 과제 중<br>가장 까다로운 문제라고 생각합니다."}, {"start": 1038.0, "end": 1044.5, "text": "자율주행은 롱테일(Long-tail) 문제이므로<br>극단적인 꼬리 영역의 엣지 케이스까지"}, {"start": 1045.0, "end": 1049.5, "text": "철저히 검증해야 하기 때문입니다.<br>또한 이는 '폐루프(Closed-loop)' 시스템입니다."}, {"start": 1050.0, "end": 1057.5, "text": "폐루프 평가를 개발하려면 우수한 시뮬레이터가 있거나<br>실제 현실 세계에서 테스트해야 합니다."}, {"start": 1058.0, "end": 1063.5, "text": "하지만 모든 롱테일 상황을 현실에서 테스트하는 것은<br>극도로 어렵습니다."}, {"start": 1064.0, "end": 1069.5, "text": "그래서 저희는 '월드 시뮬레이터 신경망'을<br>직접 학습시켰습니다."}, {"start": 1070.0, "end": 1075.5, "text": "이 모델은 수집이 매우 용이한<br>'상태-행동 쌍(State-action pairs)' 데이터로 학습되며,"}, {"start": 1076.0, "end": 1081.5, "text": "이를 역으로 적용합니다. 즉 현재 영상과<br>조향 및 가속 페달 입력이 주어지면,"}, {"start": 1082.0, "end": 1087.5, "text": "다음 비디오 프레임이 어떻게 보일지<br>미래의 시각 상태를 직접 생성해 냅니다."}, {"start": 1088.0, "end": 1092.5, "text": "이 월드 시뮬레이터를 실제 동작을 결정하는<br>'정책 신경망(Policy Neural Network)'에 연결합니다."}, {"start": 1093.0, "end": 1099.5, "text": "시뮬레이터가 다음 비디오 프레임과 센서값을 생성하면,<br>정책 신경망이 이를 입력받아 다음 제어 동작을 산출하고,"}, {"start": 1100.0, "end": 1105.5, "text": "서로 주고받는 라운드 로빈 방식으로<br>세계를 실시간 시뮬레이션합니다."}, {"start": 1106.0, "end": 1113.5, "text": "이 두 신경망은 서로 독립적으로 학습됩니다.<br>월드 시뮬레이터는 정책 모델이 접근할 수 없는"}, {"start": 1114.0, "end": 1122.5, "text": "'특권 정보(Privileged information)'를 활용할 수 있어,<br>상호 독립적인 안전성 검증이 가능해집니다."}, {"start": 1123.0, "end": 1128.5, "text": "지금 보시는 영상이 바로 이 신경망이<br>완전히 생성해 낸 비디오 화면입니다."}, {"start": 1129.0, "end": 1134.5, "text": "차량의 8개 카메라 뷰 전체를<br>36fps, 500만 화소 고해상도로 생성합니다."}, {"start": 1135.0, "end": 1139.5, "text": "약 1분에 달하는 매우 긴 시퀀스 생성 결과인데,<br>차량과 주변 밴 등의 객체가 이동할 때"}, {"start": 1140.0, "end": 1163.5, "text": "모든 카메라 간에 완벽한 시공간적 일관성을 유지합니다."}, {"start": 1164.0, "end": 1169.5, "text": "실제 영상처럼 매우 사실적으로 보이지만,<br>모든 카메라의 모든 픽셀이 100% 신경망으로 생성된 가상 화면입니다."}, {"start": 1170.0, "end": 1173.5, "text": "실제 촬영된 픽셀은 단 하나도 없습니다."}, {"start": 1174.0, "end": 1177.5, "text": "이러한 월드 모델을 구축한 핵심 목적은<br>바로 '평가'입니다."}, {"start": 1178.0, "end": 1183.5, "text": "과거에 발생했던 주행 이슈를 새로운 정책 모델에서<br>다시 재생(Replay)하여 문제가 해결되었는지 검증하는 것이죠."}, {"start": 1184.0, "end": 1188.5, "text": "예를 들어 왼쪽 영상은 과거 차량이 보행자에게<br>다소 가깝게 주행하여 운전자가 개입했던 상황입니다."}, {"start": 1189.0, "end": 1193.5, "text": "이 문제를 개선한 최신 신경망을<br>동일한 비디오 클립 시뮬레이션에서 재현하여"}, {"start": 1194.0, "end": 1198.5, "text": "기존 신경망 대비 성능이 얼마나 향상되었는지<br>정밀하게 검증합니다."}, {"start": 1199.0, "end": 1205.5, "text": "오른쪽 영상을 보시면 당시의 중요 세부 사항들이<br>정확하게 재현되어 있습니다."}, {"start": 1206.0, "end": 1210.5, "text": "쓰레기통 같은 사소한 요소는 생략되었을지 몰라도,<br>보행자와 강아지 산책이라는 핵심 요소는"}, {"start": 1211.0, "end": 1215.5, "text": "완벽히 재현되었습니다. 그리고 새로운 정책 모델은<br>보행자로부터 안전거리를 두고 올바르게 우회합니다."}, {"start": 1216.0, "end": 1221.5, "text": "또한 과거에 겪지 않았던 새로운 이슈도 주입할 수 있습니다.<br>직진 주행 중인 일반 영상 클립을 가져와"}, {"start": 1222.0, "end": 1226.5, "text": "적대적(Adversarial) 상황을 인위적으로 주입하는 것이죠.<br>동일한 장면에 다양한 움직임을 부여하여"}, {"start": 1227.0, "end": 1230.5, "text": "시뮬레이션 시스템을 새로운 방식으로 활용하고,<br>실제 플릿에서도 아직 겪어보지 못한"}, {"start": 1231.0, "end": 1238.5, "text": "극단적인 코너 케이스들을 시험할 수 있습니다."}, {"start": 1239.0, "end": 1246.5, "text": "추론 시의 연산량을 대폭 경량화하면<br>이를 완전한 실시간(Real-time)으로 구동할 수도 있습니다."}, {"start": 1247.0, "end": 1255.5, "text": "지금 보시는 화면은 게임 엔진의 스티어링 휠과 페달로<br>신경망이 실시간 생성하는 완전 합성 월드를 직접 주행하는 모습입니다."}, {"start": 1256.0, "end": 1260.5, "text": "실시간 주행을 위해 연산량이 다소 경량화되었지만,<br>실시간 조종에 충분히 합리적이고 뛰어난 품질을 보여줍니다."}, {"start": 1261.0, "end": 1286.5, "text": "그리고 이 모든 기술은<br>단순히 자율주행 차량에만 국한되지 않습니다."}, {"start": 1287.0, "end": 1293.5, "text": "엔드투엔드 주행 신경망은 단순한 차량용 모델이 아니라,<br>로보틱스 전체를 위한 기초 모델(Foundational Model)입니다."}, {"start": 1294.0, "end": 1299.5, "text": "시뮬레이션 신경망 역시 마찬가지로<br>모든 로봇에 걸친 공통 데이터로 학습됩니다."}, {"start": 1300.0, "end": 1307.5, "text": "동일한 영상 생성 네트워크가 옵티머스(Optimus)가<br>걸어 다닐 실내 공간 영상을 생성하는 데도 일반화 적용됩니다."}, {"start": 1308.0, "end": 1314.5, "text": "이 역시 제어가 가능하여, 단일 비디오 클립에<br>직진, 좌회전, 우회전 등의 제어 입력을 주면"}, {"start": 1315.0, "end": 1325.5, "text": "영상 생성이 행동에 맞게 정확히 반응합니다.<br>제가 설명해 드린 모든 원리는 차량뿐만 아니라"}, {"start": 1326.0, "end": 1334.5, "text": "휴머노이드 로봇 및 모든 물리적 로봇에 동일하게 적용됩니다."}, {"start": 1335.0, "end": 1341.5, "text": "물체 조작(Manipulation) 작업에서도 마찬가지입니다.<br>서랍을 여는 동작 입력을 주면"}, {"start": 1342.0, "end": 1345.5, "text": "서랍이 열리는 영상이 적절히 생성되고,<br>물건을 집어 올리는 동작도 그대로 반영됩니다."}, {"start": 1346.0, "end": 1353.5, "text": "생성형 월드 모델을 활용하는 것의 가장 큰 이점은<br>기술적으로 모든 것이 훌륭하게 작동한다는 점입니다."}, {"start": 1354.0, "end": 1359.5, "text": "비용이 많이 든다는 점만 제외하면<br>반드시 도입해야 할 최고의 접근법입니다."}, {"start": 1360.0, "end": 1367.5, "text": "저희 팀은 자율주행차의 광범위한 보급을 통해<br>세상에 엄청난 풍요를 가져오는 것을 목표로 하고 있습니다."}, {"start": 1368.0, "end": 1373.5, "text": "여기에 보이는 사이버캡(Cybercab)은<br>완전 자율주행을 위해 설계된 전용 차량입니다."}, {"start": 1374.0, "end": 1379.5, "text": "스티어링 휠이나 가속·브레이크 페달이 전혀 없으며,<br>오직 자율주행 전용으로 제작되었습니다."}, {"start": 1380.0, "end": 1387.5, "text": "대중교통보다 저렴한 최저 수준의 이동 비용으로<br>모두에게 프리미엄 포인트 투 포인트 이동 경험을 제공할 것입니다."}, {"start": 1388.0, "end": 1392.6, "text": "기본적으로 모든 것이 순조롭고 훌륭해서<br>반드시 도입해야 하지만 한 가지는,"}, {"start": 1393.0, "end": 1397.5, "text": "막대한 비용이 든다는 점만 제외하면<br>그 외에는 정말 훌륭하다는 점입니다."}, {"start": 1398.0, "end": 1403.5, "text": "팀이 집중하는 목표는 자율주행의 대중화로<br>세상에 엄청난 풍요를 가져오는 것입니다."}, {"start": 1404.0, "end": 1409.5, "text": "여기 보이는 사이버캡(Cybercab)은<br>자율주행 전용으로 설계된 차량입니다."}, {"start": 1410.0, "end": 1415.5, "text": "스티어링 휠이나 가속 및 브레이크 페달이 없으며<br>오직 완전 자율주행만을 위해 제작되었습니다."}, {"start": 1416.0, "end": 1423.5, "text": "올해 말 출시 예정이며, 대중교통보다 저렴한 비용으로<br>모두에게 프리미엄 도어 투 도어 이동 경험을 제공할 것입니다."}, {"start": 1424.0, "end": 1433.5, "text": "또한 옵티머스 로봇도 본격 양산에 들어갈 예정이며,<br>현실 세계에서 물리적 작업의 비용을 대폭 낮출 것입니다."}, {"start": 1434.0, "end": 1441.5, "text": "이를 통해 전 세계의 생산성과 경제적 가치를<br>획기적으로 높일 것입니다."}, {"start": 1442.0, "end": 1447.5, "text": "이러한 문제에 관심이 있으시다면 언제든 지원해 주십시오.<br>이미 훌륭하게 작동하고 있지만 여전히 도전적이고"}, {"start": 1448.0, "end": 1458.5, "text": "기술적으로 흥미로우며 세상에 큰 의미를 지닌 과제들이 많습니다.<br>경청해 주셔서 감사합니다."}, {"start": 1459.0, "end": 1469.5, "text": "(사회자) 몇 가지 질문을 받겠습니다.<br>네, 말씀해 주시죠."}, {"start": 1470.0, "end": 1476.5, "text": "(질문자) 카메라만으로 자율주행을 풀 수 있다고<br>그토록 확신하시는 이유가 무엇인가요?"}, {"start": 1477.0, "end": 1484.5, "text": "(아쇼크) 오늘 이곳에 어떻게 오셨나요?<br>(질문자) 차를 운전해서 왔습니다."}, {"start": 1485.0, "end": 1493.5, "text": "(아쇼크) 많은 분들이 자신의 두 눈으로 운전해서 오셨고,<br>이 건물 안도 두 눈으로 걸어 다니십니다."}, {"start": 1494.0, "end": 1497.5, "text": "카메라만으로 해결할 수 있다는 것은<br>너무나 자명한 사실입니다."}, {"start": 1498.0, "end": 1503.5, "text": "왜 카메라로 풀지 않겠습니까?<br>지금은 2026년입니다."}, {"start": 1504.0, "end": 1510.5, "text": "인간과 동물들이 세상에 적응해 살아가듯<br>매우 단순한 센서만으로도 충분히 해결할 수 있습니다."}, {"start": 1511.0, "end": 1516.5, "text": "자율주행은 센서 문제가 아니라 AI 문제입니다.<br>세상을 이해하고 타인의 행동을 예측하는 것이 핵심이며,"}, {"start": 1517.0, "end": 1520.5, "text": "카메라에는 이미 충분한 정보가 담겨 있습니다.<br>정보를 추출하는 것이 바로 AI의 역할입니다."}, {"start": 1521.0, "end": 1526.5, "text": "2008년 DARPA 시절에는 정보를 추출할 인공지능이<br>부족했기 때문에 다양한 센서에 의존했던 것이죠."}, {"start": 1527.0, "end": 1532.5, "text": "하지만 오늘날 AI는 비약적으로 발전했습니다.<br>이제 필요한 정보를 충분히 추출할 수 있으므로,"}, {"start": 1533.0, "end": 1539.5, "text": "AI가 확보된 이상 다른 센서는 필요하지 않습니다.<br>카메라가 필요한 모든 정보를 제공하기 때문입니다."}, {"start": 1540.0, "end": 1561.5, "text": "(사회자) 다음 질문 받겠습니다."}, {"start": 1562.0, "end": 1569.5, "text": "(질문자) 생성형 월드 시뮬레이터에서<br>충돌 발생 시 보상이나 패널티를 부여하나요?"}, {"start": 1570.0, "end": 1576.5, "text": "(아쇼크) 네, 그렇습니다.<br>(질문자) 모델 자체가 패널티를 출력하나요?"}, {"start": 1577.0, "end": 1583.5, "text": "(아쇼크) 모델 출력을 활용할 수도 있고,<br>명시적인 충돌 검사를 수행할 수도 있습니다."}, {"start": 1584.0, "end": 1588.5, "text": "(질문자) 도로 교차로에 반사경을 설치하는 등<br>인프라를 추가할 계획은 없으신가요?"}, {"start": 1589.0, "end": 1594.5, "text": "코너 너머가 잘 안 보일 때 도움이 될 텐데요.<br>(아쇼크) 그런 인프라는 금상첨화일 수는 있습니다."}, {"start": 1595.0, "end": 1601.5, "text": "하지만 인간은 그런 것 없이도 세상을 잘 주행합니다.<br>저희는 인간이 가진 것과 동일한 인프라와 도구로"}, {"start": 1602.0, "end": 1605.5, "text": "현실 세계를 주행하고자 합니다.<br>인간보다 더 잘할 수 없다는 뜻이 아니라,"}, {"start": 1606.0, "end": 1611.5, "text": "다른 인프라를 문제 해결을 위한 임시변통으로 삼아선 안 됩니다.<br>핵심 문제를 온전히 풀어낸 뒤에"}, {"start": 1612.0, "end": 1620.5, "text": "인프라를 추가해도 늦지 않습니다.<br>현재 저희 팀은 핵심 문제를 해결하는 데 집중하고 있습니다."}, {"start": 1621.0, "end": 1625.5, "text": "(사회자) 네, 다음 분 질문해 주세요."}, {"start": 1626.0, "end": 1631.5, "text": "(질문자) 슬라이드에 36Hz 동작 모델이 있었는데,<br>구체적으로 어떤 의미인가요?"}, {"start": 1632.0, "end": 1638.5, "text": "(아쇼크) 차량에 제어 명령을 내리는 주파수입니다.<br>즉 1초에 36번, 약 27밀리초(ms)마다"}, {"start": 1639.0, "end": 1651.5, "text": "차량이 취해야 할 동작 명령을 전송한다는 의미입니다."}, {"start": 1652.0, "end": 1661.5, "text": "(질문자) 음성 상호작용에 대해 질문드립니다.<br>차량이나 로봇이 사람과 음성으로 대화할 수 있나요?"}, {"start": 1662.0, "end": 1668.5, "text": "말을 걸면 테슬라 차량이 응답할 수 있는지 궁금합니다."}, {"start": 1669.0, "end": 1674.5, "text": "(아쇼크) 현재 테슬라 차량에는 Grok 기능이 탑재되어<br>대화할 수 있습니다."}, {"start": 1675.0, "end": 1680.5, "text": "자체 오디오 모델도 보유하고 있으나, 지금은 자연어 대화보다는<br>사이렌이나 긴급 차량 소음 등"}, {"start": 1681.0, "end": 1686.5, "text": "차량 주변 소리를 인식하는 데 주로 활용됩니다.<br>미래에는 차량을 직접 제어하는"}, {"start": 1687.0, "end": 1694.5, "text": "완전 통합형 음성 제어 명령이 도입될 것입니다.<br>다만 현재로서는 다소 이른 감이 있습니다."}, {"start": 1695.0, "end": 1701.5, "text": "음성 제어는 완전히 새로운 안전성 검증 영역을 열기 때문입니다.<br>예를 들어 차량에 충돌하라고 명령했을 때"}, {"start": 1702.0, "end": 1705.5, "text": "절대 충돌해서는 안 되며,<br>음성을 통한 적대적 공격을 방어하기 위한"}, {"start": 1706.0, "end": 1721.5, "text": "수많은 안전 대책이 필수적입니다.<br>현재 단계에서는 우선순위가 아닙니다."}, {"start": 1722.0, "end": 1729.5, "text": "(질문자) 가우시안 스플래팅을 언급하셨는데,<br>테슬라는 주로 시각적 인식을 향상하기 위해"}, {"start": 1730.0, "end": 1737.5, "text": "이러한 모델을 개선하는 연구를 진행 중인가요?<br>해석 가능성을 위한 작업의 일환인가요?"}, {"start": 1738.0, "end": 1742.6, "text": "(아쇼크) 네, 제가 언급한 여러 연구 과제 중 하나입니다."}, {"start": 1743.0, "end": 1749.5, "text": "가우시안 스플래팅 등을 활용한 3D 공간 이해가<br>그중 하나입니다."}, {"start": 1750.0, "end": 1756.5, "text": "다른 예로는 차량의 3D 위치, 형상,<br>그리고 미래 궤적 예측 등이 포함됩니다."}, {"start": 1757.0, "end": 1761.5, "text": "(사회자) 발표해 주신 아쇼크에게<br>다시 한번 큰 박수를 부탁드립니다."}];
let player;
let isMutedState = true;

function handleUnmute() {
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});
let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
