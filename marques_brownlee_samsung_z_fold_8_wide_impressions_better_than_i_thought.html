const videoId="8Hx2yvWSgs0";
const subs=[{"start": 2.81, "end": 8.41, "text": "자, 오늘 선보일 삼성의 새로운 폴더블폰 3종을 가장 먼저 직접 만나보시죠."}, {"start": 8.41, "end": 11.05, "text": "더 흥미진진한 순서대로..."}, {"start": 11.05, "end": 19.449, "text": "소개해 드리겠습니다. 새로운 Z 플립 8, 그리고 Z 폴드 8 울트라, 마지막으로 Z 폴드 8입니다."}, {"start": 19.449, "end": 23.769, "text": "진짜 이 순서가 맞아요. 자, 그럼 새로운 플립, 플립 8은..."}, {"start": 23.769, "end": 29.85, "text": "플립 7과 아주 비슷하게 생겼지만 조금 더 얇고 가벼워졌습니다. 그 외에는 무난하게 개선된 정도인데,"}, {"start": 29.85, "end": 32.649, "text": "우리가 삼성에 늘 기대했던 흐름과 딱 맞습니다."}, {"start": 32.649, "end": 38.009, "text": "S26 시리즈와 발맞추기 위해 갤럭시 전용 스냅드래곤 8 엘리트 5세대를 탑재해서"}, {"start": 38.009, "end": 42.969, "text": "뛰어난 성능, 이미지 처리 프로세스, NPU를 제공합니다. 그리고 소소한 디테일로 내부..."}, {"start": 42.969, "end": 47.049, "text": "모서리를 비스듬히 깎아 폰을 열기 쉽게 만들었고, 외부 커버 화면을"}, {"start": 47.049, "end": 52.49, "text": "일반 외장 화면처럼 더 편리하게 개선했죠. 왼쪽을 쓸어내리면 알림,"}, {"start": 52.49, "end": 57.21, "text": "오른쪽을 쓸어내리면 빠른 설정, 아래에서 위로 쓸어올리면 앱 목록이 뜹니다. 괜찮네요."}, {"start": 57.21, "end": 63.24, "text": "그런데 8g 더 가벼워지고 0.5mm 더 얇아졌다고 해서"}, {"start": 63.24, "end": 69.07900000000001, "text": "작년이나 재작년 모델을 쓰던 사람들에게 체감이 될까요? 아뇨, 하지만 삼성이 늘 보여준 완만하고 꾸준한 개선입니다."}, {"start": 69.07900000000001, "end": 73.64, "text": "매년 보여주는 이런 완만한 발전의 연장선상에서,"}, {"start": 73.64, "end": 79.239, "text": "이제 대화면 모델인 갤럭시 Z 폴드의 8세대 제품을 살펴보겠습니다. 솔직히 말씀드리면,"}, {"start": 79.239, "end": 83.56, "text": "그동안 너무 꾸준한 개선만 고집하다 보니, 삼성이 먼저 시작했음에도"}, {"start": 83.56, "end": 87.15899999999999, "text": "공격적인 경쟁사들이 어느새 따라잡고 추월해 버린 느낌입니다."}, {"start": 87.15899999999999, "end": 89.959, "text": "그렇다면 삼성은 대형 폴드의 이번 새 세대에서 무엇을 보여주었을까요?"}, {"start": 89.959, "end": 96.12, "text": "글쎄요, 이번에도 소소한 개선에 그쳤지만, 한편으로는 아주 영리한 시도를 했습니다."}, {"start": 96.12, "end": 101.0, "text": "그게 뭔지는 잠시 후에 확인하시죠. 새로운 스냅드래곤 칩 탑재 완료, 그리고 조금 더 얇아졌습니다."}, {"start": 101.0, "end": 106.03999999999999, "text": "더 얇고 가벼워진 건 합격이에요. 하지만 초광각 카메라도 새로운"}, {"start": 106.03999999999999, "end": 111.56, "text": "5,000만 화소 센서로 업그레이드해서 이제 작년과 같은 2억 화소 메인 카메라와 함께 8K 동영상도 촬영할 수 있죠."}, {"start": 111.56, "end": 115.799, "text": "망원 카메라도 그대로지만, 가장 큰 변화는 단연 개선된 힌지와"}, {"start": 115.799, "end": 119.719, "text": "내부 디스플레이예요. 몇 달 전에 올린 폴더블폰 결산 영상에서 제가"}, {"start": 119.719, "end": 125.48, "text": "오포 파인드 N3의 화면 주름이 거의 보이지 않아 정말 놀라웠고,"}, {"start": 125.48, "end": 131.0, "text": "삼성은 한 발 밀린 모습이었죠. 하지만 이제 OLED 패널 뒤에 새로운 티타늄 합금 필름과"}, {"start": 131.0, "end": 135.319, "text": "티타늄 백플레이트를 더하며 주름을 개선하는 데 꽤 큰 진전을 이루었습니다."}, {"start": 135.319, "end": 139.96, "text": "완벽하진 않아요. 아직 오포 수준까지는 아니죠. 만약"}, {"start": 139.96, "end": 145.379, "text": "오포가 10점 만점에 10점이라면 이건 8점이나 8.5점 정도 될 것 같은데,"}, {"start": 145.379, "end": 146.659, "text": "5점 수준이었던 작년보다는 훨씬 낫습니다."}, {"start": 146.659, "end": 150.699, "text": "그럼 화면을 켜고 실제로 콘텐츠를 보면서 확인해 볼까요?"}, {"start": 150.699, "end": 154.36, "text": "게다가 새로운 반사 방지 코팅과 최대 3,000니트 밝기가 지원돼서,"}, {"start": 154.36, "end": 158.06, "text": "이제 주름이 거의 보이지 않는데, 정말 훌륭합니다."}, {"start": 158.06, "end": 165.3, "text": "그리고 추가로 삼성이 드디어 배터리에 실리콘 소재를 쓰기 시작했습니다."}, {"start": 165.3, "end": 167.74, "text": "물론 오포만큼 과감하게 적용하진 못했고,"}, {"start": 167.74, "end": 169.97899999999998, "text": "다른 공격적인 경쟁사들 수준에도 못 미칩니다."}, {"start": 169.97899999999998, "end": 171.139, "text": "솔직히 그리 놀랍지도 않은 게,"}, {"start": 171.139, "end": 173.219, "text": "삼성의 배터리 흑역사를 생각하면 당연하죠."}, {"start": 173.219, "end": 176.219, "text": "그래도 이번 제품은 삼성 폴드 중 역대 최대 배터리를 탑재해,"}, {"start": 176.219, "end": 178.3, "text": "드디어 5,000mAh에 달합니다."}, {"start": 178.3, "end": 179.939, "text": "게다가 이번에 최초로 업그레이드된 부분이 있는데요,"}, {"start": 179.939, "end": 183.58, "text": "유선 충전 속도가 25W에서 45W로 빨라졌고,"}, {"start": 183.58, "end": 185.74, "text": "무선 충전도 15W에서 20W로 개선되었습니다."}, {"start": 185.74, "end": 189.9, "text": "한편, 삼성은 라인업에 새로운 폴더블폰을 추가했습니다."}, {"start": 189.9, "end": 191.62, "text": "이건 삼성이 아주 영리하게 머리를 쓴 건데,"}, {"start": 191.62, "end": 194.46, "text": "포지셔닝 측면에서 제 생각은 그렇습니다."}, {"start": 194.46, "end": 199.57999999999998, "text": "몇 달 후면 애플이 첫 폴더블 스마트폰인"}, {"start": 199.57999999999998, "end": 200.57999999999998, "text": "아이폰을 공개할 것으로 예상되는 상황이니까요."}, {"start": 200.57999999999998, "end": 205.57999999999998, "text": "소문에 따르면 그 폰은 더 짧고 둥글며 작은,"}, {"start": 205.57999999999998, "end": 207.78, "text": "여권 같은 화면 비율을 가질 것이라고 합니다."}, {"start": 207.78, "end": 211.25900000000001, "text": "사실 삼성은 오랫동안 폴더블폰을 만들어 왔죠."}, {"start": 211.25900000000001, "end": 212.81900000000002, "text": "벌써 8세대 제품이니까요."}, {"start": 212.81900000000002, "end": 217.219, "text": "수년 전 여권 모양의 폴더블폰이 잠깐 주목받았을 때가 있었죠."}, {"start": 217.219, "end": 221.62, "text": "오포 파인드 N과 1세대 픽셀 폴드가 그런 형태였습니다."}, {"start": 221.62, "end": 225.879, "text": "하지만 결국 업계 트렌드는 바형 스마트폰 비율로 굳어졌고,"}, {"start": 225.879, "end": 229.78, "text": "삼성이 주도하는 현재의 디자인은 접었을 땐 일반 스마트폰처럼 약간"}, {"start": 229.78, "end": 233.379, "text": "세로로 긴 형태였다가, 펼치면 커다란 정사각형이 됩니다."}, {"start": 233.379, "end": 237.18, "text": "혹시라도 애플이 등장해 완전히 새로운 여권형 비율의"}, {"start": 237.18, "end": 242.659, "text": "혁신적인 폴더블폰이라며 대대적으로 홍보할 것을 대비해,"}, {"start": 242.659, "end": 249.74, "text": "삼성 역시 여권 모양 폴더블폰을 출시해 그 아래에 확실히 포지셔닝하려는 것이죠."}, {"start": 249.74, "end": 251.25900000000001, "text": "기존의 바(bar)형 폴더블폰 말이죠."}, {"start": 251.25900000000001, "end": 255.25900000000001, "text": "그래서 기존 바형 폴더블폰 이름 뒤에 '울트라'가 붙게 된 겁니다."}, {"start": 255.25900000000001, "end": 257.579, "text": "이제 'Z 폴드 8 울트라'가 된 거죠."}, {"start": 257.579, "end": 262.139, "text": "그리고 완전히 새로운 이 작은 여권 스타일의 폴더블은 그냥 일반 Z 폴드 8이죠."}, {"start": 262.139, "end": 264.139, "text": "그래서 9월에 애플이 신제품을 출시하며, \"오, 멋진데?\" 하면"}, {"start": 264.139, "end": 265.139, "text": "\"드디어 폴더블을 만들었네\"라고요."}, {"start": 265.139, "end": 265.939, "text": "\"앙증맞네\" 하면서요."}, {"start": 265.939, "end": 268.819, "text": "그러면 우리는 \"우리도 그런 거 있어, 하지만 더 좋은 것도 있지\"라고 맞받아치는 거죠."}, {"start": 268.819, "end": 269.66, "text": "바로 울트라 말입니다."}, {"start": 269.66, "end": 272.18, "text": "아무튼 이 작은 폰도 정말 흥미로워요."}, {"start": 272.18, "end": 274.86, "text": "제가 울트라를 설명할 때 말한 기능들이 다 들어있거든요."}, {"start": 274.86, "end": 277.899, "text": "티타늄 플렉스 힌지에 주름도 거의 없죠."}, {"start": 277.899, "end": 281.06, "text": "새로운 반사 방지 코팅에, 배터리엔 실리콘이 살짝 들어갔죠."}, {"start": 281.06, "end": 283.86, "text": "하지만 확실히 크기가 훨씬 작습니다."}, {"start": 283.86, "end": 286.939, "text": "전체적으로 아주 얇고 정말 가벼워요."}, {"start": 286.939, "end": 288.62, "text": "정확히 201g입니다."}, {"start": 288.62, "end": 289.779, "text": "그리고 정말 얇고 세로 길이도 짧죠."}, {"start": 289.779, "end": 292.019, "text": "솔직히 말씀드리면, 제 생각을 좀 보태서"}, {"start": 292.019, "end": 295.98, "text": "서피스 듀오의 좋았던 점들이 생각나네요."}, {"start": 295.98, "end": 298.65999999999997, "text": "그 장점들 말이에요, 하드웨어가 아주 훌륭했던 부분 말이죠."}, {"start": 298.65999999999997, "end": 302.18, "text": "일반 삼성 갤럭시 S24 플러스와 무게가 거의 비슷하지만,"}, {"start": 302.18, "end": 304.66, "text": "외부 화면과 내부 폴딩 디스플레이까지"}, {"start": 304.66, "end": 306.139, "text": "두 개의 화면을 갖추고 있고,"}, {"start": 306.139, "end": 308.339, "text": "4,000mAh 배터리까지 탑재하고 있죠."}, {"start": 308.339, "end": 312.899, "text": "직접 만져보고 사용하면서 다뤄볼수록 솔직히 말씀드려서"}, {"start": 312.899, "end": 313.899, "text": "점점 더 마음에 듭니다."}, {"start": 313.899, "end": 317.3, "text": "물론 울트라에 비하면 사양이 확실히 떨어지는 기기이긴 합니다."}, {"start": 317.3, "end": 321.699, "text": "외부 화면과 내부 화면 모두 더 작고 배터리도 적은 데다, 카메라도 하나"}, {"start": 321.699, "end": 322.699, "text": "더 적습니다."}, {"start": 322.699, "end": 325.06, "text": "보시다시피 메인 카메라와 초광각 카메라뿐이죠."}, {"start": 325.06, "end": 329.139, "text": "하지만 삼성이 이 제품들을 포지셔닝한 방식을 보면, 울트라는 파워 유저를"}, {"start": 329.139, "end": 330.139, "text": "위한 제품입니다."}, {"start": 330.139, "end": 333.65999999999997, "text": "여러 앱을 나란히 띄워놓고 한 번에 엄청난 멀티태스킹을"}, {"start": 333.65999999999997, "end": 334.65999999999997, "text": "하는 사람들을 위해서요."}, {"start": 334.65999999999997, "end": 339.3, "text": "원래 그런 용도에 특화되어 있었고, 펼쳤을 때 중앙의 대화면은 기본적으로 폰 두 개를 붙여놓은 것과 같습니다."}, {"start": 339.3, "end": 341.139, "text": "반면, 새로 나온 더 작은 폴드 6는"}, {"start": 341.139, "end": 345.899, "text": "미디어 시청에 좀 더 초점을 맞춘 크기로 포지셔닝되어 있습니다."}, {"start": 345.899, "end": 348.3, "text": "외부 화면은 5.5인치이고,"}, {"start": 348.3, "end": 353.339, "text": "16:10 화면비에 베젤도 꽤 얇은 편이지만, 이 때문에"}, {"start": 353.339, "end": 359.819, "text": "내부 화면은 8인치가 아닌 7.6인치에 화면비는 4:3이 되었고, 밝기는 3,000니트입니다."}, {"start": 359.819, "end": 360.819, "text": "그리고 최대 밝기죠."}, {"start": 360.819, "end": 362.699, "text": "사양상으로는 똑같이 강력해요."}, {"start": 362.699, "end": 363.779, "text": "스펙도 전부 동일하지만,"}, {"start": 363.779, "end": 366.579, "text": "크기가 더 작아지고 화면도 작아져서"}, {"start": 366.579, "end": 369.06, "text": "멀티태스킹에는 조금 아쉽지만,"}, {"start": 369.06, "end": 371.42, "text": "확실히 더 유용하다고 생각해요."}, {"start": 371.42, "end": 374.54, "text": "특정 미디어 작업에는 훨씬 더 낫다고 봐요."}, {"start": 374.54, "end": 376.699, "text": "예를 들어, 접었을 때 카메라 뷰파인더를 보면,"}, {"start": 376.699, "end": 377.62, "text": "모든 버튼이 손에 잘 닿아요."}, {"start": 377.62, "end": 379.379, "text": "엄지손가락으로 모든 버튼을 누를 수 있고,"}, {"start": 379.379, "end": 381.819, "text": "찍히는 화면이 화면을 더 꽉 채워 주죠."}, {"start": 381.819, "end": 383.74, "text": "바형 폴더블폰보다 훨씬 나은 부분이에요."}, {"start": 383.74, "end": 385.66, "text": "게다가 사진을 다시 볼 때도,"}, {"start": 385.66, "end": 387.259, "text": "특히 펼쳤을 때 그렇습니다."}, {"start": 387.259, "end": 389.699, "text": "이 사진들은 보통 4 대 3 비율이라,"}, {"start": 389.699, "end": 393.22, "text": "나중에 볼 때 화면에 아주 꽉 차요."}, {"start": 393.22, "end": 394.06, "text": "정말 만족스럽죠."}, {"start": 394.06, "end": 395.74, "text": "이 폼팩터는 아주 훌륭하다고 봐요."}, {"start": 395.74, "end": 398.339, "text": "펼치거나 접어서 이북 리더기로 쓰기에 말이죠."}, {"start": 398.339, "end": 399.699, "text": "진짜 엄청나게 가볍거든요."}, {"start": 399.699, "end": 401.74, "text": "물론 와이드스크린 영상이 완벽할 순 없겠죠."}, {"start": 401.74, "end": 403.5, "text": "곳곳에 블랙 바가 생기겠지만"}, {"start": 403.5, "end": 408.74, "text": "네, 열고 닫기 편하고 크기도 참 괜찮네요."}, {"start": 408.74, "end": 409.699, "text": "한 손에 쏙 들어옵니다."}, {"start": 409.699, "end": 411.74, "text": "이런 포지셔닝은 꽤 영리하다고 봐요."}, {"start": 411.74, "end": 413.019, "text": "아주 합리적이기도 하고요."}, {"start": 413.019, "end": 416.139, "text": "모든 걸 갖춘 하이엔드 모델인 울트라와"}, {"start": 416.139, "end": 417.06, "text": "플립 사이에 있는 모델이죠."}, {"start": 417.06, "end": 418.459, "text": "카메라 성능이 조금 떨어지고,"}, {"start": 418.459, "end": 420.259, "text": "메인 카메라도 5천만 화소입니다."}, {"start": 420.259, "end": 421.579, "text": "2억 화소 대신에 말이죠."}, {"start": 421.579, "end": 425.779, "text": "화면과 배터리 용량도 약간 줄었지만, 콘셉트는 같습니다."}, {"start": 425.779, "end": 427.06, "text": "가격도 더 저렴하고요."}, {"start": 427.06, "end": 430.62, "text": "하지만 올해는 그 장점이 크게 와닿지 않네요."}, {"start": 430.62, "end": 432.54, "text": "모든 게 다 비싸졌으니까요."}, {"start": 432.54, "end": 434.98, "text": "이 폰들은 전부 256GB부터 시작하지만"}, {"start": 434.98, "end": 439.06, "text": "플립 8의 시작가는 이제 1,200달러입니다."}, {"start": 439.06, "end": 441.86, "text": "더 작은 Z 폴드는 1,900달러부터 시작하고"}, {"start": 441.86, "end": 446.62, "text": "폴드 8 울트라는 2,000달러가 넘는 가격부터 시작하죠."}, {"start": 446.62, "end": 448.339, "text": "작년보다 100달러씩 오른 셈입니다."}, {"start": 448.339, "end": 450.339, "text": "하지만 이제는 확실히 가격 부담이 좀 더 느껴지네요."}, {"start": 450.339, "end": 451.98, "text": "시작 가격이 2,000달러를 넘기 때문이죠."}, {"start": 451.98, "end": 453.259, "text": "하지만 이게 우리가 살아가는 지금의 현실입니다."}, {"start": 453.259, "end": 456.139, "text": "앞으로 몇 달 사이에 출시될"}, {"start": 456.139, "end": 457.74, "text": "수많은 기기가"}, {"start": 457.74, "end": 460.22, "text": "작년보다 더 비싸게 나와도 전혀 놀랍지 않을 겁니다."}, {"start": 460.22, "end": 462.579, "text": "메모리 가격이 상승했기 때문이죠."}, {"start": 462.579, "end": 464.22, "text": "특히 그 아이폰, 그 아이폰은"}, {"start": 464.22, "end": 466.459, "text": "가격이 비쌀 거라는 걸 우리 모두 잘 알고 있죠."}, {"start": 466.459, "end": 467.98, "text": "출시되면 바로 확인하실 수 있게 구독해 주세요."}, {"start": 467.98, "end": 470.3, "text": "그래도 비쌀 거라는 건 우리 다 알고 있지만요."}, {"start": 470.3, "end": 472.779, "text": "어쨌든, 제가 이 제품을 얼마나 마음에 들어 하는지 저조차 놀라워요."}, {"start": 472.779, "end": 475.42, "text": "이 작은 폴더블폰을 실제로 제가"}, {"start": 475.42, "end": 481.42, "text": "메인 폰으로 쓸 수 있을 것 같아요. 처음엔 그런 생각은 안 했지만요. 아무튼 이 폰의 상세 리뷰에서 보고 싶으신 점을 댓글로 알려주세요."}, {"start": 481.42, "end": 488.42, "text": "또한, 이렇게 훨씬 더 비싸진 폴더블폰 구매를 고민하고 계신다면, 채널 후원사인 디브랜드의 케이스 구매도 고려해 보셔야 할 겁니다."}, {"start": 488.42, "end": 492.42, "text": "삼성의 신형 스마트폰 3종 모두를 위한 그립 케이스가 준비되어 있거든요."}, {"start": 492.42, "end": 500.42 let player;
let isMutedState = true;

function handleUnmute() {
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});
let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
