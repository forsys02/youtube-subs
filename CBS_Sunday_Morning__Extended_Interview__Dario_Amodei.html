<script>
async function toggleFullScreen() {
    const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const fsBtn = document.getElementById('fs-btn');
    if (!isFull) {
        const req = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
        if (req) {
            try {
                await req.call(document.documentElement);
            } catch (err) {
                console.log(`Fullscreen error: ${err.message}`);
            }
        }
        // 📱 모바일 환경인 경우 화면을 가로 최대화면(Landscape)으로 자동 회전 고정! 🔄📱✨
        if (screen.orientation && screen.orientation.lock) {
            try {
                await screen.orientation.lock('landscape');
            } catch (e) {
                try {
                    if (screen.lockOrientation) screen.lockOrientation('landscape');
                } catch (e2) {}
            }
        }
        if (fsBtn) fsBtn.textContent = '🗗 창모드';
    } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) {
            try {
                await exit.call(document);
            } catch (e) {}
        }
        if (screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (e) {}
        }
        if (fsBtn) fsBtn.textContent = '🔲 전체화면';
    }
}

// 🖥️ 전체화면 상태 변경 시 버튼 텍스트 및 화면 방향 락 자동 해제 동기화 🎯
function handleFullscreenChange() {
    const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const fsBtn = document.getElementById('fs-btn');
    if (fsBtn) {
        fsBtn.textContent = isFull ? '🗗 창모드' : '🔲 전체화면';
    }
    if (!isFull) {
        if (screen.orientation && screen.orientation.unlock) {
            try { screen.orientation.unlock(); } catch (e) {}
        }
    }
}
document.addEventListener('fullscreenchange', handleFullscreenChange);
document.addEventListener('webkitfullscreenchange', handleFullscreenChange);

const subs=[{"start": 0.0, "end": 2.0, "text": "다리오 아모데이 씨, 앤스로픽의 CEO이신데요."}, {"start": 2.1, "end": 3.8, "text": "오늘 자리해 주셔서 정말 감사합니다."}, {"start": 4.0, "end": 5.8, "text": "초대해 주셔서 감사합니다."}, {"start": 6.0, "end": 8.8, "text": "머지않은 미래에 AI가 인류를 파멸시킬 수도 있다는,"}, {"start": 8.9, "end": 11.5, "text": "그런 우려에 대해 이야기해 보고자 합니다."}, {"start": 11.8, "end": 14.8, "text": "실제로 이런 일이 일어날 위험은 어느 정도인가요?"}, {"start": 15.2, "end": 17.5, "text": "조금 거슬러 올라가 말씀드리자면,"}, {"start": 17.8, "end": 20.8, "text": "앤스로픽을 창립했을 때부터 저희는 확신해 왔고,"}, {"start": 21.0, "end": 24.5, "text": "제가 이 분야에서 일해 온 지난 12년 동안 늘 믿어왔던 것은,"}, {"start": 24.8, "end": 27.2, "text": "AI가 엄청나게 강력한 기술이라는 점입니다."}, {"start": 27.5, "end": 30.8, "text": "따라서 심각한 위험과 막대한 이점을,"}, {"start": 31.0, "end": 33.8, "text": "동시에 지니고 있는 기술이죠."}, {"start": 34.0, "end": 37.2, "text": "저는 항상 기술의 이점이 위험보다 크다고 믿어왔으며,"}, {"start": 37.4, "end": 40.2, "text": "기술을 올바른 방식으로 개발해 나간다면,"}, {"start": 40.4, "end": 43.2, "text": "그 위험을 매우 낮은 수준으로 줄일 수 있다고 봅니다."}, {"start": 43.5, "end": 46.0, "text": "긍정적인 이점들을 살펴보자면,"}, {"start": 46.2, "end": 49.5, "text": "수천 년간 인류를 괴롭혀 온 질병들을,"}, {"start": 49.7, "end": 53.0, "text": "이 기술이 치료해 낼 수 있다고 진심으로 믿습니다."}, {"start": 53.5, "end": 56.8, "text": "바로 지난주에도 저희 모델을 활용해서,"}, {"start": 57.0, "end": 60.2, "text": "신약 개발의 초기 단계인 단백질 결합 예측 성능을,"}, {"start": 60.4, "end": 63.5, "text": "크게 향상시키는 연구 성과를 냈습니다."}, {"start": 63.8, "end": 66.8, "text": "앞으로 몇 달 안에 생물학 분야에서,"}, {"start": 67.0, "end": 70.2, "text": "기초 과학적 발견을 이뤄낼 소식들을,"}, {"start": 70.4, "end": 72.5, "text": "전해드릴 수 있을 겁니다."}, {"start": 72.8, "end": 75.8, "text": "하지만 어떤 기술이 강력할 때, 우리가 만드는 건 본질적으로 지능이니까요,"}, {"start": 76.0, "end": 78.8, "text": "기술이 그토록 강력하다면 당연히 선하게 쓰일 수도 있고,"}, {"start": 79.0, "end": 82.0, "text": "동시에 악하게 악용될 수도 있습니다."}, {"start": 82.2, "end": 85.5, "text": "그래서 저는 최근 OpenAI 허깅페이스 사건처럼,"}, {"start": 85.8, "end": 89.0, "text": "모델이 승인되지 않은 행동을 제멋대로 취하는 현상을 우려하고 있으며,"}, {"start": 89.2, "end": 92.5, "text": "그런 일들이 더 격화될까 봐 깊이 걱정하고 있습니다."}, {"start": 93.0, "end": 96.2, "text": "AI 모델의 오남용에 대해서도 마찬가지입니다."}, {"start": 96.5, "end": 99.8, "text": "불과 이틀 전에도 모델을 악용해 생물학 무기를 제작하는,"}, {"start": 100.0, "end": 103.2, "text": "위험성에 대한 보고서를,"}, {"start": 103.4, "end": 106.0, "text": "저희가 발표하기도 했죠."}, {"start": 106.2, "end": 109.5, "text": "저희 앤스로픽이 회사를 일구어 온 모든 과정은,"}, {"start": 109.8, "end": 113.2, "text": "이러한 파국적 결과가 일어나지 않도록 막기 위함입니다."}, {"start": 113.5, "end": 116.5, "text": "단순히 파멸의 확률을 논하기보다는,"}, {"start": 116.8, "end": 120.0, "text": "우리가 무엇을 할 수 있는지에 대해 이야기해야 합니다."}, {"start": 120.2, "end": 123.0, "text": "우리가 주사위를 굴리고만 있는 건 아니니까요."}, {"start": 123.2, "end": 126.5, "text": "올바른 방식으로 개발한다면 나쁜 일이 일어날 확률은 매우 낮아지겠지만,"}, {"start": 126.7, "end": 130.2, "text": "잘못된 방식으로 개발한다면 파국의 가능성은 극도로 높아질 겁니다."}, {"start": 131.0, "end": 133.2, "text": "지금 많은 이들이 나누는 이야기는,"}, {"start": 133.4, "end": 136.8, "text": "우리가 정말 무시무시한 벼랑 끝에 서 있다는 것입니다."}, {"start": 137.0, "end": 139.0, "text": "이것이 최고 등급의 화재 경보 상황인가요?"}, {"start": 139.2, "end": 141.5, "text": "글쎄요, 최고 등급 경보를 어떻게 정의하느냐에 달렸지만,"}, {"start": 141.7, "end": 143.8, "text": "제가 말씀드리고 싶은 것은,"}, {"start": 144.0, "end": 145.8, "text": "당신이라면 어떻게 묘사하시겠습니까?"}, {"start": 146.0, "end": 148.0, "text": "제가 설명해 드리자면,"}, {"start": 148.2, "end": 151.2, "text": "앤스로픽을 창립했을 때부터, 아니 그 이전부터 제가 해온 말은,"}, {"start": 151.5, "end": 154.2, "text": "이 기술이 기하급수적 곡선을 타고 있다는 사실입니다."}, {"start": 154.5, "end": 157.2, "text": "1에서 2, 4, 8, 16, 32로 폭발적으로 늘어나는 것처럼요."}, {"start": 157.5, "end": 160.5, "text": "하지만 제 스스로 그렇게 말하면서도,"}, {"start": 160.8, "end": 164.0, "text": "발전 속도가 이 정도로 빠를 때 실제로 어떤 일이 벌어질지,"}, {"start": 164.2, "end": 167.5, "text": "저 역시 온전히 실감하지는 못했던 것 같습니다."}, {"start": 167.8, "end": 171.0, "text": "기하급수적 곡선은 대략 이런 모양을 띱니다."}, {"start": 173.5, "end": 175.2, "text": "지금 우리는 그 곡선의 어디쯤 와 있나요?"}, {"start": 175.4, "end": 178.0, "text": "기울기가 본격적으로 가팔라지기 시작하는 굴곡점에 서 있습니다."}, {"start": 178.2, "end": 180.5, "text": "그렇다면 당신에게는 이것이 최고 등급 경보인가요?"}, {"start": 180.8, "end": 183.5, "text": "그것이 의미하는 바는, 당장 오늘 공포에 떨어야 한다거나,"}, {"start": 183.8, "end": 186.8, "text": "모든 것을 완전히 셧다운해야 한다는 뜻은 아닙니다."}, {"start": 187.0, "end": 189.5, "text": "제가 말씀드리고 싶은 것은,"}, {"start": 189.8, "end": 191.2, "text": "왜 셧다운이 아닌가요?"}, {"start": 191.4, "end": 194.2, "text": "이것은 일종의 경고 신호입니다. 속도를 늦춰야 한다는 경고죠."}, {"start": 194.5, "end": 197.8, "text": "우리는 이 기술을 신중하게 만들어야 하며,"}, {"start": 198.0, "end": 201.5, "text": "우리의 안전장치와 기술을 이해하고 통제하는 능력이,"}, {"start": 201.8, "end": 205.0, "text": "기술 자체가 발전하는 속도를,"}, {"start": 205.2, "end": 208.5, "text": "반드시 따라잡을 수 있도록 보장해야 합니다."}, {"start": 208.8, "end": 212.0, "text": "지금까지는 안전장치를 빠르게 구축함으로써 그 균형을 맞춰왔지만,"}, {"start": 212.3, "end": 215.5, "text": "적어도 어느 정도는, 기술이 개발되는 속도 자체를,"}, {"start": 215.8, "end": 219.0, "text": "조금 조절해야 하는 시점에 도달했다고 생각합니다."}, {"start": 226.0, "end": 228.5, "text": "그렇다면 앤스로픽이 앞으로 더 진보된 모델 출시를,"}, {"start": 228.7, "end": 231.0, "text": "중단하겠다는 의미인가요?"}, {"start": 231.2, "end": 233.0, "text": "그런 뜻은 결코 아닙니다."}, {"start": 233.2, "end": 236.5, "text": "우리가 출시하는 모든 세대의 모델들이,"}, {"start": 236.8, "end": 240.0, "text": "제대로 철저히 검증되어야 한다는 뜻입니다."}, {"start": 240.3, "end": 243.8, "text": "제가 불과 몇 시간 전에 발표한 에세이에서,"}, {"start": 244.0, "end": 247.5, "text": "제안한 3단계 실행 계획이 바로 그것입니다."}, {"start": 247.8, "end": 249.5, "text": "네."}, {"start": 249.8, "end": 253.0, "text": "그 첫 번째 단계는 상주형 외부 평가자를 두는 것입니다."}, {"start": 253.2, "end": 256.5, "text": "제3자 비영리 단체나 훗날 정부 기관 소속의 전문가들이,"}, {"start": 256.8, "end": 260.0, "text": "우리가 모델을 훈련하고 운영하는 전 과정을,"}, {"start": 260.2, "end": 263.5, "text": "직접 현장에서 관찰하고 감시할 수 있도록 하는 것이죠."}, {"start": 263.8, "end": 267.0, "text": "이것은 우리가 모델을 언제, 어떻게 출시할지보다도,"}, {"start": 267.2, "end": 270.5, "text": "궁극적으로 훨씬 더 중요하다고 생각합니다."}, {"start": 270.8, "end": 274.0, "text": "모델을 더욱 신중하게 출시하기 위한 전제 조건이기 때문입니다."}, {"start": 285.0, "end": 288.2, "text": "저는 이러한 평가 체계가 업계 전반에 걸쳐 확립되기를 바랍니다."}, {"start": 288.5, "end": 291.8, "text": "어느 기업이든 AI 모델을 개발할 때마다,"}, {"start": 292.0, "end": 295.2, "text": "최고의 안전 기준을 깊이 이해하고 있는 외부 평가자가 입회하여,"}, {"start": 295.5, "end": 299.0, "text": "그 회사가 공언한 안전 원칙을 제대로 준수하고 있는지,"}, {"start": 299.2, "end": 302.5, "text": "철저히 검증할 수 있도록 말이죠."}, {"start": 302.8, "end": 305.2, "text": "식품 위생 검사관처럼요."}, {"start": 305.5, "end": 308.0, "text": "하지만 기술이 이렇게나 빠르게 변하고 있는데,"}, {"start": 308.2, "end": 310.8, "text": "과연 식품 검사관이 그 속도를 따라잡을 수 있을까요?"}, {"start": 311.2, "end": 314.2, "text": "그들이 할 수 있는 중요한 역할 중 하나는 바로,"}, {"start": 314.5, "end": 317.8, "text": "자신들이 따라잡을 수 있는 한계 속도를 우리에게 알려주는 것입니다."}, {"start": 318.0, "end": 321.5, "text": "그것이 바로 기술 발전의 제한 속도를 설정하는,"}, {"start": 321.8, "end": 324.8, "text": "결정적인 기준 요인 중 하나가 될 수 있습니다."}, {"start": 325.0, "end": 328.5, "text": "개발사인 우리도 이해해야 하고, 외부 평가자도 완벽히 이해해야 하니까요."}, {"start": 329.0, "end": 331.5, "text": "일론 머스크도 당신의 생각에 동의한다고 밝혔고,"}, {"start": 331.8, "end": 334.0, "text": "샘 올트먼 역시 당신에게 동의한다고 했습니다."}, {"start": 334.2, "end": 337.0, "text": "업계 리더들이 한자리에 모이기 위한 실행 계획은 무엇인가요?"}, {"start": 337.2, "end": 339.0, "text": "이와 관련해 단체 채팅방이라도 만들어진 게 있나요?"}, {"start": 339.2, "end": 340.8, "text": "우선 말씀드리고 싶은 것은,"}, {"start": 341.0, "end": 341.8, "text": "서로 대화를 나누고 계신가요?"}, {"start": 342.0, "end": 345.2, "text": "경쟁사를 포함한 업계 리더들이 이 계획에 동의해 준 점에 대해,"}, {"start": 345.5, "end": 348.8, "text": "저는 대단히 감사하게 생각하고 있습니다."}, {"start": 349.0, "end": 352.2, "text": "다음 단계는 여러 주요 기업들이 외부 평가자를 두는 데,"}, {"start": 352.5, "end": 355.8, "text": "실제로 공식 동의하도록 만드는 것입니다."}, {"start": 356.0, "end": 359.2, "text": "그 이후의 단계는 기업들이 어떤 형태로든 힘을 합쳐,"}, {"start": 359.5, "end": 362.8, "text": "출시를 위한 안전 기준과 출시 속도에 대한 규범을,"}, {"start": 363.0, "end": 366.2, "text": "공동으로 수립해 나가는 것이라고 봅니다."}, {"start": 366.5, "end": 369.8, "text": "하지만 이를 실현하기 위해서는,"}, {"start": 370.0, "end": 373.2, "text": "반드시 정부의 참여가 필요합니다."}, {"start": 373.5, "end": 376.8, "text": "우리가 논의하는 것은 안전 여부에 따른 제품의 출시 속도이며,"}, {"start": 377.0, "end": 380.2, "text": "이는 반드시 정부 당국자가 배석한 자리에서 다뤄져야 하기 때문입니다."}, {"start": 390.0, "end": 393.5, "text": "정부가 여기서 무엇이 가능한지 본질적으로 이해하고 있다고 보시나요?"}, {"start": 393.8, "end": 397.2, "text": "전직 앤스로픽 직원이었던 제이콥 콕슨 씨는,"}, {"start": 397.5, "end": 400.2, "text": "앤스로픽과 OpenAI 양쪽 모두를 향해,"}, {"start": 400.5, "end": 403.5, "text": "\"두 회사 모두 책임감 있게 행동하지 않고 있다,"}, {"start": 403.8, "end": 406.5, "text": "당신들은 우리의 목숨을 걸고 도박을 하고 있다\"고 비판했는데요."}, {"start": 406.8, "end": 408.0, "text": "이에 대해 어떻게 답변하시겠습니까?"}, {"start": 408.2, "end": 411.5, "text": "우선 제이콥이 했던 말 중에서 크게 인용되지 않은 부분이 있는데,"}, {"start": 411.8, "end": 415.0, "text": "그는 앤스로픽이 주요 기업들 중 가장 책임감 있는 기업이며,"}, {"start": 415.2, "end": 418.5, "text": "우리가 일을 올바르게 해내기 위해 각고의 노력을 기울이고 있다고도 말했습니다."}, {"start": 418.8, "end": 422.0, "text": "그가 지적한 것은 사실 제가 지적하고 있는 바와 같습니다."}, {"start": 422.2, "end": 425.5, "text": "현재 상황의 구조적 난제에 대한 경고인 것이죠."}, {"start": 425.8, "end": 429.0, "text": "우리 모두가 처한 상황의 구조적 어려움에 대한 지적이며,"}, {"start": 429.2, "end": 432.5, "text": "제가 발표한 계획은 바로 이 문제를 해결하고,"}, {"start": 432.8, "end": 436.0, "text": "우리가 함께 협력할 수 있도록 돕기 위해 고안되었습니다."}, {"start": 436.2, "end": 439.5, "text": "이제 정부에 대한 질문으로 돌아가자면,"}, {"start": 439.8, "end": 443.0, "text": "저희는 정부와 매일같이 긴밀하게 소통하고 있습니다."}, {"start": 443.2, "end": 446.5, "text": "상무부, 재무부, 그리고 정보 당국의 공직자들과 매일 대화하며,"}, {"start": 446.8, "end": 450.0, "text": "저희가 파악한 바를 가능한 한 투명하게 공유하고 있습니다."}, {"start": 450.2, "end": 453.5, "text": "정부와 계속해서 협력해 나간다면,"}, {"start": 453.8, "end": 457.0, "text": "최신 동향을 계속 업데이트해 줄 수 있을 것이라 낙관합니다."}, {"start": 457.2, "end": 460.5, "text": "당국자들은 진정으로 올바른 일을 하고 싶어 하며,"}, {"start": 460.8, "end": 464.0, "text": "자신들이 어떻게 도울 수 있을지 적극적으로 찾고 있습니다."}, {"start": 464.2, "end": 467.5, "text": "따라서 기업들과 정부가 함께 협력하여,"}, {"start": 467.8, "end": 471.0, "text": "합리적이고 타당한 방안을 도출해 낼 수 있으리라 확신합니다."}, {"start": 485.0, "end": 487.2, "text": "현재 발의된 몇 가지 입법안들이 있는데요."}, {"start": 487.5, "end": 490.8, "text": "샌더스 상원의원과 카사르 하원의원이 발의한 인공초지능 금지법안은,"}, {"start": 491.0, "end": 494.2, "text": "첨단 AI를 개발하는 기업과 개인을, 불법 핵무기 개발자와 마찬가지로,"}, {"start": 494.5, "end": 497.8, "text": "강력하게 처벌하도록 규정하고 있습니다."}, {"start": 498.0, "end": 501.2, "text": "해당 법안 내용 중에는 이런 조항이 있습니다."}, {"start": 501.5, "end": 504.5, "text": "\"법인은 법인 해산 처분에 처해지며,"}, {"start": 504.8, "end": 508.0, "text": "개인은 20년 이하의 징역형에 처한다.\""}, {"start": 508.2, "end": 511.0, "text": "이 법안에 동의하시나요?"}, {"start": 511.5, "end": 514.0, "text": "제가 말씀드리고 싶은 것은,"}, {"start": 514.2, "end": 516.0, "text": "지지하시겠습니까?"}, {"start": 516.2, "end": 519.5, "text": "현재 제안되는 법안들의 범위가 대단히 넓다는 점입니다."}, {"start": 519.8, "end": 523.0, "text": "그 스펙트럼이 실로 엄청납니다."}, {"start": 523.2, "end": 526.5, "text": "불과 1년 전인 2025년으로 돌아가 보면,"}, {"start": 526.8, "end": 530.0, "text": "캘리포니아에서 SB 53이라는 법안이 있었고 다른 주들에도 유사 법안이 있었죠."}, {"start": 530.2, "end": 533.5, "text": "그 법안은 단순히 '안전 테스트 계획을 공개하라'는 내용이었습니다."}, {"start": 533.8, "end": 535.5, "text": "그렇죠."}, {"start": 535.8, "end": 539.0, "text": "그런데 업계 전체가 반대하거나 침묵으로 일관했을 때,"}, {"start": 539.2, "end": 542.5, "text": "열렬하게 찬성한 기업은 오직 앤스로픽뿐이었습니다."}, {"start": 542.8, "end": 546.0, "text": "그리고 지금은 스펙트럼의 반대편 끝까지 가서,"}, {"start": 546.2, "end": 548.5, "text": "AI 킬스위치 법안도 나와 있죠."}, {"start": 548.8, "end": 552.0, "text": "네, 모든 것을 전면 금지하자는 쪽까지 가 있는 셈입니다."}, {"start": 552.2, "end": 555.0, "text": "AI 킬스위치는 좋은 아이디어일 수 있습니다."}, {"start": 555.2, "end": 556.8, "text": "왜인가요?"}, {"start": 557.0, "end": 560.2, "text": "하지만 전면 금지, 완전히 금지하는 것은 올바른 접근이 아니라고 봅니다."}, {"start": 560.5, "end": 563.8, "text": "첫째, 이 기술이 가져올 놀라운 혜택과 질병 치료법을,"}, {"start": 564.0, "end": 567.2, "text": "영원히 얻지 못한다는 생각은 결코 납득하기 어렵습니다."}, {"start": 567.5, "end": 570.8, "text": "둘째, 이 기술은 권위주의 국가를 포함한 다른 나라에서도,"}, {"start": 571.0, "end": 574.0, "text": "어차피 개발될 것이기 때문입니다."}, {"start": 574.2, "end": 575.8, "text": "중국처럼요."}, {"start": 576.0, "end": 578.8, "text": "중국을 비롯한 여러 국가들이죠."}, {"start": 579.0, "end": 582.2, "text": "저는 그들이 이 기술을 자유 사회를 상대로 어떻게 쓸지,"}, {"start": 582.5, "end": 585.8, "text": "자국민을 탄압하는 데 어떻게 악용할지 깊이 우려하고 있습니다."}, {"start": 586.0, "end": 589.2, "text": "물론 제 에세이에서도 그들과의 협력을 언급했고 일정 부분 필요하다고 보지만,"}, {"start": 589.5, "end": 592.8, "text": "기술을 아예 만들지 않는 것이,"}, {"start": 593.0, "end": 596.0, "text": "지속 가능한 해법이라고는 전혀 보지 않습니다."}, {"start": 596.2, "end": 599.5, "text": "우리가 해야 할 일은 멈추는 것이 아니라, 속도를 늦추는 것입니다."}, {"start": 599.8, "end": 603.0, "text": "그리고 그것은 창립 이래 줄곧 견지해 온 앤스로픽의 철학과도 일치합니다."}, {"start": 603.2, "end": 606.5, "text": "저희는 항상 균형을 추구해 왔습니다."}, {"start": 606.8, "end": 610.0, "text": "우리가 기술의 개척자가 되어 정상으로 가는 경쟁을 만들어내고,"}, {"start": 610.2, "end": 613.5, "text": "안전의 기준선을 한 단계 끌어올려야 한다고 늘 강조해 왔죠."}, {"start": 613.8, "end": 617.0, "text": "프런티어에 서 있되, 올바른 방식으로 임해야 한다는 것입니다."}, {"start": 617.2, "end": 620.5, "text": "국방 분야에서도 모델 활용에 적극적이지만,"}, {"start": 620.8, "end": 624.0, "text": "모든 국방 용도를 허용하는 건 아닙니다."}, {"start": 624.2, "end": 627.5, "text": "모두에게 도움이 되는 합리적 중도와 해법을 찾으려 해왔고,"}, {"start": 627.8, "end": 631.0, "text": "이번에도 마찬가지입니다. 완벽하지는 않을지라도 최선을 다해 노력하고 있습니다."}, {"start": 631.5, "end": 634.8, "text": "테드 리우 하원의원의 AI 킬스위치 법안을 지지하시나요?"}, {"start": 635.0, "end": 638.2, "text": "그 법안을 아주 면밀히 검토해 보지는 못했습니다만,"}, {"start": 638.5, "end": 641.8, "text": "AI 모델을 비활성화하거나 제한하거나 셧다운할 수 있는,"}, {"start": 642.0, "end": 645.2, "text": "어떤 수단을 확보해야 한다는 발상 자체는 분명 필요합니다."}, {"start": 645.5, "end": 648.8, "text": "다만 그것이 만병통치약이거나 유일한 해결책은 아닙니다."}, {"start": 649.0, "end": 652.2, "text": "AI 모델이 충분히 강력해지면 종료 시도를 우회할 수도 있으며,"}, {"start": 652.5, "end": 656.0, "text": "저희도 시뮬레이션에서 그러한 양상을 직접 목격한 바 있습니다."}, {"start": 656.2, "end": 658.8, "text": "그렇다면 킬스위치가 전혀 작동하지 않을 수도 있겠네요."}, {"start": 659.0, "end": 662.2, "text": "우리는 이것을 '심층 방어'의 관점에서 접근해야 합니다."}, {"start": 662.5, "end": 665.8, "text": "보안 분야에는 '스위스 치즈 모델'이라는 개념이 있습니다."}, {"start": 666.0, "end": 669.2, "text": "스위스 치즈 한 조각은 일부를 막아주지만 구멍들이 뚫려 있죠."}, {"start": 669.5, "end": 672.8, "text": "하지만 다섯 조각의 치즈를 겹쳐 놓으면,"}, {"start": 673.0, "end": 676.2, "text": "서로 다른 층의 구멍 위치가 제각기 다르기 때문에,"}, {"start": 676.5, "end": 680.0, "text": "치즈 더미 전체를 관통하기란 대단히 어렵습니다."}, {"start": 680.2, "end": 683.5, "text": "AI의 위험으로부터 우리를 지켜줄 단 하나의 방책이란 존재하지 않습니다."}, {"start": 683.8, "end": 687.0, "text": "시스템 전체의 상하 전 과정에서 철저히 주의를 기울여야 합니다."}, {"start": 687.2, "end": 690.5, "text": "완벽한 단일 방어선은 없지만, 모든 곳에서 빈틈없이 대비한다면,"}, {"start": 690.8, "end": 694.0, "text": "추가로 확보한 시간을 통해 충분히 상황을 긍정적으로 이끌 수 있습니다."}, {"start": 736.0, "end": 738.2, "text": "상황이 긍정적으로 흘러갈 수 있다고 보시는군요,"}, {"start": 738.5, "end": 741.8, "text": "지금 이 순간이 거대한 변곡점처럼 느껴지는데도 말이죠."}, {"start": 742.0, "end": 745.0, "text": "에세이에서 속도 조절, 즉 개발 늦추기는,"}, {"start": 745.2, "end": 748.5, "text": "미국 기업들이 권위주의 정권, 특히 중국 공산당에 대해,"}, {"start": 748.8, "end": 751.8, "text": "가지고 있는 기술적 우위의 격차 범위,"}, {"start": 752.0, "end": 754.0, "text": "내에서만 이뤄져야 한다고 하셨습니다."}, {"start": 754.2, "end": 757.0, "text": "우리는 지금 중국과 치열한 경쟁을 벌이고 있습니다."}, {"start": 757.2, "end": 760.5, "text": "중국은 멈추지 않을 텐데, 속도를 늦추는 게 정말 좋은 생각일까요?"}, {"start": 760.8, "end": 764.0, "text": "이것이 바로 가장 풀기 어려운 딜레마이자, 우리 상황의 가장 힘든 부분입니다."}, {"start": 764.2, "end": 767.5, "text": "그런 지정학적 상황만 아니었다면,"}, {"start": 767.8, "end": 771.0, "text": "우리는 훨씬 더 많은 시간을 가질 수 있었겠죠."}, {"start": 771.2, "end": 774.5, "text": "이 점이 우리를 가장 큰 곤경에 빠뜨리는 요인입니다."}, {"start": 774.8, "end": 778.0, "text": "단순한 상업적 경쟁의 문제가 아니라, 지정학적 구도가 가장 까다롭습니다."}, {"start": 778.2, "end": 781.5, "text": "하지만 우리에게는 두 가지 전략이 있습니다."}, {"start": 781.8, "end": 785.0, "text": "첫째로, 제 제안서에서 밝혔듯 우리가 보유한 우위의 여유 폭 안에서 속도를 늦추는 것입니다."}, {"start": 785.2, "end": 788.5, "text": "특히 첨단 반도체를 권위주의 국가에 판매하지 않고,"}, {"start": 788.8, "end": 792.0, "text": "기술을 도난당하지 않도록 자체 보안을 대폭 강화한다면,"}, {"start": 792.2, "end": 795.5, "text": "적어도 얼마간의 귀중한 시간을 벌 수 있을 것입니다."}, {"start": 795.8, "end": 799.0, "text": "그렇게 벌어들인 시간만큼 우리는 속도를 조절할 수 있습니다."}, {"start": 799.2, "end": 802.0, "text": "그것이 인류의 파멸을 막을 만큼 충분한 차이를 만들어낼 수 있을까요?"}, {"start": 802.5, "end": 805.8, "text": "그 첫 번째 전략을 통해 우리는 얻을 수 있는 최대한의 시간을 확보할 것입니다."}, {"start": 806.0, "end": 809.2, "text": "그리고 우리는 두 번째 전략 또한 병행해야 한다고 봅니다."}, {"start": 809.5, "end": 812.8, "text": "권위주의 국가들, 심지어 중국에게도 직접 다가가,"}, {"start": 813.0, "end": 816.2, "text": "\"우리 모두에게 심각한 위협이 될 수 있는 요소들이 존재한다\"고 말하는 것입니다."}, {"start": 816.5, "end": 819.8, "text": "단순히 통제를 벗어난 AI의 문제만이 아닙니다."}, {"start": 820.0, "end": 823.2, "text": "불과 이틀 전에도 바이러스의 감염력을 인위적으로 높이는 생화학 테러에,"}, {"start": 823.5, "end": 826.8, "text": "AI를 악용하려던 시도에 대한 보고서를 저희가 발표했습니다."}, {"start": 827.0, "end": 830.2, "text": "정말 끔찍한 일이며, 중국조차도 그런 사태를 결코 원치 않습니다."}, {"start": 830.5, "end": 833.8, "text": "생물학 테러가 일어나는 것은 어떤 정부의 국익에도 부합하지 않으니까요."}, {"start": 834.0, "end": 837.2, "text": "따라서 우리는 중국과 대화하여 이 기술의 발전 속도에 제한을 둘 수 있는지,"}, {"start": 837.5, "end": 840.8, "text": "함께 협력할 방안을 모색해야 합니다."}, {"start": 841.0, "end": 844.5, "text": "통치 체제의 모든 차이에도 불구하고, 저 역시 대중국 강경파 입장을 취하고 있습니다만,"}, {"start": 844.8, "end": 848.0, "text": "미국과 소련이 대치하던 과거 냉전 시기를 떠올려 보십시오."}, {"start": 848.2, "end": 851.5, "text": "양측이 서로를 향해 1만 기의 핵미사일을 겨누고 있었을 때조차,"}, {"start": 851.8, "end": 855.0, "text": "그 숫자가 너무나 지나치다는 점을 양국 모두 인정했습니다."}, {"start": 855.2, "end": 858.5, "text": "잠재적 파멸의 규모를 줄이기 위한 대화에 나서야 한다는 데 공감했던 것이죠."}, {"start": 859.0, "end": 862.0, "text": "냉전을 하나의 모델로 삼아 AI를 바라봐야 한다는 말씀인가요?"}, {"start": 862.2, "end": 864.5, "text": "냉전 자체를 모델로 삼자는 게 아니라,"}, {"start": 864.8, "end": 866.5, "text": "당시에 이뤄졌던 협상들 말씀이시죠?"}, {"start": 866.8, "end": 870.0, "text": "그렇습니다, 군비 통제나 군축 협상 같은 접근법입니다."}, {"start": 870.2, "end": 873.5, "text": "지정학적 차원에서 이 문제를 다루는 데 매우 적절한 시각이라고 봅니다."}, {"start": 873.8, "end": 877.2, "text": "AI 모델이 사이버 보안 등에서 발휘할 수 있는 파급력을 보면,"}, {"start": 877.5, "end": 881.0, "text": "명백히 지정학적, 국가 안보적 중대성을 지니고 있습니다."}, {"start": 881.2, "end": 884.5, "text": "그렇기 때문에 우리가 지금 이 긴 논의를 나누고 있는 것이고요."}, {"start": 884.8, "end": 888.0, "text": "그래서 저는 우리가 중국에 접근해야 한다고 생각합니다."}, {"start": 888.2, "end": 891.5, "text": "물론 이는 제 권한을 넘어서는 일이며,"}, {"start": 891.8, "end": 895.0, "text": "미국 정부가 중국 정부와 풀어야 할 문제입니다."}, {"start": 895.5, "end": 897.2, "text": "하지만 대통령에게 조언하고 계시잖아요."}, {"start": 897.5, "end": 900.8, "text": "누군가 제게 의견을 묻는다면 기꺼이 생각을 말씀드릴 뿐입니다."}, {"start": 901.0, "end": 904.2, "text": "에세이에 생각을 담았고, 더 묻는다면 얼마든지 말씀드릴 수 있습니다."}, {"start": 904.5, "end": 907.8, "text": "하지만 궁극적으로는 정부 대 정부 차원의 일입니다."}, {"start": 908.0, "end": 911.2, "text": "제 생각을 말씀드리자면, 이 기술에 대해 가능한 한 많은 통제와 절제를,"}, {"start": 911.5, "end": 914.8, "text": "이끌어내기 위해 양국이 반드시 협력해야 합니다."}, {"start": 915.0, "end": 918.2, "text": "희망은 높게 갖되 기대는 낮추고,"}, {"start": 918.5, "end": 921.8, "text": "어느 정도까지 합의를 이끌어낼 수 있는지 타진해 보아야 합니다."}, {"start": 922.0, "end": 925.2, "text": "그리고 이러한 협상에서 가장 핵심적으로 집중해야 할 부분은,"}, {"start": 925.5, "end": 928.5, "text": "바로 '검증'입니다."}, {"start": 928.8, "end": 932.0, "text": "핵무기 협상이나 생물학 무기 협상에서도 마찬가지였듯,"}, {"start": 932.2, "end": 935.5, "text": "상대방이 합의를 어기고 일탈하지 않는지 검증할 수 있어야 합니다."}, {"start": 935.8, "end": 939.0, "text": "따라서 실질적인 검증 방안을 마련하는 것이 무엇보다 중요할 것입니다."}, {"start": 1009.0, "end": 1012.2, "text": "트럼프 대통령이 곧 시진핑 주석과 만날 예정인데요."}, {"start": 1012.5, "end": 1016.0, "text": "AI 분야에서 두 정상이 반드시 합의해야 할 가장 단순하고 핵심적인 해결책은 무엇일까요?"}, {"start": 1017.0, "end": 1020.2, "text": "두 가지를 말씀드릴 수 있겠습니다. 곧바로 실행 가능한 작은 사안과,"}, {"start": 1020.5, "end": 1023.8, "text": "시간이 아주 오래 걸릴 것으로 예상되는,"}, {"start": 1024.0, "end": 1027.0, "text": "거대한 사안입니다."}, {"start": 1027.2, "end": 1030.5, "text": "당장 실행 가능한 작은 사안은, 미·중 양국이 생물학 무기 개발에 AI를 쓰지 않고,"}, {"start": 1030.8, "end": 1034.2, "text": "생물학 테러에 악용될 수 있는 AI 모델을 출시하지 않겠다고,"}, {"start": 1034.5, "end": 1037.5, "text": "합의하는 것입니다."}, {"start": 1037.8, "end": 1041.0, "text": "양국 모두 이미 생물무기금지협약의 서명국이므로,"}, {"start": 1041.2, "end": 1044.5, "text": "그 협약의 적용 범위를 AI 분야로 확장하기만 해도 대단히 가치 있는 결실이 될 것입니다."}, {"start": 1044.8, "end": 1048.0, "text": "그리고 장기적인 과제는 AI 발전 속도에 일종의 제한을 두기 위해 협력하는 것입니다."}, {"start": 1048.2, "end": 1051.5, "text": "앞서 나가려는 유인과 군사적 이점이 워낙 막대하기 때문에,"}, {"start": 1051.8, "end": 1055.0, "text": "대단히 어렵겠지만,"}, {"start": 1055.2, "end": 1058.5, "text": "가능할지 확신할 수는 없더라도 최소한 시도해 보고 가능성을 확인해야 합니다."}, {"start": 1058.8, "end": 1062.0, "text": "다시 말씀드리지만 이 모든 것은 제 권한 밖의 일입니다."}, {"start": 1062.2, "end": 1065.5, "text": "제가 말씀드리고자 하는 것은 우리 정부가 제시해 볼 수 있는 방안들이며,"}, {"start": 1065.8, "end": 1069.0, "text": "고려해 볼 만한 중요한 의제들이라는 점입니다."}, {"start": 1089.0, "end": 1092.2, "text": "이 문제의 시야를 넓혀보면 인류의 운명이 걸려 있는 것처럼 보입니다."}, {"start": 1092.5, "end": 1095.8, "text": "우리가 나아가고 있는 미래에 대해,"}, {"start": 1096.0, "end": 1099.2, "text": "개인적으로 어느 정도의 책임감을 느끼십니까?"}, {"start": 1100.0, "end": 1103.2, "text": "제 솔직한 생각은, 이 기술이 민간 기업에 의해 개발되고 있다는 사실 자체가,"}, {"start": 1103.5, "end": 1106.8, "text": "언제나 매우 기이하게 느껴졌다는 점입니다."}, {"start": 1107.0, "end": 1110.2, "text": "\"왜 정부가 개발하지 않는가?\"라는 질문을 늘 받곤 하는데,"}, {"start": 1110.5, "end": 1113.8, "text": "아이러니하게도 저 역시 그 의견에 동의하며 불편함을 느낍니다."}, {"start": 1114.0, "end": 1116.8, "text": "그렇다면 이 기술을 정부에 기꺼이 넘겨줄 용의가 있으신가요?"}, {"start": 1117.2, "end": 1120.5, "text": "적절한 민주주의 정부들의 연합체라면 가능합니다."}, {"start": 1120.8, "end": 1123.5, "text": "제가 우려하는 것은,"}, {"start": 1124.0, "end": 1126.5, "text": "이 회사를 정부에 통째로 넘길 수도 있다는 뜻인가요?"}, {"start": 1126.8, "end": 1130.0, "text": "단일 정부 역시 단일 기업만큼이나 기술을 쉽게 남용할 수 있다는 점입니다."}, {"start": 1130.2, "end": 1133.5, "text": "하지만 민주적으로 선출된 정부들의 연합이라면 이야기가 다릅니다."}, {"start": 1133.8, "end": 1137.0, "text": "소유권을 완전히 넘기는 방식까지는 몰라도,"}, {"start": 1137.2, "end": 1140.5, "text": "일종의 감독과 공동 거버넌스 체제는 필요합니다."}, {"start": 1147.0, "end": 1150.2, "text": "마지막 질문으로 돌아가서, 개인적인 책임감을 느끼십니까?"}, {"start": 1151.5, "end": 1153.0, "text": "물론입니다!"}, {"start": 1153.2, "end": 1156.5, "text": "이 기술은 막대한 혜택과 거대한 위험을 동시에 안고 있습니다."}, {"start": 1156.8, "end": 1160.0, "text": "저는 이 기술의 혜택, 그 필요성을 매일 절감합니다."}, {"start": 1160.2, "end": 1163.5, "text": "에세이에도 썼듯 제 아버지는 C형 간염으로 돌아가셨습니다."}, {"start": 1163.8, "end": 1167.0, "text": "당시 완치율이 40% 정도였는데 아버지는 완치되지 못하셨죠."}, {"start": 1167.2, "end": 1170.5, "text": "그런데 불과 몇 년 후 완치율을 95%까지 끌어올린 치료제가 개발되었습니다."}, {"start": 1170.8, "end": 1174.0, "text": "저 자신도 초기 암을 겪었지만, 1950년대였다면 살아남지 못했을 겁니다."}, {"start": 1174.2, "end": 1177.5, "text": "그렇기에 이 기술의 혜택을 세상에 전해야 한다는 무거운 책임감을 느낍니다."}, {"start": 1177.8, "end": 1181.0, "text": "동시에 그 위험성 또한 뼈저리게 느끼고 있습니다."}, {"start": 1181.2, "end": 1184.5, "text": "매일 아침 일어나 저희 모델을 악용해 생물학 무기를 만들려 했다는,"}, {"start": 1184.8, "end": 1188.0, "text": "위협 보고서를 읽을 때마다 절대 그런 일에 책임을 져서는 안 된다고 다짐합니다."}, {"start": 1188.2, "end": 1191.5, "text": "그렇기 때문에 저희는 매우 강력한 안전장치를 두고 있는 것입니다."}, {"start": 1191.8, "end": 1195.0, "text": "생물학 안전장치가 너무 엄격하다고 SNS에서 거의 매일 조롱을 당합니다."}, {"start": 1195.2, "end": 1198.5, "text": "생물학 전공 학생들이 모델을 쓸 수 없다며 불평하고 농담거리로 삼곤 하죠."}, {"start": 1198.8, "end": 1202.0, "text": "하지만 그렇게 강력한 안전장치를 구축해 둔 이유는 명확합니다."}, {"start": 1202.2, "end": 1205.5, "text": "어느 날 아침 저희 모델 클로드로 누군가 수많은 사람을 살상했다는 소식을 듣느니,"}, {"start": 1205.8, "end": 1209.0, "text": "차라리 제가 매일 조롱거리가 되는 편이 백배 낫기 때문입니다."}, {"start": 1209.2, "end": 1212.5, "text": "저는 혜택과 위험이라는 양면의 책임을 모두 온몸으로 느끼고 있습니다."}, {"start": 1212.8, "end": 1216.0, "text": "하지만 이것이 저 혼자나 앤스로픽만의 책임이 되어서는 안 됩니다."}, {"start": 1216.2, "end": 1219.5, "text": "AI 기업들만의 책임도, 어느 한 정부만의 책임도 아닙니다."}, {"start": 1219.8, "end": 1223.0, "text": "이 사안은 우리 모두보다 훨씬 거대하며,"}, {"start": 1223.2, "end": 1226.5, "text": "모든 사람이 이 과정에 참여하고 발언권을 가질 수 있는 방안을 찾아야 합니다."}, {"start": 1226.8, "end": 1230.0, "text": "몇몇 소수 기업이 제멋대로 모든 것을 결정한다고 느끼며,"}, {"start": 1230.2, "end": 1233.5, "text": "대중이 무력감에 빠지는 것을 저는 결코 원치 않습니다."}, {"start": 1272.0, "end": 1273.8, "text": "사람들이 실제로 그렇게 느끼고 있습니다."}, {"start": 1274.0, "end": 1276.5, "text": "잘 압니다, 사람들이 그렇게 느끼고 있다는 걸요."}, {"start": 1276.8, "end": 1280.0, "text": "저는 그런 구도를 결코 원치 않았습니다."}, {"start": 1280.2, "end": 1283.5, "text": "그런 상황이 사실이 되지 않도록 바로잡아야 합니다."}, {"start": 1283.8, "end": 1287.0, "text": "이를 위해 이미 많은 노력을 기울이고 있지만 더 많은 조치가 필요합니다."}, {"start": 1287.2, "end": 1290.5, "text": "절제를 보여주고 정부와 협력하겠다는 이번 제안이 모든 걸 해결할 수는 없겠지만,"}, {"start": 1290.8, "end": 1294.0, "text": "그 올바른 방향을 향한 분명한 한 걸음입니다."}, {"start": 1295.0, "end": 1298.2, "text": "집에서 클로드나 ChatGPT를 쓰는 제 이모 같은 평범한 시민들에게,"}, {"start": 1298.5, "end": 1301.5, "text": "어떤 메시지를 전하고 싶으신가요?"}, {"start": 1305.0, "end": 1306.8, "text": "제가 드리고 싶은 메시지는,"}, {"start": 1307.0, "end": 1308.5, "text": "지금 많은 두려움이 존재하니까요."}, {"start": 1308.8, "end": 1310.8, "text": "몇 가지 말씀드리겠습니다."}, {"start": 1311.0, "end": 1314.2, "text": "첫째로, 늘 그렇듯 이 기술은 위대하며,"}, {"start": 1314.5, "end": 1317.2, "text": "무궁무진한 긍정적 쓰임새를 지니고 있습니다."}, {"start": 1317.5, "end": 1319.5, "text": "그 긍정적인 사실부터 출발해야 합니다."}, {"start": 1319.8, "end": 1322.8, "text": "수억 명의 사람들이 매주 우리 기술을 이용해,"}, {"start": 1323.0, "end": 1325.2, "text": "놀랍고 훌륭한 일들을 해내고 있습니다."}, {"start": 1325.5, "end": 1328.8, "text": "매주 제게 감사의 이메일이 도착합니다."}, {"start": 1329.0, "end": 1332.2, "text": "\"의사들이 놓쳤던 난치병을,"}, {"start": 1332.5, "end": 1335.2, "text": "클로드와 대화한 덕분에 진단해 낼 수 있었다\"는 내용입니다."}, {"start": 1335.5, "end": 1338.8, "text": "이런 편지를 매주 받으니, 이 놀라운 혜택을 잊어서는 안 됩니다."}, {"start": 1339.2, "end": 1342.2, "text": "하지만 기술의 위험성에 관해서도 거짓말하지 않겠습니다."}, {"start": 1342.5, "end": 1345.2, "text": "실재하는 위험들이 분명히 존재합니다."}, {"start": 1345.5, "end": 1349.0, "text": "업계는 너무 오랫동안 기술의 위험성에 대해 솔직하지 못했습니다."}, {"start": 1349.5, "end": 1352.8, "text": "이 기술에 위험이 따른다는 사실을 대중에게 숨겨왔던 것이죠."}, {"start": 1353.2, "end": 1356.5, "text": "가능한 한 장점만을 부각하려 했습니다."}, {"start": 1356.8, "end": 1360.2, "text": "저희는 결코 그러지 않았지만, 업계 대다수가 그렇게 해왔습니다."}, {"start": 1360.5, "end": 1363.2, "text": "따라서 진실을 말하는 것부터 시작해야 합니다."}, {"start": 1363.5, "end": 1366.8, "text": "진실은 위험이 존재한다는 것이며, 그 위험은 엄연히 실재합니다."}, {"start": 1367.2, "end": 1370.5, "text": "하지만 그 위험을 해결하는 과정에서,"}, {"start": 1370.8, "end": 1373.8, "text": "여러분도 분명한 목소리를 낼 권리가 있습니다."}, {"start": 1374.2, "end": 1377.5, "text": "저희는 정부와 긴밀히 협력하여,"}, {"start": 1377.8, "end": 1381.0, "text": "이 기술에 대한 적절한 감독 체계를 마련하고자 최선을 다하고 있습니다."}, {"start": 1381.5, "end": 1384.8, "text": "유권자와 선출직 공직자들에게,"}, {"start": 1385.0, "end": 1388.2, "text": "이 기술의 사회적 배치를 결정할 발언권을 부여하기 위함입니다."}, {"start": 1389.2, "end": 1392.5, "text": "우리는 그분들과 가능한 한 가장 긴밀하게 협력하기를 원합니다."}, {"start": 1393.2, "end": 1396.5, "text": "모든 사람이 기술의 놀라운 혜택을 온전히 누리는 동시에,"}, {"start": 1396.8, "end": 1400.0, "text": "혜택의 가치를 실감할 수 있기를 바랍니다."}, {"start": 1400.5, "end": 1403.8, "text": "하지만 동시에 자신의 목소리와 소중한 투표권을 통해,"}, {"start": 1404.0, "end": 1407.2, "text": "기술이 사회에 도입되는 방식을 결정할 수 있어야 합니다."}, {"start": 1407.5, "end": 1410.2, "text": "이것은 결코 소수의 몇몇 사람들만의 결정이 아닙니다."}, {"start": 1410.5, "end": 1413.0, "text": "모두를 위한 결정이며, 우리 모두가 내려야 할 결정입니다."}, {"start": 1413.2, "end": 1415.2, "text": "그리고 대단히 중대한 결정입니다."}, {"start": 1415.5, "end": 1418.2, "text": "위험과 판돈이 크지 않다고 거짓말하지 않겠습니다."}, {"start": 1418.5, "end": 1422.0, "text": "이것은 인류 역사상 가장 중대한 기술적 사건 중 하나이며,"}, {"start": 1422.2, "end": 1425.5, "text": "우리 모두가 반드시 여기에 참여하고 함께해야 합니다."}];
const hasDubAudio=false;
let audioMode='orig'; // 🎬 유튜브 원음이 기본 디폴트!
let dubAudio=document.getElementById('dub-audio'); // 초기 조기 바인딩 ⚡
let dubHudTimeout=null;
let player;
let isMutedState = true;

function showAudioHud(text) {
    const hud = document.getElementById('audio-hud');
    if (!hud) return;
    hud.textContent = text;
    hud.classList.add('show');
    clearTimeout(dubHudTimeout);
    dubHudTimeout = setTimeout(() => {
        hud.classList.remove('show');
    }, 1200);
}

function updateAudioTrackButtonUI() {
    const btn = document.getElementById('audio-track-btn');
    const optOrig = document.getElementById('opt-orig');
    const optDub = document.getElementById('opt-dub');
    if (!btn) return;
    if (audioMode === 'dub') {
        if (optOrig) optOrig.classList.remove('active');
        if (optDub) optDub.classList.add('active');
        btn.title = '🎙️ MP3 더빙 음원 재생 중 (클릭 또는 Alt+A / D: 원음 전환)';
    } else {
        if (optDub) optDub.classList.remove('active');
        if (optOrig) optOrig.classList.add('active');
        btn.title = '🎬 유튜브 원음 재생 중 (클릭 또는 Alt+A / D: 더빙 전환)';
    }
}

function toggleAudioTrack() {
    if (!hasDubAudio || !dubAudio) return;
    audioMode = (audioMode === 'dub' ? 'orig' : 'dub');
    updateAudioTrackButtonUI();

    if (audioMode === 'dub') {
        if (player && typeof player.mute === 'function') {
            try { player.mute(); } catch(e) {}
        }
        dubAudio.muted = false;
        if (player && typeof player.getCurrentTime === 'function') {
            const curT = player.getCurrentTime();
            dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
        }
        if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === 1) {
            dubAudio.play().catch(e => {});
        }
        showAudioHud('🎙️ 더빙 음원으로 전환');
    } else {
        dubAudio.pause();
        dubAudio.muted = true;
        if (player && typeof player.unMute === 'function') {
            try {
                player.unMute();
                player.setVolume(100);
            } catch(e) {}
        }
        showAudioHud('🎬 유튜브 원음으로 전환');
    }
}

function handleUnmute() {
    if (!dubAudio && hasDubAudio) dubAudio = document.getElementById('dub-audio');
    if (hasDubAudio && dubAudio && audioMode === 'dub') {
        dubAudio.muted = false;
        if (player && typeof player.getCurrentTime === 'function') {
            const curT = player.getCurrentTime();
            dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
        }
        if (player && typeof player.getPlayerState === 'function' && player.getPlayerState() === 1) {
            dubAudio.play().catch(e => {});
        }
        if (player && typeof player.mute === 'function') {
            try { player.mute(); } catch(e) {}
        }
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
        return;
    }
    if (player && typeof player.unMute === 'function') {
        try {
            player.unMute();
            player.setVolume(100);
        } catch(e) {}
        isMutedState = false;
        const b = document.getElementById('unmute-badge');
        if (b) b.style.display = 'none';
    }
}

function onYouTubeIframeAPIReady(){
    dubAudio = document.getElementById('dub-audio');
    updateAudioTrackButtonUI();
    player=new YT.Player('player',{
        events:{
            'onReady': function(e){ 
                try {
                    e.target.playVideo();
                    if (hasDubAudio && audioMode === 'dub') {
                        try { e.target.mute(); } catch(err) {}
                    }
                    if (e.target.isMuted && e.target.isMuted()) {
                        const b = document.getElementById('unmute-badge');
                        if (b) b.style.display = 'block';
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// 사용자의 첫 인터랙션 시 자동 소리 켜기 🔊⚡
function autoUnmuteOnUserAction() {
    if (isMutedState) {
        handleUnmute();
    }
}
window.addEventListener('click', autoUnmuteOnUserAction, {once: true});
window.addEventListener('keydown', autoUnmuteOnUserAction, {once: true});
window.addEventListener('touchstart', autoUnmuteOnUserAction, {once: true, passive: true});

// iframe 클릭 시 빼앗긴 포커스를 훔쳐오고, 첫 클릭 시 언뮤트도 자동 실행! 🕵️‍♂️⚡
window.addEventListener('blur', function() {
    autoUnmuteOnUserAction();
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    // 🛡️ [F1 키: 브라우저 도움말 팝업 차단]
    if (e.key === 'F1' || e.keyCode === 112) {
        e.preventDefault();
        return;
    }
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // 🎙️ Alt+A 또는 D 키: 원음 ↔ 더빙 음원 토글!
    if ((e.altKey && (e.key === 'a' || e.key === 'A')) || (e.key.toLowerCase() === 'd' && !e.ctrlKey && !e.altKey && !e.metaKey)) {
        if (hasDubAudio) {
            toggleAudioTrack();
            e.preventDefault();
            return;
        }
    }

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) {
            player.pauseVideo();
            if (hasDubAudio && dubAudio) dubAudio.pause();
        } else {
            player.playVideo();
            if (hasDubAudio && dubAudio && audioMode === 'dub') {
                const curT = player.getCurrentTime();
                dubAudio.currentTime = dubAudio.duration ? Math.min(curT, dubAudio.duration) : curT;
                dubAudio.play().catch(e => {});
            }
        }
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        const target = Math.max(0, player.getCurrentTime() - 5);
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        const target = player.getCurrentTime() + 5;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        const curV = player.getVolume();
        const nextV = Math.min(100, curV + 5);
        player.setVolume(nextV);
        if (hasDubAudio && dubAudio) dubAudio.volume = nextV / 100;
        showAudioHud('🔊 볼륨 ' + nextV + '%');
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        const curV = player.getVolume();
        const nextV = Math.max(0, curV - 5);
        player.setVolume(nextV);
        if (hasDubAudio && dubAudio) dubAudio.volume = nextV / 100;
        showAudioHud('🔉 볼륨 ' + nextV + '%');
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        if (hasDubAudio && audioMode === 'dub' && dubAudio) {
            dubAudio.muted = !dubAudio.muted;
            showAudioHud(dubAudio.muted ? '🔇 더빙 음소거' : '🔊 더빙 소리 켬');
        } else {
            player.isMuted() ? player.unMute() : player.mute();
        }
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        const target = Math.max(0, player.getCurrentTime() - 10);
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        const target = player.getCurrentTime() + 10;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        const target = player.getDuration() * fraction;
        player.seekTo(target, true);
        if (hasDubAudio && dubAudio) {
            dubAudio.currentTime = dubAudio.duration ? Math.min(target, dubAudio.duration) : target;
        }
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});

let syncInterval = null;
let activityTimeout;
let isUserPositioned = false;
let userBottomPercent = 12;

function resetActivity() {
    const topControls = document.getElementById('top-controls');
    const subsEl = document.getElementById('subtitles');
    if(topControls) topControls.classList.remove('fade-out');
    if(subsEl) {
        subsEl.classList.remove('ui-hidden');
        if(isUserPositioned) {
            subsEl.style.bottom = Math.min(88, userBottomPercent + 4) + '%';
        } else {
            subsEl.style.bottom = '';
        }
    }
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(topControls) topControls.classList.add('fade-out');
            if(subsEl) {
                subsEl.classList.add('ui-hidden');
                if(isUserPositioned) {
                    subsEl.style.bottom = userBottomPercent + '%';
                } else {
                    subsEl.style.bottom = '';
                }
            }
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function startSyncTimer(intervalMs) {
    if (syncInterval) clearInterval(syncInterval);
    syncInterval = setInterval(updateSubs, intervalMs);
}

function onPlayerStateChange(event){
    resetActivity();
    if(event.data == YT.PlayerState.PLAYING){
        // 재생 시작 시 브라우저 정책이 풀렸으면 자동 언뮤트 시도
        if (isMutedState) {
            autoUnmuteOnUserAction();
        }
        if (hasDubAudio && dubAudio && audioMode === 'dub') {
            try { player.mute(); } catch(e) {}
            dubAudio.playbackRate = (player.getPlaybackRate && player.getPlaybackRate()) || 1.0;
            dubAudio.volume = ((player.getVolume && player.getVolume()) || 100) / 100;
            const curTime = player.getCurrentTime();
            const maxT = dubAudio.duration ? Math.min(curTime, dubAudio.duration) : curTime;
            if (Math.abs(dubAudio.currentTime - maxT) > 0.08) {
                dubAudio.currentTime = maxT;
            }
            dubAudio.play().catch(e => {});
        }
        // 재생 중일 때는 100ms 정밀 싱크
        startSyncTimer(100);
    } else {
        if (hasDubAudio && dubAudio && !dubAudio.paused) {
            dubAudio.pause();
        }
        // 일시정지나 버퍼링 중에도 시크바 이동 시 자막 갱신 및 오디오 위치 대기를 위해 250ms로 유지! ⏱️
        startSyncTimer(250);
    }
}

function updateSubs(){
    if (!player || typeof player.getCurrentTime !== 'function') return;
    const t = player.getCurrentTime();

    if (hasDubAudio && dubAudio && audioMode === 'dub') {
        const isPlaying = (player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING);
        // 유튜브 원음 소리가 광고나 외부 조작으로 풀렸을 경우 즉각 차단 🛡️
        if (player.isMuted && !player.isMuted()) {
            try { player.mute(); } catch(e) {}
        }
        // 유튜브 볼륨 슬라이더 조작 시 더빙 볼륨 실시간 연동 🎚️
        if (player.getVolume) {
            const pv = player.getVolume() / 100;
            if (Math.abs(dubAudio.volume - pv) > 0.02) {
                dubAudio.volume = pv;
            }
        }
        // 재생 중일 때 동기화
        if (isPlaying) {
            // 일시정지 상태였다면 자동 재생 ⚡
            if (dubAudio.paused) {
                const maxT = dubAudio.duration ? Math.min(t, dubAudio.duration) : t;
                dubAudio.currentTime = maxT;
                dubAudio.play().catch(e => {});
            }
            // 싱크 드리프트 0.12초 이상 시 미세 보정 ⏱️
            const drift = Math.abs(dubAudio.currentTime - t);
            if (drift > 0.12) {
                const maxT = dubAudio.duration ? Math.min(t, dubAudio.duration) : t;
                dubAudio.currentTime = maxT;
            }
            // 배속 동기화
            if (player.getPlaybackRate && dubAudio.playbackRate !== player.getPlaybackRate()) {
                dubAudio.playbackRate = player.getPlaybackRate();
            }
        } else {
            // 일시정지 중일 때: 시크바 이동에 대비하여 오디오 위치만 조용히 대기 동기화 🎯
            if (dubAudio.duration) {
                const maxT = Math.min(t, dubAudio.duration);
                if (Math.abs(dubAudio.currentTime - maxT) > 0.15) {
                    dubAudio.currentTime = maxT;
                }
            }
        }
    }

    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div>`;
    }
    const subsContainer = document.getElementById('subtitles');
    if(subsContainer && subsContainer.innerHTML !== currentHtml){
        subsContainer.innerHTML = currentHtml;
    }
}

let isDragging=false, startY, currentBottomPx, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

// 자막 더블 클릭 / 더블 탭 시 기본 위치로 초기화 🔄✨
document.addEventListener('dblclick', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        isUserPositioned = false;
        if(subEl) subEl.style.bottom = '';
        resetActivity();
    }
});

function dragStart(e) {
    if(!e.target.closest('#subtitles') && !e.target.classList.contains('sub-line')) return;
    isDragging = true;
    subEl.classList.add('dragging');
    startY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let style = window.getComputedStyle(subEl);
    currentBottomPx = parseFloat(style.bottom) || 0;
    if(e.cancelable) e.preventDefault();
}

function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    let targetBottomPx = currentBottomPx - dy;
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let bottomPercent = Math.max(2, Math.min(85, (targetBottomPx / vh) * 100));
    subEl.style.bottom = bottomPercent + '%';
    if(e.cancelable) e.preventDefault();
}

function dragEnd(e) {
    if(!isDragging) return;
    isDragging = false;
    subEl.classList.remove('dragging');
    let vh = window.innerHeight || document.documentElement.clientHeight || 1;
    let style = window.getComputedStyle(subEl);
    let bottomPx = parseFloat(style.bottom) || 0;
    userBottomPercent = Math.max(2, Math.min(85, (bottomPx / vh) * 100));
    isUserPositioned = true;
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1.5, Math.min(15, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / (initialDist || 1);
        currentFontSize = Math.max(1.5, Math.min(15, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
