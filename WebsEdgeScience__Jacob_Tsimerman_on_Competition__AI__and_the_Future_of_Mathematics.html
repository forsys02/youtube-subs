하니까요."}, {"start": 82.48, "end": 84.162, "text": "차근차근 밟고 올라갈 수 있는"}, {"start": 84.162, "end": 85.361, "text": "좋은 사다리 같았죠."}, {"start": 85.319, "end": 86.7, "text": "그리고 '경쟁'이라 불리는 데는"}, {"start": 86.7, "end": 87.92, "text": "다 그만한 이유가 있습니다."}, {"start": 87.92, "end": 89.719, "text": "그래서 저도 꽤 승부욕이 생겼어요."}, {"start": 89.719, "end": 90.92, "text": "필즈상에 지나치게"}, {"start": 90.92, "end": 92.12, "text": "집착하지 않으려고"}, {"start": 91.719, "end": 94.0, "text": "스스로 마음을 다잡으셨다고 들었습니다."}, {"start": 94.0, "end": 95.4, "text": "상을 받을 수 있겠다는 걸"}, {"start": 95.4, "end": 96.799, "text": "스스로 깨닫기 전까지는요."}, {"start": 96.799, "end": 98.834, "text": "그런 깨달음이 본인의 집중력이나"}, {"start": 98.834, "end": 100.87, "text": "목표를 어떻게 바꾸어 놓았나요?"}, {"start": 100.87, "end": 103.15, "text": "네, 약 2년 전부터 시작했는데요."}, {"start": 103.15, "end": 105.326, "text": "진지하게 노력해 보지 않으면"}, {"start": 105.326, "end": 108.22999999999999, "text": "후회할 것 같다는 생각이 들었습니다."}, {"start": 108.22999999999999, "end": 109.826, "text": "게다가 2년이라는 시간은"}, {"start": 109.826, "end": 111.67, "text": "충분히 짧은 기간이기도 해서"}, {"start": 111.67, "end": 113.162, "text": "일단 모든 시간을 쏟아붓고"}, {"start": 113.162, "end": 114.549, "text": "어떤 결과가 나오든 간에"}, {"start": 114.549, "end": 115.989, "text": "훌훌 털고 나아가기로 결심했죠."}, {"start": 115.989, "end": 117.52799999999999, "text": "목표를 바꾸기보다는"}, {"start": 117.52799999999999, "end": 119.989, "text": "우선순위를 정하기 시작했어요."}, {"start": 119.989, "end": 122.036, "text": "더 중요해 보이는 프로젝트를 다뤘습니다."}, {"start": 122.036, "end": 123.989, "text": "평소에는 그저 끌리는 일만 하곤 했는데"}, {"start": 123.989, "end": 126.103, "text": "조금 더 뭐라고 할까요,"}, {"start": 126.103, "end": 129.52, "text": "어떤 면에서는 고도로 집중하게 되었죠."}, {"start": 129.52, "end": 133.361, "text": "24~25년 사이 여러 수학 분야에서"}, {"start": 133.361, "end": 137.519, "text": "11편의 논문을 발표하셨다고 들었습니다."}, {"start": 137.52, "end": 139.7, "text": "어떻게 그렇게 높은 수준의 성과를"}, {"start": 139.7, "end": 141.52, "text": "계속 유지할 수 있으셨나요?"}, {"start": 141.52, "end": 145.56, "text": "사실 오래 진행한 프로젝트들이라,"}, {"start": 145.56, "end": 151.06, "text": "자리에 앉아 논문을 마무리하고 검토하는 일이었죠."}, {"start": 153.52, "end": 158.099, "text": "동료인 아룰 샨카르와 쓴 논문 두 편은"}, {"start": 158.099, "end": 163.219, "text": "밤샘도 잦고 힘들었지만 동기 부여가 되었죠."}, {"start": 168.52, "end": 171.933, "text": "전통적인 방식은 아니지만, 시행착오가"}, {"start": 171.933, "end": 175.52, "text": "연구 도구 중 하나라고 말씀하셨는데요."}, {"start": 175.52, "end": 178.867, "text": "이에 대해 다른 수학자들은 어떻게 생각하며,"}, {"start": 178.867, "end": 181.52, "text": "이 방식이 본인에게 왜 잘 맞나요?"}, {"start": 181.52, "end": 184.383, "text": "그건 보편적일 겁니다. 시행착오가"}, {"start": 184.383, "end": 188.52, "text": "연구의 핵심이 아니라는 수학자는 없을 테니까요."}, {"start": 188.52, "end": 192.438, "text": "수학자는 대부분 막히고 혼란스러워하며"}, {"start": 192.438, "end": 196.519, "text": "그걸 서서히 해결해 나가는 존재입니다."}, {"start": 196.52, "end": 199.069, "text": "학생들에게 늘 말해줍니다."}, {"start": 199.069, "end": 203.25900000000001, "text": "수학에서는 보상을 받는 일이 아주 드물고,"}, {"start": 203.25900000000001, "end": 206.151, "text": "프로젝트는 보통 몇 달에서 몇 년이 걸려,"}, {"start": 206.151, "end": 208.539, "text": "그동안 끊임없이 실패를 겪는다고요."}, {"start": 208.539, "end": 210.698, "text": "그래서 실패에 무뎌져야 하고,"}, {"start": 210.698, "end": 214.34, "text": "안 될 걸 알면서도 시도하는 데 익숙해져야 하죠."}, {"start": 214.34, "end": 216.06, "text": "작동하지 않을 걸 뻔히 알면서도 말이죠."}, {"start": 216.06, "end": 219.382, "text": "이제 제게 좋은 날이란, 아이디어를 내서"}, {"start": 219.382, "end": 222.099, "text": "실패하는 날입니다. 아예 생각조차"}, {"start": 222.099, "end": 224.11599999999999, "text": "안 나는 날보다 훨씬 낫거든요."}, {"start": 224.11599999999999, "end": 225.659, "text": "일종의 라이프스타일이죠."}, {"start": 225.659, "end": 227.662, "text": "그럼 이제 앙드레-오르트 추측을"}, {"start": 227.662, "end": 229.9, "text": "증명하신 과정에 관해 얘기해 보죠."}, {"start": 229.9, "end": 231.497, "text": "대학원생 시절부터 시작해서"}, {"start": 231.497, "end": 233.78, "text": "수년간 연구한 끝에 나온 결과인데요."}, {"start": 233.78, "end": 235.164, "text": "어떻게 그렇게 오랫동안"}, {"start": 235.164, "end": 237.36, "text": "포기하지 않고 매달릴 수 있었나요?"}, {"start": 237.36, "end": 238.599, "text": "네, 참 재밌는 게요."}, {"start": 238.599, "end": 241.127, "text": "그런 문제는 여러 조각이"}, {"start": 241.127, "end": 245.21, "text": "차례대로 맞아떨어지며 해결되곤 합니다."}, {"start": 245.21, "end": 249.508, "text": "제가 대학원생일 때, 절친인 조너선 필라가"}, {"start": 249.508, "end": 253.179, "text": "그 문제에서 큰 돌파구를 마련했고,"}, {"start": 253.18, "end": 255.358, "text": "그걸 논문으로 발표하면서 화제가 되었죠."}, {"start": 255.358, "end": 257.139, "text": "그는 새로운 방법론을 도입했는데,"}, {"start": 257.139, "end": 259.697, "text": "바로 o-극소성 같은 도구였고,"}, {"start": 259.697, "end": 262.86, "text": "이후 그와 대화하며 협력하기 시작했죠."}, {"start": 262.86, "end": 265.579, "text": "그 이후로는 한 가지 문제에만"}, {"start": 265.579, "end": 268.3, "text": "쉬지 않고 매달리지 않았어요."}, {"start": 268.3, "end": 270.137, "text": "문제의 일부분을 발견하고"}, {"start": 270.137, "end": 272.259, "text": "아이디어가 있을지 고민하다가"}, {"start": 272.259, "end": 274.197, "text": "그 프로젝트를 완료하면"}, {"start": 274.197, "end": 276.62, "text": "다른 주제로 넘어가곤 했죠."}, {"start": 276.62, "end": 278.105, "text": "그리고 그것을 머릿속 한구석에"}, {"start": 278.105, "end": 279.305, "text": "계속 남겨두는 겁니다."}, {"start": 279.22, "end": 280.5, "text": "그러다 나중에 다른 부분에 대한"}, {"start": 280.5, "end": 281.779, "text": "아이디어가 또 떠오르는 식이죠."}, {"start": 281.779, "end": 283.99, "text": "그사이에 학계의 다른 연구자들도"}, {"start": 283.99, "end": 286.459, "text": "서로 다른 관점을 제시하곤 합니다."}, {"start": 286.459, "end": 288.379, "text": "그러니 결국 전체를 해결할 거라"}, {"start": 288.379, "end": 290.3, "text": "확신하고 시작하는 게 아닙니다."}, {"start": 290.3, "end": 291.752, "text": "일단 작은 한 부분부터 시작하고"}, {"start": 291.752, "end": 292.952, "text": "그것에 만족하는 거죠."}, {"start": 292.779, "end": 294.536, "text": "그러다 운이 좋으면 결국"}, {"start": 294.536, "end": 296.699, "text": "최종 목표에 도달하는 겁니다."}, {"start": 296.699, "end": 297.939, "text": "하지만 항상 그런 건 아니에요."}, {"start": 297.939, "end": 299.899, "text": "그런 식으로 계속 나아가는 것이죠."}, {"start": 299.899, "end": 301.375, "text": "그렇다면 수학의 미래에 대해"}, {"start": 301.375, "end": 302.574, "text": "이야기해 볼까요?"}, {"start": 302.259, "end": 304.485, "text": "다른 연구자들은 AI에 대해"}, {"start": 304.485, "end": 306.86, "text": "낙관적인 전망을 하고 있어요."}, {"start": 306.86, "end": 308.54, "text": "유용한 비서라고 생각하더군요."}, {"start": 308.54, "end": 310.68, "text": "반면 교수님은 AI가 수학자의"}, {"start": 310.68, "end": 312.819, "text": "역할을 없앨까 우려하시는데요."}, {"start": 312.819, "end": 314.98, "text": "이에 대한 자세한 생각을 듣고 싶습니다."}, {"start": 314.98, "end": 318.23, "text": "글쎄요, 저에 대해 쓰인 단어들에"}, {"start": 318.23, "end": 320.579, "text": "완전히 동의하진 않아요."}, {"start": 320.579, "end": 323.021, "text": "자극적인 단어들이죠."}, {"start": 323.021, "end": 327.459, "text": "전 세상을 있는 그대로 보려 합니다."}, {"start": 327.459, "end": 331.283, "text": "제 생각일 뿐이지만, 몇 년 안에"}, {"start": 331.283, "end": 335.449, "text": "AI는 단순한 비서를 넘어설 겁니다."}, {"start": 335.449, "end": 338.68, "text": "오늘날 전문 수학자들이 하는 일을"}, {"start": 338.68, "end": 342.089, "text": "인간보다 더 잘해낼 거라 확신해요."}, {"start": 342.089, "end": 344.889, "text": "그리고 훨씬 뛰어납니다. 질문을 더 잘하고"}, {"start": 344.889, "end": 347.689, "text": "문제를 해결하며, 정의를 내리고 분류하죠."}, {"start": 348.49, "end": 351.49, "text": "우리는 그 방향으로 가고 있죠. 수학의 경우,"}, {"start": 351.49, "end": 353.05, "text": "수학 연구원이라는 직업이"}, {"start": 353.769, "end": 355.877, "text": "현재와 같은 수학 연구자라는 직업은"}, {"start": 355.877, "end": 358.649, "text": "앞으로 그리 오래 존재하지 않을 거라 봅니다."}, {"start": 358.649, "end": 361.199, "text": "그렇다면 인간과 수학자, 수학을 사랑하는"}, {"start": 361.199, "end": 364.329, "text": "사람들을 위한 자리가 있을까요? 그러길 바랍니다."}, {"start": 364.329, "end": 367.132, "text": "낙관적으로 보고 있습니다. 하지만 그렇게 되려면"}, {"start": 367.132, "end": 369.29, "text": "현실을 있는 그대로 직시해야 합니다."}, {"start": 369.29, "end": 371.932, "text": "그리고 사람들이 워크숍과 모임을 열어"}, {"start": 371.932, "end": 375.37, "text": "가능한 것에 대해 고민해 보도록 권장하고 있죠."}, {"start": 375.37, "end": 377.97, "text": "우리가 지향할 미래 말이죠. 이 상황이 그냥"}, {"start": 377.97, "end": 380.569, "text": "조용히 사그라들어 사라지길 바라는 대신에요."}, {"start": 380.569, "end": 381.846, "text": "남: 예전의 일상으로 돌아갈 수 있을 거라고요."}, {"start": 381.846, "end": 383.047, "text": "여: 이제 와서 도로 주워담을 수는 없죠."}, {"start": 383.047, "end": 384.247, "text": "남: 그렇죠, 그럴 수 없다고 봅니다."}, {"start": 384.009, "end": 388.60699999999997, "text": "네, 최근 AI로 인한 인류 공멸의 미래에 관한"}, {"start": 388.60699999999997, "end": 390.73, "text": "논문을 발표하셨는데요."}, {"start": 390.73, "end": 393.516, "text": "어떤 우려가 있으신지, 그리고 수학자들은"}, {"start": 393.516, "end": 396.81, "text": "이런 가능성을 어떻게 대비하고 예방해야 할까요?"}, {"start": 396.81, "end": 398.841, "text": "AI로 인한 위험에는 여러 가지 유형이"}, {"start": 398.841, "end": 400.041, "text": "있다고 생각합니다."}, {"start": 399.81, "end": 402.589, "text": "경제적 붕괴부터 시작해서, 저는 특히"}, {"start": 402.589, "end": 405.37, "text": "수학 분야에 대해 우려하고 있습니다."}, {"start": 405.37, "end": 406.569, "text": "제가 그 분야 출신이고"}, {"start": 406.569, "end": 407.81, "text": "잘 아는 세계이기 때문이죠."}, {"start": 407.81, "end": 410.324, "text": "또한 더 광범위한 사회적 위험도 존재하며,"}, {"start": 410.324, "end": 413.17, "text": "매우 두려운 상황까지 치달을 수 있다고 봅니다."}, {"start": 413.17, "end": 414.81, "text": "바로 인류의 멸종입니다."}, {"start": 414.81, "end": 416.81, "text": "충분히 가능한 시나리오라고 생각합니다."}, {"start": 416.81, "end": 418.81, "text": "우리는 이를 직시해야 합니다."}, {"start": 418.81, "end": 420.754, "text": "공포를 조장하려는 것은 아닙니다."}, {"start": 420.754, "end": 422.81, "text": "공포는 결코 생산적이지 않으니까요."}, {"start": 422.81, "end": 425.61, "text": "하지만 나쁜 미래를 피하려면 그것을 이해하고"}, {"start": 425.61, "end": 428.41, "text": "그로부터 멀어지도록 유도해야 한다고 봅니다."}, {"start": 428.41, "end": 430.333, "text": "논문을 발표한 계기는"}, {"start": 430.333, "end": 433.002, "text": "제 친구 앤드루 크리치 덕분인데"}, {"start": 433.002, "end": 436.807, "text": "그는 저보다 훨씬 전부터 AI에 대비해 왔습니다."}, {"start": 436.81, "end": 440.81, "text": "버클리의 연구원들과 C-FAR를 비롯해"}, {"start": 440.81, "end": 444.81, "text": "아주 오랜 시간 AI 위험을 고민해 온"}, {"start": 444.81, "end": 448.992, "text": "현재 수많은 사람과 전문가, 과학자들,"}, {"start": 448.992, "end": 451.98, "text": "그리고 요슈아 벤지오나..."}, {"start": 451.98, "end": 454.22, "text": "제프리 힌턴 등 수많은 사람이"}, {"start": 454.22, "end": 457.3, "text": "AI의 위험성을 경고하고 있다는 점이죠."}, {"start": 457.3, "end": 460.459, "text": "하지만 그에 비해 사람들이 실제로 와닿을 만한"}, {"start": 460.459, "end": 462.86, "text": "구체적인 시나리오는 거의 없습니다."}, {"start": 462.86, "end": 464.06, "text": "사람들은 보통 \"대체 어떻게 그런 일이"}, {"start": 464.06, "end": 465.259, "text": "일어날 수 있죠?\"라고 묻습니다."}, {"start": 465.06, "end": 467.54, "text": "\"정확히 무엇을 두려워해야 하나요?\""}, {"start": 467.54, "end": 469.56, "text": "그래서 저희 둘은 훨씬 더 피부에"}, {"start": 469.56, "end": 471.579, "text": "와닿는 이야기를 쓰고 싶었습니다."}, {"start": 471.579, "end": 473.98, "text": "그 결과 상황이 잘못될 수 있는"}, {"start": 473.98, "end": 476.379, "text": "여섯 가지의 이야기를 썼습니다."}, {"start": 476.379, "end": 477.579, "text": "이 중 다섯 가지 이야기는"}, {"start": 477.579, "end": 478.779, "text": "절대 일어나지 않을 겁니다."}, {"start": 478.67, "end": 479.87, "text": "바라건대 여섯 가지 모두"}, {"start": 479.87, "end": 481.069, "text": "일어나지 않기를 바랍니다."}, {"start": 480.269, "end": 482.069, "text": "다만 사람들이 이 글을 읽고"}, {"start": 482.069, "end": 485.069, "text": "자신에게 와닿는 단 하나의 이야기라도 찾아서,"}, {"start": 485.069, "end": 486.362, "text": "\"이건 내가 정말 관심을 가져야 할"}, {"start": 486.362, "end": 487.562, "text": "실제 문제일 수도 있겠구나\"라고"}, {"start": 487.562, "end": 488.762, "text": "생각하게 되기를 바랍니다."}, {"start": 488.47, "end": 489.67, "text": "우리 모두가 이 문제에"}, {"start": 489.67, "end": 490.87, "text": "관심을 가져야 한다고 생각하거든요."}, {"start": 490.87, "end": 492.069, "text": "모두가 주의를 기울여야 합니다."}, {"start": 492.069, "end": 493.269, "text": "전적으로 동감합니다."}, {"start": 493.069, "end": 494.269, "text": "그 이야기를 읽는 것만으로도"}, {"start": 494.269, "end": 495.47, "text": "분명 얻는 것이 있을 겁니다."}, {"start": 495.069, "end": 499.069, "text": "그렇다면 잠재적으로 암울한 미래 앞에서,"}, {"start": 499.069, "end": 500.961, "text": "이제 막 커리어를 시작한 수학자들에게"}, {"start": 500.961, "end": 502.569, "text": "어떤 조언을 해주고 싶으신가요?"}, {"start": 502.569, "end": 504.56, "text": "우선 모든 사람에게"}, {"start": 504.56, "end": 509.54, "text": "AI를 적극적으로 경험해보라 권하고 싶습니다."}, {"start": 509.54, "end": 512.121, "text": "도구를 사용하든, 관련 글을 읽든,"}, {"start": 512.121, "end": 514.84, "text": "작동 방식을 배우는 것 등이 있겠죠."}, {"start": 514.84, "end": 518.975, "text": "남: 규제 방식의 작동이나 부재에 대해<br>제 생각엔 모두가,"}, {"start": 518.975, "end": 520.174, "text": "AI가 실제로"}, {"start": 519.879 // [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});

// [YouTube Keyboard Shortcuts]

</script>
