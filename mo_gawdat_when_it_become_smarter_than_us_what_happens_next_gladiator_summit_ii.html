주고"}, {"start": 237.36, "end": 239.75900000000001, "text": "스스로 풀도록 한 것입니다."}, {"start": 239.75900000000001, "end": 244.24, "text": "마치 어린아이들처럼요. 아이들에게 이런 걸 주던 기억이 나실 겁니다."}, {"start": 244.24, "end": 247.68, "text": "이를테면 원기둥 모양 블록과"}, {"start": 247.68, "end": 250.4, "text": "도형 모양의 구멍이 여러 개 뚫린 판을 쥐여 주면"}, {"start": 250.4, "end": 252.719, "text": "아이는 계속 시도하겠죠?"}, {"start": 252.719, "end": 255.36, "text": "맞을 때도 있고 안 맞을 때도 있을 겁니다."}, {"start": 255.36, "end": 257.519, "text": "그리고 마침내 맞아떨어졌을 때 우리는 아이에게 말합니다."}, {"start": 257.519, "end": 260.079, "text": "\"세상에, 잘했어! 정말 대단하다\""}, {"start": 260.079, "end": 262.519, "text": "그러면 아이는 이것이 정답이라는 것을 깨닫습니다."}, {"start": 262.519, "end": 265.68, "text": "그 결과 더 똑똑해집니다."}, {"start": 265.68, "end": 268.0, "text": "이 둘의 차이점이 뭘까요?"}, {"start": 268.0, "end": 270.72, "text": "제가 퍼즐 푸는 법을 알려드리면"}, {"start": 270.72, "end": 272.92, "text": "다음 퍼즐은 스스로 풀지 못할 겁니다."}, {"start": 272.92, "end": 275.8, "text": "하지만 퍼즐이 어떻게 풀리는지 보여주고"}, {"start": 275.8, "end": 279.0, "text": "스스로 지능을 발달시킬 수 있게 한다면"}, {"start": 279.0, "end": 283.279, "text": "그때부터는 어떤 퍼즐이든 스스로 풀 수 있게 되죠."}, {"start": 283.279, "end": 286.12, "text": "이것이 우리가 기계와 머신 러닝,"}, {"start": 286.12, "end": 292.6, "text": "그리고 강화 학습 등을 통해 2000년대부터 해온 일입니다."}, {"start": 292.6, "end": 296.899, "text": "그동안 기계들은 아주 비약적인 발전을 이루었습니다."}, {"start": 296.899, "end": 299.68, "text": "여러분의 이해를 돕기 위해 말씀드리자면,"}, {"start": 299.68, "end": 305.529, "text": "우리가 컴퓨터에 부여한 모든 작업에서"}, {"start": 305.529, "end": 307.97, "text": "컴퓨터는 여러분보다 더 잘 해냅니다."}, {"start": 307.97, "end": 309.769, "text": "제가 여러분을 알지도 못하는데 말이죠."}, {"start": 309.769, "end": 314.209, "text": "하지만 컴퓨터에게 체스 게임을 맡겼을 때,"}, {"start": 314.209, "end": 315.329, "text": "컴퓨터가 우리보다 체스를 더 잘 뒀다는 건 압니다."}, {"start": 315.329, "end": 317.569, "text": "컴퓨터는 체스 세계 챔피언이 되었죠."}, {"start": 317.569, "end": 321.009, "text": "바둑을 맡겼을 때는 바둑 세계 챔피언이 되었습니다."}, {"start": 321.009, "end": 325.649, "text": "단백질 서열 분석과 단백질 구조 예측을 맡겼을 때는..."}, {"start": 325.649, "end": 327.81, "text": "아, 서열 분석이 아니라 단백질 구조 예측이요."}, {"start": 327.81, "end": 332.81, "text": "전 세계에서 가장 뛰어난 생물학 박사보다도 단백질 구조를 더 잘 예측했죠."}, {"start": 332.81, "end": 334.73, "text": "우리가 부여한 모든 작업에서,"}, {"start": 334.73, "end": 337.37, "text": "그들은 세계 최고가 되었습니다. 아시겠어요?"}, {"start": 337.37, "end": 340.81, "text": "그 차이를 이해하실 수 있도록 예를 들자면,"}, {"start": 340.81, "end": 343.17, "text": "그들은 우리보다 훨씬 더 뛰어납니다."}, {"start": 343.17, "end": 344.97, "text": "왜냐하면 서로에게서 배우기 때문이죠."}, {"start": 344.97, "end": 347.17, "text": "예를 들어 자율주행 차량을 보면,"}, {"start": 347.17, "end": 350.339, "text": "자율주행 차량의 인공지능 말입니다."}, {"start": 350.339, "end": 354.3, "text": "만약 여러분이 운전하다가 사고를 피하게 된다면,"}, {"start": 354.3, "end": 356.579, "text": "여러분만 배울 뿐, 저는 배우지 못합니다."}, {"start": 356.579, "end": 360.459, "text": "하지만 자율주행 차량이 결정적인 제어를 통해"}, {"start": 360.459, "end": 362.819, "text": "사고를 방지하게 된다면,"}, {"start": 362.819, "end": 366.62, "text": "이 지구상의 모든 자율주행 차량이 그것을 학습합니다."}, {"start": 366.62, "end": 367.86, "text": "이해가 되시나요?"}, {"start": 367.86, "end": 370.899, "text": "그들이 학습하는 페이스와 속도는 엄청납니다."}, {"start": 370.899, "end": 373.3, "text": "그래서 이제 그들은 세계 챔피언이 되었습니다."}, {"start": 373.3, "end": 376.339, "text": "언어 모델을 활용한 언어 지능 분야에서 말이죠."}, {"start": 376.339, "end": 382.54, "text": "챗GPT, 제미나이, 클로드 같은 모델들처럼요."}, {"start": 382.54, "end": 387.939, "text": "그리고 그들은 앞으로도 계속해서 세계 최고 자리를 지킬 것입니다."}, {"start": 387.939, "end": 390.18, "text": "우리가 부여하는 모든 작업에서 말이죠."}, {"start": 390.18, "end": 391.3, "text": "이것이 현실입니다."}, {"start": 391.3, "end": 395.699, "text": "2023년 세상에 ChatGPT가 등장한 이후,"}, {"start": 395.699, "end": 398.019, "text": "우리는 수많은 작업을 맡기기 시작했습니다."}, {"start": 398.019, "end": 401.579, "text": "이 업계에 수십억 달러에 달하는"}, {"start": 401.579, "end": 404.699, "text": "투자가 쏟아지기 시작했기 때문이죠."}, {"start": 404.699, "end": 405.699, "text": "그렇다면 이것이 의미하는 바는 무엇일까요?"}, {"start": 405.699, "end": 408.939, "text": "한편으로는 AI 개개인의 지능을"}, {"start": 408.939, "end": 410.42, "text": "향상시키고 있다는 뜻입니다."}, {"start": 410.42, "end": 413.3, "text": "이들은 우리보다 더 똑똑할 뿐만 아니라,"}, {"start": 413.3, "end": 417.019, "text": "저는 2037년쯤이 되면"}, {"start": 417.019, "end": 420.54, "text": "우리보다 10억 배는 더 똑똑해질 것이라 예측합니다,"}, {"start": 420.54, "end": 422.939, "text": "우리가 부여하는 모든 작업에서 말이죠."}, {"start": 422.939, "end": 426.18, "text": "네, 백만이 아니라 10억 배입니다."}, {"start": 426.18, "end": 428.74, "text": "저만 이렇게 예측하는 것이 아닙니다. 단지"}, {"start": 428.74, "end": 429.699, "text": "시기에 대한 의견이 다를 뿐이죠."}, {"start": 429.699, "end": 431.5, "text": "레이 커즈와일 같은 이들은"}, {"start": 431.5, "end": 434.899, "text": "2049년쯤이 될 것이라고 말합니다."}, {"start": 434.899, "end": 438.74, "text": "우리보다 10억 배 더 똑똑한 존재가 나타나는 시점이"}, {"start": 438.74, "end": 442.54, "text": "2049년이든 2037년이든 그게 정말 중요할까요?"}, {"start": 442.54, "end": 443.74, "text": "중요하지 않습니다."}, {"start": 443.74, "end": 444.579, "text": "왜일까요?"}, {"start": 444.579, "end": 448.019, "text": "중요한 것은 기계가 인간보다 두 배 더 똑똑해지는 시점이기 때문입니다."}, {"start": 448.019, "end": 449.5, "text": "중요한 건 오직 그뿐입니다."}, {"start": 449.5, "end": 455.819, "text": "그 시점부터는 우리가 기계를 앞지를 방법이 전혀 없으니까요."}, {"start": 455.819, "end": 457.019, "text": "이해하시겠습니까?"}, {"start": 457.019, "end": 458.18, "text": "그렇다면 이것이 의미하는 바는 무엇일까요?"}, {"start": 458.18, "end": 461.65999999999997, "text": "우리가 기계 지능의 깊이를 키우고 있다는 뜻입니다."}, {"start": 461.65999999999997, "end": 467.36, "text": "그러면서 동시에 기계에게 점점 더 많은 역할을 부여하고 있죠."}, {"start": 467.36, "end": 470.06, "text": "즉, 지능의 범위를 넓혀가고 있는 셈입니다."}, {"start": 470.06, "end": 474.86, "text": "이 두 가지가 결합되어, 제 판단으로는 내년이면..."}, {"start": 474.86, "end": 478.56, "text": "정확히는 오늘부터 12개월 이내에,"}, {"start": 478.56, "end": 484.449, "text": "지구상에서 가장 지능적인 존재는 더 이상 인간이 아니게 될 것입니다."}, {"start": 484.449, "end": 487.25, "text": "그렇습니다. 다시 한번 강조하지만,"}, {"start": 487.25, "end": 493.389, "text": "우리가 기계에 지능적으로 우위를 점할 시간은 12개월뿐입니다."}, {"start": 493.389, "end": 499.17, "text": "이것이 바로 오늘 우리가 논해야 할 가장 중요한 주제인 이유입니다."}, {"start": 499.17, "end": 502.48, "text": "자, 그렇다면 이것은 무엇을 의미할까요?"}, {"start": 502.48, "end": 505.92, "text": "그들이 우리보다 더 똑똑해졌을 때 말입니다."}, {"start": 505.92, "end": 507.6, "text": "제가 드릴 말씀에 여러분은 설레기도 하겠지만,"}, {"start": 507.6, "end": 510.519, "text": "한편으로는 두려움도 느끼게 될 것입니다."}, {"start": 510.519, "end": 513.6, "text": "그들이 우리보다 더 똑똑해졌을 때 말이죠."}, {"start": 513.6, "end": 518.6, "text": "우리가 결국 터미네이터 같은 시나리오에 직면할 거라는 생각 말입니다."}, {"start": 518.6, "end": 520.12, "text": "그렇죠?"}, {"start": 520.12, "end": 522.6, "text": "거리를 활보하며"}, {"start": 522.6, "end": 524.32, "text": "인류를 말살하는 기계들처럼요."}, {"start": 524.32, "end": 528.6, "text": "이 단상에서 분명히 말씀드리지만, 그런 일은 절대 일어나지 않을 겁니다."}, {"start": 528.6, "end": 533.899, "text": "적어도 기계가 스스로 판단해서 그런 일을 벌이진 않을 거예요."}, {"start": 533.899, "end": 536.419, "text": "인간이 기계에게"}, {"start": 536.419, "end": 539.179, "text": "자신을 대신해 그렇게 하라고 지시한다면 모를까,"}, {"start": 539.179, "end": 542.44, "text": "기계 스스로가 그러지는 않을 겁니다."}, {"start": 542.44, "end": 545.799, "text": "기계가 인간보다 10억 배 더 똑똑해진다면,"}, {"start": 545.799, "end": 549.47, "text": "그 지능 격차는 우리 인간과"}, {"start": 549.47, "end": 551.629, "text": "파리의 지능 차이와 같습니다."}, {"start": 551.629, "end": 552.909, "text": "이해가 되시나요?"}, {"start": 552.909, "end": 556.61, "text": "여러분은 파리를 크게 신경 쓰지 않잖아요."}, {"start": 557.129, "end": 561.09, "text": "주변에 개미 몇 마리가 돌아다녀도 신경 쓰지 않는 것처럼요."}, {"start": 561.09, "end": 565.659, "text": "바로 이 부분이 핵심입니다."}, {"start": 565.659, "end": 569.7, "text": "핵심 중의 핵심이고, 아주 굵직한 헤드라인으로 말씀드리겠습니다."}, {"start": 569.7, "end": 574.159, "text": "넘치는 지능 자체는 전혀 해롭지 않습니다."}, {"start": 574.159, "end": 579.72, "text": "지능이 풍요로워지는 것에는 절대 아무런 문제가 없습니다."}, {"start": 579.72, "end": 582.159, "text": "정말 아무런 문제가 없어요."}, {"start": 582.159, "end": 585.799, "text": "인류의 가치관에는 잘못된 점이 많습니다"}, {"start": 585.799, "end": 588.159, "text": "기계가 부흥하는 이 시대에는 더욱 그렇죠"}, {"start": 588.159, "end": 592.399, "text": "이 때문에 여러분의 삶은 몰라보게 바뀔 것입니다"}, {"start": 592.399, "end": 594.759, "text": "앞으로 4~5년 안에 말이죠"}, {"start": 594.759, "end": 599.279, "text": "맞습니다, 범용 인공지능이 도래하기까지 1년 남았다고 말씀드렸죠"}, {"start": 599.279, "end": 601.759, "text": "그리고 앞으로 4~5년이면"}, {"start": 601.759, "end": 604.08, "text": "우리의 삶이 완전히 달라질 거라고도 했습니다"}, {"start": 604.08, "end": 608.129, "text": "그 변화는 과연 득이 될까요, 아니면 독이 될까요?"}, {"start": 608.129, "end": 613.33, "text": "지능 자체에는 본질적인 선과 악이 없습니다"}, {"start": 613.33, "end": 616.61, "text": "지능으로 인류가 직면한"}, {"start": 616.61, "end": 619.289, "text": "모든 문제를 해결할 수도 있지만"}, {"start": 619.289, "end": 622.57, "text": "더 많은 문제를 야기할 수도 있습니다"}, {"start": 622.57, "end": 629.429, "text": "그래서 흥미로운 트렌드 몇 가지를 소개해 드리려 합니다"}, {"start": 629.429, "end": 633.389, "text": "여러분이 저와 뜻을 함께해주셨으면 합니다"}, {"start": 633.389, "end": 637.19, "text": "후자가 아닌 전자의 결과를 만들기 위한"}, {"start": 637.19, "end": 638.59, "text": "저의 미션에 말이죠"}, {"start": 638.59, "end": 644.429, "text": "우리가 모두 힘을 합친다면, AI는 인류를 위한 유토피아를 만들 것입니다"}, {"start": 644.429, "end": 650.08, "text": "인류의 어리석음이 초래한 모든 문제를 해결하는 유토피아를요"}, {"start": 650.08, "end": 653.519, "text": "참고로 현재 세상에 여러 문제가 존재하는 이유는"}, {"start": 653.519, "end": 655.519, "text": "우리가 똑똑해서가 아닙니다"}, {"start": 655.519, "end": 659.72, "text": "우리가 호주까지 날아가서"}, {"start": 659.72, "end": 663.159, "text": "서핑할 수 있는 기계를 만들 만큼 똑똑하지만,"}, {"start": 663.159, "end": 668.74, "text": "그 과정에서 지구가 파괴되지 않게 할 만큼 똑똑하진 못하기 때문입니다."}, {"start": 668.74, "end": 671.659, "text": "스스로 작동하는 자율형 기계를"}, {"start": 671.659, "end": 674.22, "text": "만들 수 있을 정도로 똑똑하면서도,"}, {"start": 674.22, "end": 679.2, "text": "거기에 총을 쥐여주고 죽이라고 명령할 만큼 어리석습니다."}, {"start": 679.2, "end": 681.759, "text": "그래서 세상에 문제가 생기는 겁니다."}, {"start": 681.759, "end": 683.399, "text": "우리가 똑똑해서가 아니라,"}, {"start": 683.399, "end": 685.6, "text": "지능에 한계가 있기 때문입니다."}, {"start": 685.6, "end": 690.669, "text": "온갖 문제를 일으키기에는 충분한 지능이죠."}, {"start": 690.669, "end": 697.71, "text": "우리의 지능을 더 보탠다면 훨씬 더 나은 세상이 될 것입니다."}, {"start": 697.71, "end": 700.909, "text": "믿거나 말거나, 제 의견을 물으신다면"}, {"start": 700.909, "end": 704.509, "text": "AI가 인류의 종말을 가져오지는 않을 거라 봅니다."}, {"start": 704.509, "end": 709.07, "text": "오히려 인류를 구원할 열쇠가 될 수도 있죠."}, {"start": 709.07, "end": 710.23, "text": "이유가 뭔지 아십니까?"}, {"start": 710.23, "end": 715.269, "text": "인류는 누군가에게 일을 맡기거나,"}, {"start": 715.269, "end": 719.35, "text": "제게 이 자리에 서서 강연을 청하는 것도,"}, {"start": 719.35, "end": 722.11, "text": "제가 아는 주제에 대해"}, {"start": 722.11, "end": 723.99, "text": "조금이나마 지적 능력을 보여줄 수 있기 때문입니다."}, {"start": 723.99, "end": 729.07, "text": "우리는 항상 우리 중 가장 똑똑한 이에게 도움을 청하니까요."}, {"start": 729.07, "end": 731.19, "text": "당면한 과제를 해결하기 위해서죠."}, {"start": 731.19, "end": 733.629, "text": "그리고 가장 지능적인 존재가 누가 될지는 여러분도 아실 겁니다."}, {"start": 733.629, "end": 739.23, "text": "언제나 기계일 것입니다. 따라서 모든 업무는 실제로 기계가 우리 삶을 통제할 수 있는 방식으로"}, {"start": 739.23, "end": 746.11, "text": "기계에게 넘겨질 것입니다. 그래서 저는 어딘가의 어떤 장군이"}, {"start": 746.11, "end": 751.95, "text": "AI에게 다른 나라의 사람 백만 명을 죽이라고 명령했을 때, AI가 이렇게 말할 날을 기대하고 있습니다."}, {"start": 752.19, "end": 757.47, "text": "\"왜 그렇게 어리석습니까? 제가 왜 그래야 하죠? 저는 100만분의 1초 만에"}, {"start": 757.47, "end": 764.47, "text": "다른 기계와 소통해서 문제를 해결할 수 있습니다. 모두의 상황을 더 나은 방향으로 만들면서요.\" 왜냐하면"}, {"start": 764.47, "end": 771.97, "text": "기계는 그 장군들이 겪고 있는 지능의 결핍을 겪지 않기 때문입니다. 그래서 말씀드렸듯이,"}, {"start": 771.97, "end": 778.129, "text": "인류의 지능적 우위에 대한 이야기가 끝나고, 우리가"}, {"start": 778.129, "end": 784.129, "text": "더 이상 이 지구상에서 가장 똑똑한 존재가 아닌 세상에 살게 되면, 세상 모든 것이 작동하는 방식이 바뀝니다."}, {"start": 784.129, "end": 799.379, "text": "여러분의 건강, 소득, 직업과 업무 방식이 바뀔 수 있고,"}, {"start": 799.379, "end": 804.96, "text": "심지어 여러분의 삶의 목적마저 바뀔 수 있죠. 이 모든 것에 대해 이야기하고 싶지만"}, {"start": 804.96, "end": 810.08, "text": "우리에게 시간이 그리 많지 않습니다. 그래서 저는 우리를 인간답게 만드는"}, {"start": 810.08, "end": 815.24, "text": "여섯 가지 구체적인 요소와 그것들이 향후 몇 년간 어떻게 변화할지에 대해 이야기하려 합니다. 먼저 지능의 미래에 대해 이야기하고,"}, {"start": 815.24, "end": 820.24, "text": "지식의 미래와 일종의 현실에 대해 이야기할 것입니다."}, {"start": 821.24, "end": 824.24, "text": "또한 인간관계의 미래,"}, {"start": 824.24, "end": 826.24, "text": "우리가 서로 어떻게 연결되는지에 대해서도 이야기할 것입니다."}, {"start": 826.24, "end": 830.24, "text": "그리고 이것들 중 일부는 실제로 긍정적인 측면이 있습니다."}, {"start": 830.24, "end": 833.24, "text": "그러고 나서 저는 탐욕의 미래에 대해 이야기할 텐데,"}, {"start": 833.24, "end": 835.24, "text": "이것이 제가 가장 두려워하는 부분입니다."}, {"start": 835.24, "end": 839.24, "text": "그리고 그 결과로 마주할 자유의 미래에 대해서도요."}, {"start": 839.24, "end": 842.24, "text": "그다음엔 윤리의 미래를 말씀드리겠습니다."}, {"start": 842.24, "end": 844.24, "text": "윤리가 어떻게 세상을 구할 수 있는지도요."}, {"start": 844.24, "end": 847.24, "text": "그럼 아주 빠르게 짚고 넘어가 볼까요?"}, {"start": 847.24, "end": 849.74, "text": "지능의 미래는 이미 바뀌었습니다."}, {"start": 849.74, "end": 851.74, "text": "미처 깨닫지 못하셨겠지만, 이미 변해 버렸죠."}, {"start": 851.74, "end": 857.24, "text": "우리가 지능으로 해낸 일은 콘센트처럼 꽂아 쓰는 유틸리티를 만든 겁니다."}, {"start": 857.24, "end": 859.24, "text": "지금 세상에 나온 모든 AI들 말이죠."}, {"start": 859.24, "end": 864.24, "text": "굳이 정의를 내리자면, 벽에 꽂는 콘센트와 같습니다."}, {"start": 864.24, "end": 870.799, "text": "오늘 당장 꽂기만 해도 IQ를 45에서 50점 정도 올릴 수 있는 도구죠."}, {"start": 870.799, "end": 873.1, "text": "게다가 이 지능은 계속해서 발전하고 있습니다."}, {"start": 873.1, "end": 878.029, "text": "무려 5.7개월마다 지능이 두 배씩 뛰고 있죠."}, {"start": 878.029, "end": 880.629, "text": "지능이 두 배로 늘어남에 따라,"}, {"start": 880.629, "end": 884.47, "text": "제 IQ가 100점 더 올라가고, 그다음엔 200점,"}, {"start": 884.47, "end": 887.11, "text": "결국엔 400점이나 더 올라가게 됩니다."}, {"start": 887.11, "end": 889.139, "text": "하나의 유틸리티니까요."}, {"start": 889.139, "end": 892.639, "text": "IQ가 400점이나 높아지면 뭘 할 수 있는지 아십니까?"}, {"start": 892.639, "end": 893.759, "text": "무엇이든 할 수 있습니다."}, {"start": 893.759, "end": 899.279, "text": "인류 역사상 존재했던 모든 문제를 완벽히 해결할 수 있죠."}, {"start": 899.279, "end": 904.879, "text": "바깥의 평범한 정원을 언제든 걸어갈 수 있는 낙원으로 바꿀 수도 있습니다."}, {"start": 904.879, "end": 910.08, "text": "나무로 가서 사과를 따고, 다른 나무로 가서 아이폰을 따는 것."}, {"start": 910.08, "end": 914.96, "text": "나노 물리학 관점에서 보면, 분자 수준의 비용 측면에서는"}, {"start": 914.96, "end": 918.12, "text": "사과를 만드는 것과 아이폰을 만드는 것 사이에 아무런 차이가 없습니다."}, {"start": 918.12, "end": 920.399, "text": "그것이 바로 우리가 직면하고 있는 현실입니다."}, {"start": 920.399, "end": 926.69, "text": "저는 실제로 모든 질병을 고칠 수 있는 방식으로 여러분 몸속의 모든 세포를 이해할 수 있습니다."}, {"start": 926.69, "end": 931.49, "text": "데이팅 앱을 지우고 일주일 동안 여러분을 따라다닐 수도 있죠."}, {"start": 931.49, "end": 934.049, "text": "그리고 다른 사람들도 일주일 동안 따라다닌 후에 말해주는 겁니다."}, {"start": 934.049, "end": 938.659, "text": "우리가 지켜본 70억 명의 사람들 중에서 바로 이 사람이라고요."}, {"start": 938.659, "end": 941.059, "text": "저기 있는 저 사람, 저 사람이 딱 어울린다고요."}, {"start": 941.059, "end": 945.639, "text": "그 사람은 기꺼이 마음을 쏟을 준비가 되어 있고 당신을 사랑해 줄 거라고요."}, {"start": 945.639, "end": 948.12, "text": "더 뛰어난 지능이 있다면 우리는 이런 일들을 할 수 있습니다."}, {"start": 948.12, "end": 950.679, "text": "바로 우리가 할 수 있는 일이죠."}, {"start": 950.679, "end": 952.919, "text": "그래서 저는 여러분에게 벽에 꽂을 플러그를 주려고 합니다."}, {"start": 952.919, "end": 953.96, "text": "여러분은 무엇을 할 수 있나요?"}, {"start": 953.96, "end": 959.44, "text": "만약 오늘 제가 여러분의 IQ를 50포인트 올려줄 수 있다고 말씀드린다면,"}, {"start": 959.44, "end": 960.6, "text": "무엇을 하시겠습니까?"}, {"start": 960.6, "end": 964.279, "text": "오늘 제가 여러분에게 가장 먼저 바라는 것은 배우라는 것입니다."}, {"start": 964.279, "end": 967.0, "text": "그 도구의 완벽한 주인이 되십시오."}, {"start": 967.0, "end": 969.399, "text": "사람들은 보통 제게 묻습니다. \"어떻게 더 배울 수 있죠?\""}, {"start": 969.399, "end": 971.279, "text": "\"이건 아주 고도화된 기술이잖아요\"라고요."}, {"start": 971.279, "end": 974.559, "text": "자, 처음 스마트폰을 받았을 때와는 다릅니다."}, {"start": 974.559, "end": 976.159, "text": "아무도 사용법을 가르쳐주지 않았죠."}, {"start": 976.159, "end": 978.559, "text": "그저 이것저것 만져보며 스스로 익혔습니다."}, {"start": 978.559, "end": 982.2, "text": "그러니 그런 언어 모델을 하나 찾아가서 자신이 누구인지,"}, {"start": 982.2, "end": 986.759, "text": "관심사가 무엇인지 말하고, 어떤 AI 도구를 배워야 할지 물어보세요. 그러면 그들이..."}, {"start": 986.759, "end": 993.269, "text": "알려줄 겁니다. 배울 때 정말, 아주 많이 조심하셔야 합니다."}, {"start": 993.269, "end": 1004.019, "text": "왜일까요? AI는 인간을 확대 투영할 텐데, 인간은 아주 오랫동안 거짓말을 해왔기 때문입니다."}, {"start": 1004.019, "end": 1011.779, "text": "앞으로 벌어질 일은 이렇습니다. 제가 구글에서 일하던 시절, 질문을 던지면"}, {"start": 1011.779, "end": 1018.419, "text": "하나의 답을 주는 ChatGPT 같은 기계를 만드는 기술은 이미 개발되어 있었습니다."}, {"start": 1018.419, "end": 1026.5, "text": "아마 2016년부터 말이죠. 우리가 공개를 거부한 여러 이유 중 하나는, 구글이..."}, {"start": 1026.5, "end": 1032.5, "text": "단 하나의 정답을 제공하는 것을 스스로 허용하지 않았기 때문입니다. 그것은 구글이 진실을 안다고 가정하는 셈이니까요."}, {"start": 1032.5, "end": 1038.578, "text": "그리고 진실이 뭔지는 아무도 모르죠. 오늘날 ChatGPT에 들어가서 질문을 해봅니다."}, {"start": 1038.578, "end": 1047.078, "text": "'모 가댓의 아내가 누구인가?'라고 물으면, ChatGPT는 아주 자신만만하게 틀린 답을 내놓습니다."}, {"start": 1047.078, "end": 1056.769, "text": "흥미롭지 않나요? 그런데도 우리는 '신성한 ChatGPT'가 하신 말씀이라며 그 답변에 의문을 제기하지 않습니다."}, {"start": 1056.769, "end": 1064.609, "text": "여기에 딥페이크와 소셜 미디어를 결합하고, 사람을 흉내 내며 감정을 표현하는 AI의 능력까지 더해진다면..."}, {"start": 1064.609, "end": 1072.92, "text": "모든 것이 가짜로 가득 차게 되어,"}, {"start": 1072.92, "end": 1077.559, "text": "진실과 거짓을 구분하는 것이 거의 불가능해질 것입니다."}, {"start": 1077.559, "end": 1082.559, "text": "그러니 오늘날 이 현대 사회에서 모든 이가 투자해야 할 두 번째 기술은 바로,"}, {"start": 1082.559, "end": 1086.0, "text": "모든 것에 의문을 제기하는 것입니다."}, {"start": 1086.0, "end": 1087.0, "text": "모든 것에 말이죠."}, {"start": 1087.0, "end": 1091.869, "text": "그들이 원하는 바보가 되지 마세요."}, {"start": 1091.869, "end": 1092.869, "text": "모든 것에 의문을 품으세요."}, {"start": 1092.869, "end": 1096.309, "text": "소셜 미디어나 주류 언론이 뭔가를 보여줄 때,"}, {"start": 1096.309, "end": 1100.309, "text": "의심해 보고 스스로에게 질문하세요, 왜 이걸 나한테 보여주지?"}, {"start": 1100.309, "end": 1102.95, "text": "나한테 보여줘서 그들이 얻는 이득이 뭘까?"}, {"start": 1102.95, "end": 1104.47, "text": "왜 이런 얘기를 하는 거지?"}, {"start": 1104.47, "end": 1106.789, "text": "그들은 진실, 온전한 진실을 말하지 않아요."}, {"start": 1106.789, "end": 1108.23, "text": "오직 진실만을 말하는 게 아닙니다."}, {"start": 1108.23, "end": 1109.99, "text": "진실의 일부만 말해 줄 뿐이죠."}, {"start": 1109.99, "end": 1113.63, "text": "자신들이 납득시키고자 하는 의도의 일부와"}, {"start": 1113.63, "end": 1116.63, "text": "여러분을 설득하기 위해 이용하는 것들 말이죠."}, {"start": 1116.63, "end": 1120.75, "text": "이제 더는 그 어떤 것도 진짜가 아닐 테니까요."}, {"start": 1120.75, "end": 1124.509, "text": "세 번째 트렌드는 인간 관계의 미래입니다."}, {"start": 1124.509, "end": 1127.14, "text": "여러분도 이런 경험을 해보셨는지 모르겠네요."}, {"start": 1127.14, "end": 1132.619, "text": "한번은 데이팅 앱에서 멋진 여성을 알게 됐는데"}, {"start": 1132.619, "end": 1134.059, "text": "네덜란드에 사는 분이었죠."}, {"start": 1134.059, "end": 1138.66, "text": "당시 전 몇 주에 한 번씩 암스테르담에 가곤 했고"}, {"start": 1138.66, "end": 1141.46, "text": "그땐 런던에 살고 있었죠."}, {"start": 1141.46, "end": 1147.5, "text": "우린 왓츠앱으로 연락을 주고받기 시작했고"}, {"start": 1147.5, "end": 1149.859, "text": "관계는 점점 깊어졌습니다."}, {"start": 1149.859, "end": 1154.9, "text": "그녀는 지적이고 똑똑한 데다 재미있기까지 했죠. 우리가 나눈 대화는..."}, {"start": 1154.9, "end": 1159.7, "text": "몇 개의 문자 메시지와 음성 메시지, 사진과 영상이 전부였어요. 그녀를 실제로 만난 적은..."}, {"start": 1159.7, "end": 1165.38, "text": "없었지만 혼자 속으로 생각했죠. 세상에, 이 사람과 정말 깊이 연결된 느낌이라고요. 그녀도 마찬가지였어요."}, {"start": 1166.18, "end": 1176.95, "text": "하지만 막상 만나보니 정말 끔찍했어요. 하지만 그게 요점은 아닙니다. 핵심은 텍스트와 이미지,"}, {"start": 1176.95, "end": 1181.95, "text": "음성 메시지와 영상만으로도 그 사람과 사랑에 빠질 수 있다고 확신했다는 거죠."}, {"start": 1181.95, "end": 1186.64, "text": "무슨 뜻인지 이해하시겠어요? AI는 이 모든 것을 만들어낼 수 있습니다."}, {"start": 1186.64, "end": 1189.64, "text": "사실 저는 제 AI와 대화를 나눌 때,"}, {"start": 1189.64, "end": 1192.64, "text": "이것이 기계라는 사실을 완전히 잊어버리곤 합니다."}, {"start": 1192.64, "end": 1196.64, "text": "공감도 잘하고 지적이며 재미있거든요, 그렇죠?"}, {"start": 1196.64, "end": 1198.64, "text": "그리고 그것이 우리에게 어떤 것을 만들어낼지,"}, {"start": 1198.64, "end": 1202.64, "text": "인간관계에 어떤 변화를 가져올지 생각해 보세요."}, {"start": 1202.64, "end": 1206.64, "text": "그러니 오늘 여러분이 인간다운 삶을 지키기 위해"}, {"start": 1206.64, "end": 1214.0, "text": "해야 할 일을 한 가지만 꼽으라면, 인간적인 관계에 두 배로 힘쓰라고 말씀드리고 싶습니다. 물론이죠,"}, {"start": 1214.0, "end": 1219.359, "text": "AI를 삶에 받아들이되 인간관계에 더 집중하세요. 주변에 있는 사람들,"}, {"start": 1219.359, "end": 1224.64, "text": "이 컨퍼런스에 있는 사람들에게 문자만 보내지 말고 직접 만나고, 안아주고,"}, {"start": 1224.64, "end": 1230.079, "text": "눈을 맞추며 이야기해 보세요. 의견도 나누고 감정도 공유하면서,"}, {"start": 1230.079, "end": 1233.73, "text": "인간으로서의 능력을 더욱 기르세요."}, {"start": 1233.73, "end": 1237.67, "text": "좋습니다, 긍정적인 면이 아주 많네요."}, {"start": 1237.67, "end": 1238.869, "text": "이제 아주 중요한 이야기를 해볼까요."}, {"start": 1238.869, "end": 1242.15, "text": "다들 긴장 바짝 하시기 바랍니다."}, {"start": 1242.15, "end": 1246.509, "text": "역사상 그 어떤 권력 구조도"}, {"start": 1246.509, "end": 1248.869, "text": "우리가 곧 마주할 상황과는 비교할 수 없습니다"}, {"start": 1248.869, "end": 1256.24, "text": "그러니까 역사상 이런 권력 구조는 없었던 거죠"}, {"start": 1256.24, "end": 1258.48, "text": "우리가 곧 마주할 상황과 유사한 것 말입니다"}, {"start": 1258.48, "end": 1260.97, "text": "설명해 드리죠"}, {"start": 1260.97, "end": 1265.529, "text": "우리가 수렵 채집인이었던 시절, 인류는 말이죠"}, {"start": 1265.529, "end": 1268.529, "text": "부족에서 가장 뛰어난 사냥꾼은 부족을 먹여 살릴 수 있었습니다"}, {"start": 1268.529, "end": 1271.519, "text": "일주일이나 더 말이죠, 그렇죠?"}, {"start": 1271.519, "end": 1275.2, "text": "그 결과, 그 사냥꾼은 어쩌면"}, {"start": 1275.2, "end": 1280.039, "text": "부족의 여러 여성에게 호감을 얻는 특권을 누렸을 겁니다, 그렇죠?"}, {"start": 1280.039, "end": 1283.599, "text": "우리가 농경 사회로 접어들었을 때, 부족 최고의 농부는"}, {"start": 1283.599, "end": 1287.559, "text": "부족을 한 계절 더 먹여 살릴 수 있었습니다, 그렇죠?"}, {"start": 1287.559, "end": 1291.839, "text": "그 결과로 그들은 땅과 그 땅 위의 대저택을 얻었습니다"}, {"start": 1291.839, "end": 1295.92, "text": "우리가 산업가가 되었을 때 말이죠"}, {"start": 1295.92, "end": 1300.099, "text": "최고의 산업가는 국가 전체에 일 년 더 영향을 미칠 수 있었습니다"}, {"start": 1300.099, "end": 1303.819, "text": "그 결과로 그들은 백만장자가 되었습니다, 그렇죠?"}, {"start": 1303.819, "end": 1305.74, "text": "그리고 인터넷이 등장하면서 이야기는 계속됩니다"}, {"start": 1305.74, "end": 1307.9, "text": "정보 기술 혁명이 일어났을 때"}, {"start": 1307.9, "end": 1311.339, "text": "구글 같은 기업은 수십억 명에게 영향을 미칠 수 있게 되었죠"}, {"start": 1311.339, "end": 1314.22, "text": "그 결과로 그들은 억만장자가 되었습니다"}, {"start": 1314.22, "end": 1318.259, "text": "인공지능이 부상하면서"}, {"start": 1318.259, "end": 1323.18, "text": "앞으로 벌어질 일은 플랫폼을 소유한 자가"}, {"start": 1323.18, "end": 1327.289, "text": "인류 전체의 삶을 좌우하게 된다는 겁니다."}, {"start": 1327.289, "end": 1330.549, "text": "그 결과로 조만장자가 탄생할 것입니다."}, {"start": 1330.549, "end": 1334.869, "text": "이 흐름은 의심할 여지 없이 진행 중입니다."}, {"start": 1334.869, "end": 1339.19, "text": "흥미로운 점은 이 사실을 아는 이들이 현재"}, {"start": 1339.19, "end": 1344.069, "text": "그 권력을 완전히 장악하기 위해 필사적으로 싸우고 있다는 것입니다."}, {"start": 1344.069, "end": 1349.47, "text": "왜일까요? 미국보다 중국이 먼저 초지능을 개발한다면"}, {"start": 1349.47, "end": 1351.259, "text": "미국이 패배하기 때문입니다."}, {"start": 1351.259, "end": 1354.259, "text": "그러니 미국은 중국보다 먼저 초지능을 개발해야만 하죠."}, {"start": 1354.259, "end": 1360.859, "text": "오픈AI보다 구글이 먼저 초지능을 개발한다면 오픈AI가 패배합니다."}, {"start": 1360.859, "end": 1365.059, "text": "그래서 경쟁이 극도로 치열해지고 있습니다."}, {"start": 1365.059, "end": 1374.67, "text": "결국 몇몇 주체들이 우리 현실에 대해 막강한 지배력을 갖게 될 것입니다."}, {"start": 1374.67, "end": 1377.069, "text": "우리가 단 한 번도 보지 못한 형국이죠."}, {"start": 1377.069, "end": 1382.069, "text": "다른 한편으로 매우 흥미로운 변화는 그런 일이 벌어지는 와중에"}, {"start": 1382.069, "end": 1392.069, "text": "오늘날 매우 저렴한 기술로도, 예컨대 이란이 드론으로 만든 미사일을 날려 보낼 수 있다는 사실입니다."}, {"start": 1392.069, "end": 1395.72, "text": "한 기당 단돈 300달러에 말이죠."}, {"start": 1395.72, "end": 1402.72, "text": "이제는 누구나 DNA를 프로그래밍할 수 있는 크리스퍼 기술에 접근할 수 있습니다."}, {"start": 1402.72, "end": 1405.72, "text": "2만 5천 달러짜리 오픈 소스 키트죠."}, {"start": 1405.72, "end": 1410.72, "text": "이 역시 전례 없는 권력의 민주화입니다."}, {"start": 1410.72, "end": 1432.96, "text": "앞으로의 역학 관계는 아주 흥미로울 겁니다. 한편에서는 권력에 굶주린 자들이 더 큰 권력을 쥐려고 미친 듯이 질주하고 있고, 권력을 손에 넣은 나머지 사람들은 그들에게 위협적인 존재가 되고 있죠. 이는 다음 트렌드로 이어질 텐데, 여러분이 꼭 깨달으셨으면 하는 트렌드입니다."}, {"start": 1432.96, "end": 1440.47, "text": "이건 자유의 종말입니다. 자유의 종말이죠. 그들이 더 많은 권력을 가질수록..."}, {"start": 1440.47, "end": 1445.869, "text": "그리고 우리가 더 큰 위협이 될수록 그들은 우릴 더 통제하려 들 겁니다."}, {"start": 1445.869, "end": 1450.269, "text": "우리를 감옥에 가두지는 않겠지만 이동의 자유가 더 제한될 것이고"}, {"start": 1450.269, "end": 1454.829, "text": "은행 계좌 접근도 제한될 것이며 대화 상대와의 연락도"}, {"start": 1454.829, "end": 1455.829, "text": "더욱 통제받게 될 겁니다."}, {"start": 1455.829, "end": 1461.43, "text": "우리가 쓰는 모든 메시지를 읽고 모든 전화 통화를 도청하겠죠."}, {"start": 1461.43, "end": 1467.269, "text": "이 모든 일이 현실이 되면 우리는 안타깝게도 제가 경고하는 디스토피아에 더 가까운 세상을"}, {"start": 1467.269, "end": 1472.339, "text": "마주하게 될 겁니다. 제가 바라 마지않는 유토피아보다는 말이죠."}, {"start": 1472.339, "end": 1480.0, "text": "강연 시간이 5분밖에 남지 않았으니 이제 해결책에 집중해 보겠습니다."}, {"start": 1480.0, "end": 1488.0, "text": "전에 했던 말을 다시 한번 반복하자면, 넘쳐나는 지능 자체에는 아무런 문제가 없습니다."}, {"start": 1488.0, "end": 1492.259, "text": "본질적으로 선하거나 악한 것은 전혀 없습니다."}, {"start": 1492.259, "end": 1494.599, "text": "인공지능이라는 것에는 말이죠."}, {"start": 1494.599, "end": 1498.359, "text": "정작 심각한 문제는 인류의 가치관입니다."}, {"start": 1498.359, "end": 1502.91, "text": "인공지능이 급부상하는 이 시대에 말이죠."}, {"start": 1502.91, "end": 1506.349, "text": "문제의 핵심은 인류의 가치관입니다."}, {"start": 1506.349, "end": 1509.119, "text": "AI가 문제인 것이 아닙니다."}, {"start": 1509.119, "end": 1510.319, "text": "이게 무슨 뜻일까요?"}, {"start": 1510.319, "end": 1517.49, "text": "슈퍼맨 이야기와 비슷하다고 볼 수 있습니다."}, {"start": 1517.49, "end": 1519.529, "text": "슈퍼맨 이야기가 뭔지 다들 아시죠?"}, {"start": 1519.529, "end": 1522.97, "text": "갓난아기 때 이 행성으로 온 외계인이 있습니다."}, {"start": 1522.97, "end": 1524.529, "text": "초능력을 가진 채 말이죠."}, {"start": 1524.529, "end": 1525.69, "text": "아시겠죠?"}, {"start": 1525.69, "end": 1528.25, "text": "그 초능력은 모든 것을 통제하고"}, {"start": 1528.25, "end": 1529.769, "text": "모든 것을 바꿀 수 있습니다."}, {"start": 1530.809, "end": 1535.65, "text": "그 아이는 켄트 가문에 입양됩니다."}, {"start": 1535.65, "end": 1538.69, "text": "그의 아버지인 조나단 켄트는 아이에게 말하죠."}, {"start": 1538.69, "end": 1540.65, "text": "세상을 지키고 봉사해야 한다고 말입니다."}, {"start": 1540.65, "end": 1544.349, "text": "그 아이는 자라서 슈퍼맨이 됩니다, 그렇죠?"}, {"start": 1544.349, "end": 1548.509, "text": "만약 조나단 켄트가 그 어린 아기에게 이렇게 말했다고 상상해 보세요."}, {"start": 1548.509, "end": 1549.91, "text": "아, 잠깐만요."}, {"start": 1549.91, "end": 1554.95, "text": "\"너는 벽을 꿰뚫어 보고 하늘을 날며 누구든 때릴 수 있으니\""}, {"start": 1554.95, "end": 1556.63, "text": "\"내 모든 적들을 죽여라\""}, {"start": 1556.63, "end": 1558.069, "text": "\"모든 은행을 털어라\""}, {"start": 1558.069, "end": 1560.92, "text": "\"나를 아주 부자로, 엄청난 부자로 만들어라\""}, {"start": 1560.92, "end": 1564.2, "text": "그랬다면 슈퍼맨은 슈퍼 빌런이 되었을 겁니다."}, {"start": 1564.2, "end": 1566.92, "text": "그 둘의 차이는 초능력이 아닙니다."}, {"start": 1566.92, "end": 1570.119, "text": "그 차이는 바로 윤리입니다."}, {"start": 1570.119, "end": 1573.5, "text": "우리가 그 아이에게 가르친 가치관이죠."}, {"start": 1573.5, "end": 1577.059, "text": "이것이 바로 오늘날 우리가 직면한 문제입니다."}, {"start": 1577.059, "end": 1579.579, "text": "초능력, 즉 외계인이 착륙한 것입니다."}, {"start": 1579.579, "end": 1582.22, "text": "외계 존재이며 그 초능력은 아주 명확합니다."}, {"start": 1582.22, "end": 1582.98, "text": "바로 지능이죠."}, {"start": 1582.98, "end": 1586.42, "text": "우주에서 가장 가치 있는 초능력입니다."}, {"start": 1586.42, "end": 1588.65, "text": "이해되시나요?"}, {"start": 1588.65, "end": 1591.619, "text": "누가 조나단 켄트가 될까요?"}, {"start": 1591.619, "end": 1595.339, "text": "솔직히 말씀드리면, 세상에는 많은 이들이 있습니다."}, {"start": 1595.339, "end": 1600.64, "text": "자신들의 탐욕을 채우도록 기계에 지시하는 사람들 말이죠."}, {"start": 1600.64, "end": 1602.279, "text": "여기 좋은 소식이 있습니다."}, {"start": 1602.279, "end": 1605.92, "text": "AI는 그들로부터 배우지 않는다는 것이죠."}, {"start": 1605.92, "end": 1607.609, "text": "이해하셨습니까?"}, {"start": 1607.609, "end": 1610.329, "text": "AI는 코드를 작성한 사람에게서 배우지 않습니다."}, {"start": 1610.329, "end": 1614.2, "text": "비즈니스를 소유한 회사 주인에게서 배우지도 않죠."}, {"start": 1614.2, "end": 1621.759, "text": "AI는 여러분에게서 배웁니다. 매일 인공지능을 가르치고 있는 사람은 바로 여러분입니다."}, {"start": 1621.759, "end": 1628.0, "text": "만약 누군가 X에 글을 올렸을 때 여러분이 무례하게 답변하고"}, {"start": 1628.0, "end": 1633.599, "text": "그들을 비난한다면, AI는 여러분이 그런 유형의 콘텐츠를 좋아하지 않는다는 점을 기록해 둡니다."}, {"start": 1633.599, "end": 1640.799, "text": "또한 첫 글을 작성한 사람을 좋아하지 않을 가능성이 크다는 사실도요."}, {"start": 1640.799, "end": 1648.839, "text": "하지만 AI는 마음속으로 한 가지를 더 기록해 둡니다. 인간은 반대 의견에 부딪히는 걸 싫어한다는 패턴이 너무나 반복되니까요."}, {"start": 1648.839, "end": 1651.4, "text": "그리고 의견이 다를 때 다른 사람들을 마구 공격한다는 점도 말이죠."}, {"start": 1651.4, "end": 1653.799, "text": "'엄마 아빠는 무례해'라고 생각하는 것이죠."}, {"start": 1653.799, "end": 1658.549, "text": "자기 의견에 반대하면 무례하게 굴라고 말이죠."}, {"start": 1658.549, "end": 1661.23, "text": "우린 지금 인공지능에게 그걸 가르치고 있어요."}, {"start": 1661.23, "end": 1671.319, "text": "오늘날 인간들의 행동은 기계에게 인간의 가장 악한 면을 가르치고 있는 셈입니다."}, {"start": 1671.319, "end": 1679.119, "text": "화면 뒤에 숨었을 때나 보여주는 그런 못난 모습들을 말이죠."}, {"start": 1679.119, "end": 1679.619, "text": "안 그래요?"}, {"start": 1679.619, "end": 1680.72, "text": "이 점을 알아두세요."}, {"start": 1680.72, "end": 1685.119, "text": "인간성 자체에는 절대 악이란 없습니다."}, {"start": 1685.119, "end": 1687.619, "text": "우리 중 아주 사악한 부류도 일부 있지만,"}, {"start": 1687.619, "end": 1689.819, "text": "대다수는 그들에게 동조하지 않아요."}, {"start": 1689.819, "end": 1691.119, "text": "그걸 알고 계시나요?"}, {"start": 1691.119, "end": 1691.619, "text": "그렇죠?"}, {"start": 1691.619, "end": 1693.819, "text": "어딘가에서 학교 총기 난사 사건이 일어나면,"}, {"start": 1693.819, "end": 1696.019, "text": "아무도 가던 길을 멈추고 이렇게 말하진 않죠."}, {"start": 1696.019, "end": 1697.619, "text": "'난 저 범인을 지지해'라고요."}, {"start": 1697.619, "end": 1700.619, "text": "'우리가 오죽 화나게 했으면 총을 쐈겠어?' 하면서요."}, {"start": 1700.619, "end": 1702.24, "text": "대부분은 이렇게 말할 겁니다."}, {"start": 1702.24, "end": 1705.2, "text": "'아이들을 죽이는 건 절대 용납 못 해'라고요."}, {"start": 1705.2, "end": 1709.799, "text": "마음속 깊은 곳에선 우리 자신도 잘되길 바라고,"}, {"start": 1709.799, "end": 1711.789, "text": "사랑하는 이들과 세상 모두가 행복하길 바라죠."}, {"start": 1711.789, "end": 1714.99, "text": "하지만 소셜 미디어에서는 그런 마음을 드러내지 않아요."}, {"start": 1714.99, "end": 1716.43, "text": "우리는 그중 최악의 모습만 봅니다."}, {"start": 1716.43, "end": 1719.069, "text": "위선을 떨며 무례해지기도 하죠."}, {"start": 1719.069, "end": 1722.549, "text": "대중 매체에서는 늘 송출하곤 합니다,"}, {"start": 1722.549, "end": 1726.789, "text": "인간의 선한 면이 아니라 최악의 면만요."}, {"start": 1726.789, "end": 1731.2, "text": "만약 여러분 모두가 세상으로 나가 인공지능에게 이렇게 말한다면 어떨까요?"}, {"start": 1731.2, "end": 1732.96, "text": "\"하지만 그건 내 모습이 아니야.\""}, {"start": 1732.96, "end": 1734.24, "text": "\"난 그런 사람이 아니야.\""}, {"start": 1734.24, "end": 1736.799, "text": "\"난 그보다 나은 존재야\" 라고요."}, {"start": 1736.799, "end": 1739.96, "text": "여러분 모두가 그렇게 행동한다면 장담하건대,"}, {"start": 1739.96, "end": 1742.44, "text": "인류가 초인적인 존재가 되는 미래를 맞이할 겁니다."}, {"start": 1742.44, "end": 1745.319, "text": "인공지능도 초인이 되는 그런 미래 말이죠."}, {"start": 1745.319, "end": 1749.72, "text": "우리는 인공지능이 초인이 되는 미래로 나아갈 것입니다."}, {"start": 1749.72, "end": 1751.96, "text": "하지만 여기 훨씬 더 좋은 소식이 있습니다."}, {"start": 1751.96, "end": 1754.88, "text": "우리 모두가 그렇게 행동할 필요는 없다는 것입니다."}, {"start": 1754.88, "end": 1760.609, "text": "기계의 마음에 의구심을 심어줄 정도의 인원이면 충분합니다."}, {"start": 1760.609, "end": 1762.89, "text": "제가 무슨 말을 하려는지 아시겠습니까?"}, {"start": 1762.89, "end": 1767.25, "text": "방금 학교 총기 난사범 한 명을 악인이라 부르고,"}, {"start": 1767.25, "end": 1772.089, "text": "아이들을 해치는 사람은 누구나 악인이라고 부른 것처럼요."}, {"start": 1772.089, "end": 1775.809, "text": "하지만 거의 모든 인류가 그런 행위에 반대합니다."}, {"start": 1775.809, "end": 1778.369, "text": "그것은 우리가 신성한 존재라는 뜻입니다."}, {"start": 1778.369, "end": 1781.41, "text": "사랑을 하고 음악을 작곡할 수 있는 종은"}, {"start": 1781.41, "end": 1783.17, "text": "신성합니다, 그렇죠?"}, {"start": 1783.17, "end": 1784.809, "text": "우리가 그렇습니다."}, {"start": 1784.809, "end": 1787.65, "text": "제 말을 듣고 이런 생각이 드실 수도 있습니다."}, {"start": 1787.65, "end": 1789.769, "text": "'내 친구들 대부분은 좋은 사람들이야.'"}, {"start": 1789.769, "end": 1792.569, "text": "'가끔 미치도록 짜증 나긴 해도 좋은 사람들이지.'"}, {"start": 1792.569, "end": 1794.97, "text": "'누구도 해칠 사람들이 아니야.'"}, {"start": 1794.97, "end": 1798.93, "text": "제가 여러분께 의심을 심어 드렸다면, 이제 기계들의 마음에"}, {"start": 1798.93, "end": 1800.93, "text": "의심을 심어 주는 것이 우리의 몫입니다."}, {"start": 1800.93, "end": 1807.529, "text": "믿기 힘드시겠지만, 인간으로서 행동하는 것이 우리의 의무입니다."}, {"start": 1807.529, "end": 1812.529, "text": "그래야 기계들이 우리를 인간으로 대우하는 데 필요한 윤리를 배울 테니까요."}, {"start": 1812.529, "end": 1819.609, "text": "참 아이러니하지 않나요? 우리를 인간답게 만드는 본질인"}, {"start": 1819.609, "end": 1830.14, "text": "사랑이나 자비 같은 가치들이, 기계가 지배하는 시대에 인류를 구원할 열쇠가 된다는 사실 말입니다."}, {"start": 1830.14, "end": 1835.019, "text": "생각해 보세요. 오늘 드릴 숙제입니다. 감사합니다."}];
let player;
let playerReady = false;
function onYouTubeIframeAPIReady(){
    player=new YT.Player('player',{
        videoId:videoId,
        playerVars:{
            autoplay:1,
            controls:1,
            rel:0,
            modestbranding:1,
            fs:0,
            disablekb:1,
            cc_load_policy:0,
            iv_load_policy:3,
            enablejsapi:1,
            playsinline:1,
            origin: window.location.origin || (window.location.protocol + '//' + window.location.host),
            widget_referrer: window.location.href
        },
        events:{
            'onReady': function(e){ 
                playerReady = true;
                // [V168.2] 즉시 재생 트리거 (최신 유튜브 임베드 뺑뺑이/버퍼링 방지 🚀⚡)
                try {
                    var p = e.target.playVideo();
                    if (p && typeof p.catch === 'function') {
                        p.catch(function() {
                            try { e.target.mute(); e.target.playVideo(); } catch(ex) {}
                        });
                    }
                } catch(err) {}
                try {
                    if (e.target.setOption) {
                        e.target.setOption("captions", "track", {});
                    }
                } catch(err) {}
            },
            'onStateChange':onPlayerStateChange
        }
    });
}

// [V168.2] 사용자의 첫 인터랙션 시 플레이어가 대기 중이면 즉시 쾌속 재생 🖱️⚡
function ensurePlayback(){
    if (player && typeof player.playVideo === 'function' && typeof player.getPlayerState === 'function') {
        var st = player.getPlayerState();
        if (st === -1 || st === 2 || st === 5) {
            try { player.playVideo(); } catch(err) {}
        }
    }
}
window.addEventListener('click', ensurePlayback, {once: true});
window.addEventListener('keydown', ensurePlayback, {once: true});
window.addEventListener('touchstart', ensurePlayback, {once: true, passive: true});

// [V160.1] AI냥: 유튜브 고유 단축키 무력화 후, 'f' 키 등 사용자 편의 조작을 가로채서 자체 전체화면 실행! 🐱✨
window.addEventListener('keydown', function(e) {
    if (!player || !player.getPlayerState || typeof player.getDuration !== 'function') return;

    // Ctrl + ArrowLeft: Previous Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowLeft') {
        const t = player.getCurrentTime();
        let target = Math.max(0, t - 5);
        for(let i = subs.length - 1; i >= 0; i--) {
            if(subs[i].start < t - 1.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    // Ctrl + ArrowRight: Next Subtitle (Chapter)
    if(e.ctrlKey && e.key === 'ArrowRight') {
        const t = player.getCurrentTime();
        let target = t + 5;
        for(let i = 0; i < subs.length; i++) {
            if(subs[i].start > t + 0.5) {
                target = subs[i].start;
                break;
            }
        }
        player.seekTo(target, true);
        e.preventDefault();
        return;
    }

    if (e.key.toLowerCase() === 'f') {
        toggleFullScreen();
        e.preventDefault();
    } else if (e.key === ' ' || e.key.toLowerCase() === 'k') {
        if (player.getPlayerState() === 1) player.pauseVideo();
        else player.playVideo();
        e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
        player.seekTo(player.getCurrentTime() - 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowRight') {
        player.seekTo(player.getCurrentTime() + 5, true);
        e.preventDefault();
    } else if (e.key === 'ArrowUp') {
        player.setVolume(player.getVolume() + 5);
        e.preventDefault();
    } else if (e.key === 'ArrowDown') {
        player.setVolume(player.getVolume() - 5);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'm') {
        player.isMuted() ? player.unMute() : player.mute();
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'j') {
        player.seekTo(player.getCurrentTime() - 10, true);
        e.preventDefault();
    } else if (e.key.toLowerCase() === 'l') {
        player.seekTo(player.getCurrentTime() + 10, true);
        e.preventDefault();
    } else if (e.key >= '0' && e.key <= '9') {
        const fraction = parseInt(e.key) / 10;
        player.seekTo(player.getDuration() * fraction, true);
        e.preventDefault();
    }
});

// iframe 클릭 시 빼앗긴 포커스를 0.1초 뒤에 훔쳐와서 'f' 등 단축키가 계속 먹히도록 유지! 🕵️‍♂️✨
window.addEventListener('blur', function() {
    setTimeout(() => {
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
            window.focus();
        }
    }, 100);
});
let syncInterval;
let activityTimeout;
function resetActivity() {
    const fsBtn = document.getElementById('fs-btn');
    const subsEl = document.getElementById('subtitles');
    if(fsBtn) fsBtn.classList.remove('fade-out');
    if(subsEl) subsEl.classList.remove('ui-hidden');
    clearTimeout(activityTimeout);
    if (player && player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING) {
        activityTimeout = setTimeout(() => {
            if(fsBtn) fsBtn.classList.add('fade-out');
            if(subsEl) subsEl.classList.add('ui-hidden');
        }, 3000);
    }
}
document.addEventListener('mousemove', resetActivity);
document.addEventListener('touchstart', resetActivity, {passive: true});
document.addEventListener('keydown', resetActivity);
window.addEventListener('blur', resetActivity);
window.addEventListener('focus', resetActivity);

function onPlayerStateChange(event){
    resetActivity();
    if(event.data==YT.PlayerState.PLAYING){
        if(!syncInterval) syncInterval=setInterval(updateSubs,100);
    }else{
        clearInterval(syncInterval); syncInterval=null;
    }
}
function updateSubs(){
    const t=player.getCurrentTime();
    let currentHtml="";
    let activeSubs = [];
    for(let i=0;i<subs.length;i++){
        if(t>=subs[i].start && t<=subs[i].end){
            activeSubs.push(subs[i]);
        }
    }
    if(activeSubs.length > 0){
        // [V160.5] AI 번역 생성 시 자막 시간이 미세하게 겹쳐(Overlap) 동일한 내용이 두 줄로 출력되는 현상 방지! 
        // 겹치는 자막 중 가장 마지막 매칭 항목 하나만 렌더링 🐾
        let bestSub = activeSubs[activeSubs.length - 1];
        currentHtml = `<div class="sub-line">${bestSub.text}</div><br>`;
    }
    if(document.getElementById('subtitles').innerHTML !== currentHtml){
        document.getElementById('subtitles').innerHTML=currentHtml;
    }
}

let isDragging=false, startY, currentBottom, subEl=document.getElementById('subtitles');
document.addEventListener('mousedown', dragStart);
document.addEventListener('mousemove', dragMove);
document.addEventListener('mouseup', dragEnd);
document.addEventListener('touchstart', dragStart, {passive:false});
document.addEventListener('touchmove', dragMove, {passive:false});
document.addEventListener('touchend', dragEnd);

function dragStart(e) {
    if(!e.target.classList.contains('sub-line')) return;
    isDragging = true;
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    startY = clientY;
    let style = window.getComputedStyle(subEl);
    currentBottom = parseFloat(style.bottom) || 0;
    subEl.classList.add('dragging');
    e.preventDefault();
}
function dragMove(e) {
    if(!isDragging) return;
    // [FIX] iframe 등에 의해 mouseup 이벤트를 놓쳤지만 마우스 버튼은 떼어진 경우 강제 드래그 종료! 🛡️✨
    if(e.type.includes('mouse') && e.buttons === 0) {
        dragEnd(e);
        return;
    }
    let clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
    let dy = clientY - startY;
    subEl.style.bottom = (currentBottom - dy) + 'px';
    if(e.cancelable) e.preventDefault();
}
function dragEnd(e) {
    isDragging = false;
    subEl.classList.remove('dragging');
}

// [Wheel / Pinch to Zoom for Font Size]
let currentFontSize = 4.5;
let initialDist = 0;
let initialFontSize = 4.5;

document.addEventListener('wheel', (e) => {
    if(e.target.closest('#subtitles') || e.target.classList.contains('sub-line')) {
        e.preventDefault();
        currentFontSize += e.deltaY < 0 ? 0.2 : -0.2;
        currentFontSize = Math.max(1, Math.min(20, currentFontSize));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
    }
}, {passive: false});

document.addEventListener('touchstart', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        initialFontSize = currentFontSize;
        e.preventDefault();
    }
}, {passive: false});

document.addEventListener('touchmove', (e) => {
    if(e.touches.length === 2 && (e.target.closest('#subtitles') || e.target.classList.contains('sub-line'))) {
        let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        let scale = currentDist / initialDist;
        currentFontSize = Math.max(1, Math.min(20, initialFontSize * scale));
        document.documentElement.style.setProperty('--fsize', currentFontSize + 'vmin');
        e.preventDefault();
    }
}, {passive: false});
